/* =========================================================

/* =========================================================

function $(id) {

/* =========================================================
   STATUS
========================================================= */

function setStatus(message, error = false) {

  const box = $("status");

  if (!box) return;

  box.textContent = message;

  box.className =
    error
      ? "status error no-print"
      : "status no-print";

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m) {

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m];

      }
    );

}


function nl(value) {

  return esc(value)
    .replace(/\n/g, "<br>");

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeName(value) {

  return String(value ?? "")
    .trim()
    .toLowerCase();

}


/* =========================================================
   UUID
========================================================= */

function createUUID() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {

    return window.crypto.randomUUID();

  }

  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
    .replace(
      /[xy]/g,
      function(c) {

        const r =
          Math.random() * 16 | 0;

        const v =
          c === "x"
            ? r
            : (r & 0x3 | 0x8);

        return v.toString(16);

      }
    );

}


/* =========================================================
   DATE
========================================================= */

function today() {

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return year +
    "-" +
    month +
    "-" +
    day;

}


/* =========================================================
   AUTO FORMULA NUMBER
========================================================= */

function generateFormulaNo() {

  let max = 0;

  const used = new Set();

  formulas.forEach(
    f => {

      const number =
        String(
          f.formula_no || ""
        ).trim();

      if (number) {

        used.add(
          number.toLowerCase()
        );

      }

      const match =
        number.match(
          /^LP-F-(\d+)$/i
        );

      if (match) {

        max =
          Math.max(
            max,
            parseInt(
              match[1],
              10
            )
          );

      }

    }
  );


  let next =
    max + 1;

  let candidate =
    "LP-F-" +
    String(next)
      .padStart(3, "0");


  while (
    used.has(
      candidate.toLowerCase()
    )
  ) {

    next++;

    candidate =
      "LP-F-" +
      String(next)
        .padStart(3, "0");

  }


  return candidate;

}

/* =========================================================
   TAB
========================================================= */

function showTab(id) {

  document
    .querySelectorAll(".panel")
    .forEach(
      p =>
        p.classList.remove(
          "active"
        )
    );

  const panel =
    $(id);

  if (panel) {

    panel.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(".tab")
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  if (id === "seen") {

    if ($("seenTab")) {

      $("seenTab")
        .classList.add(
          "active"
        );

    }

  } else {

    if ($("editTab")) {

      $("editTab")
        .classList.add(
          "active"
        );

    }

  }

}

/* =========================================================
   NATURAL / SCIENCE CLASSIFICATION
========================================================= */

const NATURAL_NAMES =
  new Set([

    "cucumber extract",
    "papaya extract",
    "multani mitti",
    "licorice extract",
    "rose extract",
    "aloe vera gel",
    "almond oil",
    "grean tea extract",
    "green tea extract",
    "shea butter",
    "turmeric extract",
    "manjistha extract",
    "neem exract",
    "neem extract",
    "honey"

  ]);


function classifyIngredient(name) {

  const n =
    normalizeName(name);

  if (
    NATURAL_NAMES.has(n)
  ) {

    return "natural";

  }


  if (
    /extract|mitti|aloe|almond oil|shea|butter|honey|manjistha|neem|rose|cucumber|papaya|turmeric|licorice|green tea/i
      .test(name)
  ) {

    return "natural";

  }


  return "science";

}


/* =========================================================
   LOCAL MASTER INGREDIENTS
   Used only for ingredients created from Settings when
   Supabase ingredients table is unavailable.
========================================================= */

function getLocalMasterIngredients() {

  try {

    const saved =
      localStorage.getItem(
        "liara_formula_master_ingredients"
      );

    if (!saved) {

      return {
        science: [],
        natural: []
      };

    }

    const parsed =
      JSON.parse(saved);

    return {

      science:
        Array.isArray(
          parsed.science
        )
          ? parsed.science
          : [],

      natural:
        Array.isArray(
          parsed.natural
        )
          ? parsed.natural
          : []

    };

  } catch (error) {

    console.warn(
      "Local master ingredient error:",
      error
    );

    return {
      science: [],
      natural: []
    };

  }

}


function saveLocalMasterIngredients(data) {

  try {

    localStorage.setItem(
      "liara_formula_master_ingredients",
      JSON.stringify(data)
    );

  } catch (error) {

    console.warn(
      "Local ingredient save error:",
      error
    );

  }

}


/* =========================================================
   LOAD MASTER INGREDIENTS
   IMPORTANT:
   1. ingredients table
   2. formula_ingredients table
   3. localStorage
   All merged together.
========================================================= */

async function loadMasterIngredients() {

  const local =
    getLocalMasterIngredients();


  let allNames = [];


  /* -------------------------------------------------------
     1. LOAD FROM ingredients MASTER TABLE
  ------------------------------------------------------- */

  if (supabaseClient) {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("ingredients")
          .select("*")
          .order(
            "name",
            {
              ascending: true
            }
          );


      if (!error && Array.isArray(data)) {

        data.forEach(
          row => {

            if (
              row &&
              row.name
            ) {

              allNames.push({
                name: row.name,
                category:
                  row.category
                    ? row.category
                    : classifyIngredient(
                        row.name
                      ),
                source: "supabase"
              });

            }

          }
        );

      } else if (error) {

        console.warn(
          "ingredients table not available:",
          error.message
        );

      }

    } catch (error) {

      console.warn(
        "ingredients table read failed:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     2. LOAD EXISTING INGREDIENTS FROM
        formula_ingredients
  ------------------------------------------------------- */

  if (supabaseClient) {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("formula_ingredients")
          .select("ingredient_name")
          .not(
            "ingredient_name",
            "is",
            null
          );


      if (!error && Array.isArray(data)) {

        data.forEach(
          row => {

            if (
              row &&
              row.ingredient_name
            ) {

              allNames.push({
                name:
                  row.ingredient_name,
                category:
                  classifyIngredient(
                    row.ingredient_name
                  ),
                source:
                  "formula"
              });

            }

          }
        );

      } else if (error) {

        console.warn(
          "formula_ingredients master read:",
          error.message
        );

      }

    } catch (error) {

      console.warn(
        "formula_ingredients read failed:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     3. LOCAL INGREDIENTS
  ------------------------------------------------------- */

  local.science.forEach(
    name => {

      allNames.push({
        name,
        category: "science",
        source: "local"
      });

    }
  );


  local.natural.forEach(
    name => {

      allNames.push({
        name,
        category: "natural",
        source: "local"
      });

    }
  );


  /* -------------------------------------------------------
     4. REMOVE DUPLICATES
  ------------------------------------------------------- */

  const unique =
    new Map();


  allNames.forEach(
    item => {

      const key =
        normalizeName(
          item.name
        );

      if (!key) return;


      if (!unique.has(key)) {

        unique.set(
          key,
          item
        );

      } else {

        const existing =
          unique.get(key);


        /*
          Local category selection should win
          because user explicitly selected it.
        */

        if (
          item.source === "local"
        ) {

          unique.set(
            key,
            item
          );

        }

      }

    }
  );


  /* -------------------------------------------------------
     5. BUILD FINAL LISTS
  ------------------------------------------------------- */

  const science = [];

  const natural = [];


  unique.forEach(
    item => {

      const category =
        item.category === "natural"
          ? "natural"
          : classifyIngredient(
              item.name
            );


      if (
        category === "natural"
      ) {

        natural.push(
          item.name
        );

      } else {

        science.push(
          item.name
        );

      }

    }
  );


  science.sort(
    (a,b) =>
      a.localeCompare(
        b
      )
  );


  natural.sort(
    (a,b) =>
      a.localeCompare(
        b
      )
  );


  masterIngredients = {
    science,
    natural
  };


  renderMasterLists();

  refreshIngredientDropdowns();


  setStatus(
    "☁ Ingredients loaded • " +
    (
      science.length +
      natural.length
    ) +
    " ingredient(s)"
  );

}


/* =========================================================
   ADD MASTER INGREDIENT
========================================================= */

async function addMasterIngredient(type) {

  const input =
    $(type + "Input");

  if (!input) return;


  const value =
    input.value.trim();


  if (!value) {

    alert(
      "Please enter ingredient name."
    );

    input.focus();

    return;

  }


  if (
    type !== "science" &&
    type !== "natural"
  ) {

    return;

  }


  const alreadyExists =
    [
      ...(masterIngredients.science || []),
      ...(masterIngredients.natural || [])
    ]
    .some(
      x =>
        normalizeName(x) ===
        normalizeName(value)
    );


  if (alreadyExists) {

    alert(
      "This ingredient already exists."
    );

    input.select();

    return;

  }


  let cloudSaved = false;


  /* -------------------------------------------------------
     TRY SUPABASE ingredients TABLE
  ------------------------------------------------------- */

  if (supabaseClient) {

    try {

      const {
        data: existing,
        error: checkError
      } =
        await supabaseClient
          .from("ingredients")
          .select("id,name,category")
          .ilike(
            "name",
            value
          )
          .limit(1);


      if (!checkError) {

        if (
          existing &&
          existing.length
        ) {

          alert(
            "This ingredient already exists in Supabase."
          );

          await loadMasterIngredients();

          input.select();

          return;

        }


        const {
          error
        } =
          await supabaseClient
            .from("ingredients")
            .insert({

              name: value,

              category: type,

              updated_at:
                new Date()
                  .toISOString()

            });


        if (!error) {

          cloudSaved = true;

        } else {

          console.warn(
            "Cloud ingredient save failed:",
            error.message
          );

        }

      }

    } catch (error) {

      console.warn(
        "Cloud ingredient save error:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     LOCAL FALLBACK
  ------------------------------------------------------- */

  if (!cloudSaved) {

    const local =
      getLocalMasterIngredients();


    const exists =
      [
        ...local.science,
        ...local.natural
      ]
      .some(
        x =>
          normalizeName(x) ===
          normalizeName(value)
      );


    if (!exists) {

      local[type].push(
        value
      );

      saveLocalMasterIngredients(
        local
      );

    }

  }


  input.value = "";


  await loadMasterIngredients();


  input.focus();


  setStatus(
    cloudSaved
      ? "☁ Ingredient saved: " + value
      : "✓ Ingredient saved locally: " + value
  );

}


/* =========================================================
   DELETE MASTER INGREDIENT
========================================================= */

async function deleteMasterIngredient(
  name,
  type
) {

  if (!name) return;


  if (
    !confirm(
      'Delete "' +
      name +
      '" from master ingredient list?'
    )
  ) {

    return;

  }


  let deleted = false;


  /* -------------------------------------------------------
     DELETE FROM SUPABASE IF POSSIBLE
  ------------------------------------------------------- */

  if (supabaseClient) {

    try {

      const {
        error
      } =
        await supabaseClient
          .from("ingredients")
          .delete()
          .eq(
            "name",
            name
          )
          .eq(
            "category",
            type
          );


      if (!error) {

        deleted = true;

      } else {

        console.warn(
          "Cloud ingredient delete:",
          error.message
        );

      }

    } catch (error) {

      console.warn(
        "Cloud delete error:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     DELETE LOCAL COPY
  ------------------------------------------------------- */

  const local =
    getLocalMasterIngredients();


  local.science =
    local.science.filter(
      x =>
        normalizeName(x) !==
        normalizeName(name)
    );


  local.natural =
    local.natural.filter(
      x =>
        normalizeName(x) !==
        normalizeName(name)
    );


  saveLocalMasterIngredients(
    local
  );


  await loadMasterIngredients();


  setStatus(
    deleted
      ? "☁ Ingredient deleted: " + name
      : "✓ Local ingredient removed: " + name
  );

}


/* =========================================================
   RENDER MASTER LISTS
========================================================= */

function renderMasterLists() {

  renderMasterList(
    "science",
    masterIngredients.science
  );


  renderMasterList(
    "natural",

  );

}


/* =========================================================
   RENDER MASTER LIST
========================================================= */

function renderMasterList(

  list
) {

  const box =

  if (!box) return;


  if (
    !list ||
    !list.length
  ) {

    box.innerHTML = `
      <div
        style="
          font-size:12px;
          color:#999;
          padding:8px 0;
        "
      >
        No ingredients added yet.
      </div>
    `;

    return;

  }


  const local =
    getLocalMasterIngredients();


  box.innerHTML =
    list
      .map(
        item => {

          const isLocal =
            local[type]
              .some(
                x =>
                  normalizeName(x) ===
                  normalizeName(item)
              );


          return `

            <div
              class="master-item"
              style="

            >

                ${esc(item)}
              </span>

                style="

                  align-items:center;
                  gap:6px;
                "
              >

                <small
                  style="
                    color:${isLocal ? "#777" : "#999"};
                    font-size:10px;
                  "
                >
                  ${isLocal ? "LOCAL" : "SUPABASE"}
                </small>

                <button
                  type="button"
                  class="danger small-btn"
                  data-delete-name="${esc(item)}"
                  data-delete-type="${esc(type)}"
                >
                  × Delete
                </button>

          `;

        }
      )
      .join("");


  box
    .querySelectorAll(

              this.dataset.deleteName,

    );

}


/* =========================================================
   INGREDIENT OPTIONS
========================================================= */

function getIngredientOptions(
  selected = ""
) {

  const natural =
    masterIngredients.natural || [];

  const science =
    masterIngredients.science || [];


  let html = `

    <option value="">
      Select ingredient...
    </option>

  `;


  if (natural.length) {

    html += `
      <optgroup
        label="🌿 Natural / Herbal"
      >
    `;


    natural.forEach(
      item => {

        html += `

          <option
            value="${esc(item)}"
            ${
              normalizeName(item) ===
              normalizeName(selected)
                ? "selected"
                : ""
            }
          >
            ${esc(item)}
          </option>

        `;

      }
    );


    html += `
      </optgroup>
    `;

  }


  if (science.length) {

    html += `
      <optgroup
        label="🧪 Science"
      >
    `;


    science.forEach(
      item => {

        html += `

          <option
            value="${esc(item)}"
            ${
              normalizeName(item) ===
              normalizeName(selected)
                ? "selected"
                : ""
            }
          >
            ${esc(item)}
          </option>

        `;

      }
    );


    html += `
      </optgroup>
    `;

  }


  html += `

    <option value="__custom__">
      ✏️ Other / Type Manually
    </option>

  `;


  return html;

}


/* =========================================================
   REFRESH INGREDIENT DROPDOWNS
========================================================= */

function refreshIngredientDropdowns() {

  document
    .querySelectorAll(
      "#ingredients .ing-row"
    )
    .forEach(
      row => {

        const select =
          row.querySelector(
            ".iname-select"
          );

        if (!select) return;


        const custom =
          row.querySelector(
            ".custom-ingredient"
          );


        let current = "";


        if (
          select.value &&
          select.value !== "__custom__"
        ) {

          current =
            select.value;

        } else if (
          custom
        ) {

          current =
            custom.value.trim();

        }


        select.innerHTML =
          getIngredientOptions(
            current
          );


        const option =
          Array.from(
            select.options
          )
          .find(
            o =>
              normalizeName(
                o.value
              ) ===
              normalizeName(
                current
              )
          );


        if (
          current &&
          option
        ) {

          select.value =
            option.value;

          if (custom) {

            custom.style.display =
              "none";

          }

        } else if (
          current
        ) {

          select.value =
            "__custom__";

          if (custom) {

            custom.style.display =
              "block";

            custom.value =
              current;

          }

        }

      }
    );

}


/* =========================================================
   NEW FORMULA
========================================================= */

  ensureFormulaIdField();

    "productName",
    "formulaName",

  ]

    $("formulaNo").value =

      "none";

  if ($("formulaNo")) {

    $("formulaNo").focus();

  }

}

      placeholder="Qty"
      value="${esc(
        data.qty ?? ""
      )}"
    >


    <select
      class="iunit"
    >

      <option value="g">
        g
      </option>

      <option value="kg">
        kg
      </option>

      <option value="ml">
        ml
      </option>

      <option value="L">
        L
      </option>

    </select>


    <input
      class="ipct"
      type="number"
      min="0"
      step="any"
      placeholder="%"
      value="${esc(
        data.pct ?? ""
      )}"
    >


    <button
      type="button"
      class="danger ingredient-delete"
    >
      ×
    </button>

  `;


  if (!$("ingredients")) {
    return;
  }


  $("ingredients")
    .appendChild(row);


  const unit =
    row.querySelector(
      ".iunit"
    );


  if (data.unit) {

    unit.value =
      data.unit;

  }


  const select =
    row.querySelector(
      ".iname-select"
    );


  const custom =
    row.querySelector(
      ".custom-ingredient"
    );


  const allNames = [

    ...(masterIngredients.natural || []),

    ...(masterIngredients.science || [])

  ];


  const exists =
    allNames.some(
      x =>
        normalizeName(x) ===
        normalizeName(safeName)
    );


  if (
    safeName &&
    !exists
  ) {

    select.value =
      "__custom__";

    custom.style.display =
      "block";

  } else {

    custom.style.display =
      "none";

  }


  select.addEventListener(
    "change",
    function() {

      ingredientSelectChanged(
        this
      );

    }
  );


  custom.addEventListener(
    "input",
    calcTotals
  );


  row
    .querySelector(".iqty")
    .addEventListener(
      "input",
      calcTotals
    );


  row
    .querySelector(".ipct")
    .addEventListener(
      "input",
      calcTotals
    );


  row
    .querySelector(
      ".ingredient-delete"
    )
    .addEventListener(
      "click",
      function() {

        row.remove();

        calcTotals();

      }
    );


  calcTotals();

}


/* =========================================================
   INGREDIENT SELECT CHANGE
========================================================= */

function ingredientSelectChanged(
  select
) {

  const row =
    select.closest(
      ".ing-row"
    );


  if (!row) return;


  const custom =
    row.querySelector(
      ".custom-ingredient"
    );


  if (
    select.value ===
    "__custom__"
  ) {

    custom.style.display =
      "block";

    custom.focus();

  } else {

    custom.style.display =
      "none";

    custom.value =
      select.value;

  }


  calcTotals();

}


/* =========================================================
   TOTALS
========================================================= */

function calcTotals() {

  let q = 0;

  let p = 0;


  document
    .querySelectorAll(
      "#ingredients .iqty"
    )
    .forEach(
      x => {

        q +=
          Number(x.value) || 0;

      }
    );


  document
    .querySelectorAll(
      "#ingredients .ipct"
    )
    .forEach(
      x => {

        p +=
          Number(x.value) || 0;

      }
    );


  if ($("totalQty")) {

    $("totalQty")
      .textContent =
      q.toFixed(2)
        .replace(
          /\.00$/,
          ""
        );

  }


  if ($("totalPct")) {

    $("totalPct")
      .textContent =
      p.toFixed(2)
        .replace(
          /\.00$/,
          ""
        ) +
      "%";

  }


  if ($("totalPercent")) {

    $("totalPercent")
      .value =
      p.toFixed(2)
        .replace(
          /\.00$/,
          ""
        ) +
      "%";

  }

}


/* =========================================================
   BATCH SIZE SCALING
========================================================= */

function scaleIngredientsForBatch() {

  const batchField =
    $("batchSize");

  if (!batchField) return;


  const newBatch =
    Number(
      batchField.value
    );


  if (
    !Number.isFinite(
      newBatch
    ) ||
    newBatch <= 0
  ) {

    return;

  }


  if (
    !lastBatchSize ||
    lastBatchSize <= 0
  ) {

    lastBatchSize =
      newBatch;

    return;

  }


  if (
    Math.abs(
      newBatch -
      lastBatchSize
    ) < 0.0000001
  ) {

    return;

  }


  const multiplier =
    newBatch /
    lastBatchSize;


  document
    .querySelectorAll(
      "#ingredients .ing-row"
    )
    .forEach(
      row => {

        const qty =
          row.querySelector(
            ".iqty"
          );


        if (!qty) return;


        const oldQty =
          Number(
            qty.value
          );


        if (
          !Number.isFinite(
            oldQty
          )
        ) {

          return;

        }


        const newQty =
          oldQty *
          multiplier;


        qty.value =
          newQty
            .toFixed(6)
            .replace(
              /\.?0+$/,
              ""
            );

      }
    );


  lastBatchSize =
    newBatch;


  calcTotals();

}


/* =========================================================
   GET INGREDIENTS
========================================================= */

function getIngredients() {

  return Array.from(
    document.querySelectorAll(
      "#ingredients .ing-row"
    )
  )
  .map(
    row => {

      const select =
        row.querySelector(
          ".iname-select"
        );


      const custom =
        row.querySelector(
          ".custom-ingredient"
        );


      let name = "";


      if (
        select &&
        select.value ===
        "__custom__"
      ) {

        name =
          custom
            ? custom.value.trim()
            : "";

      } else {

        name =
          select
            ? select.value.trim()
            : "";

      }


      return {

        name,

        qty:
          row.querySelector(
            ".iqty"
          )?.value || "",

        unit:
          row.querySelector(
            ".iunit"
          )?.value || "g",

        pct:
          row.querySelector(
            ".ipct"
          )?.value || ""

      };

    }
  )
  .filter(
    x =>
      x.name ||
      x.qty ||
      x.pct
  );

}


/* =========================================================
   SAVE FORMULA
========================================================= */

async function saveFormula() {

  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  ensureFormulaIdField();


  const product =
    $("productName")
      .value
      .trim();


  if (!product) {

    alert(
      "Product Name is required."
    );

    $("productName")
      .focus();

    return;

  }


  const wasEditing =
    Boolean(editingId);


  /* -------------------------------------------------------
     AUTO FORMULA ID
  ------------------------------------------------------- */

  let formulaId =
    editingId ||
    (
      $("formulaId")
        ? $("formulaId").value.trim()
        : ""
    );


  if (!formulaId) {

    formulaId =
      createUUID();

  }


  if ($("formulaId")) {

    $("formulaId").value =
      formulaId;

  }


  /* -------------------------------------------------------
     AUTO FORMULA NO.
  ------------------------------------------------------- */

  let formulaNo =
    $("formulaNo")
      .value
      .trim();


  if (!formulaNo) {

    formulaNo =
      generateFormulaNo();

    $("formulaNo").value =
      formulaNo;

  }


  const ingredients =
    getIngredients();


  const item = {

    formula_no:
      formulaNo,

    product_name:
      product,

    formula_name:
      $("formulaName")
        .value
        .trim(),

    version:
      $("version")
        .value
        .trim(),

    formula_date:
      $("date").value ||
      today(),

    batch_size:
      $("batchSize").value
        ? Number(
            $("batchSize").value
          )
        : null,

    batch_unit:
      $("batchUnit").value,

    preparation_method:
      $("method")
        .value
        .trim(),

    result:
      $("result")
        .value
        .trim(),

    notes:
      $("notes")
        .value
        .trim(),

    updated_at:
      new Date()
        .toISOString()

  };


  const saveBtn =
    $("saveBtn");


  const oldText =
    saveBtn
      ? saveBtn.textContent
      : "Save Formula";


  if (saveBtn) {

    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "⏳ Saving...";

  }


  try {

    /* =====================================================
       UPDATE
    ===================================================== */

    if (wasEditing) {

      setStatus(
        "☁ Updating formula..."
      );


      const {
        error
      } =
        await supabaseClient
          .from("formulas")
          .update(item)
          .eq(
            "id",
            editingId
          );


      if (error) {

        throw new Error(
          "Formula update failed: " +
          error.message
        );

      }


      const {
        error:
          deleteError
      } =
        await supabaseClient
          .from(
            "formula_ingredients"
          )
          .delete()
          .eq(
            "formula_id",
            editingId
          );


      if (deleteError) {

        throw new Error(
          "Old ingredient delete failed: " +
          deleteError.message
        );

      }

    }


    /* =====================================================
       CREATE
    ===================================================== */

    else {

      setStatus(
        "☁ Creating formula..."
      );


      /*
        IMPORTANT:
        ID is generated in browser.
        This guarantees Formula ID exists.
      */

      const insertItem = {

        id:
          formulaId,

        ...item

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("formulas")
          .insert(
            insertItem
          )
          .select("id")
          .single();


      if (error) {

        throw new Error(
          "Formula creation failed: " +
          error.message
        );

      }


      if (
        data &&
        data.id
      ) {

        formulaId =
          data.id;

      }

    }


    /* =====================================================
       SAVE INGREDIENTS
    ===================================================== */

    if (
      ingredients.length
    ) {

      const ingredientRows =
        ingredients
          .filter(
            x =>
              x.name
          )
          .map(
            x => ({

              formula_id:
                formulaId,

              ingredient_name:
                x.name,

              quantity:
                x.qty !== ""
                  ? Number(x.qty)
                  : null,

              unit:
                x.unit,

              percentage:
                x.pct !== ""
                  ? Number(x.pct)
                  : null

            })
          );


      if (
        ingredientRows.length
      ) {

        const {
          error
        } =
          await supabaseClient
            .from(
              "formula_ingredients"
            )
            .insert(
              ingredientRows
            );


        if (error) {

          throw new Error(
            "Ingredient save failed: " +
            error.message
          );

        }

      }

    }


    /* =====================================================
       AUTO MASTER INGREDIENT SAVE
    ===================================================== */

    await autoSaveCustomIngredients(
      ingredients
    );


    editingId =
      formulaId;


    if ($("formulaId")) {

      $("formulaId").value =
        formulaId;

    }


    setStatus(
      wasEditing
        ? "☁ Formula updated successfully."
        : "☁ Formula saved successfully."
    );


    alert(
      wasEditing
        ? "Formula updated successfully."
        : "Formula saved successfully."
    );


    await loadFormulas();


    editFormula(
      formulaId
    );


  } catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    setStatus(
      "❌ " +
      (
        error.message ||
        error
      ),
      true
    );


    alert(
      "SAVE ERROR:\n\n" +
      (
        error.message ||
        error
      ) +
      "\n\nCheck Supabase RLS policies."
    );

  } finally {

    if (saveBtn) {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        oldText;

    }

  }

}


/* =========================================================
   AUTO SAVE CUSTOM INGREDIENTS
========================================================= */

async function autoSaveCustomIngredients(
  ingredientRows
) {

  if (
    !ingredientRows ||
    !ingredientRows.length
  ) {

    return;

  }


  const masterRows = [];


  for (
    const ingredient
    of ingredientRows
  ) {

    if (
      !ingredient.name
    ) {

      continue;

    }


    const exists =
      [
        ...(masterIngredients.natural || []),
        ...(masterIngredients.science || [])
      ]
      .some(
        x =>
          normalizeName(x) ===
          normalizeName(
            ingredient.name
          )
      );


    if (!exists) {

      masterRows.push({

        name:
          ingredient.name,

        category:
          "science",

        updated_at:
          new Date()
            .toISOString()

      });

    }

  }


  if (
    !masterRows.length
  ) {

    return;

  }


  /* -------------------------------------------------------
     Try cloud master table
  ------------------------------------------------------- */

  if (supabaseClient) {

    try {

      const {
        error
      } =
        await supabaseClient
          .from("ingredients")
          .upsert(
            masterRows,
            {
              onConflict:
                "name"
            }
          );


      if (!error) {

        await loadMasterIngredients();

        return;

      }


      console.warn(
        "Cloud master ingredient auto-save:",
        error.message
      );

    } catch (error) {

      console.warn(
        "Cloud master ingredient error:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     Local fallback
  ------------------------------------------------------- */

  const local =
    getLocalMasterIngredients();


  masterRows.forEach(
    row => {

      const exists =
        [
          ...local.science,
          ...local.natural
        ]
        .some(
          x =>
            normalizeName(x) ===
            normalizeName(
              row.name
            )
        );


      if (!exists) {

        local.science.push(
          row.name
        );

      }

    }
  );


  saveLocalMasterIngredients(
    local
  );


  await loadMasterIngredients();

}


/* =========================================================
   LOAD FORMULAS
========================================================= */

async function loadFormulas() {

  setStatus(
    "☁ Loading formulas..."
  );


  try {

    if (!supabaseClient) {

      throw new Error(
        "Supabase is not connected."
      );

    }


    const {
      data: rows,
      error
    } =
      await supabaseClient
        .from("formulas")
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      throw error;

    }


    const formulaRows =
      rows || [];


    /* -------------------------------------------------------
       LOAD FORMULA INGREDIENTS
    ------------------------------------------------------- */

    let ingredientRows =
      [];


    if (
      formulaRows.length
    ) {

      const ids =
        formulaRows
          .map(
            f => f.id
          )
          .filter(
            Boolean
          );


      if (ids.length) {

        const {
          data,
          error:
            ingredientError
        } =
          await supabaseClient
            .from(
              "formula_ingredients"
            )
            .select("*")
            .in(
              "formula_id",
              ids
            );


        if (
          ingredientError
        ) {

          console.warn(
            "Ingredient load warning:",
            ingredientError
          );

        } else {

          ingredientRows =
            data || [];

        }

      }

    }


    /* -------------------------------------------------------
       BUILD INGREDIENT MAP
    ------------------------------------------------------- */

    const ingredientMap =
      {};


    ingredientRows
      .forEach(
        ingredient => {

          const key =
            String(
              ingredient.formula_id
            );


          if (
            !ingredientMap[key]
          ) {

            ingredientMap[key] =
              [];

          }


          ingredientMap[key]
            .push(
              ingredient
            );

        }
      );


    /* -------------------------------------------------------
       FINAL FORMULA ARRAY
    ------------------------------------------------------- */

    formulas =
      formulaRows.map(
        formula => ({

          ...formula,

          formula_ingredients:
            ingredientMap[
              String(
                formula.id
              )
            ] || []

        })
      );


    /*
      Reload master ingredients after formulas.
      This ensures every ingredient already used in
      formula_ingredients appears in Settings.
    */

    await loadMasterIngredients();


    setStatus(
      "☁ Connected • " +
      formulas.length +
      " formula(s) online"
    );


    renderList();


  } catch (error) {

    console.error(
      "Load formulas error:",
      error
    );


    setStatus(
      "❌ " +
      (
        error.message ||
        error
      ),
      true
    );


    if ($("formulaList")) {

      $("formulaList")
        .innerHTML = `

          <div class="empty">

            Formula load failed.

            <br><br>

            <small>
              ${esc(
                error.message ||
                error
              )}
            </small>

          </div>

        `;

    }

  }

}

/* =========================================================
   DELETE CURRENT FORMULA
========================================================= */

async function deleteCurrent() {

  if (!editingId)
    return;


  if (
    !confirm(
      "Delete this formula?"
    )
  ) {

    return;

  }


  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  const deleteBtn =
    $("deleteBtn");


  if (deleteBtn) {

    deleteBtn.disabled =
      true;

  }


  try {

    setStatus(
      "☁ Deleting formula..."
    );


    /* -------------------------------------------------------
       DELETE INGREDIENTS
    ------------------------------------------------------- */

    const {
      error:
        ingredientDeleteError
    } =
      await supabaseClient
        .from(
          "formula_ingredients"
        )
        .delete()
        .eq(
          "formula_id",
          editingId
        );


    if (
      ingredientDeleteError
    ) {

      throw new Error(
        "Ingredient delete failed: " +
        ingredientDeleteError.message
      );

    }


    /* -------------------------------------------------------
       DELETE FORMULA
    ------------------------------------------------------- */

    const {
      error
    } =
      await supabaseClient
        .from("formulas")
        .delete()
        .eq(
          "id",
          editingId
        );


    if (error) {

      throw new Error(
        "Formula delete failed: " +
        error.message
      );

    }


    alert(
      "Formula deleted successfully."
    );


    editingId =
      null;


    lastBatchSize =
      0;


    await loadFormulas();


    showTab("seen");


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    setStatus(
      "❌ " +
      (
        error.message ||
        error
      ),
      true
    );


    alert(
      "Delete error:\n\n" +
      (
        error.message ||
        error
      )
    );


  } finally {

    if (deleteBtn) {

      deleteBtn.disabled =
        false;

    }

  }

}

/* =========================================================

========================================================= */

function setupEvents() {

  ------------------------------------------------------- */

  if ($("settingsButton")) {

    $("settingsButton")
      .addEventListener(
        "click",
        toggleSettings
      );

  }


  /* -------------------------------------------------------
     TABS
  ------------------------------------------------------- */

  if ($("seenTab")) {

    $("seenTab")
      .addEventListener(
        "click",
        function() {

          showTab("seen");

        }
      );

  }


  if ($("editTab")) {

    $("editTab")
      .addEventListener(
        "click",
        function() {

          showTab("edit");

        }
      );

  }


  /* -------------------------------------------------------
     NEW
  ------------------------------------------------------- */

  if ($("newTopBtn")) {

    $("newTopBtn")
      .addEventListener(
        "click",
        newFormula
      );

  }


  /* -------------------------------------------------------
     CLEAR
  ------------------------------------------------------- */

  if ($("clearBtn")) {

    $("clearBtn")
      .addEventListener(
        "click",
        newFormula
      );

  }


  /* -------------------------------------------------------
     SAVE
  ------------------------------------------------------- */

  if ($("saveBtn")) {

    $("saveBtn")
      .addEventListener(
        "click",
        saveFormula
      );

  }


  /* -------------------------------------------------------
     DELETE
  ------------------------------------------------------- */

  if ($("deleteBtn")) {

    $("deleteBtn")
      .addEventListener(
        "click",
        deleteCurrent
      );

  }


  /* -------------------------------------------------------
     ADD INGREDIENT
  ------------------------------------------------------- */

  if ($("addIngredientBtn")) {

    $("addIngredientBtn")
      .addEventListener(
        "click",
        function() {

          addIngredient();

        }
      );

  }


  /* -------------------------------------------------------
     SEARCH
  ------------------------------------------------------- */

  if ($("search")) {

    $("search")
      .addEventListener(
        "input",
        renderList
      );

  }


  /* -------------------------------------------------------
     SCIENCE ADD
  ------------------------------------------------------- */

  if ($("scienceAddBtn")) {

    $("scienceAddBtn")
      .addEventListener(
        "click",
        function() {

          addMasterIngredient(
            "science"
          );

        }
      );

  }


  /* -------------------------------------------------------
     NATURAL ADD
  ------------------------------------------------------- */

  if ($("naturalAddBtn")) {

    $("naturalAddBtn")
      .addEventListener(
        "click",
        function() {

          addMasterIngredient(
            "natural"
          );

        }
      );

  }


  /* -------------------------------------------------------
     SCIENCE ENTER
  ------------------------------------------------------- */

  if ($("scienceInput")) {

    $("scienceInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            addMasterIngredient(
              "science"
            );

          }

        }
      );

  }


  /* -------------------------------------------------------
     NATURAL ENTER
  ------------------------------------------------------- */

  if ($("naturalInput")) {

    $("naturalInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            addMasterIngredient(
              "natural"
            );

          }

        }
      );

  }


  /* -------------------------------------------------------
     BATCH SCALING
  ------------------------------------------------------- */

  if ($("batchSize")) {

    $("batchSize")
      .addEventListener(
        "change",
        scaleIngredientsForBatch
      );

  }

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    try {

      setupEvents();

    } catch (e) {

      console.error(
        "Setup error:",
        e
      );

    }


    /* -------------------------------------------------------
       CREATE AUTO FORMULA ID FIELD
    ------------------------------------------------------- */

    ensureFormulaIdField();


    /* -------------------------------------------------------
       DATE
    ------------------------------------------------------- */

    try {

      if ($("date")) {

        $("date").value =
          today();

      }

    } catch (e) {

      console.error(e);

    }


    /* -------------------------------------------------------
       LOAD MASTER INGREDIENTS FIRST
    ------------------------------------------------------- */

    try {

      await loadMasterIngredients();

    } catch (e) {

      console.error(
        "Master ingredient error:",
        e
      );

    }


    /* -------------------------------------------------------
       FIRST INGREDIENT ROW
    ------------------------------------------------------- */

    try {

      if (
        $("ingredients") &&
        !$("ingredients")
          .children.length
      ) {

        addIngredient();

      }

    } catch (e) {

      console.error(
        "Ingredient UI error:",
        e
      );

    }


    /* -------------------------------------------------------
       LOAD FORMULAS
    ------------------------------------------------------- */

    try {

      await loadFormulas();

    } catch (e) {

      console.error(
        "Formula load error:",
        e
      );

    }

  }

);

</script>
