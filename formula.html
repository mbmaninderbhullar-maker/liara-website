<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#1f2937
}

header{

}

}

.actions{

}

button{
border:0;

padding:10px 15px;

font-weight:bold
}

.primary{

}

background:#e9eef0
}

margin-bottom:15px
}

}

table{

th,td{

th{

}

.ingredients{

.ing-head,
.ing-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr auto;
gap:8px;
margin-bottom:8px
}

.ing-head{
font-size:12px;
font-weight:bold
}

.total{
text-align:right;
font-weight:bold;
margin-top:8px
}

.card{
border:1px solid #e1e5e8;
border-radius:10px;
padding:14px;
margin-top:15px
}

.status{
font-size:12px;
margin-bottom:14px;
padding:8px;
border-radius:7px;
background:#eef5f1
}

.status.error{
background:#fdecec;
color:#9b2226
}

.brand-print{
font-family:Georgia,"Times New Roman",serif;

}

}

@media(max-width:800px){

.grid{
grid-template-columns:1fr 1fr

.ing-head,
.ing-row{

}

.grid{
grid-template-columns:1fr
}

header{
padding:15px
}

.logo{
font-size:20px
}

}

@media print{

body{
background:white
}

header,
.tabs,
.no-print,
#seen,
#edit{
display:none!important
}

#printArea{

}

<body>

<header>

<div class="logo">
Liara Professional™
<small>ADVANCED HERBAL</small>
</div>

<span class="badge">
☁ Online Formula
</span>

</header>


<div class="container">

<div class="tabs no-print">

<button
class="tab active"
onclick="showTab('seen',this)">
👁 Formula Seen
</button>

<button
class="tab"
onclick="showTab('edit',this)">
➕ Add / Edit Formula
</button>

</div>


<!-- STATUS -->

<div
id="status"
class="status no-print">
☁ Connecting to Supabase...
</div>


<!-- FORMULA SEEN -->

<section
id="seen"
class="panel active">

<div class="searchbar no-print">

<input
id="search"
placeholder="Search product, formula no. or formula name..."
oninput="renderList()">

<button
class="secondary"
onclick="newFormula()">
➕ New
</button>

</div>

<div id="formulaList">

<div class="empty">
Loading formulas...
</div>

</div>

</section>


<!-- ADD / EDIT -->

<section
id="edit"
class="panel">

<div class="grid">

<div class="field">

<label>Formula No.</label>

<input
id="formulaNo"
placeholder="e.g. LP-F-001">

</div>


<div class="field">

<label>Product Name *</label>

<input
id="productName"
placeholder="Product name">

</div>


<div class="field">

<label>Formula Name</label>

<input
id="formulaName"
placeholder="Formula name">

</div>


<div class="field">

<label>Version</label>

<input
id="version"
placeholder="e.g. V1.0">

</div>


<div class="field">

<label>Date</label>

<input
id="date"

</div>


<div class="field">

<label>Batch Size</label>

<input
id="batchSize"
type="number"

<div class="field">

<label>Batch Unit</label>

<select id="batchUnit">

<option>g</option>
<option>kg</option>
<option>ml</option>
<option>L</option>

<label>Total %</label>

<input
id="totalPercent"
readonly
value="0%">

</div>

<!-- INGREDIENTS -->

<div class="card">

<b>Ingredients</b>

<div class="ingredients">

<div class="ing-head">

<span>Ingredient</span>
<span>Quantity</span>
<span>Unit</span>
<span>%</span>
<span></span>

</div>

<div id="ingredients"></div>

</div>


<div class="total">

Total Quantity:
<span id="totalQty">0</span>

&nbsp; | &nbsp;

Total:
<span id="totalPct">0%</span>

</div>


<button
class="secondary no-print"
onclick="addIngredient()">

+ Add Ingredient

</button>

</div>


<!-- OTHER DETAILS -->

<div
class="grid"
style="margin-top:15px">


<div class="field full">

<label>Preparation Method</label>

<textarea
id="method"
placeholder="Write preparation / manufacturing method..."></textarea>

</div>


<div class="field full">

<label>Result</label>

<textarea
id="result"
placeholder="Final result / observation, colour, texture, pH, fragrance, etc."></textarea>

</div>


<div class="field full">

<label>Notes</label>

<textarea
id="notes"

</div>

</div>


<div class="actions no-print">

<button
class="primary"
onclick="saveFormula()">

💾 Save Formula

</button>


<button
class="secondary"
onclick="newFormula()">

Clear

</button>


<button
class="danger"
id="deleteBtn"

🗑 Delete

</button>

</section>


<!-- PRINT AREA -->

<section
id="printArea"
style="display:none">
</section>


</div>


<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ================================
   VARIABLES
================================ */

let formulas = [];

let editingId = null;


/* ================================
   SHORTCUT
================================ */

function $(id){

return document.getElementById(id);

}


/* ================================
   STATUS
================================ */

function setStatus(message,error=false){

$("status").textContent = message;

$("status").className =
error
? "status error no-print"
: "status no-print";

}


/* ================================
   ESCAPE TEXT
================================ */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,

function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m];

});

}


function nl(value){

return esc(value)
.replace(/\n/g,"<br>");

}


/* ================================
   DATE
================================ */

function today(){

return new Date()
.toISOString()
.slice(0,10);

}


/* ================================
   TAB
================================ */

function showTab(id,btn){

document
.querySelectorAll(".panel")
.forEach(
p => p.classList.remove("active")
);

$(id).classList.add("active");

document
.querySelectorAll(".tab")
.forEach(
b => b.classList.remove("active")
);

btn.classList.add("active");

}


/* ================================
   NEW FORMULA
================================ */

function newFormula(){

editingId = null;

[
"formulaNo",
"productName",
"formulaName",
"version",
"method",
"result",
"notes",
"batchSize"

].forEach(

id => $(id).value=""

);


$("date").value = today();

$("batchUnit").value = "g";

$("ingredients").innerHTML = "";

addIngredient();

$("deleteBtn").style.display = "none";

document
.querySelectorAll(".tab")[1]
.click();

}


/* ================================
   ADD INGREDIENT
================================ */

function addIngredient(data={}){

const row =
document.createElement("div");

row.className = "ing-row";

row.innerHTML = `

<input
class="iname"
placeholder="Ingredient name"
value="${esc(data.name || "")}">

<input
class="iqty"
type="number"
min="0"
step="any"
placeholder="Qty"
value="${data.qty ?? ""}"
oninput="calcTotals()">

<select class="iunit">

<option ${data.unit==="g"?"selected":""}>
g
</option>

<option ${data.unit==="kg"?"selected":""}>
kg
</option>

<option ${data.unit==="ml"?"selected":""}>
ml
</option>

<option ${data.unit==="L"?"selected":""}>
L
</option>

</select>

<input
class="ipct"
type="number"
min="0"
step="any"
placeholder="%"
value="${data.pct ?? ""}"
oninput="calcTotals()">

<button
class="danger"
onclick="
this.parentElement.remove();
calcTotals();
">

×

</button>

`;

$("ingredients")
.appendChild(row);

calcTotals();

}


/* ================================
   TOTALS
================================ */

function calcTotals(){

let q = 0;

let p = 0;


document
.querySelectorAll(".iqty")
.forEach(
x => q += Number(x.value) || 0
);


document
.querySelectorAll(".ipct")
.forEach(
x => p += Number(x.value) || 0
);


$("totalQty").textContent =
q.toFixed(2).replace(/\.00$/,"");


$("totalPct").textContent =
p.toFixed(2).replace(/\.00$/,"")
+ "%";


$("totalPercent").value =
p.toFixed(2).replace(/\.00$/,"")
+ "%";

}


/* ================================
   GET INGREDIENTS
================================ */

function getIngredients(){

return [

...document
.querySelectorAll(
"#ingredients .ing-row"
)

]

.map(

row => ({

name:
row
.querySelector(".iname")
.value
.trim(),

qty:
row
.querySelector(".iqty")
.value,

unit:
row
.querySelector(".iunit")
.value,

pct:
row
.querySelector(".ipct")
.value

})

)

.filter(
x =>
x.name ||
x.qty ||
x.pct
);

}


/* ================================
   SAVE FORMULA
================================ */

async function saveFormula(){

const product =
$("productName")
.value
.trim();


if(!product){

alert("Product Name is required.");

return;

}


const item = {

formula_no:
$("formulaNo")
.value
.trim(),

product_name:
product,

formula_name:
$("formulaName")
.value
.trim(),

version:
$("version")
.value
.trim(),

formula_date:
$("date")
.value || today(),

batch_size:
$("batchSize")
.value
? Number($("batchSize").value)
: null,

batch_unit:
$("batchUnit")
.value,

preparation_method:
$("method")
.value
.trim(),

result:
$("result")
.value
.trim(),

notes:
$("notes")
.value
.trim(),

updated_at:
new Date().toISOString()

};


try{

let formulaId =
editingId;


/* UPDATE */

if(editingId){

const {error} =
await supabase
.from("formulas")
.update(item)
.eq("id",editingId);


if(error)
throw error;


/* Remove old ingredients */

const {error:deleteError} =
await supabase
.from("formula_ingredients")
.delete()
.eq("formula_id",editingId);


if(deleteError)
throw deleteError;

}


/* INSERT */

else{

const {data,error} =
await supabase
.from("formulas")
.insert(item)
.select("id")
.single();


if(error)
throw error;


formulaId = data.id;

}


/* INGREDIENTS */

const ingredients =
getIngredients()
.map(x => ({

formula_id:
formulaId,

ingredient_name:
x.name,

quantity:
x.qty
? Number(x.qty)
: null,

unit:
x.unit,

percentage:
x.pct
? Number(x.pct)
: null

}));


if(ingredients.length){

const {error} =
await supabase
.from("formula_ingredients")
.insert(ingredients);


if(error)
throw error;

}


alert(
editingId
? "Formula updated successfully."
: "Formula saved successfully."
);


await loadFormulas();

editFormula(formulaId);

}

catch(error){

console.error(error);

alert(
"Supabase error: "
+ error.message
);

}

}


/* ================================
   LOAD FORMULAS
================================ */

async function loadFormulas(){

setStatus(
"☁ Loading formulas..."
);


const {data,error} =
await supabase
.from("formulas")
.select(
"*, formula_ingredients(*)"
)
.order(
"created_at",
{ascending:false}
);


if(error){

setStatus(
"❌ Supabase error: "
+ error.message,
true
);

$("formulaList").innerHTML = `

<div class="empty">

Could not load formulas.

<br><br>

${esc(error.message)}

</div>

`;

return;

}


formulas = data || [];


setStatus(
"☁ Connected • "
+ formulas.length
+ " formula(s) online"
);


renderList();

}


/* ================================
   LIST
================================ */

function renderList(){

const q =
$("search")
.value
.toLowerCase()
.trim();


const list =
formulas.filter(

f => (

(f.product_name || "")
+ " "
+ (f.formula_no || "")
+ " "
+ (f.formula_name || "")

)
.toLowerCase()
.includes(q)

);


if(!list.length){

$("formulaList").innerHTML = `

<div class="empty">

No formulas found.

<br><br>

Click <b>New</b>
to add one.

</div>

`;

return;

}


$("formulaList").innerHTML = `

<table>

<thead>

<tr>

<th>Formula No.</th>
<th>Product</th>
<th>Formula</th>
<th>Version</th>
<th>Date</th>
<th class="no-print">
Action
</th>

</tr>

</thead>

<tbody>

${
list.map(f => `

<tr>

<td>
${esc(f.formula_no || "-")}
</td>

<td>
<b>
${esc(f.product_name)}
</b>
</td>

<td>
${esc(f.formula_name || "-")}
</td>

<td>
${esc(f.version || "-")}
</td>

<td>
${esc(f.formula_date || "-")}
</td>

<td class="no-print">

<button
class="secondary"
onclick="viewFormula('${f.id}')">
👁 View
</button>

<button
class="secondary"
onclick="editFormula('${f.id}')">
✏️ Edit
</button>

<button
class="secondary"
onclick="printFormula('${f.id}')">
🖨️ Print
</button>

</td>

</tr>

`).join("")
}

</tbody>

</table>

`;

}


/* ================================
   EDIT
================================ */

function editFormula(id){

const f =
formulas.find(
x => x.id === id
);


if(!f)
return;


editingId = id;


$("formulaNo").value =
f.formula_no || "";


$("productName").value =
f.product_name || "";


$("formulaName").value =
f.formula_name || "";


$("version").value =
f.version || "";


$("date").value =
f.formula_date || today();


$("batchSize").value =
f.batch_size ?? "";


$("batchUnit").value =
f.batch_unit || "g";


$("method").value =
f.preparation_method || "";


$("result").value =
f.result || "";


$("notes").value =
f.notes || "";


$("ingredients").innerHTML = "";


const ingredients =
f.formula_ingredients || [];


if(ingredients.length){

ingredients.forEach(

x => addIngredient({

name:
x.ingredient_name,

qty:
x.quantity,

unit:
x.unit,

pct:
x.percentage

})

);

}

else{

addIngredient();

}


$("deleteBtn")
.style.display =
"inline-block";


calcTotals();


document
.querySelectorAll(".tab")[1]
.click();

}


/* ================================
   VIEW
================================ */

function viewFormula(id){

const f =
formulas.find(
x => x.id === id
);


if(!f)
return;


const ingredients =
f.formula_ingredients || [];


const ing =
ingredients
.map(x => `

<tr>

<td>
${esc(x.ingredient_name)}
</td>

<td>
${esc(x.quantity ?? "")}
</td>

<td>
${esc(x.unit || "")}
</td>

<td>
${esc(x.percentage ?? "")}
</td>

</tr>

`)
.join("");


$("formulaList").innerHTML = `

<div class="card">

<div class="actions no-print">

<button
class="secondary"
onclick="renderList()">
← Back
</button>

<button
class="primary"
onclick="printFormula('${f.id}')">
🖨️ Print
</button>

<button
class="secondary"
onclick="editFormula('${f.id}')">
✏️ Edit
</button>

</div>


<h2>
${esc(f.product_name)}
</h2>


<p>

<b>Formula No:</b>
${esc(f.formula_no || "-")}

&nbsp;&nbsp;

<b>Version:</b>
${esc(f.version || "-")}

&nbsp;&nbsp;

<b>Date:</b>
${esc(f.formula_date || "-")}

</p>


<p>

<b>Formula Name:</b>
${esc(f.formula_name || "-")}

</p>


<h3>
Ingredients
</h3>


<table>

<tr>

<th>Ingredient</th>
<th>Quantity</th>
<th>Unit</th>
<th>%</th>

</tr>

${
ing ||
`
<tr>
<td colspan="4">
No ingredients
</td>
</tr>
`
}

</table>


<h3>
Preparation Method
</h3>

<div>
${nl(f.preparation_method || "-")}
</div>


<h3>
Result
</h3>

<div>
${nl(f.result || "-")}
</div>


<h3>
Notes
</h3>

<div>
${nl(f.notes || "-")}
</div>

</div>

`;

}


/* ================================
   DELETE
================================ */

async function deleteCurrent(){

if(!editingId)
return;


if(
!confirm(
"Delete this formula?"
)
)
return;


try{

const {error} =
await supabase
.from("formulas")
.delete()
.eq("id",editingId);


if(error)
throw error;


alert(
"Formula deleted successfully."
);


editingId = null;


await loadFormulas();


document
.querySelectorAll(".tab")[0]
.click();

}

catch(error){

alert(
"Delete error: "
+ error.message
);

}

}


/* ================================
   PRINT
================================ */

function printFormula(id){

const f =
formulas.find(
x => x.id === id
);


if(!f)
return;


const ingredients =
f.formula_ingredients || [];


const ing =
ingredients
.map(x => `

<tr>

<td>
${esc(x.ingredient_name)}
</td>

<td>
${esc(x.quantity ?? "")}
</td>

<td>
${esc(x.unit || "")}
</td>

<td>
${esc(x.percentage ?? "")}
</td>

</tr>

`)
.join("");


$("printArea").innerHTML = `

<div class="brand-print">
Liara Professional™
</div>

<div class="brand-line">
ADVANCED HERBAL
</div>


<h2>
FORMULA SHEET
</h2>


<table class="print-table">

<tr>

<th>Product Name</th>

<td>
${esc(f.product_name)}
</td>

<th>Formula No.</th>

<td>
${esc(f.formula_no || "-")}
</td>

</tr>


<tr>

<th>Formula Name</th>

<td>
${esc(f.formula_name || "-")}
</td>

<th>Version</th>

<td>
${esc(f.version || "-")}
</td>

</tr>


<tr>

<th>Date</th>

<td>
${esc(f.formula_date || "-")}
</td>

<th>Batch</th>

<td>
${esc(f.batch_size ?? "-")}
${esc(f.batch_unit || "")}
</td>

</tr>

</table>


<h3>
Ingredients
</h3>
