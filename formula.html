/* =========================================================

/* =========================================================
   SHORTCUT
========================================================= */

function $(id) {

  return document.getElementById(id);

/* =========================================================
   STATUS
========================================================= */

function setStatus(message, error = false) {

  const box = $("status");

  if (!box) return;

  box.textContent = message;

  box.className =
    error
      ? "status error no-print"
      : "status no-print";

}


/* =========================================================
   ESCAPE
========================================================= */

function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m) {

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        }[m];

      }
    );

}


function nl(value) {

  return esc(value)
    .replace(/\n/g, "<br>");

}


/* =========================================================
   DATE
========================================================= */

function today() {

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return year + "-" + month + "-" + day;

}


/* =========================================================
   TAB
========================================================= */

function showTab(id) {

  document
    .querySelectorAll(".panel")
    .forEach(
      p =>
        p.classList.remove("active")
    );

  const panel = $(id);

  if (panel)
    panel.classList.add("active");


  document
    .querySelectorAll(".tab")
    .forEach(
      b =>
        b.classList.remove("active")
    );


  if (id === "seen") {

    $("seenTab")
      .classList.add("active");

  } else {

    $("editTab")
      .classList.add("active");

  }

}

/* =========================================================
   MASTER INGREDIENTS
   SUPABASE TABLE: ingredients
========================================================= */

let masterIngredients = {

  science: [],
  natural: []

};


/* =========================================================
   LOAD MASTER INGREDIENTS
========================================================= */

async function loadMasterIngredients() {

  if (!supabaseClient) {

    setStatus(
      "❌ Supabase is not connected.",
      true
    );

    return;

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("ingredients")
        .select("*")
        .order("name", {
          ascending: true
        });


    if (error)
      throw error;


    const rows =
      Array.isArray(data)
        ? data
        : [];


    masterIngredients = {

      science:
        rows
          .filter(
            x =>
              x.category === "science"
          )
          .map(
            x => x.name
          ),

      natural:
        rows
          .filter(
            x =>
              x.category === "natural"
          )
          .map(
            x => x.name
          )

    };


    renderMasterLists();

    refreshIngredientDropdowns();


  } catch (error) {

    console.error(
      "Master ingredient load error:",
      error
    );


    /*
      If ingredients table doesn't exist,
      tell the user clearly.
    */

    setStatus(
      "⚠️ Ingredient master table error: " +
      (error.message || error),
      true
    );


    renderMasterLists();

  }

}


/* =========================================================
   ADD MASTER INGREDIENT
========================================================= */

async function addMasterIngredient(type) {

  const input =
    $(type + "Input");

  if (!input)
    return;


  const value =
    input.value.trim();


  if (!value) {

    alert(
      "Please enter ingredient name."
    );

    input.focus();

    return;

  }


  if (
    type !== "science" &&
    type !== "natural"
  ) {

    return;

  }


  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  try {

    /*
      Check duplicate
    */

    const {
      data: existing,
      error: checkError
    } =
      await supabaseClient
        .from("ingredients")
        .select("id,name")
        .ilike(
          "name",
          value
        )
        .limit(1);


    if (checkError)
      throw checkError;


    if (
      existing &&
      existing.length
    ) {

      alert(
        "This ingredient already exists."
      );

      input.select();

      return;

    }


    /*
      Insert new ingredient
    */

    const {
      error
    } =
      await supabaseClient
        .from("ingredients")
        .insert({

          name: value,

          category: type,

          updated_at:
            new Date().toISOString()

        });


    if (error)
      throw error;


    input.value = "";


    await loadMasterIngredients();


    input.focus();


    setStatus(
      "☁ Ingredient saved: " + value
    );


  } catch (error) {

    console.error(
      "Add ingredient error:",
      error
    );


    alert(
      "Ingredient save error:\n\n" +
      (error.message || error)
    );

  }

}


/* =========================================================
   DELETE MASTER INGREDIENT
========================================================= */

async function deleteMasterIngredient(
  name,
  type
) {

  if (!name)
    return;


  if (
    !confirm(
      "Delete \"" +
      name +
      "\" from master ingredient list?"
    )
  ) {

    return;

  }


  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("ingredients")
        .delete()
        .eq(
          "name",
          name
        )
        .eq(
          "category",
          type
        );


    if (error)
      throw error;


    await loadMasterIngredients();


    refreshIngredientDropdowns();


    setStatus(
      "☁ Ingredient deleted: " +
      name
    );


  } catch (error) {

    console.error(
      "Delete ingredient error:",
      error
    );


    alert(
      "Ingredient delete error:\n\n" +
      (error.message || error)
    );

  }

}

/* =========================================================
   INGREDIENT OPTIONS
========================================================= */

function getIngredientOptions(
  selected = ""
) {

  const natural =
    masterIngredients.natural || [];

  const science =
    masterIngredients.science || [];


  let html = `
    <option value="">
      Select ingredient...
    </option>
  `;


  if (natural.length) {

    html += `
      <optgroup label="🌿 Natural / Herbal">
    `;


    natural.forEach(
      item => {

        html += `
          <option
            value="${esc(item)}"
            ${item === selected
              ? "selected"
              : ""}>
            ${esc(item)}
          </option>
        `;

      }
    );


    html += `
      </optgroup>
    `;

  }


  if (science.length) {

    html += `
      <optgroup label="🧪 Science">
    `;


    science.forEach(
      item => {

        html += `
          <option
            value="${esc(item)}"
            ${item === selected
              ? "selected"
              : ""}>
            ${esc(item)}
          </option>
        `;

      }
    );


    html += `
      </optgroup>
    `;

  }


  html += `
    <option value="__custom__">
      ✏️ Other / Type Manually
    </option>
  `;


  return html;

}


/* =========================================================
   REFRESH OPEN DROPDOWNS
========================================================= */

function refreshIngredientDropdowns() {

  document
    .querySelectorAll(
      "#ingredients .ing-row"
    )
    .forEach(
      row => {

        const select =
          row.querySelector(
            ".iname-select"
          );

        if (!select)
          return;


        const custom =
          row.querySelector(
            ".custom-ingredient"
          );


        let current = "";


        if (
          select.value &&
          select.value !== "__custom__"
        ) {

          current =
            select.value;

        } else if (custom) {

          current =
            custom.value.trim();

        }


        select.innerHTML =
          getIngredientOptions(
            current
          );


        if (
          current &&
          select.querySelector(
            `option[value="${CSS.escape(current)}"]`
          )
        ) {

          select.value =
            current;

          custom.style.display =
            "none";

        }

      }
    );

}

    );

  row

/* =========================================================
   INGREDIENT SELECT CHANGE
========================================================= */

function ingredientSelectChanged(
  select
) {

  const row =
    select.closest(
      ".ing-row"
    );


  if (!row)
    return;


  const custom =
    row.querySelector(
      ".custom-ingredient"
    );


  if (
    select.value ===
    "__custom__"
  ) {

    custom.style.display =
      "block";

    custom.focus();

  } else {

    custom.style.display =
      "none";

    custom.value =
      select.value;

  }


  calcTotals();

}


/* =========================================================
   TOTALS
========================================================= */

function calcTotals() {

  let q = 0;

  let p = 0;


  document
    .querySelectorAll(
      "#ingredients .iqty"
    )
    .forEach(
      x => {

        q +=
          Number(x.value) || 0;

      }
    );


  document
    .querySelectorAll(
      "#ingredients .ipct"
    )
    .forEach(
      x => {

        p +=
          Number(x.value) || 0;

      }
    );


  $("totalQty")
    .textContent =
      q.toFixed(2)
        .replace(/\.00$/, "");


  $("totalPct")
    .textContent =
      p.toFixed(2)
        .replace(/\.00$/, "")
      + "%";


  $("totalPercent")
    .value =
      p.toFixed(2)
        .replace(/\.00$/, "")
      + "%";

}


/* =========================================================
   BATCH SIZE SCALING
========================================================= */

function scaleIngredientsForBatch() {

  const batchField =
    $("batchSize");


  if (!batchField)
    return;


  const newBatch =
    Number(
      batchField.value
    );


  if (
    !Number.isFinite(newBatch) ||
    newBatch <= 0
  ) {

    return;

  }


  if (
    !lastBatchSize ||
    lastBatchSize <= 0
  ) {

    lastBatchSize =
      newBatch;

    return;

  }


  if (
    Math.abs(
      newBatch -
      lastBatchSize
    ) < 0.0000001
  ) {

    return;

  }


  const multiplier =
    newBatch /
    lastBatchSize;


  document
    .querySelectorAll(
      "#ingredients .ing-row"
    )
    .forEach(
      row => {

        const qty =
          row.querySelector(
            ".iqty"
          );


        if (!qty)
          return;


        const oldQty =
          Number(
            qty.value
          );


        if (
          !Number.isFinite(
            oldQty
          )
        ) {

          return;

        }


        const newQty =
          oldQty *
          multiplier;


        qty.value =
          newQty
            .toFixed(6)
            .replace(
              /\.?0+$/,
              ""
            );

      }
    );


  lastBatchSize =
    newBatch;


  calcTotals();

}


/* =========================================================
   GET INGREDIENTS
   FIXED — NO INVALID SPREAD SYNTAX
========================================================= */

function getIngredients() {

  return Array.from(
    document.querySelectorAll(
      "#ingredients .ing-row"
    )
  )
  .map(
    row => {

      const select =
        row.querySelector(
          ".iname-select"
        );


      const custom =
        row.querySelector(
          ".custom-ingredient"
        );


      let name = "";


      if (
        select &&
        select.value ===
        "__custom__"
      ) {

        name =
          custom
            ? custom.value.trim()
            : "";

      } else {

        name =
          select
            ? select.value.trim()
            : "";

      }


      return {

        name,

        qty:
          row.querySelector(
            ".iqty"
          ).value,

        unit:
          row.querySelector(
            ".iunit"
          ).value,

        pct:
          row.querySelector(
            ".ipct"
          ).value

      };

    }
  )
  .filter(
    x =>
      x.name ||
      x.qty ||
      x.pct
  );

}


/* =========================================================
   SAVE FORMULA
========================================================= */

async function saveFormula() {

  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  const product =
    $("productName")
      .value
      .trim();


  if (!product) {

    alert(
      "Product Name is required."
    );

    $("productName").focus();

    return;

  }


  const ingredients =
    getIngredients();


  /*
    Remove completely empty ingredient rows
  */


  const item = {

    formula_no:
      $("formulaNo")
        .value
        .trim(),

    product_name:
      product,

    formula_name:
      $("formulaName")
        .value
        .trim(),

    version:
      $("version")
        .value
        .trim(),

    formula_date:
      $("date").value ||
      today(),

    batch_size:
      $("batchSize").value
        ? Number(
            $("batchSize").value
          )
        : null,

    batch_unit:
      $("batchUnit").value,

    preparation_method:
      $("method")
        .value
        .trim(),

    result:
      $("result")
        .value
        .trim(),

    notes:
      $("notes")
        .value
        .trim(),

    updated_at:
      new Date()
        .toISOString()

  };


  /*
    Disable button during save
  */

  const saveBtn =
    $("saveBtn");


  const oldText =
    saveBtn.textContent;


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "⏳ Saving...";


  try {

    let formulaId =
      editingId;


    /* =====================================================
       UPDATE EXISTING FORMULA
    ===================================================== */

    if (editingId) {

      setStatus(
        "☁ Updating formula..."
      );


      const {
        error
      } =
        await supabaseClient
          .from("formulas")
          .update(item)
          .eq(
            "id",
            editingId
          );


      if (error)
        throw new Error(
          "Formula update failed: " +
          error.message
        );


      /*
        Delete old ingredients
      */

      const {
        error:
          deleteError
      } =
        await supabaseClient
          .from("formula_ingredients")
          .delete()
          .eq(
            "formula_id",
            editingId
          );


      if (deleteError)
        throw new Error(
          "Old ingredient delete failed: " +
          deleteError.message
        );


    }

    /* =====================================================
       CREATE NEW FORMULA
    ===================================================== */

    else {

      setStatus(
        "☁ Creating formula..."
      );


      const {
        data,
        error
      } =
        await supabaseClient
          .from("formulas")
          .insert(item)
          .select("id")
          .single();


      if (error)
        throw new Error(
          "Formula creation failed: " +
          error.message
        );


      if (!data || !data.id)
        throw new Error(
          "Formula was created but ID was not returned."
        );


      formulaId =
        data.id;

    }


    /* =====================================================
       SAVE INGREDIENTS
    ===================================================== */

    if (
      ingredients.length
    ) {

      const ingredientRows =
        ingredients
          .map(
            x => ({

              formula_id:
                formulaId,

              ingredient_name:
                x.name,

              quantity:
                x.qty !== ""
                  ? Number(x.qty)
                  : null,

              unit:
                x.unit,

              percentage:
                x.pct !== ""
                  ? Number(x.pct)
                  : null

            })
          );


      const {
        error
      } =
        await supabaseClient
          .from("formula_ingredients")
          .insert(
            ingredientRows
          );


      if (error)
        throw new Error(
          "Ingredient save failed: " +
          error.message
        );

    }


    /*
      If manually typed ingredients were used,
      automatically add them to Science master list.
    */

    await autoSaveCustomIngredients(
      ingredients
    );


    setStatus(
      editingId
        ? "☁ Formula updated successfully."
        : "☁ Formula saved successfully."
    );


    alert(
      editingId
        ? "Formula updated successfully."
        : "Formula saved successfully."
    );


    await loadFormulas();


    editFormula(
      formulaId
    );


  } catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    setStatus(
      "❌ " +
      (error.message || error),
      true
    );


    alert(
      "SAVE ERROR:\n\n" +
      (error.message || error) +
      "\n\nCheck Supabase RLS policies."
    );


  } finally {

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      oldText;

  }

}


/* =========================================================
   AUTO SAVE CUSTOM INGREDIENTS
========================================================= */

async function autoSaveCustomIngredients(
  ingredientRows
) {

  if (
    !supabaseClient ||
    !ingredientRows.length
  )
    return;


  const masterRows = [];


  for (
    const ingredient
    of ingredientRows
  ) {

    if (!ingredient.name)
      continue;


    const exists =
      [
        ...(masterIngredients.natural || []),
        ...(masterIngredients.science || [])
      ]
      .some(
        x =>
          x.toLowerCase() ===
          ingredient.name.toLowerCase()
      );


    if (!exists) {

      masterRows.push({

        name:
          ingredient.name,

        category:
          "science",

        updated_at:
          new Date()
            .toISOString()

      });

    }

  }


  if (!masterRows.length)
    return;


  try {

    await supabaseClient
      .from("ingredients")
      .upsert(
        masterRows,
        {
          onConflict:
            "name"
        }
      );


    await loadMasterIngredients();


  } catch (error) {

    /*
      Don't fail formula save just because
      master ingredient auto-save failed.
    */

    console.warn(
      "Master ingredient auto-save:",
      error
    );

  }

}


/* =========================================================
   LOAD FORMULAS
========================================================= */

async function loadFormulas() {

  setStatus(
    "☁ Loading formulas..."
  );


  try {

    let rows = [];


    if (supabaseClient) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("formulas")
          .select("*")
          .order(
            "created_at",
            {
              ascending:false
            }
          );


      if (error)
        throw error;


      rows =
        data || [];

    }


    /*
      Load formula ingredients
    */

    let ingredientRows = [];


    if (
      rows.length &&
      supabaseClient
    ) {

      const ids =
        rows
          .map(
            f => f.id
          )
          .filter(Boolean);


      if (ids.length) {

        const {
          data,
          error
        } =
          await supabaseClient
            .from(
              "formula_ingredients"
            )
            .select("*")
            .in(
              "formula_id",
              ids
            );


        if (error) {

          console.warn(
            "Ingredient load warning:",
            error
          );

        } else {

          ingredientRows =
            data || [];

        }

      }

    }


    const ingredientMap =
      {};


    ingredientRows
      .forEach(
        ingredient => {

          const key =
            String(
              ingredient.formula_id
            );


          if (
            !ingredientMap[key]
          ) {

            ingredientMap[key] =
              [];

          }


          ingredientMap[key]
            .push(
              ingredient
            );

        }
      );


    formulas =
      rows.map(
        formula => ({

          ...formula,

          formula_ingredients:
            ingredientMap[
              String(formula.id)
            ] || []

        })
      );


    setStatus(
      "☁ Connected • " +
      formulas.length +
      " formula(s) online"
    );


    renderList();


  } catch (error) {

    console.error(
      "Load formulas error:",
      error
    );


    setStatus(
      "❌ " +
      (error.message || error),
      true
    );


    $("formulaList")
      .innerHTML = `

        <div class="empty">

          Formula load failed.

          <br><br>

          <small>
            ${esc(
              error.message ||
              error
            )}
          </small>

        </div>

      `;

  }

}

/* =========================================================
   DELETE CURRENT FORMULA
========================================================= */

async function deleteCurrent() {

  if (!editingId)
    return;


  if (
    !confirm(
      "Delete this formula?"
    )
  )
    return;


  if (!supabaseClient) {

    alert(
      "Supabase is not connected."
    );

    return;

  }


  const deleteBtn =
    $("deleteBtn");


  deleteBtn.disabled =
    true;


  try {

    setStatus(
      "☁ Deleting formula..."
    );


    /*
      Delete ingredients first
    */

    const {
      error:
        ingredientDeleteError
    } =
      await supabaseClient
        .from(
          "formula_ingredients"
        )
        .delete()
        .eq(
          "formula_id",
          editingId
        );


    if (
      ingredientDeleteError
    )
      throw new Error(
        "Ingredient delete failed: " +
        ingredientDeleteError.message
      );


    /*
      Delete formula
    */

    const {
      error
    } =
      await supabaseClient
        .from("formulas")
        .delete()
        .eq(
          "id",
          editingId
        );


    if (error)
      throw new Error(
        "Formula delete failed: " +
        error.message
      );


    alert(
      "Formula deleted successfully."
    );


    editingId = null;

    lastBatchSize = 0;


    await loadFormulas();


    showTab("seen");


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    setStatus(
      "❌ " +
      (error.message || error),
      true
    );


    alert(
      "Delete error:\n\n" +
      (error.message || error)
    );


  } finally {

    deleteBtn.disabled =
      false;

  }

}

    try {

      $("date").value =

      console.error(e);

      );

      }

    } catch (e) {

      console.error(
        "Ingredient UI error:",
        e
      );

    }

    await loadFormulas();

);
