<!DOCTYPE html> 
<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0"> 

    <title>Liara Professional™ | Shopping Cart</title> 

    <link rel="stylesheet" 
          href="style.css"> 

    <style> 

        .cart-section { 
            padding: 80px 8%; 
            background: #faf8f5; 
            min-height: 70vh; 
        } 

        .cart-container { 
            max-width: 1100px; 
            margin: auto; 
        } 

        .cart-box { 
            background: white; 
            padding: 30px; 
            border-radius: 18px; 
            box-shadow: 0 10px 35px rgba(0,0,0,0.08); 
        } 

        .cart-item { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            padding: 22px 0; 
            border-bottom: 1px solid #eee; 
        } 

        .cart-item img { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            border-radius: 12px; 
        } 

        .cart-info { 
            flex: 1; 
        } 

        .cart-info h3 { 
            margin: 0 0 8px; 
        } 

        .cart-price { 
            font-weight: bold; 
            margin-bottom: 12px; 
        } 

        .quantity-box { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        } 

        .quantity-box button { 
            width: 34px; 
            height: 34px; 
            border: 1px solid #ddd; 
            background: white; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 18px; 
        } 

        .quantity { 
            min-width: 25px; 
            text-align: center; 
            font-weight: bold; 
        } 

        .cart-actions { 
            margin-top: 12px; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        } 

        .remove-btn { 
            border: none; 
            background: #f5f5f5; 
            padding: 10px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            color: #a33; 
        } 

        .buy-btn { 
            text-decoration: none; 
            padding: 10px 18px; 
            border-radius: 6px; 
        } 

        .item-total { 
            font-size: 18px; 
            font-weight: bold; 
        } 

        .cart-bottom { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 30px; 
            gap: 20px; 
        } 

        .cart-total { 
            font-size: 25px; 
            font-weight: bold; 
        } 

        .empty-cart { 
            text-align: center; 
            padding: 60px 20px; 
        } 

        .free-shipping-msg { 
            margin-top: 12px; 
            padding: 12px 15px; 
            border-radius: 8px; 
            background: #f5f5f5; 
            font-size: 14px; 
        }

        /* =========================
           PAYMENT METHOD POPUP
        ========================= */

        .liara-payment-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.58);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 99999;
        }

        .liara-payment-popup {
            width: min(520px, 100%);
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: liaraPopupIn .2s ease-out;
        }

        @keyframes liaraPopupIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .liara-payment-popup h2 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #222;
        }

        .liara-payment-popup .liara-popup-subtitle {
            margin: 0 0 20px;
            color: #666;
            font-size: 14px;
        }

        .liara-payment-option {
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .liara-payment-option:hover {
            border-color: #222;
        }

        .liara-payment-option.active {
            border: 2px solid #222;
            background: #fafafa;
        }

        .liara-payment-option-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .liara-payment-option-text {
            color: #555;
            font-size: 14px;
            line-height: 1.65;
        }

        .liara-payment-total {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f7f7f7;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-weight: 700;
        }

        .liara-popup-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .liara-popup-buttons button {
            flex: 1;
            min-height: 46px;
            border-radius: 9px;
            border: 1px solid #ddd;
            cursor: pointer;
            font-weight: 700;
            padding: 10px 12px;
        }

        .liara-popup-cancel {
            background: #fff;
            color: #444;
        }

        .liara-popup-continue {
            background: #222;
            color: #fff;
            border-color: #222 !important;
        }

        @media (max-width: 520px) {
            .liara-payment-popup {
                padding: 22px;
            }

            .liara-popup-buttons {
                flex-direction: column;
            }
        }

        @media (max-width: 700px) { 

            .cart-section { 
                padding: 50px 5%; 
            } 

            .cart-item { 
                align-items: flex-start; 
            } 

            .cart-item img { 
                width: 75px; 
                height: 75px; 
            } 

            .item-total { 
                display: none; 
            } 

            .cart-bottom { 
                flex-direction: column; 
                align-items: stretch; 
            } 

        } 

    </style> 

</head> 


<body> 


<header> 

    <a href="index.html" 
       class="logo"> 

        <span>LIARA</span> 

        <small> 
            PROFESSIONAL™ 
        </small> 

    </a> 


    <nav> 

        <a href="index.html"> 
            Home 
        </a> 

        <a href="index.html#about"> 
            About 
        </a> 

        <a href="index.html#products"> 
            Products 
        </a> 

        <a href="cart.html"> 
            Cart 🛒 
        </a> 

        <a href="account.html"> 
            My Account 
        </a> 

        <a href="index.html#why-us"> 
            Why Liara 
        </a> 

        <a href="index.html#contact"> 
            Contact 
        </a> 

    </nav> 

</header> 



<section class="cart-section"> 


    <div class="heading"> 

        <p> 
            LIARA PROFESSIONAL™ 
        </p> 

        <h2> 
            Your Shopping Cart 
        </h2> 

    </div> 


    <div class="cart-container"> 

        <div class="cart-box" 
             id="cart-box"> 

        </div> 

    </div> 


</section> 



<footer> 

    <div class="footer-brand"> 

        LIARA 

        <small> 
            PROFESSIONAL™ 
        </small> 

    </div> 


    <p> 

        © 2026 Liara Group Private Limited. 
        All Rights Reserved. 

    </p> 

</footer> 



<script> 

const FREE_SHIPPING_THRESHOLD = 499; 
const SHIPPING_CHARGE = 49; 


/* ========================= 
   LOAD CART SAFELY 
========================= */ 

function loadCart() { 

    try { 

        const saved = 
            localStorage.getItem("liaraCart"); 

        if (!saved) { 
            return []; 
        } 

        const parsed = JSON.parse(saved); 

        if (Array.isArray(parsed)) { 
            return parsed; 
        } 

        /* If accidentally saved as one object */ 
        if (parsed && typeof parsed === "object") { 
            return [parsed]; 
        } 

        return []; 

    } catch (error) { 

        console.error( 
            "Cart loading error:", 
            error 
        ); 

        return []; 

    } 

} 


let cart = loadCart(); 


/* =========================
   PAYMENT POPUP HELPERS
========================= */

function liaraMoney(value) {
    return "₹" + Number(value || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function liaraGetCharge(subtotal, method) {
    subtotal = Math.max(0, Number(subtotal) || 0);

    if (method === "cod") {
        return subtotal <= 999 ? 120 : 80;
    }

    if (method === "online") {
        return subtotal <= 499 ? 80 : 0;
    }

    return 0;
}

function closeLiaraPaymentPopup() {
    const popup = document.getElementById("liara-payment-overlay");
    if (popup) {
        popup.remove();
    }
}

function updateLiaraPaymentTotal(subtotal, method) {
    const charge = liaraGetCharge(subtotal, method);
    const chargeText = charge === 0 ? "FREE" : liaraMoney(charge);

    const chargeElement = document.getElementById("liara-popup-charge");
    const totalElement = document.getElementById("liara-popup-final-total");

    if (chargeElement) {
        chargeElement.textContent = chargeText;
    }

    if (totalElement) {
        totalElement.textContent = liaraMoney(subtotal + charge);
    }

    document.querySelectorAll(".liara-payment-option").forEach(function(option) {
        option.classList.toggle(
            "active",
            option.getAttribute("data-method") === method
        );
    });
}

function selectLiaraPaymentMethod(method, subtotal) {
    const methodInput = document.getElementById("liara-popup-method");

    if (methodInput) {
        methodInput.value = method;
    }

    updateLiaraPaymentTotal(subtotal, method);
}

function showLiaraPaymentPopup(subtotal, checkoutMode, buyNowProduct) {

    subtotal = Math.max(0, Number(subtotal) || 0);

    const existing = document.getElementById("liara-payment-overlay");
    if (existing) {
        existing.remove();
    }

    const popup = document.createElement("div");
    popup.id = "liara-payment-overlay";
    popup.className = "liara-payment-overlay";

    popup.innerHTML = `
        <div class="liara-payment-popup" role="dialog" aria-modal="true">

            <h2>Choose Your Payment Method</h2>

            <p class="liara-popup-subtitle">
                Select your payment method to continue.
                Your selected delivery charge will be used on checkout.
            </p>

            <div class="liara-payment-option active"
                 data-method="cod"
                 onclick="selectLiaraPaymentMethod('cod', ${subtotal})">

                <div class="liara-payment-option-title">
                    💵 Cash on Delivery
                </div>

                <div class="liara-payment-option-text">
                    Orders up to ₹999 → <strong>₹120 COD Charge</strong><br>
                    Orders above ₹999 → <strong>₹80 COD Charge</strong>
                </div>

            </div>

            <div class="liara-payment-option"
                 data-method="online"
                 onclick="selectLiaraPaymentMethod('online', ${subtotal})">

                <div class="liara-payment-option-title">
                    ⚡ Online Payment
                </div>

                <div class="liara-payment-option-text">
                    Orders up to ₹499 → <strong>₹80 Delivery Charge</strong><br>
                    Orders above ₹499 → <strong>FREE Delivery</strong>
                </div>

            </div>

            <input type="hidden" id="liara-popup-method" value="cod">

            <div class="liara-payment-total">
                <span>
                    Delivery Charge:
                </span>
                <span id="liara-popup-charge">
                    ${liaraMoney(liaraGetCharge(subtotal, "cod"))}
                </span>
            </div>

            <div class="liara-payment-total">
                <span>
                    Final Total:
                </span>
                <span id="liara-popup-final-total">
                    ${liaraMoney(subtotal + liaraGetCharge(subtotal, "cod"))}
                </span>
            </div>

            <div class="liara-popup-buttons">

                <button type="button"
                        class="liara-popup-cancel"
                        onclick="closeLiaraPaymentPopup()">
                    Cancel
                </button>

                <button type="button"
                        class="liara-popup-continue"
                        onclick="confirmLiaraPaymentSelection(${subtotal}, '${checkoutMode}')">
                    Continue →
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(popup);

    window.liaraPendingCartBuyNowProduct = buyNowProduct || null;
}

function confirmLiaraPaymentSelection(subtotal, checkoutMode) {

    const methodElement = document.getElementById("liara-popup-method");
    const method = methodElement ? methodElement.value : "cod";

    const charge = liaraGetCharge(subtotal, method);

    localStorage.setItem(
        "liaraPaymentMethod",
        method === "cod" ? "Cash on Delivery" : "Online Payment"
    );

    localStorage.setItem(
        "liaraDeliveryCharge",
        String(charge)
    );

    localStorage.setItem(
        "liaraOrderSubtotal",
        String(subtotal)
    );

    localStorage.setItem(
        "liaraOrderFinalTotal",
        String(subtotal + charge)
    );

    localStorage.setItem(
        "liaraCheckoutMode",
        checkoutMode
    );

    if (checkoutMode === "buyNow" && window.liaraPendingCartBuyNowProduct) {

        localStorage.setItem(
            "liaraBuyNow",
            JSON.stringify(window.liaraPendingCartBuyNowProduct)
        );

    }

    closeLiaraPaymentPopup();

    window.location.href = "checkout.html";
}



/* ========================= 
   DISPLAY CART 
========================= */ 

function displayCart() { 

    const cartBox = 
        document.getElementById("cart-box"); 


    if (!Array.isArray(cart)) { 
        cart = []; 
    } 


    if (cart.length === 0) { 

        cartBox.innerHTML = ` 

            <div class="empty-cart"> 

                <h3> 
                    Your cart is empty 🛒 
                </h3> 

                <p> 
                    Add a product to your cart 
                    before buying. 
                </p> 

                <br> 

                <a 
                    href="index.html#products" 
                    class="btn"> 

                    Explore Products 

                </a> 

            </div> 

        `; 

        return; 

    } 


    let html = ""; 

    let subtotal = 0; 


    cart.forEach(function(product, index) { 

        const quantity = 
            Math.max( 
                1, 
                Number(product.quantity) || 1 
            ); 


        const price = 
            Math.max( 
                0, 
                Number(product.price) || 0 
            ); 


        const itemTotal = 
            price * quantity; 


        subtotal += itemTotal; 


        html += ` 

            <div class="cart-item"> 


                <img 
                    src="${product.image || ''}" 
                    alt="${product.name || 'Product'}" 
                    onerror="this.style.visibility='hidden';" 
                > 


                <div class="cart-info"> 


                    <h3> 
                        ${product.name || 'Product'} 
                    </h3> 


                    <div class="cart-price"> 

                        ₹${price.toFixed(2)} 

                    </div> 


                    <div class="quantity-box"> 


                        <button 
                            type="button" 
                            onclick="decreaseQuantity(${index})"> 

                            − 

                        </button> 


                        <span class="quantity"> 

                            ${quantity} 

                        </span> 


                        <button 
                            type="button" 
                            onclick="increaseQuantity(${index})"> 

                            + 

                        </button> 


                    </div> 


                    <div class="cart-actions"> 


                        <button 
                            type="button" 
                            class="remove-btn" 
                            onclick="removeProduct(${index})"> 

                            Remove 

                        </button> 


                        <button 
                            type="button" 
                            class="btn buy-btn" 
                            onclick="buyThisProduct(${index})"> 

                            Buy Now 

                        </button> 


                    </div> 


                </div> 


                <div class="item-total"> 

                    ₹${itemTotal.toFixed(2)} 

                </div> 


            </div> 

        `; 

    }); 


    let shippingMessage = ""; 


    if (subtotal >= FREE_SHIPPING_THRESHOLD) { 

        shippingMessage = ` 

            <div class="free-shipping-msg"> 

                🎉 You qualify for 
                <strong>FREE SHIPPING</strong>! 

            </div> 

        `; 

    } else { 

        const remaining = 
            FREE_SHIPPING_THRESHOLD - subtotal; 


        shippingMessage = ` 

            <div class="free-shipping-msg"> 

                Add ₹${remaining.toFixed(2)} 
                more to get 
                <strong>FREE SHIPPING</strong>. 

            </div> 

        `; 

    } 


    html += ` 

        <div class="cart-bottom"> 


            <div> 

                <div class="cart-total"> 

                    Total: ₹${subtotal.toFixed(2)} 

                </div> 

                ${shippingMessage} 

            </div> 


            <button 
                type="button" 
                class="btn" 
                onclick="proceedToCheckout()"> 

                Proceed to Checkout → 

            </button> 

        </div> 

    `; 


    cartBox.innerHTML = html; 

} 



/* ========================= 
   INCREASE 
========================= */ 

function increaseQuantity(index) { 

    if (!cart[index]) { 
        return; 
    } 


    const current = 
        Number(cart[index].quantity) || 1; 


    cart[index].quantity = 
        current + 1; 


    saveCart(); 

} 



/* ========================= 
   DECREASE 
========================= */ 

function decreaseQuantity(index) { 

    if (!cart[index]) { 
        return; 
    } 


    const current = 
        Number(cart[index].quantity) || 1; 


    if (current > 1) { 

        cart[index].quantity = 
            current - 1; 

    } 


    saveCart(); 

} 



/* ========================= 
   REMOVE 
========================= */ 

function removeProduct(index) { 

    if ( 
        index < 0 || 
        index >= cart.length 
    ) { 
        return; 
    } 


    cart.splice(index, 1); 


    saveCart(); 

} 



/* ========================= 
   BUY ONE PRODUCT 
========================= */ 

function buyThisProduct(index) { 

    if (!cart[index]) { 
        return; 
    } 


    const product = cart[index]; 


    const buyNowProduct = { 

        ...product, 

        quantity: 
            Math.max( 
                1, 
                Number(product.quantity) || 1 
            ) 

    }; 

    const subtotal =
        Math.max(
            0,
            (Number(buyNowProduct.price) || 0) *
            (Number(buyNowProduct.quantity) || 1)
        );

    /*
       Same payment popup as Product page.
       Customer selects COD / Online here before checkout.
    */
    showLiaraPaymentPopup(
        subtotal,
        "buyNow",
        buyNowProduct
    );

} 



/* ========================= 
   PROCEED WITH FULL CART 
========================= */ 

function proceedToCheckout() { 

    if ( 
        !Array.isArray(cart) || 
        cart.length === 0 
    ) { 

        alert( 
            "Your cart is empty." 
        ); 

        return; 

    } 


    /* 
       IMPORTANT: 
       Always save the COMPLETE cart 
       before going to checkout. 
    */ 

    localStorage.setItem( 
        "liaraCart", 
        JSON.stringify(cart) 
    ); 


    /* 
       IMPORTANT: 
       Force checkout mode to CART. 
       This prevents an old "buyNow" 
       value from showing only one product. 
    */ 

    localStorage.setItem( 
        "liaraCheckoutMode", 
        "cart" 
    ); 


    /* 
       Remove old Buy Now data so it 
       cannot interfere with cart checkout. 
    */ 

    localStorage.removeItem( 
        "liaraBuyNow" 
    ); 

    let subtotal = 0;

    cart.forEach(function(product) {

        const quantity =
            Math.max(
                1,
                Number(product.quantity) || 1
            );

        const price =
            Math.max(
                0,
                Number(product.price) || 0
            );

        subtotal += price * quantity;

    });

    /*
       Full cart checkout also uses the same
       payment popup. The selected charge is
       saved and shown on checkout.
    */
    showLiaraPaymentPopup(
        subtotal,
        "cart",
        null
    );

} 



/* ========================= 
   SAVE CART 
========================= */ 

function saveCart() { 

    localStorage.setItem( 
        "liaraCart", 
        JSON.stringify(cart) 
    ); 


    /* 
       Cart changes should always remain 
       in CART mode unless user explicitly 
       clicks Buy Now. 
    */ 

    localStorage.setItem( 
        "liaraCheckoutMode", 
        "cart" 
    ); 


    displayCart(); 

} 



/* ========================= 
   INITIAL DISPLAY 
========================= */ 

displayCart(); 

</script> 


</body> 

</html>
