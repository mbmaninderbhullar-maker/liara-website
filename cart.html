<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara - Cart</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f2;
    color: #222;
}

header {
    padding: 20px;
    text-align: center;
    background: white;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.cart-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 15px;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 20px;
    background: white;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.cart-image {
    width: 110px;
    height: 110px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 10px;
}

.cart-details {
    flex: 1;
}

.cart-details h3 {
    margin: 0 0 8px;
    font-size: 20px;
}

.cart-price {
    font-size: 17px;
    margin-bottom: 12px;
}

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.quantity-box button {
    width: 32px;
    height: 32px;
    border: none;
    background: #222;
    color: white;
    border-radius: 6px;
    font-size: 20px;
    cursor: pointer;
}

.quantity {
    font-size: 17px;
    min-width: 20px;
    text-align: center;
}

.cart-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn,
.remove-btn {
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 14px;
}

.remove-btn {
    background: #eee;
    color: #222;
}

.buy-btn {
    background: #222;
    color: white;
}

.item-total {
    font-size: 18px;
    font-weight: bold;
    white-space: nowrap;
}

.cart-bottom {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.cart-total {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 18px;
}

.checkout-btn {
    background: #222;
    color: white;
    width: 100%;
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    text-decoration: none;
    display: block;
}

.empty-cart {
    text-align: center;
    background: white;
    padding: 40px 20px;
    border-radius: 15px;
}

.empty-cart h2 {
    margin-bottom: 10px;
}

@media (max-width: 600px) {

    .cart-item {
        gap: 12px;
        padding: 12px;
    }

    .cart-image {
        width: 80px;
        height: 80px;
    }

    .cart-details h3 {
        font-size: 16px;
    }

    .cart-price {
        font-size: 15px;
    }

    .item-total {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<header>
    <h1>My Cart</h1>
</header>

<div class="cart-container">

    <div id="cartBox"></div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("liaraCart")) || [];


function displayCart() {

    let cartBox = document.getElementById("cartBox");

    if (cart.length === 0) {

        cartBox.innerHTML = `
            <div class="empty-cart">
                <h2>Your Cart is Empty</h2>
                <p>Add some products to your cart.</p>
            </div>
        `;

        return;
    }


    let html = "";

    let total = 0;


    cart.forEach((product, index) => {

        let itemTotal =
            Number(product.price) * Number(product.quantity);

        total += itemTotal;


        html += `

            <div class="cart-item">

                <div class="cart-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        onerror="this.style.display='none'"
                    >

                </div>


                <div class="cart-details">

                    <h3>
                        ${product.name}
                    </h3>


                    <div class="cart-price">

                        ₹${product.price}

                    </div>


                    <div class="quantity-box">

                        <button
                            onclick="decreaseQuantity(${index})">

                            −

                        </button>


                        <span class="quantity">

                            ${product.quantity}

                        </span>


                        <button
                            onclick="increaseQuantity(${index})">

                            +

                        </button>

                    </div>


                    <div class="cart-actions">

                        <button
                            class="remove-btn"
                            onclick="removeProduct(${index})">

                            Remove

                        </button>


                        <button
                            class="btn buy-btn"
                            onclick="buyThisProduct(${index})">

                            Buy Now

                        </button>

                    </div>

                </div>


                <div class="item-total">

                    ₹${itemTotal}

                </div>

            </div>

        `;

    });


    html += `

        <div class="cart-bottom">

            <div class="cart-total">

                Total: ₹${total}

            </div>


            <a
                href="checkout.html"
                class="checkout-btn">

                Proceed to Checkout →

            </a>

        </div>

    `;


    cartBox.innerHTML = html;

}



function increaseQuantity(index) {

    cart[index].quantity++;

    saveCart();

}



function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    }

    saveCart();

}



function removeProduct(index) {

    cart.splice(index, 1);

    saveCart();

}



function buyThisProduct(index) {

    let product = cart[index];


    let buyNowCart = [

        {

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: product.quantity

        }

    ];


    localStorage.setItem(

        "liaraCart",

        JSON.stringify(buyNowCart)

    );


    window.location.href =
        "checkout.html";

}



function saveCart() {

    localStorage.setItem(

        "liaraCart",

        JSON.stringify(cart)

    );


    displayCart();

}


displayCart();

</script>

</body>
</html>
