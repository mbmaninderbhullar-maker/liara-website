<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Shopping Cart</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .cart-section {
            padding: 80px 8%;
            background: #faf8f5;
            min-height: 70vh;
        }

        .cart-container {
            max-width: 1100px;
            margin: auto;
        }

        .cart-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 12px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin: 0 0 8px;
        }

        .cart-price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-box button {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .cart-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .remove-btn {
            border: none;
            background: #f5f5f5;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            color: #a33;
        }

        .buy-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .item-total {
            font-size: 18px;
            font-weight: bold;
        }

        .cart-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 20px;
        }

        .cart-total {
            font-size: 25px;
            font-weight: bold;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .free-shipping-msg {
            margin-top: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            background: #f5f5f5;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .cart-section {
                padding: 50px 5%;
            }

            .cart-item {
                align-items: flex-start;
            }

            .cart-item img {
                width: 75px;
                height: 75px;
            }

            .item-total {
                display: none;
            }

            .cart-bottom {
                flex-direction: column;
                align-items: stretch;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html"
       class="logo">

        <span>LIARA</span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="account.html">
            My Account
        </a>

        <a href="index.html#why-us">
            Why Liara
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>



<section class="cart-section">


    <div class="heading">

        <p>
            LIARA PROFESSIONAL™
        </p>

        <h2>
            Your Shopping Cart
        </h2>

    </div>


    <div class="cart-container">

        <div class="cart-box"
             id="cart-box">

        </div>

    </div>


</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<script>

const FREE_SHIPPING_THRESHOLD = 499;
const SHIPPING_CHARGE = 49;


/* =========================
   LOAD CART SAFELY
========================= */

function loadCart() {

    try {

        const saved =
            localStorage.getItem("liaraCart");

        if (!saved) {
            return [];
        }

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            return parsed;
        }

        /* If accidentally saved as one object */
        if (parsed && typeof parsed === "object") {
            return [parsed];
        }

        return [];

    } catch (error) {

        console.error(
            "Cart loading error:",
            error
        );

        return [];

    }

}


let cart = loadCart();



/* =========================
   DISPLAY CART
========================= */

function displayCart() {

    const cartBox =
        document.getElementById("cart-box");


    if (!Array.isArray(cart)) {
        cart = [];
    }


    if (cart.length === 0) {

        cartBox.innerHTML = `

            <div class="empty-cart">

                <h3>
                    Your cart is empty 🛒
                </h3>

                <p>
                    Add a product to your cart
                    before buying.
                </p>

                <br>

                <a
                    href="index.html#products"
                    class="btn">

                    Explore Products

                </a>

            </div>

        `;

        return;

    }


    let html = "";

    let subtotal = 0;


    cart.forEach(function(product, index) {

        const quantity =
            Math.max(
                1,
                Number(product.quantity) || 1
            );


        const price =
            Math.max(
                0,
                Number(product.price) || 0
            );


        const itemTotal =
            price * quantity;


        subtotal += itemTotal;


        html += `

            <div class="cart-item">


                <img
                    src="${product.image || ''}"
                    alt="${product.name || 'Product'}"
                    onerror="this.style.visibility='hidden';"
                >


                <div class="cart-info">


                    <h3>
                        ${product.name || 'Product'}
                    </h3>


                    <div class="cart-price">

                        ₹${price.toFixed(2)}

                    </div>


                    <div class="quantity-box">


                        <button
                            type="button"
                            onclick="decreaseQuantity(${index})">

                            −

                        </button>


                        <span class="quantity">

                            ${quantity}

                        </span>


                        <button
                            type="button"
                            onclick="increaseQuantity(${index})">

                            +

                        </button>


                    </div>


                    <div class="cart-actions">


                        <button
                            type="button"
                            class="remove-btn"
                            onclick="removeProduct(${index})">

                            Remove

                        </button>


                        <button
                            type="button"
                            class="btn buy-btn"
                            onclick="buyThisProduct(${index})">

                            Buy Now

                        </button>


                    </div>


                </div>


                <div class="item-total">

                    ₹${itemTotal.toFixed(2)}

                </div>


            </div>

        `;

    });


    let shippingMessage = "";


    if (subtotal >= FREE_SHIPPING_THRESHOLD) {

        shippingMessage = `

            <div class="free-shipping-msg">

                🎉 You qualify for
                <strong>FREE SHIPPING</strong>!

            </div>

        `;

    } else {

        const remaining =
            FREE_SHIPPING_THRESHOLD - subtotal;


        shippingMessage = `

            <div class="free-shipping-msg">

                Add ₹${remaining.toFixed(2)}
                more to get
                <strong>FREE SHIPPING</strong>.

            </div>

        `;

    }


    html += `

        <div class="cart-bottom">


            <div>

                <div class="cart-total">

                    Total: ₹${subtotal.toFixed(2)}

                </div>

                ${shippingMessage}

            </div>


            <button
                type="button"
                class="btn"
                onclick="proceedToCheckout()">

                Proceed to Checkout →

            </button>


        </div>

    `;


    cartBox.innerHTML = html;

}



/* =========================
   INCREASE
========================= */

function increaseQuantity(index) {

    if (!cart[index]) {
        return;
    }


    const current =
        Number(cart[index].quantity) || 1;


    cart[index].quantity =
        current + 1;


    saveCart();

}



/* =========================
   DECREASE
========================= */

function decreaseQuantity(index) {

    if (!cart[index]) {
        return;
    }


    const current =
        Number(cart[index].quantity) || 1;


    if (current > 1) {

        cart[index].quantity =
            current - 1;

    }


    saveCart();

}



/* =========================
   REMOVE
========================= */

function removeProduct(index) {

    if (
        index < 0 ||
        index >= cart.length
    ) {
        return;
    }


    cart.splice(index, 1);


    saveCart();

}



/* =========================
   BUY ONE PRODUCT
========================= */

function buyThisProduct(index) {

    if (!cart[index]) {
        return;
    }


    const product = cart[index];


    const buyNowProduct = {

        ...product,

        quantity:
            Math.max(
                1,
                Number(product.quantity) || 1
            )

    };


    localStorage.setItem(
        "liaraBuyNow",
        JSON.stringify(buyNowProduct)
    );


    localStorage.setItem(
        "liaraCheckoutMode",
        "buyNow"
    );


    window.location.href =
        "checkout.html";

}



/* =========================
   PROCEED WITH FULL CART
========================= */

function proceedToCheckout() {

    if (
        !Array.isArray(cart) ||
        cart.length === 0
    ) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    /*
       IMPORTANT:
       Always save the COMPLETE cart
       before going to checkout.
    */

    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    /*
       IMPORTANT:
       Force checkout mode to CART.
       This prevents an old "buyNow"
       value from showing only one product.
    */

    localStorage.setItem(
        "liaraCheckoutMode",
        "cart"
    );


    /*
       Remove old Buy Now data so it
       cannot interfere with cart checkout.
    */

    localStorage.removeItem(
        "liaraBuyNow"
    );


    window.location.href =
        "checkout.html";

}



/* =========================
   SAVE CART
========================= */

function saveCart() {

    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    /*
       Cart changes should always remain
       in CART mode unless user explicitly
       clicks Buy Now.
    */

    localStorage.setItem(
        "liaraCheckoutMode",
        "cart"
    );


    displayCart();

}



/* =========================
   INITIAL DISPLAY
========================= */

displayCart();

</script>


</body>

</html>
