<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liara Professional™ | Track Order</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f3eb;color:#111}header{background:#fff;border-bottom:1px solid #e8e1d5;padding:22px 6%;display:flex;align-items:center;justify-content:space-between}.logo{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:700;letter-spacing:6px}nav a{margin-left:20px;text-decoration:none;color:#444;font-size:11px;font-weight:bold}nav a:hover{color:#b58a3c}main{min-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;padding:60px 20px}.card{width:100%;max-width:620px;background:#fff;border:1px solid #e8e1d5;padding:45px;box-shadow:0 20px 55px rgba(0,0,0,.08)}.kicker{color:#b58a3c;font-size:10px;font-weight:bold;letter-spacing:3px;margin-bottom:10px}h1{margin:0 0 12px;font-size:38px}p{color:#777;font-size:13px;line-height:1.8}label{display:block;margin:25px 0 8px;font-size:11px;font-weight:bold}input{width:100%;height:48px;padding:0 14px;border:1px solid #d8d0c2;font-size:14px;outline:none}input:focus{border-color:#b58a3c}button{width:100%;height:48px;margin-top:12px;border:1px solid #191919;background:#191919;color:#fff;font-size:11px;font-weight:bold;cursor:pointer}button:hover{background:#b58a3c;border-color:#b58a3c}#result{display:none;margin-top:25px;padding:18px;background:#f7f3eb;border:1px solid #e8e1d5;font-size:12px;line-height:1.7}.back{display:inline-block;margin-top:22px;color:#b58a3c;text-decoration:none;font-size:11px;font-weight:bold}@media(max-width:600px){header{padding:18px 5%;flex-direction:column;gap:14px;align-items:flex-start}nav{width:100%;overflow:auto;white-space:nowrap}nav a{margin-left:0;margin-right:16px}.card{padding:30px 22px}h1{font-size:32px}}
</style>
</head>
<body>
<header><a href="index.html" style="text-decoration:none;color:inherit"><div class="logo">LIARA</div></a><nav><a href="index.html">HOME</a><a href="index.html#products">SHOP</a><a href="account.html">MY ACCOUNT</a></nav></header>
<main><section class="card"><div class="kicker">LIARA PROFESSIONAL™</div><h1>Track Your Order</h1><p>Enter your Order ID or AWB number below to check your shipment status.</p><label for="trackingNumber">ORDER ID / AWB NUMBER</label><input id="trackingNumber" type="text" placeholder="Enter Order ID or AWB" autocomplete="off"><button type="button" onclick="trackOrder()">TRACK ORDER</button><div id="result"></div><a class="back" href="index.html">← Back to Shopping</a></section></main>
<script>function trackOrder(){const value=document.getElementById("trackingNumber").value.trim();const result=document.getElementById("result");if(!value){result.style.display="block";result.innerHTML="Please enter your Order ID or AWB number.";return}result.style.display="block";result.innerHTML="Tracking request received for <strong>"+escapeHtml(value)+"</strong>.<br><br>Live Shiprocket tracking will be connected here."}function escapeHtml(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}</script>
</body>
</html>
