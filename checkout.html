```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Checkout</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .checkout-section {
            padding: 80px 8%;
            background: #faf8f5;
            min-height: 70vh;
        }

        .checkout-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 35px;
        }

        .checkout-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .checkout-box h3 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .order-summary {
            border: 1px solid #eee;
            padding: 22px;
            border-radius: 14px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 18px;
            margin-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .order-item img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 10px;
        }

        .order-item h4 {
            margin: 0 0 6px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .place-order:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .error-message {
            color: #b00020;
        }

        .success-message {
            color: #287a35;
        }

        @media (max-width: 800px) {

            .checkout-container {
                grid-template-columns: 1fr;
            }

            .checkout-section {
                padding: 50px 5%;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>LIARA</span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">Home</a>

        <a href="index.html#about">About</a>

        <a href="index.html#products">Products</a>

        <a href="cart.html">Cart 🛒</a>

        <a href="account.html">My Account</a>

        <a href="index.html#contact">Contact</a>

    </nav>

</header>



<section class="checkout-section">


    <div class="heading">

        <p>
            LIARA PROFESSIONAL™
        </p>

        <h2>
            Complete Your Order
        </h2>

    </div>



    <div class="checkout-container">


        <!-- ORDER SUMMARY -->

        <div class="checkout-box">

            <h3>
                Your Order
            </h3>


            <div
                id="order-items"
                class="order-summary">

                Loading your order...

            </div>


            <div class="total-box">

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="checkout-total">0</span>
                </span>

            </div>

        </div>



        <!-- CUSTOMER DETAILS -->

        <div class="checkout-box">

            <h3>
                Customer Details
            </h3>


            <form id="checkoutForm">


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>



                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        required>

                </div>



                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="House No, Street, City, State, PIN Code"
                        required></textarea>

                </div>



                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="payment"
                        required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="Online Payment">
                            Online Payment
                        </option>

                    </select>

                </div>



                <button
                    type="submit"
                    class="btn place-order"
                    id="placeOrderButton">

                    Place Order

                </button>


                <div
                    id="message"
                    class="message">
                </div>


            </form>

        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   CART
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("liaraCart")
    ) || [];

let total = 0;

const orderItems =
    document.getElementById("order-items");


if (cart.length === 0) {

    orderItems.innerHTML = `
        <p>Your cart is empty.</p>
    `;

} else {

    orderItems.innerHTML = "";

    cart.forEach(function(product) {

        total +=
            Number(product.price) *
            Number(product.quantity);

        orderItems.innerHTML += `

            <div class="order-item">

                <img
                    src="${product.image}"
                    alt="${product.name}">

                <div>

                    <h4>
                        ${product.name}
                    </h4>

                    <p>
                        ₹${product.price}
                        × ${product.quantity}
                    </p>

                </div>

            </div>

        `;

    });

}


document.getElementById(
    "checkout-total"
).innerText = total;


/* =========================
   PLACE ORDER
========================= */

document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const button =
            document.getElementById(
                "placeOrderButton"
            );


        button.disabled = true;

        button.innerText =
            "Checking Login...";


        /* =========================
           CHECK LOGIN SESSION
        ========================= */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabaseClient.auth.getSession();


        if (sessionError) {

            button.disabled = false;

            button.innerText =
                "Place Order";

            showMessage(
                "Login check failed: " +
                sessionError.message,
                true
            );

            return;

        }


        const session =
            sessionData.session;


        if (!session || !session.user) {

            button.disabled = false;

            button.innerText =
                "Place Order";

            showMessage(
                "Please login before placing an order.",
                true
            );

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

            return;

        }


        const user =
            session.user;


        console.log(
            "Logged in user:",
            user.id
        );


        /* =========================
           CHECK CART
        ========================= */

        if (cart.length === 0) {

            button.disabled = false;

            button.innerText =
                "Place Order";

            showMessage(
                "Your cart is empty.",
                true
            );

            return;

        }


        /* =========================
           CUSTOMER DETAILS
        ========================= */

        const customerName =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "mobile"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const payment =
            document.getElementById(
                "payment"
            ).value;


        /* =========================
           QUANTITY
        ========================= */

        let quantity = 0;


        cart.forEach(function(product) {

            quantity +=
                Number(product.quantity);

        });


        /* =========================
           BUTTON
        ========================= */

        button.innerText =
            "Placing Order...";


        /* =========================
           INSERT ORDER
        ========================= */

        const orderData = {

            user_id:
                user.id,

            customer_name:
                customerName,

            phone:
                phone,

            address:
                address,

            quantity:
                quantity,

            total:
                total,

            status:
                "Order Received"

        };


        console.log(
            "Order data:",
            orderData
        );


        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .insert(orderData);


        /* =========================
           ERROR
        ========================= */

        if (error) {

            console.log(
                "Supabase order error:",
                error
            );


            button.disabled = false;

            button.innerText =
                "Place Order";


            showMessage(
                "Order could not be placed:<br>" +
                error.message,
                true
            );


            return;

        }


        /* =========================
           SUCCESS
        ========================= */

        localStorage.removeItem(
            "liaraCart"
        );


        showMessage(
            "🎉 Order placed successfully!",
            false
        );


        button.innerText =
            "Order Placed ✓";


        setTimeout(function() {

            window.location.href =
                "account.html";

        }, 1500);

    }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    isError
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        text;


    if (isError) {

        message.className =
            "message error-message";

    } else {

        message.className =
            "message success-message";

    }

}

</script>


</body>

</html>
