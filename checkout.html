<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Checkout</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .checkout-section {
            padding: 80px 8%;
            background: #faf8f5;
            min-height: 70vh;
        }

        .checkout-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 35px;
        }

        .checkout-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .checkout-box h3 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .order-summary {
            border: 1px solid #eee;
            padding: 22px;
            border-radius: 14px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 18px;
            margin-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .order-item img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 10px;
        }

        .order-item h4 {
            margin: 0 0 6px;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .checkout-container {
                grid-template-columns: 1fr;
            }

            .checkout-section {
                padding: 50px 5%;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>LIARA</span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="account.html">
            My Account
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>



<section class="checkout-section">


    <div class="heading">

        <p>
            LIARA PROFESSIONAL™
        </p>

        <h2>
            Complete Your Order
        </h2>

    </div>



    <div class="checkout-container">


        <!-- ORDER SUMMARY -->

        <div class="checkout-box">

            <h3>
                Your Order
            </h3>


            <div
                id="order-items"
                class="order-summary">

                Loading your order...

            </div>


            <div class="total-box">

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="checkout-total">0</span>
                </span>

            </div>

        </div>



        <!-- CUSTOMER DETAILS -->

        <div class="checkout-box">

            <h3>
                Customer Details
            </h3>


            <form id="checkoutForm">


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>



                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        required>

                </div>



                <div class="form-group">

                    <label>
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="House No, Street, City, State, PIN Code"
                        required></textarea>

                </div>



                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="payment"
                        required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="Online Payment">
                            Online Payment
                        </option>

                    </select>

                </div>



                <button
                    type="submit"
                    class="btn place-order"
                    id="placeOrderButton">

                    Place Order

                </button>


                <div
                    id="message"
                    class="message">
                </div>


            </form>

        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   CART
========================= */


let cart =
    JSON.parse(
        localStorage.getItem("liaraCart")
    ) || [];


let total = 0;


const orderItems =
    document.getElementById(
        "order-items"
    );


if (cart.length === 0) {

    orderItems.innerHTML = `
        <p>
            Your cart is empty.
        </p>
    `;

} else {


    orderItems.innerHTML = "";


    cart.forEach(function(product) {


        total +=
            product.price *
            product.quantity;


        orderItems.innerHTML += `

            <div class="order-item">

                <img
                    src="${product.image}"
                    alt="${product.name}">

                <div>

                    <h4>
                        ${product.name}
                    </h4>

                    <p>
                        ₹${product.price}
                        × ${product.quantity}
                    </p>

                </div>

            </div>

        `;

    });

}


document.getElementById(
    "checkout-total"
).innerText = total;



/* =========================
   PLACE ORDER
========================= */


document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        if (cart.length === 0) {

            showMessage(
                "Your cart is empty."
            );

            return;

        }



        /* CHECK LOGIN */


        const {
            data: {
                user
            }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            showMessage(
                "Please login before placing an order."
            );


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);


            return;

        }



        /* CUSTOMER DETAILS */


        const customerName =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "mobile"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const payment =
            document.getElementById(
                "payment"
            ).value;



        /* PRODUCT INFORMATION */


        let productNames = "";


        let quantity = 0;


        cart.forEach(function(product) {

            productNames +=
                product.name +
                " × " +
                product.quantity +
                ", ";

            quantity +=
                Number(product.quantity);

        });


        productNames =
            productNames.replace(/,\s*$/, "");



        /* BUTTON */


        const button =
            document.getElementById(
                "placeOrderButton"
            );


        button.disabled = true;


        button.innerText =
            "Placing Order...";



        /* SAVE ORDER */


        const {
            data,
            error
        } = await supabaseClient
            .from("orders")
            .insert([{

                user_id:
                    user.id,

                customer_name:
                    customerName,

                phone:
                    phone,

                address:
                    address,

                quantity:
                    quantity,

                total:
                    total,

                status:
                    "Order Received"

            }])
            .select();



        if (error) {


            console.log(error);


            button.disabled =
                false;


            button.innerText =
                "Place Order";


            showMessage(
                "Order could not be placed: " +
                error.message
            );


            return;

        }



        /* SUCCESS */


        localStorage.removeItem(
            "liaraCart"
        );


        showMessage(
            "🎉 Order placed successfully!"
        );


        button.innerText =
            "Order Placed ✓";



        setTimeout(function() {

            window.location.href =
                "account.html";

        }, 1500);


    }
);



/* =========================
   MESSAGE
========================= */


function showMessage(text) {

    document.getElementById(
        "message"
    ).innerText = text;

}


</script>


</body>

</html>
