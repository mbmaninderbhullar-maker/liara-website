
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Checkout</title>

<link rel="stylesheet" href="style.css">

<style>

.checkout-section {
    padding: 80px 8%;
    background: #faf8f5;
    min-height: 70vh;
}

.checkout-container {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 35px;
}

.checkout-box {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.checkout-box h3 {
    margin: 0 0 25px;
    font-size: 24px;
}

.order-summary {
    border: 1px solid #eee;
    padding: 22px;
    border-radius: 14px;
}

.order-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid #eee;
}

.order-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
}

.order-item img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border-radius: 10px;
    background: #f7f1e7;
}

.order-item h4 {
    margin: 0 0 6px;
}

.order-item p {
    margin: 0;
    color: #666;
}

.order-mode {
    display: inline-block;
    margin-bottom: 18px;
    padding: 7px 12px;
    border-radius: 20px;
    background: #f5f1e7;
    color: #ad8232;
    font-size: 12px;
    font-weight: bold;
}

.total-box {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
    background: white;
    transition: .2s;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #ad8232;
}

.form-group input.field-error,
.form-group select.field-error {
    border-color: #d33 !important;
    background: #fff8f8;
}

.form-group input.field-success,
.form-group select.field-success {
    border-color: #287a3e;
}

.field-error-message {
    display: none;
    color: #c62828;
    font-size: 12px;
    margin-top: 6px;
    font-weight: 600;
}

.field-error-message.show {
    display: block;
}

.address-title {
    margin: 25px 0 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
    color: #ad8232;
    font-size: 18px;
}

.address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 15px;
}

.full-width {
    grid-column: 1 / -1;
}

.place-order {
    width: 100%;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

.place-order:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.empty-checkout {
    text-align: center;
    padding: 40px 15px;
    color: #777;
}

.back-shopping {
    display: inline-block;
    margin-top: 15px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 800px) {

    .checkout-container {
        grid-template-columns: 1fr;
    }

    .checkout-section {
        padding: 50px 5%;
    }

    .address-grid {
        grid-template-columns: 1fr;
    }

    .full-width {
        grid-column: auto;
    }

}

</style>

/* =====================================================

===================================================== */

const SUPABASE_URL =

/* =====================================================

totalElement.innerText =

/* =====================================================

===================================================== */

/* =====================================================
   ERROR FUNCTIONS
===================================================== */

function setError(
    fieldId,
    errorId,
    message
) {

    const field =
        document.getElementById(
            fieldId
        );


    const error =
        document.getElementById(
            errorId
        );


    field.classList.add(
        "field-error"
    );


    field.classList.remove(
        "field-success"
    );


    error.innerText =
        message;


    error.classList.add(
        "show"
    );

}



function clearError(
    fieldId,
    errorId
) {

    const field =
        document.getElementById(
            fieldId
        );


    const error =
        document.getElementById(
            errorId
        );


    field.classList.remove(
        "field-error"
    );


    error.innerText =
        "";


    error.classList.remove(
        "show"
    );

}



/* =====================================================
   CLEAR ERRORS WHEN TYPING
===================================================== */

const fields = [

    ["name","nameError"],

    ["mobile","mobileError"],

    ["house_no","houseError"],

    ["street","streetError"],

    ["city","cityError"],

    ["state","stateError"],

    ["pincode","pincodeError"],

    ["payment","paymentError"]

];


fields.forEach(
    function(pair) {

        const field =
            document.getElementById(
                pair[0]
            );


        field.addEventListener(
            "input",
            function() {

                clearError(
                    pair[0],
                    pair[1]
                );

            }
        );


        field.addEventListener(
            "change",
            function() {

                clearError(
                    pair[0],
                    pair[1]
                );

            }
        );

    }
);



/* =====================================================
   MOBILE ONLY NUMBERS
===================================================== */

document.getElementById(
    "mobile"
).addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);



/* =====================================================
   PIN ONLY NUMBERS
===================================================== */

document.getElementById(
    "pincode"
).addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);



/* =====================================================
   VALIDATE FORM
===================================================== */

function validateForm() {

    let valid = true;

    let firstInvalid = null;


    /* CLEAR OLD ERRORS */

    fields.forEach(
        function(pair) {

            clearError(
                pair[0],
                pair[1]
            );

        }
    );



    /* NAME */

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    if(name === "") {

        setError(
            "name",
            "nameError",
            "Please enter your full name."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "name"
            );

    }



    /* MOBILE */

    const mobile =
        document.getElementById(
            "mobile"
        ).value.trim();


    if(mobile === "") {

        setError(
            "mobile",
            "mobileError",
            "Please enter your mobile number."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "mobile"
            );

    }

    else if(!/^[0-9]{10}$/.test(mobile)) {

        setError(
            "mobile",
            "mobileError",
            "Please enter a valid 10-digit mobile number."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "mobile"
            );

    }



    /* HOUSE */

    const house =
        document.getElementById(
            "house_no"
        ).value.trim();


    if(house === "") {

        setError(
            "house_no",
            "houseError",
            "Please enter your House / Flat No."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "house_no"
            );

    }



    /* STREET */

    const street =
        document.getElementById(
            "street"
        ).value.trim();


    if(street === "") {

        setError(
            "street",
            "streetError",
            "Please enter your Street / Area."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "street"
            );

    }



    /* CITY */

    const city =
        document.getElementById(
            "city"
        ).value.trim();


    if(city === "") {

        setError(
            "city",
            "cityError",
            "Please enter your city."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "city"
            );

    }



    /* STATE */

    const state =
        document.getElementById(
            "state"
        ).value.trim();


    if(state === "") {

        setError(
            "state",
            "stateError",
            "Please enter your state."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "state"
            );

    }



    /* PINCODE */

    const pincode =
        document.getElementById(
            "pincode"
        ).value.trim();


    if(pincode === "") {

        setError(
            "pincode",
            "pincodeError",
            "Please enter your PIN Code."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "pincode"
            );

    }

    else if(!/^[0-9]{6}$/.test(pincode)) {

        setError(
            "pincode",
            "pincodeError",
            "Please enter a valid 6-digit PIN Code."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "pincode"
            );

    }



    /* PAYMENT */

    const payment =
        document.getElementById(
            "payment"
        ).value;


    if(payment === "") {

        setError(
            "payment",
            "paymentError",
            "Please select a payment method."
        );


        valid = false;

        firstInvalid =
            firstInvalid ||
            document.getElementById(
                "payment"
            );

    }



    /* FOCUS FIRST ERROR */

    if(firstInvalid) {

        firstInvalid.focus();

    }


    return valid;

}



/* =====================================================
   PLACE ORDER + RAZORPAY
===================================================== */

const RAZORPAY_KEY_ID =
    "rzp_live_TU2zkAcjKfrnym";


async function saveOrderToDatabase(statusText) {

    const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

    if (authError || !authData?.user) {
        throw new Error("Customer login session expired. Please log in again.");
    }

    const customerUser = authData.user;

    const customerName =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("mobile").value.trim();

    const houseNo =
        document.getElementById("house_no").value.trim();

    const street =
        document.getElementById("street").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const state =
        document.getElementById("state").value.trim();

    const pincode =
        document.getElementById("pincode").value.trim();

    const payment =
        document.getElementById("payment").value;


    let productNames = "";
    let totalQuantity = 0;


    checkoutItems.forEach(function(product) {

        const quantity =
            Number(product.quantity || 1);

        productNames +=
            (product.name || "Product") +
            " × " +
            quantity +
            ", ";

        totalQuantity += quantity;

    });


    productNames =
        productNames.replace(/,\s*$/, "");


    const { error } =
        await supabaseClient
            .from("orders")
            .insert([{

                user_id: customerUser.id,

                customer_name:
                    customerName,

                phone:
                    phone,

                house_no:
                    houseNo,

                street:
                    street,

                city:
                    city,

                state:
                    state,

                pincode:
                    pincode,

                address:
                    [
                        houseNo,
                        street,
                        city,
                        state,
                        pincode
                    ]
                    .filter(Boolean)
                    .join(", "),

                product:
                    productNames,

                quantity:
                    totalQuantity,

                total:
                    total,

                payment_method:
                    payment,

                status:
                    statusText

            }]);


    if(error) {
        throw error;
    }
}


async function createRazorpayOrder() {

    const { data, error } =
        await supabaseClient.functions.invoke(
            "create-razorpay-order",
            {
                body: {
                    action: "create",
                    amount: total,
                    receipt:
                        "liara_" + Date.now()
                }
            }
        );


    if(error) {
        throw new Error(
            error.message ||
            "Could not connect to Razorpay."
        );
    }


    if(!data || !data.success || !data.order) {
        throw new Error(
            data?.error ||
            "Could not create Razorpay order."
        );
    }


    return data.order;
}


async function verifyRazorpayPayment(
    response
) {

    const { data, error } =
        await supabaseClient.functions.invoke(
            "create-razorpay-order",
            {
                body: {
                    action: "verify",
                    razorpay_order_id:
                        response.razorpay_order_id,
                    razorpay_payment_id:
                        response.razorpay_payment_id,
                    razorpay_signature:
                        response.razorpay_signature
                }
            }
        );


    if(error) {
        throw new Error(
            error.message ||
            "Payment verification failed."
        );
    }


    if(!data || !data.success || !data.verified) {
        throw new Error(
            "Payment could not be verified."
        );
    }


    return true;
}


function clearCheckoutStorage() {

    localStorage.removeItem(
        "liaraPendingCheckout"
    );

    localStorage.removeItem(
        "liaraPendingGoogleOrder"
    );


    if(checkoutMode === "buyNow") {

        localStorage.removeItem(
            "liaraBuyNow"
        );

        localStorage.removeItem(
            "liaraCheckoutMode"
        );

    }
    else {

        localStorage.removeItem(
            "liaraCart"
        );

            "liaraCheckoutMode"
        );

    }
}

async function openRazorpayPayment(button) {

    showMessage(
        "Creating secure payment..."
    );

    const razorpayOrder =
        await createRazorpayOrder();


    const options = {

        key:
            RAZORPAY_KEY_ID,

        amount:
            razorpayOrder.amount,

        currency:
            razorpayOrder.currency || "INR",

        name:
            "Liara Professional™",

        description:
            "Liara Professional Order",

        order_id:
            razorpayOrder.id,

        prefill: {
            name:
                document.getElementById("name").value.trim()
        },

        notes: {
            customer_name:
                document.getElementById("name").value.trim(),
            phone:
                document.getElementById("mobile").value.trim()
        },

        theme: {
            color: "#ad8232"
        },

        handler: async function(response) {

            try {

                button.innerText =
                    "Verifying Payment...";

                showMessage(
                    "Verifying your payment..."
                );


                await verifyRazorpayPayment(
                    response
                );


                button.innerText =
                    "Saving Order...";


                await saveOrderToDatabase(
                    "Payment Received"
                );


                orderSuccess(button);

            }
            catch(error) {

                console.error(
                    "RAZORPAY SUCCESS HANDLER ERROR:",
                    error
                );

                button.disabled = false;
                button.innerText =
                    "Place Order";

                console.error("PAYMENT/ORDER ERROR DETAILS:", error);

                showMessage(
                    "Payment received, but we could not finish your order. Please do not pay again. Contact us with your payment ID."
                );
            }
        },

        modal: {
            ondismiss: function() {

                button.disabled = false;
                button.innerText =
                    "Place Order";

                showMessage(
                    "Payment cancelled. Your order was not placed."
                );
            }
        }
    };


    const razorpay =
        new Razorpay(options);


    razorpay.on(
        "payment.failed",
        function(response) {

            console.error(
                "RAZORPAY PAYMENT FAILED:",
                response.error
            );

            button.disabled = false;
            button.innerText =
                "Place Order";

            showMessage(
                response?.error?.description ||
                "Payment failed. Please try again."
            );
        }
    );


    razorpay.open();
}



/* =====================================================
   SUBMIT CHECKOUT
===================================================== */

document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* CHECK ORDER */

        if(!checkoutItems || checkoutItems.length === 0) {

            showMessage(
                "Your order is empty."
            );

            return;
        }


        /* VALIDATE */

        if(!validateForm()) {

            showMessage(
                "Please fill all required fields."
            );

            return;
        }


        /* =====================================================
           GOOGLE LOGIN
        ===================================================== */

        const {
            data: { user },
            error: userError
        } = await supabaseClient
            .auth
            .getUser();


        if(userError) {

            console.error(
                "AUTH ERROR:",
                userError
            );
        }


        /* =====================================================
           IF NOT LOGGED IN
        ===================================================== */

        if(!user) {

            const checkoutCustomerData = {

                name:
                    document.getElementById("name").value.trim(),

                mobile:
                    document.getElementById("mobile").value.trim(),

                house_no:
                    document.getElementById("house_no").value.trim(),

                street:
                    document.getElementById("street").value.trim(),

                city:
                    document.getElementById("city").value.trim(),

                state:
                    document.getElementById("state").value.trim(),

                pincode:
                    document.getElementById("pincode").value.trim(),

                payment:
                    document.getElementById("payment").value
            };


            localStorage.setItem(
                "liaraPendingCheckout",
                JSON.stringify(checkoutCustomerData)
            );

            localStorage.setItem(
                "liaraPendingGoogleOrder",
                "true"
            );


            showMessage(
                "Please continue with Google..."
            );


            const { error } =
                await supabaseClient
                    .auth
                    .signInWithOAuth({
                        provider: "google",
                        options: {
                            redirectTo:
                                window.location.origin +
                                window.location.pathname
                        }
                    });


            if(error) {

                console.error(
                    "GOOGLE LOGIN ERROR:",
                    error
                );

                localStorage.removeItem(
                    "liaraPendingGoogleOrder"
                );

                showMessage(
                    "Google login failed: " +
                    error.message
                );
            }


            return;
        }


        /* =====================================================
           CUSTOMER + BUTTON
        ===================================================== */

        const button =
            document.getElementById(
                "placeOrderButton"
            );


        button.disabled = true;
        button.innerText =
            "Processing...";


        try {

            const payment =
                document.getElementById(
                    "payment"
                ).value;


            /* =====================================================
               ONLINE PAYMENT
            ===================================================== */

            if(payment === "Online Payment") {

                await openRazorpayPayment(
                    button
                );

                return;
            }


            /* =====================================================
               CASH ON DELIVERY
            ===================================================== */

            if(payment === "Cash on Delivery") {

                button.innerText =
                    "Placing Order...";

                await saveOrderToDatabase(
                    "Order Received"
                );

                orderSuccess(button);

                return;
            }


            throw new Error(
                "Please select a valid payment method."
            );

        }
        catch(error) {

            console.error(
                "ORDER ERROR:",
                error
            );

            button.disabled = false;
            button.innerText =
                "Place Order";

            showMessage(
                error?.message ||
                "Order could not be placed. Please try again."
            );
        }
    }
);

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
