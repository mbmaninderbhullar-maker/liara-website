<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Checkout</title>

<link rel="stylesheet" href="style.css">

<style>

.checkout-section {
    padding: 80px 8%;
    background: #faf8f5;
    min-height: 70vh;
}

.checkout-container {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 35px;
}

.checkout-box {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.checkout-box h3 {
    margin: 0 0 25px;
    font-size: 24px;
}

.order-summary {
    border: 1px solid #eee;
    padding: 22px;
    border-radius: 14px;
}

.order-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid #eee;
}

.order-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
}

.order-item img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border-radius: 10px;
    background: #f7f1e7;
}

.order-item h4 {
    margin: 0 0 6px;
}

.order-item p {
    margin: 0;
    color: #666;
}

.order-mode {
    display: inline-block;
    margin-bottom: 18px;
    padding: 7px 12px;
    border-radius: 20px;
    background: #f5f1e7;
    color: #ad8232;
    font-size: 12px;
    font-weight: bold;
}

.total-box {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 14px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #ad8232;
}

.address-title {
    margin: 25px 0 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
    color: #ad8232;
    font-size: 18px;
}

.address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 15px;
}

.full-width {
    grid-column: 1 / -1;
}

.place-order {
    width: 100%;
    border: none;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

.place-order:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.empty-checkout {
    text-align: center;
    padding: 40px 15px;
    color: #777;
}

.back-shopping {
    display: inline-block;
    margin-top: 15px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 800px) {

    .checkout-container {
        grid-template-columns: 1fr;
    }

    .checkout-section {
        padding: 50px 5%;
    }

    .address-grid {
        grid-template-columns: 1fr;
    }

    .full-width {
        grid-column: auto;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a href="index.html" class="logo">

        <span>
            LIARA
        </span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#about">
            About
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="account.html">
            My Account
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>



<!-- =====================================================
     CHECKOUT
===================================================== -->

<section class="checkout-section">


    <div class="heading">

        <p>
            LIARA PROFESSIONAL™
        </p>

        <h2>
            Complete Your Order
        </h2>

    </div>



    <div class="checkout-container">


        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <div class="checkout-box">

            <h3>
                Your Order
            </h3>


            <div id="orderMode"
                 class="order-mode">

                Loading...

            </div>


            <div
                id="order-items"
                class="order-summary">

                Loading your order...

            </div>


            <div class="total-box">

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="checkout-total">0</span>
                </span>

            </div>

        </div>



        <!-- =================================================
             CUSTOMER DETAILS
        ================================================== -->

        <div class="checkout-box">

            <h3>
                Customer Details
            </h3>


            <form id="checkoutForm">


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>



                <!-- MOBILE -->

                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        required>

                </div>



                <!-- ADDRESS -->

                <div class="address-title">

                    Delivery Address

                </div>


                <div class="address-grid">


                    <!-- HOUSE -->

                    <div class="form-group">

                        <label>
                            House / Flat No.
                        </label>

                        <input
                            type="text"
                            id="house_no"
                            placeholder="House / Flat No."
                            required>

                    </div>



                    <!-- STREET -->

                    <div class="form-group">

                        <label>
                            Street / Area
                        </label>

                        <input
                            type="text"
                            id="street"
                            placeholder="Street / Area"
                            required>

                    </div>



                    <!-- CITY -->

                    <div class="form-group">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required>

                    </div>



                    <!-- STATE -->

                    <div class="form-group">

                        <label>
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            placeholder="State"
                            required>

                    </div>



                    <!-- PIN -->

                    <div class="form-group full-width">

                        <label>
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="6 digit PIN Code"
                            maxlength="6"
                            inputmode="numeric"
                            required>

                    </div>


                </div>



                <!-- PAYMENT -->

                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="payment"
                        required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="Online Payment">
                            Online Payment
                        </option>

                    </select>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn place-order"
                    id="placeOrderButton">

                    Place Order

                </button>


                <div
                    id="message"
                    class="message">
                </div>


            </form>

        </div>

    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   DETERMINE CHECKOUT MODE
===================================================== */

const checkoutMode =
    localStorage.getItem(
        "liaraCheckoutMode"
    ) || "cart";


/*
   BUY NOW:
   liaraBuyNow

   CART:
   liaraCart
*/


let checkoutItems = [];


if (checkoutMode === "buyNow") {

    const buyNow =
        JSON.parse(
            localStorage.getItem(
                "liaraBuyNow"
            ) || "null"
        );


    if (buyNow) {

        checkoutItems = [
            buyNow
        ];

    }

}


else {

    checkoutItems =
        JSON.parse(
            localStorage.getItem(
                "liaraCart"
            ) || "[]"
        );

}



/* =====================================================
   ELEMENTS
===================================================== */

const orderItems =
    document.getElementById(
        "order-items"
    );


const totalElement =
    document.getElementById(
        "checkout-total"
    );


const orderModeElement =
    document.getElementById(
        "orderMode"
    );



/* =====================================================
   SHOW CHECKOUT MODE
===================================================== */

if (checkoutMode === "buyNow") {

    orderModeElement.innerText =
        "⚡ BUY NOW — Direct Order";

}

else {

    orderModeElement.innerText =
        "🛒 CART ORDER";

}



/* =====================================================
   SHOW ORDER
===================================================== */

let total = 0;


if (!checkoutItems ||
    checkoutItems.length === 0) {


    orderItems.innerHTML = `

        <div class="empty-checkout">

            <p>
                Your order is empty.
            </p>

            <a
                href="index.html#products"
                class="back-shopping">

                ← Continue Shopping

            </a>

        </div>

    `;

}


else {

    orderItems.innerHTML = "";


    checkoutItems.forEach(
        function(product) {


            const productPrice =
                Number(
                    product.price || 0
                );


            const productQuantity =
                Number(
                    product.quantity || 1
                );


            const productTotal =
                productPrice *
                productQuantity;


            total +=
                productTotal;


            orderItems.innerHTML += `

                <div class="order-item">

                    <img
                        src="${escapeHtml(product.image || "facewash.jpg")}"
                        alt="${escapeHtml(product.name || "Product")}"
                        onerror="this.src='facewash.jpg'"
                    >


                    <div>

                        <h4>
                            ${escapeHtml(
                                product.name ||
                                "Product"
                            )}
                        </h4>


                        <p>

                            ₹${productPrice.toLocaleString("en-IN")}

                            ×

                            ${productQuantity}

                        </p>

                    </div>

                </div>

            `;

        }
    );

}


totalElement.innerText =
    total.toLocaleString("en-IN");



/* =====================================================
   MOBILE VALIDATION
===================================================== */

document.getElementById(
    "mobile"
).addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);



/* =====================================================
   PINCODE VALIDATION
===================================================== */

document.getElementById(
    "pincode"
).addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);



/* =====================================================
   PLACE ORDER
===================================================== */

document.getElementById(
    "checkoutForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ================================
           CHECK ORDER
        ================================= */

        if (!checkoutItems ||
            checkoutItems.length === 0) {


            showMessage(
                "Your order is empty."
            );


            return;

        }



        /* ================================
           CHECK LOGIN
        ================================= */

        const {
            data: {
                user
            },
            error: userError
        } =
        await supabaseClient
            .auth
            .getUser();


        if (userError || !user) {


            showMessage(
                "Please login before placing an order."
            );


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1200
            );


            return;

        }



        /* ================================
           CUSTOMER
        ================================= */

        const customerName =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "mobile"
            ).value.trim();



        /* ================================
           VALIDATE MOBILE
        ================================= */

        if (!/^[0-9]{10}$/.test(phone)) {

            showMessage(
                "Please enter a valid 10-digit mobile number."
            );


            return;

        }



        /* ================================
           ADDRESS
        ================================= */

        const houseNo =
            document.getElementById(
                "house_no"
            ).value.trim();


        const street =
            document.getElementById(
                "street"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const state =
            document.getElementById(
                "state"
            ).value.trim();


        const pincode =
            document.getElementById(
                "pincode"
            ).value.trim();



        /* ================================
           VALIDATE PIN
        ================================= */

        if (!/^[0-9]{6}$/.test(pincode)) {

            showMessage(
                "Please enter a valid 6-digit PIN code."
            );


            return;

        }



        /* ================================
           PAYMENT
        ================================= */

        const payment =
            document.getElementById(
                "payment"
            ).value;



        /* ================================
           PRODUCT INFORMATION
        ================================= */

        let productNames = "";

        let totalQuantity = 0;


        checkoutItems.forEach(
            function(product) {


                const quantity =
                    Number(
                        product.quantity || 1
                    );


                productNames +=
                    (
                        product.name ||
                        "Product"
                    ) +
                    " × " +
                    quantity +
                    ", ";


                totalQuantity +=
                    quantity;

            }
        );


        productNames =
            productNames.replace(
                /,\s*$/,
                ""
            );



        /* ================================
           BUTTON
        ================================= */

        const button =
            document.getElementById(
                "placeOrderButton"
            );


        button.disabled = true;


        button.innerText =
            "Placing Order...";



        /* ================================
           SAVE ORDER
        ================================= */

        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .insert([{

                user_id:
                    user.id,

                customer_name:
                    customerName,

                phone:
                    phone,

                house_no:
                    houseNo,

                street:
                    street,

                city:
                    city,

                state:
                    state,

                pincode:
                    pincode,

                product:
                    productNames,

                quantity:
                    totalQuantity,

                total:
                    total,

                payment_method:
                    payment,

                status:
                    "Order Received"

            }]);



        /* ================================
           ERROR
        ================================= */

        if (error) {

            console.error(
                "ORDER ERROR:",
                error
            );


            button.disabled =
                false;


            button.innerText =
                "Place Order";


            showMessage(
                "Order could not be placed: " +
                error.message
            );


            return;

        }



        /* ================================
           SUCCESS
        ================================= */

        if (checkoutMode === "buyNow") {

            /*
               BUY NOW ORDER:
               Remove only buy-now data.
            */

            localStorage.removeItem(
                "liaraBuyNow"
            );


            localStorage.removeItem(
                "liaraCheckoutMode"
            );

        }


        else {

            /*
               CART ORDER:
               Remove only cart data.
            */

            localStorage.removeItem(
                "liaraCart"
            );


            localStorage.removeItem(
                "liaraCheckoutMode"
            );

        }



        /* ================================
           SUCCESS MESSAGE
        ================================= */

        showMessage(
            "🎉 Order placed successfully!"
        );


        button.innerText =
            "Order Placed ✓";



        /* ================================
           ACCOUNT PAGE
        ================================= */

        setTimeout(
            function() {

                window.location.href =
                    "account.html";

            },
            1500
        );

    }
);



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    document.getElementById(
        "message"
    ).innerText =
        text;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>


</body>

</html>
```
