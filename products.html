<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Product</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   PRODUCT PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #222;
}


/* =====================================================
   MAIN
===================================================== */

.product-page {
    width: 92%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 45px 0 70px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-link {
    display: inline-block;
    margin-bottom: 30px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
}

.back-link:hover {
    text-decoration: underline;
}


/* =====================================================
   PRODUCT DETAIL
===================================================== */

.product-detail {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-photo {
    width: 100%;
    height: 450px;
    background: #f5f1eb;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.product-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 10px;
}

.product-label {
    color: #ad8232;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2.5px;
    margin-bottom: 12px;
}

.product-info h1 {
    font-size: 36px;
    line-height: 1.2;
    margin: 0 0 15px;
    color: #222;
}

.product-price {
    font-size: 30px;
    font-weight: bold;
    color: #ad8232;
    margin: 5px 0 22px;
}

.product-description {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}


/* =====================================================
   KEY INGREDIENTS
===================================================== */

.ingredients-section {
    margin: 5px 0 28px;
    padding: 25px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.ingredients-title {
    margin: 0 0 18px;
    font-size: 22px;
    color: #222;
    font-weight: 700;
}

.ingredients-title span {
    color: #ad8232;
}

.ingredients-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.ingredient-item {
    background: #fff;
    border-radius: 12px;
    padding: 15px 16px;
    border: 1px solid #eee;
}

.ingredient-name {
    font-size: 16px;
    font-weight: 700;
    color: #ad8232;
    margin-bottom: 5px;
}

.ingredient-benefit {
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.no-ingredients {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}


/* =====================================================
   STOCK
===================================================== */

.stock-text {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 15px;
}

.in-stock {
    color: #287a3e;
}

.out-stock {
    color: #b22;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.quantity-box button {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    font-size: 21px;
    cursor: pointer;
    transition: .2s;
}

.quantity-box button:hover {
    background: #f5f1eb;
    border-color: #ad8232;
}

.quantity-box input {
    width: 65px;
    height: 42px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-buttons button {
    border: none;
    cursor: pointer;
    padding: 15px 27px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.action-buttons button:hover {
    transform: translateY(-2px);
    opacity: .93;
}

.add-cart {
    background: #ad8232;
    color: white;
}

.buy-now {
    background: #287a3e;
    color: white;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.message {
    text-align: center;
    padding: 100px 20px;
    color: #777;
}

.error {
    color: #a33;
}

.message a {
    color: #ad8232;
    font-weight: bold;
    text-decoration: none;
}



/* =====================================================
   PURCHASE / DETAILS LAYOUT
===================================================== */

.purchase-area {
    grid-column: 1;
    grid-row: 2;
    align-self: start;
}

.product-info {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
}

.product-detail .ingredients-section,
.product-detail .product-detail-section {
    grid-column: 1 / -1;
}

.purchase-area .stock-text {
    margin: 0 0 14px;
}

.purchase-area .quantity-box {
    margin: 0 0 14px;
}

.purchase-area .action-buttons {
    width: 100%;
}

.purchase-area .action-buttons button {
    flex: 1;
}


/* =====================================================
   MOBILE PURCHASE ORDER
===================================================== */

@media(max-width: 900px) {

    .product-info {
        grid-column: auto;
        grid-row: auto;
    }

    .purchase-area {
        grid-column: auto;
        grid-row: auto;
        order: 3;
    }

    .product-detail .ingredients-section,
    .product-detail .product-detail-section {
        grid-column: auto;
    }

    .purchase-area .buy-now {
        order: 1;
    }

    .purchase-area .add-cart {
        order: 2;
    }

    .purchase-area .action-buttons {
        flex-direction: column;
    }

    .purchase-area .action-buttons button {
        width: 100%;
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

    .product-detail {
        grid-template-columns: 1fr;
        padding: 25px;
        gap: 35px;
    }

    .product-photo {
        height: 450px;
    }

    .product-info h1 {
        font-size: 34px;
    }

}


@media(max-width: 600px) {

    .product-page {
        padding: 35px 15px 60px;
    }

    .product-detail {
        padding: 18px;
        border-radius: 18px;
    }

    .product-photo {
        height: 360px;
        border-radius: 15px;
    }

    .product-info h1 {
        font-size: 29px;
    }

    .product-price {
        font-size: 26px;
    }

    .ingredients-section {
        padding: 18px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }

}


/* =====================================================
   PRODUCT PAGE - LAPTOP SIZE FIX
   Only affects product.html
===================================================== */

@media (min-width: 901px) {

    .product-page {
        width: min(88vw, 810px) !important;
        max-width: 810px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding: 35px 0 60px !important;
    }

    .product-detail {
        width: 100% !important;
        max-width: 810px !important;
        padding: 22px !important;
        gap: 22px !important;
        border-radius: 18px !important;
    }

    .product-photo {
        height: 325px !important;
        max-height: 325px !important;
    }

    .product-info h1 {
        font-size: 29px !important;
        line-height: 1.18 !important;
    }

    .product-price {
        font-size: 23px !important;
    }
}

@media (min-width: 1400px) {

    .product-page {
        width: min(86vw, 840px) !important;
        max-width: 840px !important;
    }

    .product-detail {
        max-width: 840px !important;
    }

    .product-photo {
        height: 340px !important;
        max-height: 340px !important;
    }
}

@media (max-width: 900px) {

    .product-page {
        width: 92% !important;
        max-width: none !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .product-detail {
        width: 100% !important;
    }
}


/* =====================================================
   PRODUCT DETAIL SECTIONS
===================================================== */

.product-detail-section {
    margin: 5px 0 24px;
    padding: 22px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.product-detail-title {
    margin: 0 0 14px;
    font-size: 21px;
    color: #222;
    font-weight: 700;
}

.product-detail-title span {
    margin-right: 6px;
}

.product-detail-content {
    color: #666;
    font-size: 14px;
    line-height: 1.75;
}

.detail-line {
    margin-bottom: 7px;
}

.detail-line:last-child {
    margin-bottom: 0;
}

@media(max-width:600px) {
    .product-detail-section {
        padding: 18px;
    }

    .product-detail-title {
        font-size: 19px;
    }
}


/* =====================================================
   LIARA PREMIUM PRODUCT PAGE — FINAL VISUAL
===================================================== */

.product-page{
    width:min(92vw, 1040px) !important;
    max-width:1040px !important;
    margin:0 auto !important;
    padding:28px 0 60px !important;
}

.product-detail{
    display:grid !important;
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;

    padding:22px !important;
    border-radius:24px !important;

}

/* Main product image */
.product-photo{
    grid-column:span 3 !important;
    grid-row:1 !important;

}

/* Product information */

    grid-column:span 3 !important;

}

.product-label{

    margin-bottom:12px !important;
}

.product-info h1{
    font-size:34px !important;
    line-height:1.14 !important;
    letter-spacing:-.5px !important;
    margin-bottom:16px !important;
    color:#171717 !important;
}

.product-price{
    font-size:28px !important;
    color:#ad8232 !important;
    margin:4px 0 16px !important;
}

.product-description{
    font-size:15px !important;
    line-height:1.65 !important;
    color:#666 !important;
    margin-bottom:18px !important;
}

/* Purchase block stays with product information */
.purchase-area{
    grid-column:span 3 !important;
    grid-row:2 !important;
    align-self:start !important;
    padding:0 8px !important;
}

.purchase-area .stock-text{
    display:flex !important;
    align-items:center !important;

    margin:0 0 14px !important;
}

.purchase-area .in-stock{

}

.purchase-area .quantity-box{
    width:max-content !important;
    margin:0 0 14px !important;

    border:1px solid #e5ded3 !important;
    border-radius:11px !important;

    background:#fff !important;
}

.purchase-area .quantity-box button{
    width:42px !important;
    height:40px !important;
    border:0 !important;
    border-radius:0 !important;
    background:#fff !important;
}

.purchase-area .quantity-box input{
    width:48px !important;
    height:40px !important;
    border:0 !important;
    border-left:1px solid #eee7de !important;
    border-right:1px solid #eee7de !important;
    border-radius:0 !important;
}

.purchase-area .action-buttons{
    display:flex !important;
    gap:10px !important;
    width:100% !important;
}

.purchase-area .action-buttons button{
    min-height:48px !important;
    padding:13px 18px !important;
    border-radius:11px !important;
    font-size:15px !important;
}

.purchase-area .buy-now{
    background:#b88427 !important;
    color:#fff !important;
    box-shadow:0 8px 18px rgba(184,132,39,.20) !important;
}

.purchase-area .add-cart{
    background:#fff !important;
    color:#ad8232 !important;
    border:1px solid #d9c39a !important;
}

/* Three information cards */
.product-detail .ingredients-section,
.product-detail .product-detail-section{
    grid-column:span 2 !important;
    grid-row:auto !important;
    width:auto !important;
    margin:0 !important;
    padding:20px !important;
    background:#fbf9f6 !important;
    border:1px solid #eee5d7 !important;
    border-radius:18px !important;
    box-sizing:border-box !important;
}

.product-detail .ingredients-section{
    grid-row:3 !important;
}

.product-detail .product-detail-section{
    grid-row:3 !important;
}

.ingredients-title,
.product-detail-title{

    align-items:center !important;
    gap:10px !important;

}

.ingredients-title span,
.product-detail-title span{

}

.ingredients-list{

}

.ingredient-item,
.product-detail-content{

}

.ingredient-name{
    font-size:15px !important;
    margin-bottom:4px !important;
}

.ingredient-benefit,
.detail-line{
    font-size:13px !important;
    line-height:1.55 !important;

}

.product-detail-content{
    display:flex !important;
    flex-direction:column !important;
    gap:8px !important;
}

.product-detail-section:nth-of-type(1){
    /* keeps normal card styling */
}

/* Desktop: benefits cards are visually balanced */
.product-detail .ingredients-section,
.product-detail .product-detail-section{
    min-height:145px !important;
}

/* =====================================================
   MOBILE
===================================================== */

    .product-page{
        width:92% !important;

    }

    .product-detail{

   PURCHASE SECTION BESIDE PRODUCT PHOTO
   Price → Description → Stock → Quantity → Buttons
===================================================== */

    display: flex;

}

    }

    .product-info .purchase-area .action-buttons {

    }

    .product-info .purchase-area .action-buttons button {

    }
}



/* =====================================================
   PRODUCT SIZE / UNIT OPTIONS
===================================================== */
.size-selection {
    margin: 0 0 14px;
}
.size-selection-label {
    display:block;
    margin:0 0 8px;
    font-size:14px;
    font-weight:700;
    color:#333;
}
.size-options {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.size-option {
    min-width:72px;
    padding:10px 13px;
    border:1px solid #ddd5c9;
    border-radius:10px;
    background:#fff;
    color:#555;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}
.size-option:hover,
.size-option.active {
    border-color:#b88427;
    background:#b88427;
    color:#fff;
}
.size-option:disabled {
    opacity:.45;
    cursor:not-allowed;
    background:#f5f3ef;
}
.selected-size-text {
    margin:8px 0 0;
    font-size:13px;
    color:#777;
}
@media(max-width:600px){
    .size-options{gap:7px;}
    .size-option{flex:1 1 70px;}
}


/* PRODUCT SIZE / VARIANT SELECTOR */

@media(max-width:600px){.size-options{gap:7px}.size-option{flex:1;min-width:70px}.size-selection{padding:13px}}

<script>

/* =====================================================
   SUPABASE CONNECTION

function escapeHtml(value) {

        .replace(/&/g,"&amp;")

/* =====================================================
   INGREDIENT PARSER
===================================================== */

function parseIngredients(value) {

    if(!value) {

        return [];

    }


    /*
       Try JSON first.
    */

    try {

        const parsed =
            JSON.parse(value);

        if(Array.isArray(parsed)) {

            return parsed;

        }

    }

    catch(error) {

        /*
           Normal text format will
           continue below.
        */

    }


    /*
       Normal text format:

       Niacinamide — Brightening
       Aloe Vera — Hydration
       Vitamin E — Moisturising
    */

    const lines =
        String(value)
        .split(/\r?\n/)
        .map(function(line) {

            return line.trim();

        })
        .filter(Boolean);


    return lines.map(function(line) {

        let parts;


        if(line.includes("—")) {

            parts =
                line.split("—");

        }

        else if(line.includes("|")) {

            parts =
                line.split("|");

        }

        else if(line.includes(":")) {

            parts =
                line.split(":");

        }

        else {

            return {

                name: line,
                benefit: ""

            };

        }


        return {

            name:
                parts.shift().trim(),

            benefit:
                parts.join("—").trim()

        };

    });

}

/* =====================================================
   PRODUCT SIZE / UNIT HELPERS
===================================================== */
function parseSizeOptions(product) {
    const candidates = [
        product.size_options,
        product.sizes,
        product.product_sizes,
        product.variants
    ];

    for (const value of candidates) {
        if (Array.isArray(value) && value.length) return normalizeSizeOptions(value);
        if (typeof value === "string" && value.trim()) {
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed) && parsed.length) return normalizeSizeOptions(parsed);
            } catch(e) {}
            const parts = value.split(/[,\n|]+/).map(v => v.trim()).filter(Boolean);
            if (parts.length) return normalizeSizeOptions(parts);
        }
    }

    const singleSize = product.size || product.volume || product.weight || product.quantity_size || "";
    const singleUnit = product.unit || product.size_unit || product.volume_unit || product.weight_unit || "";
    if (singleSize) return normalizeSizeOptions([{ size: singleSize, unit: singleUnit }]);

    return [];
}

function normalizeSizeOptions(list) {
    return list.map((item, index) => {
        if (typeof item === "number") return { value:String(item), label:String(item), price:null, stock:null, unit:"" };
        if (typeof item === "string") {
            const raw=item.trim();
            const match=raw.match(/^([0-9]+(?:\.[0-9]+)?)\s*(g|gram|grams|kg|ml|millilitre|milliliter|l|ltr|litre|liter|litres|liters)$/i);
            if(match){ const n=match[1], u=normalizeUnit(match[2]); return {value:n+u,label:n+" "+u,price:null,stock:null,unit:u}; }
            return {value:raw,label:raw,price:null,stock:null,unit:""};
        }
        const size=String(item?.label ?? item?.size ?? item?.value ?? item?.quantity ?? item?.weight ?? item?.volume ?? "").trim();
        const unit=normalizeUnit(item?.unit ?? item?.size_unit ?? item?.volume_unit ?? item?.weight_unit ?? "");
        const label=size+(unit?" "+unit:"");
        return { value:label || ("Option "+(index+1)), label:label || ("Option "+(index+1)), price:item?.price != null ? Number(item.price) : null, stock:item?.stock != null ? Number(item.stock) : null, unit:unit };
    }).filter(x=>x.label);
}

function normalizeUnit(unit) {
    const u=String(unit||"").trim().toLowerCase();
    if(["g","gram","grams"].includes(u)) return "g";
    if(["kg","kilogram","kilograms"].includes(u)) return "kg";
    if(["ml","millilitre","milliliter","millilitres","milliliters"].includes(u)) return "ml";
    if(["l","ltr","litre","liter","litres","liters"].includes(u)) return "L";
    return String(unit||"").trim();
}

let selectedProductVariant=null;

}

function applyProductVariant(option) {

}

async function addToCart() {

    const product =
        await getCurrentProduct();


    if(!product) {

            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        selectedProductVariant && selectedProductVariant.stock != null
        ? Number(selectedProductVariant.stock)
        : Number(product.stock || 0);


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "liaraCart"
                ) || "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    const selectedSize = getSelectedSize();

    const existing =
        cart.find(function(item) {

            return String(item.id) === String(product.id) &&
                   String(item.size || "") === String(selectedSize || "");

        });


    if(existing) {

        const newQuantity =
            Number(
                existing.quantity || 0
            ) +
            quantity;


        if(newQuantity > stock) {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }


        existing.quantity =
            newQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                product.product_name ||
                "Liara Product",

            price:
                selectedProductVariant && selectedProductVariant.price != null
                ? Number(selectedProductVariant.price)
                : Number(product.price || 0),

            image:
                product.image_url ||
                product.photo_url ||
                product.image ||
                product.photo ||
                "facewash.jpg",

            quantity:
                quantity,

            size:
                getSelectedSize(),

            unit:
                selectedProductVariant?.unit || ""

        });

    }


    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );

        "cart.html";
