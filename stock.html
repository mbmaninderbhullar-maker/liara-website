<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Stock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#222;
    font-weight:400;
}

.header{
    background:#111827;
    color:#fff;
    padding:16px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:21px;
    font-weight:400;
}

.header p{
    margin:4px 0 0;
    opacity:.72;
    font-size:12px;
}

.back-btn{
    background:#fff;
    color:#111827;
    text-decoration:none;
    padding:8px 12px;
    border-radius:7px;
    font-size:12px;
}

.container{
    max-width:1200px;
    margin:18px auto;
    padding:0 15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:14px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.card-title{
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.card-number{
    font-size:24px;
    font-weight:400;
}

.toolbar{
    background:#fff;
    padding:11px;
    border-radius:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.search{
    flex:1;
    min-width:200px;
}

input,select{
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:12px;
    outline:none;
    font-weight:400;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    font-size:12px;
    font-weight:400;
}

.refresh{
    background:#111827;
    color:#fff;
}

.table-box{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:12px;
    font-weight:400;
}

th{
    background:#fafafa;
    color:#666;
    font-size:11px;
}

.product-name{
    font-weight:400;
}

.track{
    white-space:nowrap;
}

.pending{
    color:#b45309;
}

.sold{
    color:#166534;
}

.warehouse{
    color:#111827;
}

.status{
    display:inline-block;
    padding:4px 8px;
    border-radius:16px;
    font-size:10px;
}

.available{
    background:#dcfce7;
    color:#166534;
}

.low{
    background:#fef3c7;
    color:#92400e;
}

.out{
    background:#fee2e2;
    color:#991b1b;
}

.add{
    background:#166534;
    color:#fff;
}

.give{
    background:#111827;
    color:#fff;
    margin-left:4px;
}

.loading,.empty,.error{
    text-align:center;
    padding:32px;
    color:#777;
}

.error{
    color:#991b1b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.modal-box{
    background:#fff;
    width:min(410px,92%);
    max-height:90vh;
    overflow:auto;
    border-radius:12px;
    padding:20px;
}

.modal-box h2{
    margin:0 0 14px;
    font-size:19px;
    font-weight:400;
}

.modal-box label{
    display:block;
    margin:12px 0 6px;
    font-size:12px;
}

.modal-box input,
.modal-box select{
    width:100%;
}

.product-info{
    background:#f5f6f8;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    line-height:1.6;
}

.entry-type{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.entry-type label{
    margin:0;
    cursor:pointer;
}

.entry-type input{
    display:none;
}

.entry-option{
    display:block;
    text-align:center;
    padding:9px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:12px;
}

.entry-type input:checked + .entry-option{
    border-color:#111827;
    background:#f1f5f9;
}

.unit-row{
    display:grid;
    grid-template-columns:1fr 120px;
    gap:8px;
}

.party-note{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.modal-actions button{
    flex:1;
}

.save{
    background:#111827;
    color:#fff;
}

.cancel{
    background:#ddd;
    color:#222;
}

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    background:#111827;
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    display:none;
    z-index:10000;
    font-size:12px;
}

@media(max-width:800px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:12px;
    }

    .card-number{
        font-size:21px;
    }

    .unit-row{
        grid-template-columns:1fr 100px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="header-inner">

        <div>
            <h1>Stock Management</h1>
            <p>Liara Professional™ — Warehouse & Party Stock</p>
        </div>

        <a href="admin.html" class="back-btn">← Admin</a>

    </div>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">Total Products</div>
            <div class="card-number" id="totalProducts">0</div>
        </div>

        <div class="card">
            <div class="card-title">Warehouse Stock</div>
            <div class="card-number" id="totalWarehouse">0</div>
        </div>

        <div class="card">
            <div class="card-title">Low Warehouse</div>
            <div class="card-number" id="lowStock">0</div>
        </div>

        <div class="card">
            <div class="card-title">Empty Warehouse</div>
            <div class="card-number" id="zeroStock">0</div>
        </div>

    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search product..."
            oninput="renderProducts()"
        >

        <select id="filter" onchange="renderProducts()">
            <option value="all">All Stock</option>
            <option value="available">Available</option>
            <option value="low">Low Stock</option>
            <option value="out">Empty</option>
        </select>

        <button class="refresh" onclick="loadProducts()">
            Refresh
        </button>

    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Unit</th>
                    <th>Online Stock</th>
                    <th>Warehouse</th>
                    <th>Given</th>
                    <th>Sold</th>
                    <th>Pending</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="stockBody">

                <tr>
                    <td colspan="10" class="loading">
                        Loading stock...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<div class="modal" id="stockModal">

    <div class="modal-box">

        <h2 id="modalTitle">Warehouse Stock</h2>

        <div id="modalProduct" class="product-info"></div>

        <div id="partyArea">

            <label>Give To Party</label>

            <select id="partySelect">
                <option value="">Loading parties...</option>
            </select>

            <div class="party-note">
                Party name will be saved with this stock entry.
            </div>

        </div>

        <label>Source</label>

        <div class="entry-type">

            <label>
                <input
                    type="radio"
                    name="entrySource"
                    value="online"
                    checked
                >
                <span class="entry-option">Online</span>
            </label>

            <label>
                <input
                    type="radio"
                    name="entrySource"
                    value="offline"
                >
                <span class="entry-option">Offline</span>
            </label>

        </div>

        <label>Quantity & Unit</label>

        <div class="unit-row">

            <input
                id="stockQuantity"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Quantity"
            >

            <select id="stockUnit">
                <option value="pcs">pcs</option>
                <option value="ml">ml</option>
                <option value="L">L</option>
                <option value="g">g</option>
                <option value="kg">kg</option>
            </select>

        </div>

        <label>Note</label>

        <input
            id="stockNote"
            type="text"
            placeholder="Optional note"
        >

        <div class="modal-actions">

            <button class="save" onclick="saveStock()">
                Save Entry
            </button>

            <button class="cancel" onclick="closeModal()">
                Cancel
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const PRODUCT_TABLE = "products";
const STOCK_ENTRY_TABLE = "stock_entries";
const PARTY_TABLE = "parties";


let allProducts = [];
let allParties = [];
let selectedProduct = null;
let stockMode = "in";
let stockStats = {};


function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getProductId(product){
    return (
        product.id ??
        product.product_id ??
        product.productId
    );
}


function getProductName(product){
    return (
        product.product_name ??
        product.name ??
        product.productName ??
        product.title ??
        product.product ??
        "Unnamed Product"
    );
}


function getProductPrice(product){
    return Number(
        product.price ??
        product.sale_price ??
        product.selling_price ??
        product.unit_price ??
        0
    ) || 0;
}


/* ONLINE WEBSITE STOCK */
function getOnlineStock(product){
    return Number(product.stock) || 0;
}


/* WAREHOUSE STOCK ONLY */
function getWarehouseStock(product){
    return Number(product.warehouse_stock) || 0;
}


function getProductUnit(product){
    return (
        product.unit ??
        product.stock_unit ??
        "pcs"
    );
}


function findStockColumn(){
    return "warehouse_stock";
}


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    setTimeout(function(){
        toast.style.display = "none";
    },2500);
}


/* =========================================
   LOAD PARTIES
========================================= */

async function loadParties(){

    const select =
        document.getElementById("partySelect");

    try{

        const result =
            await supabaseClient
                .from(PARTY_TABLE)
                .select("*")
                .order("id",{ascending:false});

        if(result.error){

            console.warn(
                "Party loading failed:",
                result.error
            );

            select.innerHTML =
                '<option value="">Party loading failed</option>';

            return;
        }

        allParties = result.data || [];

        select.innerHTML =
            '<option value="">Select party</option>';

        allParties.forEach(function(party){

            const id =
                party.id ??
                party.party_id;

            const name =
                party.name ??
                party.party_name ??
                party.partyName ??
                party.title ??
                "Unnamed Party";

            if(id != null){

                select.innerHTML += `
                    <option value="${escapeHtml(id)}">
                        ${escapeHtml(name)}
                    </option>
                `;

            }

        });

    }catch(error){

        console.warn(error);

    }

}


/* =========================================
   LOAD ENTRIES
========================================= */

async function loadStockStats(){

    stockStats = {};

    try{

        const result =
            await supabaseClient
                .from(STOCK_ENTRY_TABLE)
                .select(
                    "product_id,quantity,type,source,party_id"
                );

        if(result.error){

            console.warn(
                "Stock entries unavailable:",
                result.error
            );

            return;
        }

        (result.data || []).forEach(function(entry){

            const id =
                String(entry.product_id);

            if(!stockStats[id]){

                stockStats[id] = {
                    onlineGiven:0,
                    offlineGiven:0,
                    onlineSold:0,
                    offlineSold:0
                };

            }

            const qty =
                Number(entry.quantity) || 0;

            const source =
                String(
                    entry.source || ""
                ).toLowerCase();

            const type =
                String(
                    entry.type || ""
                ).toLowerCase();


            /*
              "out" = stock given to party
              "sale" = sold/returned sales record
            */

            if(type === "out"){

                if(source === "online"){
                    stockStats[id].onlineGiven += qty;
                }

                if(source === "offline"){
                    stockStats[id].offlineGiven += qty;
                }

            }

            if(type === "sale"){

                if(source === "online"){
                    stockStats[id].onlineSold += qty;
                }

                if(source === "offline"){
                    stockStats[id].offlineSold += qty;
                }

            }

        });

    }catch(error){

        console.warn(error);

    }

}


function getStats(product){

    return stockStats[
        String(getProductId(product))
    ] || {
        onlineGiven:0,
        offlineGiven:0,
        onlineSold:0,
        offlineSold:0
    };

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const body =
        document.getElementById("stockBody");

    body.innerHTML = `
        <tr>
            <td colspan="10" class="loading">
                Loading stock from Supabase...
            </td>
        </tr>
    `;

    try{

        const result =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .select("*")
                .order("id",{ascending:false});

        if(result.error){

            body.innerHTML = `
                <tr>
                    <td colspan="10" class="error">
                        ${escapeHtml(result.error.message)}
                    </td>
                </tr>
            `;

            return;
        }

        allProducts =
            result.data || [];

        await Promise.all([
            loadParties(),
            loadStockStats()
        ]);

        renderProducts();

    }catch(error){

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="10" class="error">
                    Unable to load products.
                </td>
            </tr>
        `;

    }

}


/* =========================================
   RENDER
========================================= */

function renderProducts(){

    const body =
        document.getElementById("stockBody");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filter =
        document.getElementById("filter")
            .value;

    body.innerHTML = "";

    let totalWarehouse = 0;
    let lowStock = 0;
    let zeroStock = 0;

    allProducts.forEach(function(product){

        const warehouse =
            getWarehouseStock(product);

        totalWarehouse += warehouse;

        if(warehouse <= 0){
            zeroStock++;
        }else if(warehouse <= 5){
            lowStock++;
        }

    });

    document.getElementById(
        "totalProducts"
    ).textContent =
        allProducts.length;

    document.getElementById(
        "totalWarehouse"
    ).textContent =
        totalWarehouse;

    document.getElementById(
        "lowStock"
    ).textContent =
        lowStock;

    document.getElementById(
        "zeroStock"
    ).textContent =
        zeroStock;


    let shown = 0;


    allProducts.forEach(function(product,index){

        const name =
            getProductName(product);

        const onlineStock =
            getOnlineStock(product);

        const warehouse =
            getWarehouseStock(product);

        const unit =
            getProductUnit(product);

        const stats =
            getStats(product);


        if(
            search &&
            !name.toLowerCase().includes(search)
        ){
            return;
        }


        let status = "available";
        let statusText = "Available";


        if(warehouse <= 0){

            status = "out";
            statusText = "Empty";

        }else if(warehouse <= 5){

            status = "low";
            statusText = "Low";

        }


        if(
            filter !== "all" &&
            filter !== status
        ){
            return;
        }


        shown++;


        const totalGiven =
            stats.onlineGiven +
            stats.offlineGiven;

        const totalSold =
            stats.onlineSold +
            stats.offlineSold;

        const pending =
            Math.max(
                0,
                totalGiven - totalSold
            );


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                <div class="product-name">
                    ${escapeHtml(name)}
                </div>
            </td>

            <td>
                ${escapeHtml(unit)}
            </td>

            <td>
                ${onlineStock}
            </td>

            <td class="warehouse">
                ${warehouse}
            </td>

            <td class="track">
                ${totalGiven}
            </td>

            <td class="track sold">
                ${totalSold}
            </td>

            <td class="track pending">
                ${pending}
            </td>

            <td>
                <span class="status ${status}">
                    ${statusText}
                </span>
            </td>

            <td>

                <button
                    class="add"
                    onclick="openStockModal(${index},'in')"
                >
                    + Warehouse
                </button>

                <button
                    class="give"
                    onclick="openStockModal(${index},'give')"
                >
                    Give
                </button>

            </td>

        `;

        body.appendChild(row);

    });


    if(shown === 0){

        body.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    No products found.
                </td>
            </tr>
        `;

    }

}


/* =========================================
   OPEN MODAL
========================================= */

function openStockModal(index,mode){

    selectedProduct =
        allProducts[index];

    if(!selectedProduct){
        return;
    }

    stockMode = mode;


    document.getElementById(
        "modalTitle"
    ).textContent =
        mode === "in"
        ? "Add to Warehouse"
        : "Give Stock to Party";


    document.getElementById(
        "modalProduct"
    ).innerHTML = `

        <div>
            ${escapeHtml(
                getProductName(
                    selectedProduct
                )
            )}
        </div>

        <div>
            Online Stock:
            ${getOnlineStock(selectedProduct)}
        </div>

        <div>
            Warehouse Stock:
            ${getWarehouseStock(selectedProduct)}
        </div>

    `;


    document.getElementById(
        "stockQuantity"
    ).value = "";


    document.getElementById(
        "stockNote"
    ).value = "";


    document.getElementById(
        "stockUnit"
    ).value =
        getProductUnit(selectedProduct);


    document.getElementById(
        "partyArea"
    ).style.display =
        mode === "give"
        ? "block"
        : "none";


    document.querySelector(
        'input[name="entrySource"][value="online"]'
    ).checked = true;


    document.getElementById(
        "stockModal"
    ).style.display =
        "flex";

}


/* =========================================
   CLOSE
========================================= */

function closeModal(){

    document.getElementById(
        "stockModal"
    ).style.display =
        "none";

    selectedProduct = null;

}


/* =========================================
   SAVE STOCK
========================================= */

async function saveStock(){

    if(!selectedProduct){
        return;
    }


    const quantity =
        Number(
            document.getElementById(
                "stockQuantity"
            ).value
        );


    const unit =
        document.getElementById(
            "stockUnit"
        ).value;


    const note =
        document.getElementById(
            "stockNote"
        ).value.trim();


    const source =
        document.querySelector(
            'input[name="entrySource"]:checked'
        ).value;


    if(!quantity || quantity <= 0){

        alert(
            "Please enter a valid quantity."
        );

        return;

    }


    const productId =
        getProductId(selectedProduct);


    if(productId == null){

        alert(
            "Product ID not found."
        );

        return;

    }


    const currentWarehouse =
        getWarehouseStock(
            selectedProduct
        );


    /* =========================================
       WAREHOUSE STOCK IN
       IMPORTANT:
       DOES NOT CHANGE products.stock
    ========================================= */

    if(stockMode === "in"){

        const newWarehouse =
            currentWarehouse + quantity;


        try{

            const updateResult =
                await supabaseClient
                    .from(PRODUCT_TABLE)
                    .update({
                        warehouse_stock:
                            newWarehouse
                    })
                    .eq(
                        "id",
                        productId
                    );


            if(updateResult.error){

                alert(
                    "Warehouse update failed: " +
                    updateResult.error.message
                );

                return;

            }


            const entryResult =
                await supabaseClient
                    .from(STOCK_ENTRY_TABLE)
                    .insert([{

                        product_id:
                            productId,

                        product_name:
                            getProductName(
                                selectedProduct
                            ),

                        quantity:
                            quantity,

                        unit:
                            unit,

                        type:
                            "in",

                        source:
                            "warehouse",

                        previous_stock:
                            currentWarehouse,

                        new_stock:
                            newWarehouse,

                        note:
                            note || null

                    }]);


            if(entryResult.error){

                console.warn(
                    "Warehouse entry save failed:",
                    entryResult.error
                );

                showToast(
                    "Warehouse stock updated."
                );

            }else{

                showToast(
                    "Added to warehouse."
                );

            }


            selectedProduct.warehouse_stock =
                newWarehouse;


            closeModal();

            await loadStockStats();

            renderProducts();


        }catch(error){

            console.error(error);

            alert(
                "Warehouse update failed."
            );

        }

        return;
    }


    /* =========================================
       GIVE TO PARTY
       ONLY warehouse_stock decreases
    ========================================= */

    const partyId =
        document.getElementById(
            "partySelect"
        ).value;


    if(!partyId){

        alert(
            "Please select a party."
        );

        return;

    }


    if(quantity > currentWarehouse){

        alert(
            "Quantity cannot be greater than warehouse stock."
        );

        return;

    }


    const party =
        allParties.find(function(party){

            return String(
                party.id ??
                party.party_id
            ) === String(
                partyId
            );

        });


    const partyName =
        party
        ? (
            party.name ??
            party.party_name ??
            party.partyName ??
            party.title ??
            "Unnamed Party"
        )
        : "Unnamed Party";


    const newWarehouse =
        currentWarehouse - quantity;


    try{

        /*
          IMPORTANT:
          products.stock IS NOT UPDATED HERE.
          Only warehouse_stock is reduced.
        */

        const updateResult =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .update({
                    warehouse_stock:
                        newWarehouse
                })
                .eq(
                    "id",
                    productId
                );


        if(updateResult.error){

            alert(
                "Warehouse stock update failed: " +
                updateResult.error.message
            );

            return;

        }


        const entryResult =
            await supabaseClient
                .from(STOCK_ENTRY_TABLE)
                .insert([{

                    product_id:
                        productId,

                    product_name:
                        getProductName(
                            selectedProduct
                        ),

                    quantity:
                        quantity,

                    unit:
                        unit,

                    type:
                        "out",

                    source:
                        source,

                    party_id:
                        partyId,

                    party_name:
                        partyName,

                    previous_stock:
                        currentWarehouse,

                    new_stock:
                        newWarehouse,

                    note:
                        note || null

                }]);


        if(entryResult.error){

            console.warn(
                "Party entry save failed:",
                entryResult.error
            );

            showToast(
                "Stock given. Party entry save failed."
            );

        }else{

            showToast(
                quantity +
                " " +
                unit +
                " given to " +
                partyName
            );

        }


        selectedProduct.warehouse_stock =
            newWarehouse;


        closeModal();

        await loadStockStats();

        renderProducts();


    }catch(error){

        console.error(error);

        alert(
            "Stock update failed."
        );

    }

}


/* =========================================
   REALTIME PRODUCTS
========================================= */

supabaseClient
    .channel("stock-products-live")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:PRODUCT_TABLE
        },
        function(){
            loadProducts();
        }
    )
    .subscribe();


/* =========================================
   REALTIME ENTRIES
========================================= */

supabaseClient
    .channel("stock-entries-live")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:STOCK_ENTRY_TABLE
        },
        async function(){

            await loadStockStats();

            renderProducts();

        }
    )
    .subscribe();


/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProducts();

    }
);

</script>

</body>
</html>
