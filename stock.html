<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Stock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#222;
}

.header{
    background:#111827;
    color:#fff;
    padding:22px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:5px 0 0;
    opacity:.75;
}

.back-btn{
    background:#fff;
    color:#111827;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.card-title{
    color:#777;
    font-size:14px;
    margin-bottom:8px;
}

.card-number{
    font-size:30px;
    font-weight:bold;
}

.toolbar{
    background:#fff;
    padding:15px;
    border-radius:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.search{
    flex:1;
    min-width:220px;
}

input,
select{
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#111827;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
}

.refresh{
    background:#111827;
    color:#fff;
}

.table-box{
    background:#fff;
    border-radius:14px;
    overflow:auto;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th,
td{
    padding:15px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#fafafa;
    font-size:13px;
    color:#666;
}

.product-name{
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.available{
    background:#dcfce7;
    color:#166534;
}

.low{
    background:#fef3c7;
    color:#92400e;
}

.out{
    background:#fee2e2;
    color:#991b1b;
}

.add{
    background:#166534;
    color:#fff;
}

.remove{
    background:#991b1b;
    color:#fff;
    margin-left:5px;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:40px;
    color:#777;
}

.error{
    color:#991b1b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.modal-box{
    background:#fff;
    width:min(400px,92%);
    border-radius:15px;
    padding:25px;
}

.modal-box h2{
    margin-top:0;
}

.modal-box label{
    display:block;
    margin:15px 0 6px;
    font-size:13px;
    font-weight:bold;
}

.modal-box input{
    width:100%;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
}

.save{
    background:#111827;
    color:#fff;
}

.cancel{
    background:#ddd;
    color:#222;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:#fff;
    padding:13px 18px;
    border-radius:9px;
    display:none;
    z-index:10000;
}

@media(max-width:800px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

}
</style>
</head>

<body>

<div class="header">

    <div class="header-inner">

        <div>
            <h1>📦 Stock Management</h1>
            <p>Liara Professional™ — Live Supabase Stock</p>
        </div>

        <a href="admin.html" class="back-btn">
            ← Admin
        </a>

    </div>

</div>


<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">
                Total Products
            </div>

            <div class="card-number" id="totalProducts">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Total Stock
            </div>

            <div class="card-number" id="totalStock">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Low Stock
            </div>

            <div class="card-number" id="lowStock">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Out of Stock
            </div>

            <div class="card-number" id="zeroStock">
                0
            </div>
        </div>

    </div>


    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search product..."
            oninput="renderProducts()"
        >

        <select
            id="filter"
            onchange="renderProducts()"
        >

            <option value="all">
                All Stock
            </option>

            <option value="available">
                Available
            </option>

            <option value="low">
                Low Stock
            </option>

            <option value="out">
                Out of Stock
            </option>

        </select>

        <button
            class="refresh"
            onclick="loadProducts()"
        >
            ↻ Refresh
        </button>

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Product</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="stockBody">

                <tr>
                    <td colspan="6" class="loading">
                        Loading stock...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- STOCK MODAL -->

<div class="modal" id="stockModal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Stock Update
        </h2>

        <div id="modalProduct"></div>

        <label>
            Quantity
        </label>

        <input
            id="stockQuantity"
            type="number"
            min="1"
            placeholder="Enter quantity"
        >

        <div class="modal-actions">

            <button
                class="save"
                onclick="saveStock()"
            >
                Save
            </button>

            <button
                class="cancel"
                onclick="closeModal()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE — SAME CONNECTION
========================================================= */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   SETTINGS
========================================================= */

const PRODUCT_TABLE = "products";

let allProducts = [];

let selectedProduct = null;

let stockMode = "in";


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getProductName(product){

    return (
        product.product_name ??
        product.name ??
        product.productName ??
        product.title ??
        product.product ??
        "Unnamed Product"
    );

}


function getProductPrice(product){

    return Number(
        product.price ??
        product.sale_price ??
        product.selling_price ??
        product.unit_price ??
        0
    ) || 0;

}


function getProductStock(product){

    return Number(
        product.stock ??
        product.stock_quantity ??
        product.quantity ??
        product.qty ??
        product.current_stock ??
        0
    ) || 0;

}


function getProductId(product){

    return (
        product.id ??
        product.product_id ??
        product.productId
    );

}


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.style.display = "block";

    setTimeout(()=>{
        toast.style.display = "none";
    },2500);

}


/* =========================================================
   LOAD PRODUCTS FROM SUPABASE
========================================================= */

async function loadProducts(){

    const body =
        document.getElementById("stockBody");

    body.innerHTML = `
        <tr>
            <td colspan="6" class="loading">
                Loading stock from Supabase...
            </td>
        </tr>
    `;

    try{

        const { data, error } =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .select("*")
                .order("id",{ascending:false});

        if(error){

            console.error(error);

            body.innerHTML = `
                <tr>
                    <td colspan="6" class="error">
                        ${escapeHtml(error.message)}
                    </td>
                </tr>
            `;

            return;
        }


        allProducts = data || [];

        renderProducts();

    }catch(error){

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="6" class="error">
                    Unable to load products.
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    const body =
        document.getElementById("stockBody");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filter =
        document
            .getElementById("filter")
            .value;


    body.innerHTML = "";


    let totalStock = 0;

    let lowStock = 0;

    let zeroStock = 0;


    allProducts.forEach(product=>{

        const stock =
            getProductStock(product);

        totalStock += stock;

        if(stock === 0){

            zeroStock++;

        }else if(stock <= 5){

            lowStock++;

        }

    });


    document.getElementById(
        "totalProducts"
    ).textContent =
        allProducts.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        totalStock;


    document.getElementById(
        "lowStock"
    ).textContent =
        lowStock;


    document.getElementById(
        "zeroStock"
    ).textContent =
        zeroStock;


    let shown = 0;


    allProducts.forEach((product,index)=>{

        const name =
            getProductName(product);

        const stock =
            getProductStock(product);

        const price =
            getProductPrice(product);


        if(
            search &&
            !name.toLowerCase().includes(search)
        ){

            return;

        }


        let status = "available";

        let statusText = "Available";


        if(stock <= 0){

            status = "out";

            statusText = "Out of Stock";

        }else if(stock <= 5){

            status = "low";

            statusText = "Low Stock";

        }


        if(
            filter !== "all" &&
            filter !== status
        ){

            return;

        }


        shown++;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                <div class="product-name">
                    ${escapeHtml(name)}
                </div>
            </td>

            <td>
                ₹${price.toLocaleString("en-IN")}
            </td>

            <td>
                <strong>
                    ${stock}
                </strong>
            </td>

            <td>
                <span class="status ${status}">
                    ${statusText}
                </span>
            </td>

            <td>

                <button
                    class="add"
                    onclick="openStockModal(${index},'in')"
                >
                    + Add
                </button>

                <button
                    class="remove"
                    onclick="openStockModal(${index},'out')"
                >
                    − Remove
                </button>

            </td>

        `;


        body.appendChild(row);

    });


    if(shown === 0){

        body.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No products found.
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   OPEN STOCK MODAL
========================================================= */

function openStockModal(index,mode){

    selectedProduct =
        allProducts[index];

    if(!selectedProduct) return;


    stockMode = mode;


    const name =
        getProductName(selectedProduct);


    document.getElementById(
        "modalTitle"
    ).textContent =
        mode === "in"
        ? "＋ Stock In"
        : "− Stock Out";


    document.getElementById(
        "modalProduct"
    ).innerHTML = `

        <div style="
            background:#f5f6f8;
            padding:12px;
            border-radius:8px;
        ">

            <strong>
                ${escapeHtml(name)}
            </strong>

            <br>

            Current Stock:
            <strong>
                ${getProductStock(selectedProduct)}
            </strong>

        </div>

    `;


    document.getElementById(
        "stockQuantity"
    ).value = "";


    document.getElementById(
        "stockModal"
    ).style.display = "flex";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "stockModal"
    ).style.display = "none";

    selectedProduct = null;

}


/* =========================================================
   UPDATE SUPABASE STOCK
========================================================= */

async function saveStock(){

    if(!selectedProduct){

        return;

    }


    const quantity =
        Number(
            document.getElementById(
                "stockQuantity"
            ).value
        );


    if(!quantity || quantity <= 0){

        alert(
            "Please enter a valid quantity."
        );

        return;

    }


    const currentStock =
        getProductStock(selectedProduct);


    let newStock;


    if(stockMode === "in"){

        newStock =
            currentStock + quantity;

    }else{

        if(quantity > currentStock){

            alert(
                "Stock Out quantity cannot be greater than current stock."
            );

            return;

        }

        newStock =
            currentStock - quantity;

    }


    const productId =
        getProductId(selectedProduct);


    if(productId == null){

        alert(
            "Product ID not found."
        );

        return;

    }


    /*
      Existing stock column detect.
    */

    let stockColumn = null;


    if(
        Object.prototype.hasOwnProperty.call(
            selectedProduct,
            "stock"
        )
    ){

        stockColumn = "stock";

    }else if(
        Object.prototype.hasOwnProperty.call(
            selectedProduct,
            "stock_quantity"
        )
    ){

        stockColumn = "stock_quantity";

    }else if(
        Object.prototype.hasOwnProperty.call(
            selectedProduct,
            "current_stock"
        )
    ){

        stockColumn = "current_stock";

    }else if(
        Object.prototype.hasOwnProperty.call(
            selectedProduct,
            "quantity"
        )
    ){

        stockColumn = "quantity";

    }else if(
        Object.prototype.hasOwnProperty.call(
            selectedProduct,
            "qty"
        )
    ){

        stockColumn = "qty";

    }


    if(!stockColumn){

        alert(
            "Stock column database vich identify nahi ho reha."
        );

        console.error(
            "Product object:",
            selectedProduct
        );

        return;

    }


    const updateData = {};

    updateData[stockColumn] =
        newStock;


    try{

        const { error } =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .update(updateData)
                .eq("id",productId);


        if(error){

            console.error(error);

            alert(
                "Stock update failed: " +
                error.message
            );

            return;

        }


        selectedProduct[stockColumn] =
            newStock;


        closeModal();

        showToast(
            stockMode === "in"
            ? "Stock added successfully."
            : "Stock removed successfully."
        );


        renderProducts();

    }catch(error){

        console.error(error);

        alert(
            "Stock update failed."
        );

    }

}


/* =========================================================
   SUPABASE REALTIME
========================================================= */

supabaseClient
    .channel("stock-live")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:PRODUCT_TABLE
        },
        function(payload){

            console.log(
                "Stock/Product change:",
                payload
            );

            loadProducts();

        }
    )
    .subscribe();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProducts();

    }
);

</script>

</body>
</html>
