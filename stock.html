<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Warehouse Stock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6f8;
    color:#222;
    font-weight:400;
}

.header{
    background:#111827;
    color:#fff;
    padding:16px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:21px;
    font-weight:400;
}

.header p{
    margin:4px 0 0;
    opacity:.72;
    font-size:12px;
}

.back-btn{
    background:#fff;
    color:#111827;
    text-decoration:none;
    padding:8px 12px;
    border-radius:7px;
    font-size:12px;
}

.container{
    max-width:1100px;
    margin:18px auto;
    padding:0 15px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:14px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.card-title{
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.card-number{
    font-size:24px;
    font-weight:400;
}

.toolbar{
    background:#fff;
    padding:11px;
    border-radius:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.search{
    flex:1;
    min-width:200px;
}

input,
select{
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:12px;
    outline:none;
    font-weight:400;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    font-size:12px;
    font-weight:400;
}

.refresh{
    background:#111827;
    color:#fff;
}

.table-box{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
    font-size:12px;
    font-weight:400;
}

th{
    background:#fafafa;
    color:#666;
    font-size:11px;
}

.product-name{
    font-weight:400;
}

.variant{
    color:#555;
}

.stock{
    font-size:15px;
}

.unit{
    color:#777;
    margin-left:3px;
}

.status{
    display:inline-block;
    padding:4px 8px;
    border-radius:16px;
    font-size:10px;
}

.available{
    background:#dcfce7;
    color:#166534;
}

.low{
    background:#fef3c7;
    color:#92400e;
}

.out{
    background:#fee2e2;
    color:#991b1b;
}

.update{
    background:#111827;
    color:#fff;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:32px;
    color:#777;
}

.error{
    color:#991b1b;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.modal-box{
    background:#fff;
    width:min(410px,92%);
    border-radius:12px;
    padding:20px;
}

.modal-box h2{
    margin:0 0 14px;
    font-size:19px;
    font-weight:400;
}

.modal-box label{
    display:block;
    margin:12px 0 6px;
    font-size:12px;
}

.modal-box input,
.modal-box select{
    width:100%;
}

.product-info{
    background:#f5f6f8;
    padding:10px;
    border-radius:8px;
    font-size:12px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:17px;
}

.modal-actions button{
    flex:1;
}

.save{
    background:#111827;
    color:#fff;
}

.cancel{
    background:#ddd;
    color:#222;
}

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    background:#111827;
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    display:none;
    z-index:10000;
    font-size:12px;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:450px){
    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:12px;
    }

    .card-number{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="header-inner">

        <div>
            <h1>Warehouse Stock</h1>
            <p>Liara Professional™ — Product Variants</p>
        </div>

        <a href="admin.html" class="back-btn">
            ← Admin
        </a>

    </div>
</div>


<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">Products</div>
            <div class="card-number" id="totalProducts">0</div>
        </div>

        <div class="card">
            <div class="card-title">Warehouse Stock</div>
            <div class="card-number" id="totalStock">0</div>
        </div>

        <div class="card">
            <div class="card-title">Low Stock</div>
            <div class="card-number" id="lowStock">0</div>
        </div>

    </div>


    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search product..."
            oninput="renderProducts()"
        >

        <select
            id="unitFilter"
            onchange="renderProducts()"
        >
            <option value="all">All Units</option>
            <option value="pcs">PCS</option>
            <option value="ml">ML</option>
            <option value="ltr">Litre</option>
            <option value="g">Gram</option>
            <option value="kg">KG</option>
        </select>

        <button
            class="refresh"
            onclick="loadProducts()"
        >
            Refresh
        </button>

    </div>


    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th>Size</th>
                    <th>Unit</th>
                    <th>Warehouse</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="stockBody">

                <tr>
                    <td colspan="7" class="loading">
                        Loading warehouse stock...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<div class="modal" id="stockModal">

    <div class="modal-box">

        <h2>Update Warehouse Stock</h2>

        <div
            id="modalProduct"
            class="product-info"
        ></div>


        <label>
            Size
        </label>

        <input
            id="stockSize"
            type="number"
            min="0"
            step="0.01"
            placeholder="Example: 30"
        >


        <label>
            Unit
        </label>

        <select id="stockUnit">

            <option value="pcs">Pieces</option>
            <option value="ml">ML</option>
            <option value="ltr">Litre</option>
            <option value="g">Gram</option>
            <option value="kg">KG</option>

        </select>


        <label>
            Warehouse Quantity
        </label>

        <input
            id="stockQuantity"
            type="number"
            min="0"
            step="1"
            placeholder="Example: 20"
        >


        <div class="modal-actions">

            <button
                class="save"
                onclick="saveWarehouseStock()"
            >
                Save
            </button>

            <button
                class="cancel"
                onclick="closeModal()"
            >
                Cancel
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   TABLE
========================================================= */

const PRODUCT_TABLE = "products";


/* =========================================================
   VARIABLES
========================================================= */

let allProducts = [];

let selectedProduct = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getProductId(product){

    return product.id;

}


function getProductName(product){

    return (
        product.name ||
        product.product_name ||
        "Unnamed Product"
    );

}


function getWarehouseStock(product){

    return Number(
        product.warehouse_stock ?? 0
    ) || 0;

}


function getSize(product){

    return product.size ?? "";

}


function getUnit(product){

    return (
        product.unit ||
        "pcs"
    ).toLowerCase();

}


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.style.display = "block";

    setTimeout(function(){

        toast.style.display = "none";

    },2500);

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

    const body =
        document.getElementById("stockBody");

    body.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                Loading warehouse stock...
            </td>
        </tr>
    `;


    try{

        const result =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .select("*")
                .order("id",{ascending:false});


        if(result.error){

            console.error(result.error);

            body.innerHTML = `
                <tr>
                    <td colspan="7" class="error">
                        ${escapeHtml(
                            result.error.message
                        )}
                    </td>
                </tr>
            `;

            return;

        }


        allProducts =
            result.data || [];


        renderProducts();


    }catch(error){

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="7" class="error">
                    Unable to load products.
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderProducts(){

    const body =
        document.getElementById("stockBody");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const unitFilter =
        document
            .getElementById("unitFilter")
            .value;


    body.innerHTML = "";


    let totalStock = 0;
    let lowStock = 0;
    let shown = 0;


    allProducts.forEach(function(product){

        const stock =
            getWarehouseStock(product);

        const unit =
            getUnit(product);

        const name =
            getProductName(product);


        totalStock += stock;


        if(stock <= 5){
            lowStock++;
        }


        if(
            search &&
            !name
                .toLowerCase()
                .includes(search)
        ){
            return;
        }


        if(
            unitFilter !== "all" &&
            unit !== unitFilter
        ){
            return;
        }


        shown++;


        let status =
            "available";

        let statusText =
            "Available";


        if(stock <= 0){

            status =
                "out";

            statusText =
                "Out of Stock";

        }else if(stock <= 5){

            status =
                "low";

            statusText =
                "Low Stock";

        }


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${shown}
            </td>

            <td>
                <div class="product-name">
                    ${escapeHtml(name)}
                </div>
            </td>

            <td class="variant">
                ${
                    getSize(product) !== ""
                    ? escapeHtml(getSize(product))
                    : "—"
                }
            </td>

            <td>
                ${escapeHtml(unit)}
            </td>

            <td class="stock">

                ${stock}

                <span class="unit">
                    ${escapeHtml(unit)}
                </span>

            </td>

            <td>

                <span
                    class="status ${status}"
                >
                    ${statusText}
                </span>

            </td>

            <td>

                <button
                    class="update"
                    onclick="openStockModal(${product.id})"
                >
                    Update
                </button>

            </td>

        `;


        body.appendChild(row);

    });


    document.getElementById(
        "totalProducts"
    ).textContent =
        allProducts.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        totalStock;


    document.getElementById(
        "lowStock"
    ).textContent =
        lowStock;


    if(shown === 0){

        body.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No products found.
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   OPEN MODAL
========================================================= */

function openStockModal(productId){

    selectedProduct =
        allProducts.find(function(product){

            return String(
                getProductId(product)
            ) === String(productId);

        });


    if(!selectedProduct){
        return;
    }


    document.getElementById(
        "modalProduct"
    ).innerHTML = `

        ${escapeHtml(
            getProductName(
                selectedProduct
            )
        )}

        <br>

        Current Warehouse Stock:
        ${getWarehouseStock(
            selectedProduct
        )}

    `;


    document.getElementById(
        "stockSize"
    ).value =
        getSize(selectedProduct);


    document.getElementById(
        "stockUnit"
    ).value =
        getUnit(selectedProduct);


    document.getElementById(
        "stockQuantity"
    ).value =
        getWarehouseStock(
            selectedProduct
        );


    document.getElementById(
        "stockModal"
    ).style.display =
        "flex";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "stockModal"
    ).style.display =
        "none";

    selectedProduct =
        null;

}


/* =========================================================
   SAVE
========================================================= */

async function saveWarehouseStock(){

    if(!selectedProduct){
        return;
    }


    const size =
        document.getElementById(
            "stockSize"
        ).value;


    const unit =
        document.getElementById(
            "stockUnit"
        ).value;


    const quantity =
        Number(
            document.getElementById(
                "stockQuantity"
            ).value
        );


    if(
        size === "" ||
        Number(size) < 0
    ){

        alert(
            "Please enter a valid size."
        );

        return;

    }


    if(
        !quantity ||
        quantity < 0
    ){

        alert(
            "Please enter a valid warehouse quantity."
        );

        return;

    }


    try{

        const updateResult =
            await supabaseClient
                .from(PRODUCT_TABLE)
                .update({

                    size:
                        Number(size),

                    unit:
                        unit,

                    warehouse_stock:
                        quantity

                })
                .eq(
                    "id",
                    getProductId(
                        selectedProduct
                    )
                );


        if(updateResult.error){

            console.error(
                updateResult.error
            );

            alert(
                "Warehouse update failed: " +
                updateResult.error.message
            );

            return;

        }


        selectedProduct.size =
            Number(size);

        selectedProduct.unit =
            unit;

        selectedProduct.warehouse_stock =
            quantity;


        closeModal();

        renderProducts();

        showToast(
            "Warehouse stock updated."
        );


    }catch(error){

        console.error(error);

        alert(
            "Warehouse update failed."
        );

    }

}


/* =========================================================
   REALTIME
========================================================= */

supabaseClient
    .channel("warehouse-stock-live")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:PRODUCT_TABLE
        },
        function(){

            loadProducts();

        }
    )
    .subscribe();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadProducts();

    }
);

</script>

</body>
</html>
