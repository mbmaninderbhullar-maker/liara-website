function getSettings(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(SETTINGS_KEY)
            );

            JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
            saved || {}
        );

    }catch(error){

        return JSON.parse(
            JSON.stringify(DEFAULT_SETTINGS)
        );

    }

}

function deepMerge(target,source){

    if(!source) return target;

    Object.keys(source).forEach(key=>{

        if(
            source[key] &&
            typeof source[key] === "object" &&
            !Array.isArray(source[key]) &&
            target[key]
        ){

            deepMerge(
                target[key],
                source[key]
            );

        }else{

            target[key] = source[key];

        }

    });

    return target;

}

function saveSettingsObject(settings){

/* =========================================================
   HELPERS
========================================================= */

function money(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");

}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function shortOrderId(id){

    const raw =
        String(id || "")
        .replace(/-/g,"")
        .toUpperCase();

    return "LIARA-" +
        raw.substring(0,8);

}

function productName(order){

    return order.product_name ||
           order.product ||
           order.productName ||
           order.item_name ||
           order.item ||
           "Product";

}

function productPrice(order){

    if(order.price != null){
        return Number(order.price);
    }

    if(order.unit_price != null){
        return Number(order.unit_price);
    }

    const qty =
        Number(order.quantity || 1);

    return qty
        ? Number(order.total || 0) / qty
        : 0;

}

function payment(order){

    return order.payment_status ||
           order.payment_method ||
           order.payment ||
           "Pending";

}

/* =========================================================

async function checkAdmin(){

    const {data,error} =
        await supabaseClient
        .auth
        .getUser();

    if(error || !data || !data.user){

        window.location.href =
            "company-login.html";

        return null;

    }

    if(
        !data.user.email ||
        data.user.email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href =
            "company-login.html";

        return null;

    }

    return data.user;

}

/* =========================================================
   ORDERS
========================================================= */

async function loadOrders(){

    const box =
        document.getElementById("orders");

    box.innerHTML = `
        <div class="message">
            Loading customer orders...
        </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        box.innerHTML = `
            <div class="message error">
                Unable to load orders.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    allOrders = data || [];

    updateOrderSummary(allOrders);
    renderOrders(allOrders);

}

function updateOrderSummary(orders){

    let sales = 0;
    let active = 0;
    let delivered = 0;

    orders.forEach(order=>{

        sales += Number(order.total || 0);

        const status =
            String(
                order.status || "Pending"
            ).toLowerCase();

        if(status === "delivered"){
            delivered++;
        }

        if([
            "pending",
            "confirmed",
            "packed",
            "shipped",
            "order received"
        ].includes(status)){

            active++;

        }

    });

    document.getElementById("totalOrders").innerText =
        orders.length;

    document.getElementById("totalSales").innerText =
        money(sales);

    document.getElementById("pendingOrders").innerText =
        active;

    document.getElementById("deliveredOrders").innerText =
        delivered;

}

/* =========================================================
   ORDER FILTER
========================================================= */

function applyOrderFilters(){

    const search =
        document.getElementById(
            "orderSearch"
        ).value
        .toLowerCase()
        .trim();

    const status =
        document.getElementById(
            "orderStatusFilter"
        ).value
        .toLowerCase();

    const from =
        document.getElementById("orderFrom").value;

    const to =
        document.getElementById("orderTo").value;

    let filtered = [...allOrders];

    filtered = filtered.filter(order=>{

        const text =
            [
                order.customer_name,
                order.name,
                order.phone,
                order.mobile,
                productName(order),
                shortOrderId(order.id)
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

        if(search && !text.includes(search)){
            return false;
        }

        const orderStatus =
            String(
                order.status || "pending"
            ).toLowerCase();

        if(status && orderStatus !== status){
            return false;
        }

        if(from && order.created_at){

            if(
                new Date(order.created_at)
                <
                new Date(from+"T00:00:00")
            ){
                return false;
            }

        }

        if(to && order.created_at){

            if(
                new Date(order.created_at)
                >
                new Date(to+"T23:59:59")
            ){
                return false;
            }

        }

        return true;

    });

    renderOrders(filtered);

}

function clearOrderFilters(){

    document.getElementById("orderSearch").value = "";
    document.getElementById("orderStatusFilter").value = "";
    document.getElementById("orderFrom").value = "";
    document.getElementById("orderTo").value = "";

    renderOrders(allOrders);

}

/* =========================================================
   STATUS
========================================================= */

function statusBadge(status){

    const s =
        String(status || "Pending");

    const lower =
        s.toLowerCase();

    let cls = "badge-gold";

    if(lower === "delivered"){
        cls = "badge-green";
    }
    else if(lower === "cancelled"){
        cls = "badge-red";
    }
    else if(
        lower === "shipped" ||
        lower === "packed"
    ){
        cls = "badge-blue";
    }

    return `
        <span class="badge ${cls}">
            ${escapeHtml(s)}
        </span>
    `;

}

            : "-";

        const customer =
            order.customer_name ||

        const phone =
            order.phone ||
            order.mobile ||

        const qty =
            Number(order.quantity || 1);

        `;

    });

    html += `

    `;

    box.innerHTML = html;

}

function statusOptions(current){

    const statuses = [
        "Pending",
        "Confirmed",
        "Packed",
        "Shipped",
        "Delivered",
        "Cancelled"
    ];

    return statuses.map(status=>`

        <option
            value="${status}"
            ${
                String(current).toLowerCase()
                === status.toLowerCase()
                ? "selected"
                : ""
            }>

            ${status}

        </option>

    `).join("");

}

/* =========================================================
   UPDATE ORDER STATUS
========================================================= */

async function updateOrderStatus(id,status){

    const yes =
        confirm(
            "Change order status to " +
            status +
            "?"
        );

    if(!yes){

        renderOrders(allOrders);

        return;

    }

    const {error} =
        await supabaseClient
        .from("orders")
        .update({
            status:status
        })
        .eq("id",id);

    if(error){

        alert(
            "Status update failed:\n\n" +
            error.message
        );

        return;

    }

    const found =
        allOrders.find(
            order =>
            String(order.id)
            === String(id)
        );

    if(found){
        found.status = status;
    }

    updateOrderSummary(allOrders);
    applyOrderFilters();

    alert(
        "Order status updated successfully."
    );

}

        ).innerHTML = `

        `;

}

function filterSalesByDate(){

    const from =
        document.getElementById("salesFrom").value;

    const to =
        document.getElementById("salesTo").value;

    let filtered = [...allOrders];

    if(from){

        filtered =
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) >=
                new Date(
                    from+"T00:00:00"
                );

            });

    }

    if(to){

        filtered =
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) <=
                new Date(
                    to+"T23:59:59"
                );

            });

    }

    renderSales(filtered);

}

function clearSalesFilter(){

    document.getElementById("salesFrom").value = "";
    document.getElementById("salesTo").value = "";

    renderSales(allOrders);

}

function renderSales(orders){

    let total = 0;
    let delivered = 0;
    let cancelled = 0;

    orders.forEach(order=>{

        const status =
            String(
                order.status || "Pending"
            ).toLowerCase();

        if(status !== "cancelled"){
            total += Number(order.total || 0);
        }

        if(status === "delivered") delivered++;
        if(status === "cancelled") cancelled++;

    });

    document.getElementById("salesTotal").innerText =
        money(total);

    document.getElementById("salesOrders").innerText =
        orders.length;

    document.getElementById("salesDelivered").innerText =
        delivered;

    document.getElementById("salesCancelled").innerText =
        cancelled;

    const box =
        document.getElementById("salesTable");

    if(!orders.length){

        box.innerHTML = `
            <div class="message">
                No sales found.
            </div>
        `;

        return;

    }

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>DATE</th>
        <th>ORDER ID</th>
        <th>CUSTOMER</th>
        <th>PRODUCT</th>
        <th>QTY</th>
        <th>AMOUNT</th>
        <th>PAYMENT</th>
        <th>STATUS</th>
        <th>ACTION</th>
    </tr>
    </thead>
    <tbody>
    `;

    orders.forEach(order=>{

        const date =
            order.created_at
            ? new Date(
                order.created_at
              ).toLocaleDateString("en-IN")
            : "-";

        html += `
        <tr>

            <td>${escapeHtml(date)}</td>

            <td>
                <strong>
                    ${escapeHtml(
                        shortOrderId(order.id)
                    )}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    order.customer_name ||
                    order.name ||
                    "-"
                )}
            </td>

            <td class="product-name">
                ${escapeHtml(productName(order))}
            </td>

            <td>
                ${Number(order.quantity || 1)}
            </td>

            <td class="total">
                ${money(order.total)}
            </td>

            <td>
                <span class="payment-badge">
                    ${escapeHtml(payment(order))}
                </span>
            </td>

            <td>${statusBadge(order.status)}</td>

            <td>
                <button

                    onclick="viewOrder(
                        '${escapeHtml(String(order.id))}'
                    )">
                    View
                </button>
            </td>

        </tr>
        `;

    });

    html += `

    `;

    box.innerHTML = html;

async function getStockTransactions(){
    const ids=(allProducts||[]).map(p=>p.id);
    if(!ids.length)return [];
    const {data,error}=await supabaseClient.from('stock_transactions').select('*').in('product_id',ids).order('created_at',{ascending:false});
    return error?[]:(data||[]);
}

function stockNumbers(product,transactions){
    const rows=transactions.filter(t=>String(t.product_id)===String(product.id));
    const warehouseAdded=rows.filter(t=>t.transaction_type==='purchase').reduce((s,t)=>s+Number(t.quantity||0),0)+Number(product.opening_stock||0);
    const onlineGiven=rows.filter(t=>t.transaction_type==='online_transfer').reduce((s,t)=>s+Number(t.quantity||0),0);
    const onlineSold=rows.filter(t=>t.transaction_type==='sale').reduce((s,t)=>s+Number(t.quantity||0),0);
    const partyGiven=rows.filter(t=>t.transaction_type==='offline_out').reduce((s,t)=>s+Number(t.quantity||0),0);
    const adjustments=rows.filter(t=>t.transaction_type==='adjustment').reduce((s,t)=>s+Number(t.quantity||0),0);
    const hasLocationTransfers=rows.some(t=>t.transaction_type==='online_transfer'||(t.transaction_type==='offline_out'&&t.destination==='party'));
    const legacyWarehouseBase=(product.warehouse_stock!==null && product.warehouse_stock!==undefined) ? Number(product.warehouse_stock||0) : Number(product.stock||0);
    const warehouse=hasLocationTransfers || product.warehouse_stock!==null && product.warehouse_stock!==undefined ? Math.max(0,legacyWarehouseBase) : Math.max(0,Number(product.stock||0));
    const onlineAvailable=Math.max(0,onlineGiven-onlineSold);
    return {warehouse,onlineGiven,onlineSold,onlineAvailable,partyGiven,total:warehouse+onlineAvailable+partyGiven};
}

async function saveParty(){

        document.getElementById("partyNameInput").value.trim();

    const phone =
        document.getElementById("partyPhoneInput").value.trim();

    const address =
        document.getElementById("partyAddressInput").value.trim();

    const note =
        document.getElementById("partyNoteInput").value.trim();

        await supabaseClient
        .from("parties")

async function renderParties(){

    const box =
        document.getElementById("partiesList");

    const {data:parties,error} =
        await supabaseClient
        .from("parties")
        .select("*")
        .order("name",{ascending:true});

    if(error){
        box.innerHTML =
            `<div class="message error">${escapeHtml(error.message)}</div>`;
        return;
    }

    if(!parties || !parties.length){
        box.innerHTML =
            `<div class="message">No parties added yet.</div>`;
        return;
    }

    const {data:tx,error:txError} =
        await supabaseClient
        .from("party_transactions")
        .select("*")
        .order("created_at",{ascending:false});

    if(txError){
        box.innerHTML =
            `<div class="message error">${escapeHtml(txError.message)}</div>`;
        return;
    }

    const transactions = tx || [];

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>PARTY</th>
        <th>MOBILE</th>
        <th>TOTAL BILL</th>
        <th>PAID</th>
        <th>BAKI</th>
        <th>ACTION</th>
    </tr>
    </thead>
    <tbody>
    `;

    parties.forEach(party=>{

        const rows =
            transactions.filter(
                t=>String(t.party_id) === String(party.id)
            );

        const bill =
            rows
            .filter(t=>t.transaction_type==="sale")
            .reduce((sum,t)=>sum + Number(t.amount || 0),0);

        const paid =
            rows
            .filter(t=>t.transaction_type==="payment")
            .reduce((sum,t)=>sum + Number(t.amount || 0),0);

        const balance =
            bill - paid;

        html += `
        <tr>

            <td>
                <strong>${escapeHtml(party.name)}</strong>
            </td>

            <td>${escapeHtml(party.phone || "-")}</td>

            <td>${money(bill)}</td>

            <td>${money(paid)}</td>

            <td class="${balance > 0 ? "stock-low" : "stock-ok"}">
                <strong>${money(balance)}</strong>
            </td>

            <td>
                <button class="table-btn view-btn"
                        onclick="viewParty('${escapeHtml(String(party.id))}')">
                    View
                </button>

                <button class="table-btn edit-btn"
                        onclick="showPartySaleForm('${escapeHtml(String(party.id))}')">
                    📦 Give Stock
                </button>

                <button class="table-btn edit-btn"
                        onclick="addPartyPayment('${escapeHtml(String(party.id))}')">
                    + Payment
                </button>
            </td>

        </tr>
        `;
    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    box.innerHTML = html;
}


async function viewParty(id){

    const {data:party,error:partyError} =
        await supabaseClient
        .from("parties")
        .select("*")
        .eq("id",id)
        .single();

    if(partyError){
        alert(partyError.message);
        return;
    }

    const {data:rows,error} =
        await supabaseClient
        .from("party_transactions")
        .select("*")
        .eq("party_id",id)
        .order("created_at",{ascending:false});

    if(error){
        alert(error.message);
        return;
    }

    const transactions = rows || [];

    const productIds =
        [...new Set(
            transactions
            .filter(t=>t.product_id)
            .map(t=>t.product_id)
        )];

    let products = [];

    if(productIds.length){
        const result =
            await supabaseClient
            .from("products")
            .select("id,name")
            .in("id",productIds);

        if(!result.error) products = result.data || [];
    }

    const productMap =
        Object.fromEntries(
            products.map(p=>[String(p.id),p.name])
        );

    const bill =
        transactions
        .filter(t=>t.transaction_type==="sale")
        .reduce((s,t)=>s+Number(t.amount||0),0);

    const paid =
        transactions
        .filter(t=>t.transaction_type==="payment")
        .reduce((s,t)=>s+Number(t.amount||0),0);

    const balance = bill-paid;

    const pieces =
        transactions
        .filter(t=>t.transaction_type==="sale")
        .reduce((s,t)=>s+Number(t.quantity||0),0);

    let history = transactions.map(t=>{

        const type =
            t.transaction_type==="sale"
            ? "🧾 SALE"
            : t.transaction_type==="payment"
            ? "💵 PAYMENT"
            : "⚙️ ADJUSTMENT";

        const product =
            t.product_id
            ? (productMap[String(t.product_id)] || "Product")
            : "-";

        const qty =
            t.transaction_type==="sale"
            ? Number(t.quantity||0)
            : "-";

        const amount =
            Number(t.amount||0);

        return `
        <tr>
            <td>${escapeHtml(new Date(t.created_at).toLocaleString("en-IN"))}</td>
            <td><strong>${type}</strong></td>
            <td>${escapeHtml(product)}</td>
            <td>${qty}</td>
            <td>₹${amount.toLocaleString("en-IN",{minimumFractionDigits:2})}</td>
            <td>${escapeHtml(t.note || "-")}</td>
        </tr>
        `;

    }).join("");

    document.getElementById("other-content").innerHTML = `

    <div class="admin-box" id="partyPrintArea">

        <div class="admin-header">

            <div>
                <p>PARTY ACCOUNT</p>
                <h2>👤 ${escapeHtml(party.name)}</h2>

                <div style="color:#777;margin-top:5px;">
                    📞 ${escapeHtml(party.phone || "No mobile number")}
                    ${party.address ? " · 📍 "+escapeHtml(party.address) : ""}
                </div>
            </div>

            <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;">

                <button class="btn"
                        onclick="addPartyPayment('${escapeHtml(String(id))}')">
                    💵 Add Payment
                </button>

                <button class="btn"
                        onclick="printPartyAccount()">
                    🖨️ Print Account
                </button>

                <button class="btn"
                        onclick="loadParties()">
                    ← Back
                </button>

            </div>

        </div>

        <div class="stock-cards party-compact-summary">

            <div class="stock-card">
                <span>Total Pieces</span>
                <strong>${pieces}</strong>
            </div>

            <div class="stock-card">
                <span>Total Bill</span>
                <strong>₹${bill.toLocaleString("en-IN",{minimumFractionDigits:2})}</strong>
            </div>

            <div class="stock-card">
                <span>Total Paid / Received</span>
                <strong>₹${paid.toLocaleString("en-IN",{minimumFractionDigits:2})}</strong>
            </div>

            <div class="stock-card">
                <span>Balance Due</span>
                <strong>${balance > 0 ? "₹"+balance.toLocaleString("en-IN",{minimumFractionDigits:2}) : "₹0.00"}</strong>
            </div>

        </div>

        <div style="margin:20px 0;padding:14px;border:1px solid #ddd;border-radius:10px;">
            <strong>Account Summary</strong>
            <div style="margin-top:7px;color:#666;">
                ${balance > 0
                    ? "🔴 Balance due: ₹"+balance.toLocaleString("en-IN",{minimumFractionDigits:2})+" "
                    : "🟢 Account settled — no balance due."}
            </div>
        </div>

        <h3>🧾 Complete Account History</h3>

        <div class="table-wrapper">

        <tr>
            <th>DATE</th>
            <th>TYPE</th>
            <th>PRODUCT</th>
            <th>QTY</th>
            <th>AMOUNT</th>
            <th>NOTE</th>

async function addPartyPayment(id){

    const amountRaw =
        prompt("Payment received: ₹:", "");

    if(amountRaw === null) return;

    const amount = Number(amountRaw);

    if(!Number.isFinite(amount) || amount <= 0){
        alert("Please enter a valid payment amount.");
        return;
    }

    const note =
        prompt("Payment note (optional):","") || null;

    const {error} =
        await supabaseClient
        .from("party_transactions")
        .insert({
            party_id:id,
            transaction_type:"payment",
            quantity:null,
            amount:amount,
            note:note
        });

    if(error){
        alert(
            "Payment could not be saved:\n\n" +
            error.message
        );
        return;
    }

    alert(
        "Payment received: ₹" +
        amount.toLocaleString("en-IN") +
        " successfully."
    );

    await viewParty(id);
}


async function addPartySale(partyId, productId, quantity, amount, note){

    if(!partyId || !productId) return;

    const qty = Number(quantity);
    const total = Number(amount);

    if(!Number.isInteger(qty) || qty <= 0){
        alert("Valid quantity pao.");
        return;
    }

    if(!Number.isFinite(total) || total < 0){
        alert("Valid sale amount pao.");
        return;
    }

    const {error} =
        await supabaseClient
        .from("party_transactions")
        .insert({
            party_id:partyId,
            product_id:productId,
            transaction_type:"sale",
            quantity:qty,
            amount:total,
            note:note || null
        });

    if(error){
        alert("Party sale save failed:\n\n" + error.message);
        return;
    }

    alert("Party sale added.");
    viewParty(partyId);
}

        prompt(

function previewEditPhoto(event){

    const files = [...(event.target.files || [])];
    if(files.length > 4){
        alert("Maximum 4 photos upload karo.");
        event.target.value = "";
        return;
    }

    const preview = document.getElementById("editPhotoPreview");
    if(!preview) return;

    preview.innerHTML = files.map((file,i)=>`
        <img src="${URL.createObjectURL(file)}" alt="New Product Photo ${i+1}" style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid #ddd;">
    `).join("");
}

async function uploadAdditionalProductPhotos(files){
    const urls = [];
    for(const file of [...files].slice(0,4)){
        const extension = file.name.split(".").pop().toLowerCase();
        const filePath = "products/" + Date.now() + "-" + Math.random().toString(36).substring(2) + "." + extension;
        const upload = await supabaseClient.storage.from(IMAGE_BUCKET).upload(filePath,file,{cacheControl:"3600",upsert:false});
        if(upload.error) throw new Error(upload.error.message);
        urls.push(supabaseClient.storage.from(IMAGE_BUCKET).getPublicUrl(filePath).data.publicUrl);
    }
    return urls;
}

async function saveEditedProduct(id){

    const name = document.getElementById("editProductNameInput").value.trim();
    const price = Number(document.getElementById("editProductPriceInput").value);
    const stock = Number(document.getElementById("editProductStockInput").value || 0);
    const lowStock = Number(document.getElementById("editProductLowStockInput").value || 5);
    const description = document.getElementById("editProductDescriptionInput").value.trim();
    const keyIngredients = document.getElementById("editProductKeyIngredientsInput").value.trim();
    const howToUse = document.getElementById("editProductHowToUseInput").value.trim();
    const benefits = document.getElementById("editProductBenefitsInput").value.trim();
    const files = document.getElementById("editProductPhotoInput").files;
    const file = files[0];
    const status = document.getElementById("editUploadStatus");

    if(!name){
        alert("Product name pao.");
        return;
    }

    if(!Number.isFinite(price) || price < 0){
        alert("Valid price pao.");
        return;
    }

    if(!Number.isInteger(stock) || stock < 0){
        alert("Valid stock quantity pao.");
        return;
    }

    if(!Number.isInteger(lowStock) || lowStock < 0){
        alert("Valid low stock value pao.");
        return;
    }

    const user = await checkAdmin();
    if(!user) return;

    const oldProduct = allProducts.find(
        p => String(p.id) === String(id)
    );

    if(!oldProduct){
        alert("Product not found.");
        return;
    }

    const variants = collectProductVariants();
    if(variants === null) return;

    try{

        let imageUrl = oldProduct.image_url || null;

        if(file){

            status.innerText = "Uploading new photo...";

            const extension =
                file.name.split(".").pop().toLowerCase();

            const fileName =
                Date.now() +
                "-" +
                Math.random().toString(36).substring(2) +
                "." + extension;

            const filePath = "products/" + fileName;

            const upload =
                await supabaseClient
                .storage
                .from(IMAGE_BUCKET)
                .upload(filePath, file, {
                    cacheControl:"3600",
                    upsert:false
                });

            if(upload.error){
                alert("Photo upload failed:\n\n" + upload.error.message);
                return;
            }

            imageUrl =
                supabaseClient
                .storage
                .from(IMAGE_BUCKET)
                .getPublicUrl(filePath)
                .data.publicUrl;
        }

        if(files.length > 4){
            alert("Maximum 4 photos upload karo.");
            return;
        }

        const extraPhotoUrls = files.length > 1
            ? await uploadAdditionalProductPhotos(files.slice(1))
            : [];

        status.innerText = "Saving changes...";

        const updateData = {
            name:name,
            price:price,
            stock:stock,
            low_stock:lowStock,
            description:description,
            key_ingredients:keyIngredients,
            how_to_use:howToUse,
            benefits:benefits,
            image_url:imageUrl,
            image_url_2:extraPhotoUrls[0] || oldProduct.image_url_2 || null,
            image_url_3:extraPhotoUrls[1] || oldProduct.image_url_3 || null,
            image_url_4:extraPhotoUrls[2] || oldProduct.image_url_4 || null,
            variants:variants
        };

        const {error} =
            await supabaseClient
            .from("products")
            .update(updateData)
            .eq("id",id);

        if(error){
            alert("Product update failed:\n\n" + error.message);
            return;
        }

        alert("Product updated successfully.");
        loadProducts();

    }catch(error){

function renderProductVariants(variants){
    const list = document.getElementById("variantList");
    if(!list) return;
    let data = variants;
    if(typeof data === "string"){
        try{ data = JSON.parse(data); }catch(e){ data = []; }
    }
    if(!Array.isArray(data)) data = [];
    list.innerHTML = "";
    if(data.length){
        data.forEach(v => addVariantRow(v));
    }else{
        addVariantRow();
    }
}

function addVariantRow(variant){
    const list = document.getElementById("variantList");
    if(!list) return;
    variant = variant || {};
    const row = document.createElement("div");
    row.className = "variant-row";
    row.innerHTML = `
        <div class="variant-field">
            <label>SIZE / ML</label>
            <input type="number" min="0" step="any" class="variant-size" value="${escapeHtml(String(variant.size ?? ""))}" placeholder="e.g. 100">
        </div>
        <div class="variant-field">
            <label>UNIT</label>
            <select class="variant-unit">
                <option value="ML">ML</option>
                <option value="G">G</option>
                <option value="L">L</option>
                <option value="KG">KG</option>
            </select>
        </div>
        <div class="variant-field">
            <label>PRICE (₹)</label>
            <input type="number" min="0" step="0.01" class="variant-price" value="${escapeHtml(String(variant.price ?? ""))}" placeholder="e.g. 499">
        </div>
        <div class="variant-field">
            <label>STOCK</label>
            <input type="number" min="0" step="1" class="variant-stock" value="${escapeHtml(String(variant.stock ?? ""))}" placeholder="e.g. 20">
        </div>
        <button type="button" class="variant-remove" onclick="this.closest('.variant-row').remove()">✕ Remove</button>
    `;
    list.appendChild(row);
    const unit = row.querySelector(".variant-unit");
    if(variant.unit) unit.value = String(variant.unit).toUpperCase();
}

function collectProductVariants(){
    const list = document.getElementById("variantList");
    if(!list) return [];
    const rows = [...list.querySelectorAll(".variant-row")];
    const variants = [];
    for(const row of rows){
        const sizeEl = row.querySelector(".variant-size");
        const unitEl = row.querySelector(".variant-unit");
        const priceEl = row.querySelector(".variant-price");
        const stockEl = row.querySelector(".variant-stock");
        const sizeText = (sizeEl?.value || "").trim();
        const priceText = (priceEl?.value || "").trim();
        const stockText = (stockEl?.value || "").trim();
        if(!sizeText && !priceText && !stockText) continue;
        const size = Number(sizeText);
        const price = Number(priceText);
        const stock = stockText === "" ? 0 : Number(stockText);
        if(!Number.isFinite(size) || size <= 0){ alert("Har Size / ML valid pao."); return null; }
        if(!Number.isFinite(price) || price < 0){ alert("Har Size da valid price pao."); return null; }
        if(!Number.isInteger(stock) || stock < 0){ alert("Har Size da valid stock pao."); return null; }
        variants.push({size:size,unit:(unitEl?.value || "ML").toUpperCase(),price:price,stock:stock});
    }
    return variants;
}

async function saveProduct(){

    const name =
        document.getElementById(
            "productNameInput"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "productPriceInput"
            ).value
        );

    const stock =
        Number(
            document.getElementById(
                "productStockInput"
            ).value || 0
        );

    const lowStock =
        Number(
            document.getElementById(
                "productLowStockInput"
            ).value || 5
        );

    const description =
        document.getElementById(
            "productDescriptionInput"
        ).value.trim();

    const keyIngredients =
        document.getElementById(
            "productKeyIngredientsInput"
        ).value.trim();

    const howToUse =
        document.getElementById(
            "productHowToUseInput"
        ).value.trim();

    const benefits =
        document.getElementById(
            "productBenefitsInput"
        ).value.trim();

    const files =
        document.getElementById(
            "productPhotoInput"
        ).files;

    if(files.length > 4){
        alert("Maximum 4 photos upload karo.");
        return;
    }

    const file = files[0];

    const status =
        document.getElementById(
            "uploadStatus"
        );

    if(!name){

        alert("Product name pao.");
        return;

    }

    if(price < 0){

        alert("Valid price pao.");
        return;

    }

    if(!file){

        alert("Product photo upload karo.");
        return;

    }

    const user =
        await checkAdmin();

    if(!user) return;

    status.innerText =
        "Uploading photo...";

    try{

        const extension =
            file.name
            .split(".")
            .pop()
            .toLowerCase();

        const fileName =
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            extension;

        const filePath =
            "products/" +
            fileName;

        const upload =
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );

        if(upload.error){

            alert(
                "Photo upload failed:\n\n" +
                upload.error.message
            );

            return;

        }

        status.innerText =
            "Saving product...";

        const publicData =
            supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .getPublicUrl(filePath);

        const imageUrl =
            publicData.data.publicUrl;

        const extraPhotoUrls = files.length > 1
            ? await uploadAdditionalProductPhotos(files.slice(1))
            : [];

        const insert =
            await supabaseClient
            .from("products")
            .insert({

                name:name,
                price:price,
                stock:stock,
                low_stock:lowStock,
                description:description,
                key_ingredients:keyIngredients,
                how_to_use:howToUse,
                benefits:benefits,
                image_url:imageUrl,
                image_url_2:extraPhotoUrls[0] || null,
                image_url_3:extraPhotoUrls[1] || null,
                image_url_4:extraPhotoUrls[2] || null

            });

        if(insert.error){

            alert(
                "Product save failed:\n\n" +
                insert.error.message
            );

            return;

        }

        alert(
            "Product successfully add ho gaya."
        );

        clearProductForm();

    }
    catch(error){

        alert(
            "Something went wrong:\n\n" +
            error.message
        );

    }

}

function clearProductForm(){

    [
        "productNameInput",
        "productPriceInput",
        "productDescriptionInput"
    ].forEach(id=>{

        const el =
            document.getElementById(id);

        if(el) el.value = "";

    });

    const stock =
        document.getElementById(
            "productStockInput"
        );

    if(stock) stock.value = "0";

    const low =
        document.getElementById(
            "productLowStockInput"
        );

    if(low) low.value = "5";

    const photo =
        document.getElementById(
            "productPhotoInput"
        );

    if(photo) photo.value = "";

    const preview =
        document.getElementById(
            "photoPreview"
        );

    if(preview)
        preview.style.display = "none";

    const status =
        document.getElementById(
            "uploadStatus"
        );

    if(status)
        status.innerText = "";

}

/* =========================================================
   SETTINGS UI HELPERS
========================================================= */

function toggle(id,checked){

    return `
    <label class="switch">

        <input
            type="checkbox"
            id="${id}"
            ${checked ? "checked" : ""}>

        <span class="slider"></span>

    </label>
    `;

}

function notificationToggle(
    id,
    checked,
    title,
    description
){

    return `
    <div class="switch-row">

        <div class="switch-info">

            <strong>${escapeHtml(title)}</strong>

            <small>
                ${escapeHtml(description)}
            </small>

        </div>

        ${toggle(id,checked)}

    </div>
    `;

}

function optionList(options,current){

    return options.map(option=>`

        <option
            value="${escapeHtml(option)}"
            ${
                String(current).toLowerCase()
                === String(option).toLowerCase()
                ? "selected"
                : ""
            }>

            ${escapeHtml(option)}

        </option>

    `).join("");

}

function openSettingsTab(tab, button){
    const root = document.getElementById("other-content");
    if(!root) return;

    root.querySelectorAll(".settings-panel").forEach(function(panel){
        panel.classList.remove("active");
        panel.style.display = "none";
    });

    root.querySelectorAll(".settings-nav button").forEach(function(btn){
        btn.classList.remove("active");
    });

    const panel = root.querySelector("#settings-" + tab);
    if(!panel) return;

    panel.classList.add("active");
    panel.style.display = "block";
    panel.style.visibility = "visible";
    panel.style.opacity = "1";

    if(button) button.classList.add("active");

    if(tab === "staff" && typeof loadStaffAccounts === "function"){
        try { loadStaffAccounts(); } catch(e) { console.error(e); }
    }
}

        getSettings();

            name:getValue("setProfileName",old.profile.name),
            phone:getValue("setProfilePhone",old.profile.phone),
            role:getValue("setProfileRole",old.profile.role)
        },

        company:{
            name:getValue("setCompanyName",old.company.name),
            brand:getValue("setCompanyBrand",old.company.brand),
            gst:getValue("setCompanyGST",old.company.gst),
            email:getValue("setCompanyEmail",old.company.email),

/* =========================================================
   STAFF MANAGEMENT
========================================================= */

function staffStatus(message, ok=false){
    const el=document.getElementById("staffCreateStatus");
    if(!el) return;
    el.style.display="block";
    el.style.background=ok ? "#e8f3e9" : "#f7dddd";
    el.style.color=ok ? "#287a3e" : "#a33";
    el.textContent=message;
}

async function createStaffLogin(){
    const name=document.getElementById("staffName")?.value.trim();
    const email=document.getElementById("staffEmail")?.value.trim().toLowerCase();
    const password=document.getElementById("staffPassword")?.value || "";
    const role=document.getElementById("staffRole")?.value || "Staff";

    if(!name || !email || !password){ staffStatus("Name, email and password are required."); return; }
    if(password.length < 8){ staffStatus("Password must be at least 8 characters."); return; }

    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){ staffStatus("Your admin session has expired. Please sign in again."); return; }

    staffStatus("Creating staff login...", true);
    const {data,error}=await supabaseClient.functions.invoke("create-staff",{
        body:{name,email,password,role,phone:"",permissions:collectPermissions()}
    });

    if(error){
        staffStatus(data?.error || error.message || "Unable to create staff login.");
        return;
    }
    if(data?.error){ staffStatus(data.error); return; }

    document.getElementById("staffName").value="";
    document.getElementById("staffEmail").value="";
    document.getElementById("staffPassword").value="";
    staffStatus("Staff login created successfully.", true);
    await loadStaffAccounts();
}

async function loadStaffAccounts(){
    const box=document.getElementById("staffAccountsList");
    if(!box) return;
    box.innerHTML='<div class="message">Loading staff accounts...</div>';

    const {data,error}=await supabaseClient
        .from("staff_profiles")
        .select("id,name,email,role,active,created_at")
        .order("created_at",{ascending:false});

    if(error){
        box.innerHTML='<div class="message error">Unable to load staff accounts: '+escapeHtml(error.message)+'</div>';
        return;
    }
    if(!data?.length){
        box.innerHTML='<div class="message">No staff accounts created yet.</div>';
        return;
    }

    box.innerHTML=`<div class="table-wrapper"><table class="data-table" style="min-width:700px">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Action</th></tr></thead>
        <tbody>${data.map(s=>`<tr>
            <td><strong>${escapeHtml(s.name || "")}</strong></td>
            <td>${escapeHtml(s.email || "")}</td>
            <td>${escapeHtml(s.role || "Staff")}</td>
            <td><span class="badge ${s.active===false?'badge-red':'badge-green'}">${s.active===false?'Inactive':'Active'}</span></td>
            <td>${s.created_at ? new Date(s.created_at).toLocaleDateString() : '—'}</td>
            <td><button class="table-btn edit-btn" type="button" onclick="changeStaffPassword('${String(s.email||'').replace(/'/g,"\\'")}')">Change Password</button></td>
        </tr>`).join('')}</tbody></table></div>`;
}

async function changeStaffPassword(email){
    const password=prompt("New password for " + email + " (minimum 8 characters):");
    if(password===null) return;
    if(password.length < 8){ alert("Password must be at least 8 characters."); return; }

    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){ alert("Your admin session has expired. Please sign in again."); return; }

    const {data,error}=await supabaseClient.functions.invoke("reset-staff-password",{
        body:{email,password}
    });

    if(error){
        alert(data?.error || error.message || "Unable to change staff password.");
        return;
    }
    if(data?.error){ alert(data.error); return; }
    alert("Staff password changed successfully.");
}

========================================================= */

async function changeAdminPassword(){

    const password =
        document.getElementById(
            "newAdminPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmAdminPassword"
        ).value;

    if(password.length < 6){

        alert(
            "Password minimum 6 characters da hona chahida."
        );

        return;

    }

    if(password !== confirmPassword){

        alert(
            "Passwords match nahi karde."
        );

        return;

    }

    const user =
        await checkAdmin();

    if(!user) return;

    const {error} =
        await supabaseClient
        .auth
        .updateUser({
            password:password
        });

    if(error){

        alert(
            "Password change failed:\n\n" +
            error.message
        );

        return;

    }

    document.getElementById(
        "newAdminPassword"
    ).value = "";

    document.getElementById(
        "confirmAdminPassword"
    ).value = "";

    alert(
        "Password successfully change ho gaya."
    );

}

async function logoutAllSessions(){

/* =========================================================
   SYSTEM STATUS
========================================================= */

async function checkSystemStatus(){

    const status =
        document.getElementById(
            "supabaseStatus"
        );

    const dot =
        document.getElementById(
            "supabaseDot"
        );

    if(!status) return;

    status.innerText =
        "Checking connection...";

    if(dot){
        dot.classList.remove(
            "offline",
            "warning"
        );
    }

    try{

        const {data,error} =
            await supabaseClient
            .auth
            .getUser();

        if(error){

            status.innerText =
                "Connection available, but admin session check returned an error.";

            if(dot)
                dot.classList.add("warning");

            return;

        }

        if(data && data.user){

            status.innerText =
                "Connected • Admin session active.";

        }
        else{

            status.innerText =
                "Supabase connected • No active session.";

        }

    }
    catch(error){

        status.innerText =
            "Unable to connect.";

        if(dot)
            dot.classList.add("offline");

    }

}



const PERMISSION_MODULES = [
  ["dashboard","Dashboard"],
  ["orders","Orders"],
  ["stock","Stock / Inventory"],
  ["parties","Parties / Offline Accounts"],
  ["sales","Sales & GST"],
  ["products","Products"],
  ["customers","Customers"],
  ["delivery","Delivery / Shiprocket"],
  ["reports","Reports"],
  ["invoice","Invoice / Print"],
  ["website","Website"],
  ["settings","Settings"],
  ["staff","Staff Management"],
  ["company","Company"]
];

const PERMISSION_ACTIONS = ["view","add","edit","delete","approve","export"];

const ROLE_PERMISSION_PRESETS = {
  "Super Admin":"all",
  "Admin":"all",
  "Manager":["dashboard","orders","stock","parties","sales","products","customers","delivery","reports","invoice","company"],
  "Sales Manager":["dashboard","orders","sales","customers","invoice","reports"],
  "Sales Staff":["dashboard","orders","sales","customers","invoice"],
  "Order Manager":["dashboard","orders","customers","delivery","invoice"],
  "Order Staff":["dashboard","orders","customers","delivery"],
  "Accounts Manager":["dashboard","sales","invoice","reports","company"],
  "Accounts Staff":["dashboard","sales","invoice","reports"],
  "Inventory Manager":["dashboard","stock","products","purchase","reports"],
  "Inventory Staff":["dashboard","stock","products"],
  "Customer Manager":["dashboard","customers","orders","reports"],
  "Customer Support":["dashboard","customers","orders"],
  "Delivery Manager":["dashboard","delivery","orders","reports"],
  "Delivery Staff":["dashboard","delivery","orders"],
  "Purchase Manager":["dashboard","stock","products","reports"],
  "Purchase Staff":["dashboard","stock","products"],
  "Report Manager":["dashboard","reports","sales","orders","stock"],
  "Viewer":"viewOnly",
  "Custom Role":[]
};

function renderPermissionMatrix(){
    const body=document.getElementById("permissionMatrixBody");
    if(!body) return;

    body.innerHTML=PERMISSION_MODULES.map(([key,label])=>`
        <tr>
            <td>
                <div class="permission-module">${escapeHtml(label)}</div>
                <small>${escapeHtml(key)}</small>
            </td>
            ${PERMISSION_ACTIONS.map(action=>`
                <td>
                    <input class="permission-check"
                           type="checkbox"
                           data-module="${escapeHtml(key)}"
                           data-action="${escapeHtml(action)}"
                           aria-label="${escapeHtml(label)} ${escapeHtml(action)}">
                </td>
            `).join("")}
        </tr>
    `).join("");

    applyRolePermissions();
}

function setAllPermissions(value){
    document.querySelectorAll(".permission-check").forEach(x=>x.checked=!!value);
}

function applyRolePermissions(){
    const role=document.getElementById("staffRole")?.value || "Custom Role";
    setAllPermissions(false);

    const preset=ROLE_PERMISSION_PRESETS[role];

    document.querySelectorAll(".permission-check").forEach(cb=>{
        const module=cb.dataset.module;
        const action=cb.dataset.action;

        if(preset==="all"){
            cb.checked=true;
            return;
        }

        if(preset==="viewOnly"){
            cb.checked=(action==="view");
            return;
        }

        if(Array.isArray(preset) && preset.includes(module)){
            cb.checked = (
                action==="view" ||
                action==="add" ||
                action==="edit"
            );

            // Higher-risk actions stay off by default.
            if(["delete","approve"].includes(action)) cb.checked=false;
            if(action==="export" && ["reports","sales","invoice","orders","stock"].includes(module)) cb.checked=true;
        }
    });
}

function collectPermissions(){
    const permissions={};
    PERMISSION_MODULES.forEach(([module])=>{
        permissions[module]={};
        PERMISSION_ACTIONS.forEach(action=>{
            const cb=document.querySelector(`.permission-check[data-module="${module}"][data-action="${action}"]`);
            permissions[module][action]=!!cb?.checked;
        });
    });
    return permissions;
}

document.addEventListener("change",function(e){
    if(e.target && e.target.id==="staffRole") applyRolePermissions();
});

document.addEventListener("DOMContentLoaded",function(){
    renderPermissionMatrix();
});


document.addEventListener("DOMContentLoaded",function(){
    loadSettings();
    setTimeout(renderPermissionMatrix,50);
});
