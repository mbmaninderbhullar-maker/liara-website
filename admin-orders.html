        .order-table td {
            padding: 14px;

            text-align: left;
        }

        .order-table th {
            background: #f7f1e7;
        }

        .status {
            color: #ad8232;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>LIARA</span>

        <small>PROFESSIONAL™</small>

    </a>

</header>



<section class="admin-section">

    <div class="admin-container">

        <div class="admin-box">


            <div class="admin-header">

                <div>

                <button
                    class="logout-btn"
                    onclick="logoutAdmin()">

                    Logout

                </button>

            </div>


            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh Orders

            </button>

                <div class="message">

                    Checking Supabase connection...

                </div>

            </div>


        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        <small>

        </small>

        All Rights Reserved.

    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_y_K_Jn5Gu";


/* Check that Supabase library loaded */


if (!window.supabase) {

    document.getElementById("orders").innerHTML = `

        <div class="message error">

            Supabase library did not load.

        </div>

    `;

    throw new Error(
        "Supabase library did not load"
    );

}


/* Create client */


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";



/* =========================================
   LOAD ORDERS
========================================= */


async function loadOrders() {


    const box =
        document.getElementById("orders");


    box.innerHTML = `

        <div class="message">

            Connecting to Supabase...

        </div>

    `;


    try {


        /* GET LOGGED-IN USER */


        const {
            data: userData,
            error: userError
        } =
        await supabaseClient
            .auth
            .getUser();


        if (userError) {

            console.error(
                "AUTH ERROR:",
                userError
            );

            box.innerHTML = `

                <div class="message error">

                    ${userError.message}

                </div>

            `;

            return;

        }


        const user =
            userData.user;


        if (!user) {

            box.innerHTML = `

                <div class="message error">

                    You are not logged in.

                    <br><br>

                    <a href="company-login.html">

                        Go to Company Login

                    </a>

                </div>

            `;

            return;

        }


        /* CHECK COMPANY EMAIL */


        if (
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {

            box.innerHTML = `

                <div class="message error">

                    Access denied.

                    <br><br>

                    Logged in account:

                    ${user.email}

                </div>

            `;

            return;

        }


        /* LOAD ORDERS */


        box.innerHTML = `

            <div class="message">

                Loading customer orders...

            </div>

        `;


        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "ORDERS ERROR:",
                error
            );

            box.innerHTML = `

                <div class="message error">

                    Unable to load orders.

                    <br><br>

                    ${error.message}

                </div>

            `;

            return;

        }


        /* NO ORDERS */


        if (
            !data ||
            data.length === 0
        ) {

            box.innerHTML = `

                <div class="message success">

                    No customer orders yet.

                </div>

            `;

            return;

        }


        /* CREATE TABLE */


        let html = `

            <table class="order-table">

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Mobile</th>

                        <th>Address</th>

                        <th>Quantity</th>

                        <th>Total</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

        `;


        data.forEach(
            function(order) {


                html += `

                    <tr>

                        <td>
                            ${order.id || "-"}
                        </td>

                        <td>
                            ${order.customer_name || "-"}
                        </td>

                        <td>
                            ${order.phone || "-"}
                        </td>

                        <td>
                            ${order.address || "-"}
                        </td>

                        <td>
                            ${order.quantity || 0}
                        </td>

                        <td>
                            ₹${order.total || 0}
                        </td>

                        <td class="status">
                            ${order.status || "Order Received"}
                        </td>

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        box.innerHTML =
            html;


    }

    catch (error) {


        console.error(
            "GENERAL ERROR:",
            error
        );


        box.innerHTML = `

            <div class="message error">

                ${error.message}

            </div>

        `;

    }

}



/* =========================================
   LOGOUT
========================================= */


async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "company-login.html";

}



/* =========================================
   START
========================================= */


loadOrders();


</script>


</body>

</html>
