<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Customer Orders</title>

    <style>

        .admin-section {
            padding: 70px 5%;
            background: #faf8f5;

        }

        .admin-container {
            max-width: 1250px;

        }

        .refresh-btn {
            border: none;

        .error {
            color: #a33;
        }

        .success {
            color: green;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .order-table th,
        .order-table td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        .order-table th {
            background: #f7f1e7;
        }

        .status {
            color: #ad8232;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .admin-section {
                padding: 40px 4%;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>
            LIARA
        </span>

        <small>
            PROFESSIONAL™
        </small>

    </a>

</header>



<section class="admin-section">

    <div class="admin-container">

        <div class="admin-box">


            <div class="admin-header">

                <div>

                    <p>
                        LIARA PROFESSIONAL™
                    </p>

                    <h2>

                    </h2>

                </div>


                <button
                    class="logout-btn"
                    onclick="logoutAdmin()">

                    Logout

                </button>

            </div>



            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh Orders

            </button>



            <div id="orders">

                <div class="message">
                    Loading orders...
                </div>

            </div>


        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        <small>

        </small>

    </div>

        All Rights Reserved.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";



/* =========================================
   LOAD CUSTOMER ORDERS
========================================= */


async function loadOrders() {


    const box =
        document.getElementById(
            "orders"
        );


    box.innerHTML = `

        <div class="message">
            Checking company login...
        </div>

    `;


    try {


        /* GET CURRENT USER */


        const {
            data: userData,
            error: userError
        } =
        await supabaseClient
            .auth
            .getUser();


        if (userError) {


            console.error(
                "LOGIN ERROR:",
                userError
            );


            box.innerHTML = `

                <div class="message error">

                    ${userError.message}

                </div>

            `;


            return;

        }


        const user =
            userData.user;


        if (!user) {


            window.location.href =
                "company-login.html";


            return;

        }


        /* CHECK COMPANY ACCOUNT */


        if (
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ) {


            box.innerHTML = `

                <div class="message error">

                    Access denied.

                    <br><br>

                    Logged in account:
                    ${user.email}

                </div>

            `;


            return;

        }


        box.innerHTML = `

            <div class="message">
                Loading customer orders...
            </div>

        `;


        /* GET ORDERS */


        const {
            data: orders,
            error: ordersError
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (ordersError) {


            console.error(
                "ORDERS ERROR:",
                ordersError
            );


            box.innerHTML = `

                <div class="message error">

                    Unable to load orders.

                    <br><br>

                    ${ordersError.message}

                </div>

            `;


            return;

        }


        /* NO ORDERS */


        if (
            !orders ||
            orders.length === 0
        ) {


            box.innerHTML = `

                <div class="message success">

                    No customer orders yet.

                </div>

            `;


            return;

        }


        /* BUILD TABLE */


        let html = `

            <table class="order-table">

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Address
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>

                <tbody>

        `;


        orders.forEach(
            function(order) {


                html += `

                    <tr>

                        <td>
                            ${order.id || "-"}
                        </td>

                        <td>
                            ${order.customer_name || "-"}
                        </td>

                        <td>
                            ${order.phone || "-"}
                        </td>

                        <td>
                            ${order.address || "-"}
                        </td>

                        <td>
                            ${order.quantity || 0}
                        </td>

                        <td>
                            ₹${order.total || 0}
                        </td>

                        <td class="status">
                            ${order.status || "Order Received"}
                        </td>

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        box.innerHTML =
            html;


    } catch (error) {


        console.error(
            "GENERAL ERROR:",
            error
        );


        box.innerHTML = `

            <div class="message error">

                ${error.message}

            </div>

        `;

    }

}



/* =========================================
   LOGOUT
========================================= */


async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "company-login.html";

}



/* =========================================
   START
========================================= */


loadOrders();


</script>


</body>

</html>
