<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Customer Orders</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .admin-section {
            padding: 70px 5%;
            background: #faf8f5;
            min-height: 75vh;
        }

        .admin-container {
            max-width: 1400px;
            margin: auto;
        }

        .admin-box {

            overflow-x: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-header p {
            margin: 0 0 5px;
            color: #ad8232;
            font-weight: bold;
        }

        .admin-header h2 {
            margin: 0;
        }

        .logout-btn,
        .refresh-btn,
        .save-btn {
            border: none;
            background: #ad8232;

            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn {
            padding: 12px 20px;
        }

        .refresh-btn {
            margin-bottom: 20px;
        }

        .save-btn {
            background: #287a3e;
        }

        .save-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1250px;
        }

        .order-table th,
        .order-table td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        .order-table th {
            background: #f7f1e7;
            font-weight: bold;
        }

        .order-id {

        .date-time {

        .status-select {

            border-radius: 7px;
            min-width: 160px;
            background: white;
        }

        .tracking-input {
            padding: 9px 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            width: 170px;
            box-sizing: border-box;
        }

        .message {
            text-align: center;
            padding: 45px 20px;
            font-weight: bold;
        }

        .error {
            color: #a33;
        }

        .saving {
            opacity: .6;
        }

        @media (max-width: 700px) {

            .admin-section {
                padding: 40px 4%;
            }

            .admin-header {
                flex-direction: column;
                align-items: flex-start;

                width: 100%;

        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>
            LIARA
        </span>

        <small>
            PROFESSIONAL™
        </small>

    </a>

</header>



<section class="admin-section">


    <div class="admin-container">


        <div class="admin-box">


            <div class="admin-header">


                <div>

                    <p>
                        LIARA PROFESSIONAL™
                    </p>

                    <h2>
                        Customer Orders
                    </h2>

                </div>


                <button
                    class="logout-btn"
                    onclick="logoutAdmin()">

                    Logout

                </button>


            </div>



            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh Orders

            </button>



            <div id="orders">

                <div class="message">
                    Loading orders...
                </div>

            </div>


        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";



/* =========================================
   CHECK COMPANY LOGIN
========================================= */


async function checkAdmin() {


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "company-login.html";

        return null;

    }


    const user =
        data.user;


    if (
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        window.location.href =
            "company-login.html";

        return null;

    }


    return user;

}



/* =========================================
   LOAD ORDERS
========================================= */


async function loadOrders() {


    const box =
        document.getElementById(
            "orders"
        );


    box.innerHTML = `

        <div class="message">
            Loading customer orders...
        </div>

    `;


    const user =
        await checkAdmin();


    if (!user) {

        return;

    }


    try {


        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {


            console.error(
                "Orders Error:",
                error
            );


            box.innerHTML = `

                <div class="message error">

                    Unable to load orders.

                    <br><br>

                    ${error.message}

                </div>

            `;


            return;

        }


        if (
            !data ||
            data.length === 0
        ) {


            box.innerHTML = `

                <div class="message">

                    No customer orders yet.

                </div>

            `;


            return;

        }


        let html = `

            <table class="order-table">

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Order Date
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Address
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Tracking ID
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody>

        `;


        data.forEach(
            function(order) {


                /*
                   DATE
                   Try created_at first.
                   If unavailable, show "-"
                */


                let orderDate = "-";


                if (order.created_at) {

                    orderDate =
                        new Date(
                            order.created_at
                        ).toLocaleString(
                            "en-IN",
                            {
                                dateStyle:
                                    "medium",
                                timeStyle:
                                    "short"
                            }
                        );

                }


                html += `

                    <tr>

                        <td class="order-id">

                            ${order.id || "-"}

                        </td>


                        <td class="date-time">

                            ${orderDate}

                        </td>


                        <td>

                            ${order.customer_name || "-"}

                        </td>


                        <td>

                            ${order.phone || "-"}

                        </td>


                        <td>

                            ${order.address || "-"}

                        </td>


                        <td>

                            ${order.quantity || 0}

                        </td>


                        <td>

                            ₹${order.total || 0}

                        </td>


                        <td>

                            <select
                                class="status-select"
                                id="status-${order.id}">

                                <option value="Order Received"
                                    ${order.status === "Order Received" ? "selected" : ""}>
                                    Order Received
                                </option>

                                <option value="Confirmed"
                                    ${order.status === "Confirmed" ? "selected" : ""}>
                                    Confirmed
                                </option>

                                <option value="Packed"
                                    ${order.status === "Packed" ? "selected" : ""}>
                                    Packed
                                </option>

                                <option value="Shipped"
                                    ${order.status === "Shipped" ? "selected" : ""}>
                                    Shipped
                                </option>

                                <option value="Delivered"
                                    ${order.status === "Delivered" ? "selected" : ""}>
                                    Delivered
                                </option>

                                <option value="Cancelled"
                                    ${order.status === "Cancelled" ? "selected" : ""}>
                                    Cancelled
                                </option>

                            </select>

                        </td>


                        <td>

                            <input
                                type="text"
                                class="tracking-input"
                                id="tracking-${order.id}"
                                value="${order.tracking_id || ""}"
                                placeholder="Tracking ID">

                        </td>


                        <td>

                            <button
                                class="save-btn"
                                id="save-${order.id}"
                                onclick="saveOrder(${order.id})">

                                Save

                            </button>

                        </td>

                    </tr>

                `;

            }
        );


        html += `

                </tbody>

            </table>

        `;


        box.innerHTML =
            html;


    }

    catch (error) {


        console.error(
            error
        );


        box.innerHTML = `

            <div class="message error">

                Something went wrong.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



/* =========================================
   SAVE ORDER STATUS + TRACKING
========================================= */


async function saveOrder(orderId) {


    const status =
        document.getElementById(
            "status-" + orderId
        ).value;


    const tracking =
        document.getElementById(
            "tracking-" + orderId
        ).value.trim();


    const button =
        document.getElementById(
            "save-" + orderId
        );


    button.disabled = true;

    button.classList.add(
        "saving"
    );

    button.innerText =
        "Saving...";


    try {


        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    status,

                tracking_id:
                    tracking || null

            })
            .eq(
                "id",
                orderId
            );


        if (error) {


            console.error(
                "Update Error:",
                error
            );


            alert(
                "Unable to update order:\n\n" +
                error.message
            );


            button.disabled =
                false;

            button.classList.remove(
                "saving"
            );

            button.innerText =
                "Save";


            return;

        }


        button.innerText =
            "✓ Saved";


        button.classList.remove(
            "saving"
        );


        setTimeout(
            function() {

                button.disabled =
                    false;

                button.innerText =
                    "Save";

            },
            1500
        );


    }

    catch (error) {


        console.error(
            error
        );


        alert(
            "Something went wrong."
        );


        button.disabled =
            false;

        button.classList.remove(
            "saving"
        );

        button.innerText =
            "Save";

    }

}



/* =========================================
   LOGOUT
========================================= */


async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "company-login.html";

}



/* =========================================
   START
========================================= */


loadOrders();


</script>


</body>

</html>
