<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#faf8f5;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:235px;
    min-height:100vh;
    background:#211d18;
    padding:25px 15px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
}

.sidebar-title{
    color:#c89b4b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    padding:5px 15px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 14px;
    border-radius:9px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.side-menu button:hover{
    background:#302a22;
    color:#fff;
}

.side-menu button.active{
    background:#ad8232;
    color:#fff;
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

/* ================= MAIN ================= */

.dashboard-main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
}

.dashboard-header{
    height:78px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:900;
}

.logo{
    font-size:23px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo small{
    display:block;
    color:#ad8232;
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:white;
    border-radius:8px;
    padding:10px 13px;
    font-size:18px;
    cursor:pointer;
}

/* ================= SECTION ================= */

.admin-section{
    padding:35px 3%;
}

.admin-container{
    max-width:1550px;
    margin:auto;
}

.admin-box{
    background:#fff;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.admin-header p,
.form-title p{
    margin:0 0 5px;
    color:#ad8232;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2{
    margin:0;
    font-size:30px;
}

/* ================= BUTTON ================= */

.btn{
    border:0;
    background:#ad8232;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#866326;
}

.green-btn{
    background:#287a3e;
}

.red-btn{
    background:#a33;
}

.gray-btn{
    background:#666;
}

/* ================= SUMMARY ================= */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.summary-card{
    border:1px solid #eee;
    border-radius:15px;
    padding:23px;
    background:#fff;
}

.summary-card span{
    color:#777;
    font-size:14px;
}

.summary-card strong{
    display:block;
    font-size:29px;
    margin-top:10px;
}

.sales strong,
.delivered strong{
    color:#287a3e;
}

.pending strong{
    color:#ad8232;
}

.cancelled strong{
    color:#a33;
}

/* ================= DATE FILTER ================= */

.sales-filter{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:end;
    margin-bottom:25px;
    padding:20px;
    background:#faf8f5;
    border:1px solid #eee;
    border-radius:14px;
}

.date-field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.date-field label{
    font-size:12px;
    font-weight:bold;
    color:#666;
}

.date-field input{
    padding:11px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
}

/* ================= TABLE ================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

.order-table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
    font-size:13px;
}

.order-table th{
    background:#f7f1e7;
    padding:13px 9px;
    text-align:left;
    white-space:nowrap;
}

.order-table td{
    padding:12px 9px;
    border-bottom:1px solid #eee;
    vertical-align:middle;
}

.product-name{
    font-weight:bold;
}

.price{
    font-weight:bold;
}

.total{
    color:#287a3e;
    font-weight:bold;
}

.payment-badge{
    background:#f3eee5;
    color:#8c6a28;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
}

.status-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    background:#eee;
}

.status-delivered{
    background:#e8f3e9;
    color:#287a3e;
}

.status-pending{
    background:#f8f0dd;
    color:#9a7427;
}

.status-cancelled{
    background:#f7dddd;
    color:#a33;
}

.view-btn{
    border:0;
    background:#211d18;
    color:white;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-weight:bold;
}

.error{
    color:#a33;
}

/* ================= ORDERS ================= */

.order-tools{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

/* ================= STOCK ================= */

.stock-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stock-card{
    border:1px solid #eee;
    border-radius:15px;
    padding:22px;
}

.stock-card span{
    color:#777;
}

.stock-card strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.stock-input{
    width:90px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.stock-ok{
    color:#287a3e;
    font-weight:bold;
}

.stock-low{
    color:#ad8232;
    font-weight:bold;
}

.stock-out{
    color:#b22;
    font-weight:bold;
}

.stock-save{
    border:0;
    background:#287a3e;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

/* ================= PRODUCTS ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    border:1px solid #eee;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-card-image{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#f5f2ed;
}

.product-card-body{
    padding:17px;
}

.product-card h3{
    margin:0 0 7px;
    font-size:17px;
}

.product-description{
    color:#777;
    font-size:13px;
    min-height:38px;
    margin-bottom:12px;
}

.product-price{
    font-size:20px;
    font-weight:bold;
    color:#287a3e;
}

.product-stock{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

.product-card-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.product-card-actions button{
    flex:1;
    border:0;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.delete-product{
    background:#f5dddd;
    color:#a33;
}

.update-product-stock{
    background:#e8f2e9;
    color:#287a3e;
}

/* ================= ADD PRODUCT ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-family:inherit;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.upload-box{
    border:2px dashed #d2b477;
    border-radius:12px;
    padding:25px;
    text-align:center;
    background:#fffdf9;
}

.upload-box input{
    margin-top:15px;
}

.photo-preview{
    margin-top:18px;
    display:none;
}

.photo-preview img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

.upload-status{
    margin-top:10px;
    font-size:13px;
    color:#287a3e;
    font-weight:bold;
}

/* ================= MODAL ================= */

.order-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.order-modal-box{
    width:100%;
    max-width:850px;
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:16px;
    padding:28px;
}

.modal-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-top h2{
    margin:0;
}

.close-modal{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.order-detail{
    border:1px solid #eee;
    border-radius:12px;
    padding:20px;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid #eee;
    padding-bottom:18px;
    margin-bottom:18px;
}

.detail-company{
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
}

.detail-company small{
    display:block;
    color:#ad8232;
    font-size:10px;
    margin-top:5px;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

.detail-item{
    padding:12px;
    background:#faf8f5;
    border-radius:8px;
}

.detail-item span{
    display:block;
    color:#777;
    font-size:11px;
    margin-bottom:4px;
}

.detail-item strong{
    font-size:14px;
}

.detail-total{
    border-top:2px solid #211d18;
    margin-top:20px;
    padding-top:15px;
    display:flex;
    justify-content:flex-end;
    gap:20px;
    font-size:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:20px;
}

/* ================= PRINT AREA ================= */

.print-only{
    display:none;
}

/* ================= MOBILE ================= */

.sidebar-overlay{
    display:none;
}

@media(max-width:1100px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
        margin-right:15px;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:950;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .summary-grid,
    .product-grid,
    .stock-cards{
        grid-template-columns:1fr;
    }

    .admin-header,
    .order-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .admin-box{
        padding:18px;
    }

    .sales-filter{
        flex-direction:column;
        align-items:stretch;
    }

    .form-group.full{
        grid-column:auto;
    }
}

/* ================= A4 PRINT ================= */

@media print{

    body{
        background:white;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:210mm;
        min-height:297mm;
        padding:15mm;
        background:white;
    }

    @page{
        size:A4;
        margin:0;
    }

    .print-header{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        border-bottom:2px solid #222;
        padding-bottom:14px;
        margin-bottom:20px;
    }

    .print-brand{
        font-size:25px;
        font-weight:bold;
        letter-spacing:3px;
    }

    .print-brand small{
        display:block;
        color:#ad8232;
        font-size:10px;
        letter-spacing:2px;
        margin-top:4px;
    }

    .print-company{
        text-align:right;
        font-size:12px;
        line-height:1.6;
    }

    .print-title{
        text-align:center;
        margin:20px 0;
    }

    .print-title h2{
        margin:0;
        font-size:22px;
    }

    .print-meta{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-bottom:20px;
    }

    .print-meta div{
        border:1px solid #ddd;
        padding:9px;
    }

    .print-meta span{
        display:block;
        font-size:10px;
        color:#777;
        margin-bottom:3px;
    }

    .print-table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    .print-table th,
    .print-table td{
        border:1px solid #ccc;
        padding:10px;
        text-align:left;
        font-size:12px;
    }

    .print-table th{
        background:#f3f0eb;
    }

    .print-grand-total{
        text-align:right;
        margin-top:18px;
        font-size:18px;
        font-weight:bold;
    }

    .print-footer{
        margin-top:55px;
        border-top:1px solid #ddd;
        padding-top:12px;
        font-size:10px;
        color:#666;
        text-align:center;
    }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
        COMPANY PANEL
    </div>

    <div class="side-menu">

        <button class="active"
            onclick="showSection('orders',this)">
            🛒 Orders
        </button>

        <button onclick="showSection('sales',this)">
            💰 Sales
        </button>

        <button onclick="showSection('stock',this)">
            📦 Stock
        </button>

        <button onclick="showSection('add-product',this)">
            ➕ Add Product
        </button>

        <button onclick="showSection('products',this)">
            🧴 Products
        </button>

        <button onclick="showSection('customers',this)">
            👥 Customers
        </button>

        <button onclick="showSection('reports',this)">
            📊 Reports
        </button>

        <button onclick="showSection('delivery',this)">
            🚚 Delivery
        </button>

        <button onclick="showSection('notifications',this)">
            🔔 Notifications
        </button>

        <button onclick="showSection('settings',this)">
            ⚙️ Settings
        </button>

        <button class="logout-side"
            onclick="logoutAdmin()">
            🚪 Logout
        </button>

    </div>

<div class="sidebar-overlay"
     id="sidebarOverlay"
     onclick="closeSidebar()">
</div>


<main class="dashboard-main">

<header class="dashboard-header">

    <button class="mobile-menu-btn"
        onclick="openSidebar()">
        ☰
    </button>

    <div class="logo">
        LIARA
        <small>PROFESSIONAL™</small>
    </div>

</header>


<!-- ================= ORDERS ================= -->

<section class="admin-section"
         id="orders-section">

<div class="admin-container">

<div class="admin-box">

<div class="admin-header">

<div>
<p>LIARA PROFESSIONAL™</p>
<h2>Company Orders Dashboard</h2>
</div>

<button class="btn"
    onclick="logoutAdmin()">
    Logout
</button>

</div>

<div class="summary-grid">

<div class="summary-card">
<span>Total Orders</span>
<strong id="totalOrders">0</strong>
</div>

<div class="summary-card sales">
<span>Total Sales</span>
<strong id="totalSales">₹0</strong>
</div>

<div class="summary-card pending">
<span>Pending Orders</span>
<strong id="pendingOrders">0</strong>
</div>

<div class="summary-card delivered">
<span>Delivered Orders</span>
<strong id="deliveredOrders">0</strong>
</div>

</div>

<div class="order-tools">

<div class="search-box">

<input
    id="searchInput"
    placeholder="Search customer, mobile, product..."
    oninput="filterOrders()">

</div>

<button class="btn"
    onclick="loadOrders()">
    🔄 Refresh Orders
</button>

</div>

<div id="orders">

<div class="message">
Loading customer orders...
</div>

</div>

</div>
</div>
</section>


<!-- ================= OTHER ================= -->

<section class="admin-section"
         id="other-section"
         style="display:none;">

<div class="admin-container">

<div id="other-content"></div>

</div>

</section>

</main>


<!-- ================= ORDER MODAL ================= -->

<div class="order-modal"
     id="orderModal">

<div class="order-modal-box">

<div class="modal-top">

<h2>
Order Details
</h2>

<button class="close-modal"
        onclick="closeOrderModal()">
×
</button>

</div>

<div id="orderDetailContent">
</div>

<div class="modal-actions">

<button class="btn gray-btn"
        onclick="closeOrderModal()">
Close
</button>

<button class="btn green-btn"
        onclick="printCurrentOrder()">
🖨️ Print A4
</button>

</div>

</div>

</div>


<!-- ================= PRINT AREA ================= -->

<div id="printArea"
     class="print-only">

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

const IMAGE_BUCKET =
"product-images";

let allOrders=[];
let allProducts=[];
let currentOrder=null;


/* ================= MENU ================= */

function showSection(section,button){

    document.querySelectorAll(
        ".side-menu button"
    ).forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    document.getElementById(
        "orders-section"
    ).style.display =
        section==="orders"
        ? "block"
        : "none";

    document.getElementById(
        "other-section"
    ).style.display =
        section==="orders"
        ? "none"
        : "block";

    if(section==="sales"){
        loadSales();
    }

    else if(section==="stock"){
        loadStock();
    }

    else if(section==="add-product"){
        showAddProduct();
    }

    else if(section==="products"){
        loadProducts();
    }

    else{
        showPlaceholder(section);
    }

    closeSidebar();
}


/* ================= PLACEHOLDER ================= */

function showPlaceholder(section){

    const details={

        customers:[
            "👥",
            "Customers",
            "Customer management will appear here."
        ],

        reports:[
            "📊",
            "Reports",
            "Business reports will appear here."
        ],

        delivery:[
            "🚚",
            "Delivery",
            "Delivery management will appear here."
        ],

        notifications:[
            "🔔",
            "Notifications",
            "Notifications will appear here."
        ],

        settings:[
            "⚙️",
            "Settings",
            "Dashboard settings will appear here."
        ]

    };

    const d=details[section];

    document.getElementById(
        "other-content"
    ).innerHTML=`

    <div class="admin-box"
         style="text-align:center;padding:80px 30px">

        <div style="font-size:50px">
            ${d ? d[0] : "📦"}
        </div>

        <h2>
            ${d ? d[1] : "Section"}
        </h2>

        <p style="color:#777">
            ${d ? d[2] : ""}
        </p>

    </div>

    `;
}


/* ================= MOBILE ================= */

function openSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.add("open");

    document.getElementById(

/* ================= MONEY ================= */

function money(value){

    return "₹"+
        Number(value||0)
        .toLocaleString("en-IN");
}


/* ================= ESCAPE ================= */

function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ================= ORDER ID ================= */

/*
   Database id ton short Order ID.
   order.order_number use nahi hunda.
*/

function shortOrderId(id){

    const raw=
        String(id||"")
        .replace(/-/g,"")
        .toUpperCase();

    return "LIARA-"+raw.substring(0,6);
}


/* ================= ORDER HELPERS ================= */

function productName(order){

    return order.product_name ||
           order.product ||
           order.productName ||
           order.item_name ||
           order.item ||
           "Product";
}

function productPrice(order){

    if(order.price!=null){
        return Number(order.price);
    }

    if(order.unit_price!=null){
        return Number(order.unit_price);
    }

    const qty=
        Number(order.quantity||1);

    return qty
        ? Number(order.total||0)/qty
        : 0;
}

function payment(order){

    return order.payment_status ||
           order.payment_method ||
           order.payment ||
           "Pending";
}

/* ================= SUMMARY ================= */

function updateSummary(orders){

    let sales=0;
    let pending=0;
    let delivered=0;

    orders.forEach(order=>{

        sales+=Number(
            order.total||0
        );

        const status=
            String(
                order.status||"Pending"
            ).toLowerCase();

        if(status==="delivered"){
            delivered++;
        }

        if([
            "pending",
            "confirmed",
            "packed",
            "shipped",
            "order received"
        ].includes(status)){
            pending++;
        }

    });

    document.getElementById(
        "totalOrders"
    ).innerText=
        orders.length;

    document.getElementById(
        "totalSales"
    ).innerText=
        money(sales);

    document.getElementById(
        "pendingOrders"
    ).innerText=
        pending;

    document.getElementById(
        "deliveredOrders"
    ).innerText=
        delivered;
}

/* ================= STATUS ================= */

function statusBadge(status){

    const s=
        String(status||"Pending");

    const lower=
        s.toLowerCase();

    if(lower==="delivered"){
        cls="status-delivered";
    }

    if(lower==="cancelled"){
        cls="status-cancelled";
    }

    return `
        <span class="status-badge ${cls}">
            ${escapeHtml(s)}
        </span>
    `;
}

function filterOrders(){

        .trim();

    if(!search){

        renderOrders(allOrders);

        return;
    }

    const filtered=
        allOrders.filter(order=>{

            const text=
                (
                    order.customer_name||""
                )+" "+
                (
                    order.name||""
                )+" "+
                (
                    order.phone||""
                )+" "+
                (
                    order.mobile||""
                )+" "+
                productName(order)+" "+
                shortOrderId(order.id);

            return text
                .toLowerCase()
                .includes(search);
        });

    renderOrders(filtered);
}

/* ================= SALES FILTER ================= */

function filterSalesByDate(){

    const from=
        document.getElementById(
            "salesFrom"
        ).value;

    const to=
        document.getElementById(
            "salesTo"
        ).value;


    let filtered=
        [...allOrders];


    if(from){

        filtered=
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) >= new Date(
                    from+"T00:00:00"
                );

            });

    }


    if(to){

        filtered=
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) <= new Date(
                    to+"T23:59:59"
                );

            });

    }


    renderSales(filtered);
}


function clearSalesFilter(){

    document.getElementById(
        "salesFrom"
    ).value="";

    document.getElementById(
        "salesTo"
    ).value="";

    renderSales(allOrders);
}

/* ================= PHOTO ================= */

function previewPhoto(event){

    const file=
        event.target.files[0];

    if(!file)return;

    const preview=
        document.getElementById(
            "previewImage"
        );

    const box=
        document.getElementById(
            "photoPreview"
        );

    preview.src=
        URL.createObjectURL(file);

    box.style.display="block";
}


/* ================= SAVE PRODUCT ================= */

async function saveProduct(){

    const name=
        document.getElementById(
            "productNameInput"
        ).value.trim();

    const price=
        Number(
            document.getElementById(
                "productPriceInput"
            ).value
        );

    const stock=
        Number(
            document.getElementById(
                "productStockInput"
            ).value||0
        );

    const lowStock=
        Number(
            document.getElementById(
                "productLowStockInput"
            ).value||5
        );

    const description=
        document.getElementById(
            "productDescriptionInput"
        ).value.trim();

    const file=
        document.getElementById(
            "productPhotoInput"
        ).files[0];

    const status=
        document.getElementById(
            "uploadStatus"
        );


    if(!name){

        alert(
            "Product name pao."
        );

        return;
    }


    if(price<0){

        alert(
            "Product price valid pao."
        );

        return;
    }


    if(!file){

        alert(
            "Product photo upload karo."
        );

        return;
    }


    const user=
        await checkAdmin();

    if(!user)return;


    status.innerText=
        "Uploading photo...";


    try{

        const extension=
            file.name
            .split(".")
            .pop()
            .toLowerCase();


        const fileName=
            Date.now()+
            "-"+
            Math.random()
            .toString(36)
            .substring(2)+
            "."+
            extension;


        const filePath=
            "products/"+fileName;


        const upload=
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );


        if(upload.error){

            alert(
                "Photo upload failed:\n\n"+
                upload.error.message
            );

            return;
        }


        const publicData=
            supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .getPublicUrl(
                filePath
            );


        const imageUrl=
            publicData.data.publicUrl;


        const insert=
            await supabaseClient
            .from("products")
            .insert({

                name:name,
                price:price,
                stock:stock,
                low_stock:lowStock,
                description:description,
                image_url:imageUrl

            });


        if(insert.error){

            alert(
                "Product save failed:\n\n"+
                insert.error.message
            );

            return;
        }


        alert(
            "Product successfully add ho gaya."
        );


        clearProductForm();

    }
    catch(error){

        alert(
            "Something went wrong:\n\n"+
            error.message
        );

    }
}


/* ================= CLEAR ================= */

function clearProductForm(){

    [
        "productNameInput",
        "productPriceInput",
        "productDescriptionInput"
    ].forEach(id=>{

        const el=
            document.getElementById(id);

        if(el)el.value="";

    });


    const stock=
        document.getElementById(
            "productStockInput"
        );

    if(stock)stock.value="0";


    const low=
        document.getElementById(
            "productLowStockInput"
        );

    if(low)low.value="5";


    const photo=
        document.getElementById(
            "productPhotoInput"
        );

    if(photo)photo.value="";


    const preview=
        document.getElementById(
            "photoPreview"
        );

    if(preview)
        preview.style.display="none";


    const status=
        document.getElementById(
            "uploadStatus"
        );

    if(status)
        status.innerText="";
}


/* ================= PRODUCTS ================= */

async function loadProducts(){

function renderProducts(products){

    const box=
        document.getElementById(
            "productsList"
        );


    if(!products.length){

        box.innerHTML=`

        <div class="message">
            No products added yet.
        </div>

        `;

        return;
    }


    let html=
        `<div class="product-grid">`;


    products.forEach(product=>{

        const stock=
            Number(
                product.stock||0
            );


        let stockText=
            "Stock: "+stock;

        let stockClass=
            "stock-ok";


        if(stock<=0){

            stockText=
                "Out of Stock";

            stockClass=
                "stock-out";

        }

        else if(
            stock<=Number(
                product.low_stock||5
            )
        ){

            stockText=
                "Low Stock: "+stock;

            stockClass=
                "stock-low";
        }


        const image=
            product.image_url||"";


        html+=`

        <div class="product-card">

            ${
                image
                ?
                `<img
                    class="product-card-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}">`
                :
                `<div
                    class="product-card-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;">
                    🧴
                </div>`
            }


            <div class="product-card-body">

                <h3>
                    ${escapeHtml(
                        product.name
                    )}
                </h3>


                <div class="product-description">

                    ${escapeHtml(
                        product.description||""
                    )}

                </div>


                <div class="product-price">

                    ${money(
                        product.price
                    )}

                </div>


                <div
                    class="product-stock ${stockClass}">

                    ${stockText}

                </div>


                <div class="product-card-actions">

                    <button
                        class="update-product-stock"
                        onclick="editProductStock('${escapeHtml(
                            String(product.id)
                        )}')">

                        ✏️ Stock

                    </button>


                    <button
                        class="delete-product"
                        onclick="deleteProduct('${escapeHtml(
                            String(product.id)
                        )}')">

                        🗑️ Delete

                    </button>

                </div>

            </div>

        </div>

        `;

    });


    html+="</div>";

    box.innerHTML=html;
}


/* ================= EDIT STOCK ================= */

async function editProductStock(id){

    const product=
        allProducts.find(
            p=>String(p.id)===String(id)
        );


    if(!product)return;


    const value=
        prompt(
            "New stock quantity:",
            product.stock||0
        );


    if(value===null)return;


    const stock=
        Number(value);


    if(
        !Number.isInteger(stock)||
        stock<0
    ){

        alert(
            "Valid stock quantity pao."
        );

        return;
    }


    const {error}=
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);


    if(error){

        alert(
            "Stock update failed:\n\n"+
            error.message
        );

        return;
    }


    alert(
        "Stock updated successfully."
    );


    loadProducts();
}


/* ================= DELETE PRODUCT ================= */

async function deleteProduct(id){

    const product=
        allProducts.find(
            p=>String(p.id)===String(id)
        );


    if(!product)return;


    const yes=
        confirm(
            'Delete "'+
            product.name+
            '"?'
        );


    if(!yes)return;


    const {error}=
        await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);


    if(error){

        alert(
            "Product delete failed:\n\n"+
            error.message
        );

        return;
    }


    alert(
        "Product deleted successfully."
    );


    loadProducts();
}

function renderStock(products){

    let low=0;
    let out=0;


    products.forEach(product=>{

        const stock=
            Number(
                product.stock||0
            );

        const minimum=
            Number(
                product.low_stock||5
            );


        if(stock<=0){
            out++;
        }

        else if(stock<=minimum){
            low++;
        }

    });


    document.getElementById(
        "stockTotal"
    ).innerText=
        products.length;


    document.getElementById(
        "stockLow"
    ).innerText=
        low;


    document.getElementById(
        "stockOut"
    ).innerText=
        out;


    if(!products.length){

        document.getElementById(
            "stockTable"
        ).innerHTML=`

        <div class="message">
            No products added yet.
        </div>

        `;

        return;
    }


    let html=`

    <div class="table-wrapper">

    <table class="order-table">

    <thead>

    <tr>

        <th>
            Product
        </th>

        <th>
            Price
        </th>

        <th>
            Stock
        </th>

        <th>
            Minimum
        </th>

        <th>
            Status
        </th>

        <th>
            Update
        </th>

    </tr>

    </thead>

    <tbody>

    `;


    products.forEach(product=>{

        const stock=
            Number(
                product.stock||0
            );

        const minimum=
            Number(
                product.low_stock||5
            );


        let status="In Stock";
        let cls="stock-ok";


        if(stock<=0){

            status=
                "Out of Stock";

            cls=
                "stock-out";

        }

        else if(
            stock<=minimum
        ){

            status=
                "Low Stock";

            cls=
                "stock-low";
        }


        html+=`

        <tr>

            <td>

                <strong>
                    ${escapeHtml(
                        product.name
                    )}
                </strong>

            </td>


            <td>
                ${money(
                    product.price
                )}
            </td>


            <td>

                <input
                    class="stock-input"
                    id="stock-${escapeHtml(
                        String(product.id)
                    )}"
                    type="number"
                    min="0"
                    value="${stock}">

            </td>


            <td>
                ${minimum}
            </td>


            <td class="${cls}">
                ${status}
            </td>


            <td>

                <button
                    class="stock-save"
                    onclick="updateStock('${escapeHtml(
                        String(product.id)
                    )}')">

                    Save

                </button>

            </td>

        </tr>

        `;

    });


    html+=`

    </tbody>

    </table>

    </div>

    `;


    document.getElementById(
        "stockTable"
    ).innerHTML=
        html;
}


/* ================= UPDATE STOCK ================= */

async function updateStock(id){

    const input=
        document.getElementById(

    if(!input)return;


    const stock=

    if(
        !Number.isInteger(stock)||

    ){

        alert(

    const {error}=
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);


    if(error){

        alert(
            "Stock update failed:\n\n"+
            error.message
        );

        return;
    }


    alert(

}
