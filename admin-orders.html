<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#faf8f5;
    color:#222;
}

.sidebar{
    width:235px;
    min-height:100vh;
    background:#211d18;
    padding:25px 15px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
}

.sidebar-title{
    color:#c89b4b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    padding:5px 15px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 14px;
    border-radius:9px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.side-menu button:hover{
    background:#302a22;
    color:#fff;
}

.side-menu button.active{
    background:#ad8232;
    color:#fff;
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

.dashboard-main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
}

.dashboard-header{
    background:#fff;
    min-height:70px;
    padding:15px 30px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:#fff;
    border-radius:8px;
    padding:10px 13px;
    font-size:18px;
    cursor:pointer;
}

.admin-section{
    padding:35px 3%;
}

.admin-container{
    max-width:1550px;
    margin:auto;
}

.admin-box{
    background:#fff;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.admin-header p{
    margin:0 0 5px;
    color:#ad8232;
    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2{
    margin:0;
    font-size:30px;
}

.logout-btn,
.refresh-btn,
.stock-refresh{
    border:0;
    background:#ad8232;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.summary-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:15px;
    padding:25px;
    box-shadow:0 7px 25px rgba(0,0,0,.05);
}

.summary-card span{
    display:block;
    color:#777;
    font-size:14px;
    margin-bottom:12px;
}

.summary-card strong{
    font-size:30px;
}

.sales strong,
.delivered strong{
    color:#287a3e;
}

.pending strong{
    color:#ad8232;
}

.order-tools{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
    max-width:450px;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

.order-table,
.stock-table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
    font-size:12px;
}

.order-table th,
.stock-table th{
    background:#f7f1e7;
    padding:13px 8px;
    text-align:left;
}

.order-table td,
.stock-table td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
    vertical-align:middle;
}

.product-name{
    font-weight:bold;
}

.price{
    font-weight:bold;
}

.total{
    color:#287a3e;
    font-weight:bold;
}

.payment-badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
    background:#f3eee5;
    color:#8c6a28;
}

.status-select{
    width:100%;
    padding:8px 5px;
    border:1px solid #ddd;
    border-radius:7px;
}

.save-btn{
    margin-top:7px;
    width:100%;
    border:0;
    background:#287a3e;
    color:#fff;
    padding:7px;
    border-radius:6px;
    cursor:pointer;
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-weight:bold;
}

.error{
    color:#a33;
}

/* ADD PRODUCT */

.product-form{
    max-width:750px;
}

.form-title{
    margin-bottom:25px;
}

.form-title p{
    margin:0 0 5px;
    color:#ad8232;
    font-weight:bold;
    letter-spacing:2px;
    font-size:13px;
}

.form-title h2{
    margin:0;
    font-size:30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.form-group input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.photo-upload{
    border:2px dashed #d7c39b;
    background:#fffdf9;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

.photo-upload input{
    border:0;
    padding:0;
}

.photo-preview{
    display:none;
    margin:20px auto 0;
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

.add-product-btn{
    width:100%;
    border:0;
    background:#ad8232;
    color:#fff;
    padding:15px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.add-product-btn:disabled{
    opacity:.6;
}

.upload-status{
    margin-top:12px;
    text-align:center;
    font-size:13px;
    color:#777;
}

/* STOCK */

.stock-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stock-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:15px;
    padding:22px;
}

.stock-card span{
    color:#777;
}

.stock-card strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.stock-input{
    width:90px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.stock-save{
    border:0;
    background:#287a3e;
    color:#fff;
    padding:8px 13px;
    border-radius:6px;
    cursor:pointer;
}

.stock-ok{
    color:#287a3e;
    font-weight:bold;
}

.stock-low{
    color:#ad8232;
    font-weight:bold;
}

.stock-out{
    color:#b22;
    font-weight:bold;
}

/* PRODUCTS */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:15px;
    overflow:hidden;
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#f5f1eb;
}

.product-card-content{
    padding:16px;
}

.product-card h3{
    margin:0 0 8px;
}

.product-card .product-price{
    color:#287a3e;
    font-weight:bold;
    font-size:18px;
}

.product-card .product-stock{
    color:#777;
    margin-top:8px;
}

/* MOBILE */

.sidebar-overlay{
    display:none;
}

@media(max-width:1100px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:950;
    }
}

@media(max-width:700px){

    .summary-grid,
    .stock-cards,
    .product-grid{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .admin-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .logout-btn{
        width:100%;
    }

    .order-tools{
        flex-direction:column;
    }

    .search-box{
        max-width:none;
    }

    .refresh-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
        COMPANY PANEL
    </div>

    <div class="side-menu">

        <button class="active"
            onclick="showSection('orders',this)">
            🛒 Orders
        </button>

        <button
            onclick="showSection('sales',this)">
            💰 Sales
        </button>

        <button
            onclick="showSection('stock',this)">
            📦 Stock
        </button>

        <button
            onclick="showSection('add-product',this)">
            ➕ Add Product
        </button>

        <button
            onclick="showSection('products',this)">
            🧴 Products
        </button>

        <button
            onclick="showSection('customers',this)">
            👥 Customers
        </button>

        <button
            onclick="showSection('reports',this)">
            📊 Reports
        </button>

        <button
            onclick="showSection('delivery',this)">
            🚚 Delivery
        </button>

        <button
            onclick="showSection('notifications',this)">
            🔔 Notifications
        </button>

        <button
            onclick="showSection('settings',this)">
            ⚙️ Settings
        </button>

        <button class="logout-side"
            onclick="logoutAdmin()">
            🚪 Logout
        </button>

    </div>
</aside>

<div class="sidebar-overlay"
     id="sidebarOverlay"
     onclick="closeSidebar()">
</div>

<main class="dashboard-main">

<header class="dashboard-header">

    <button class="mobile-menu-btn"
        onclick="openSidebar()">
        ☰
    </button>

</header>


<!-- ORDERS -->

<section class="admin-section"
         id="orders-section">

<div class="admin-container">

<div class="admin-box">

<div class="admin-header">

<div>
<p>LIARA PROFESSIONAL™</p>
<h2>Company Orders Dashboard</h2>
</div>

<button class="logout-btn"
    onclick="logoutAdmin()">
    Logout
</button>

</div>

<div class="summary-grid">

<div class="summary-card">
<span>Total Orders</span>
<strong id="totalOrders">0</strong>
</div>

<div class="summary-card sales">
<span>Total Sales</span>
<strong id="totalSales">₹0</strong>
</div>

<div class="summary-card pending">
<span>Pending Orders</span>
<strong id="pendingOrders">0</strong>
</div>

<div class="summary-card delivered">
<span>Delivered Orders</span>
<strong id="deliveredOrders">0</strong>
</div>

</div>

<div class="order-tools">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search customer, mobile, product..."
oninput="filterOrders()">

</div>

<button class="refresh-btn"
onclick="loadOrders()">
🔄 Refresh Orders
</button>

</div>

<div id="orders">

<div class="message">
Loading customer orders...
</div>

</div>

</div>
</div>
</section>


<!-- OTHER -->

<section class="admin-section"
id="other-section"
style="display:none;">

<div class="admin-container">

<div id="other-content">

</div>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

let allOrders=[];


/* =========================
MENU
========================= */

function showSection(section,button){

    document.querySelectorAll(
        ".side-menu button"
    ).forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    const orders =
        document.getElementById(
            "orders-section"
        );

    const other =
        document.getElementById(
            "other-section"
        );

    if(section==="orders"){

        orders.style.display="block";
        other.style.display="none";

    }else{

        orders.style.display="none";
        other.style.display="block";

        if(section==="stock"){
            loadStock();
        }

        else if(section==="add-product"){
            showAddProduct();
        }

        else if(section==="products"){
            loadProducts();
        }

        else{

            const info={

                sales:[
                    "💰",
                    "Sales",
                    "Sales management will appear here."
                ],

                customers:[
                    "👥",
                    "Customers",
                    "Customer management will appear here."
                ],

                reports:[
                    "📊",
                    "Reports",
                    "Business reports will appear here."
                ],

                delivery:[
                    "🚚",
                    "Delivery",
                    "Delivery management will appear here."
                ],

                notifications:[
                    "🔔",
                    "Notifications",
                    "Notifications will appear here."
                ],

                settings:[
                    "⚙️",
                    "Settings",
                    "Dashboard settings will appear here."
                ]

            };

            const item=info[section];

            document.getElementById(
                "other-content"
            ).innerHTML=`

            <div class="menu-placeholder">

                <div class="big-icon"
                style="font-size:50px">
                ${item[0]}
                </div>

                <h2>${item[1]}</h2>

                <p>${item[2]}</p>

            </div>

            `;
        }
    }

    closeSidebar();
}


/* =========================
MOBILE
========================= */

function openSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.add("open");

    document.getElementById(
        "sidebarOverlay"
    ).classList.add("show");
}

function closeSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.remove("open");

    document.getElementById(
        "sidebarOverlay"
    ).classList.remove("show");
}


/* =========================
ADMIN
========================= */

async function checkAdmin(){

    const {data,error} =
    await supabaseClient.auth.getUser();

    if(
        error ||
        !data ||
        !data.user
    ){

        window.location.href=
        "company-login.html";

        return null;
    }

    if(
        !data.user.email ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href=
        "company-login.html";

        return null;
    }

    return data.user;
}


/* =========================
MONEY
========================= */

function money(value){

    return "₹"+
    Number(value||0)
    .toLocaleString("en-IN");

}


/* =========================
ESCAPE
========================= */

function escapeHtml(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
ORDERS
========================= */

function getProductName(order){

    return(
        order.product_name ||
        order.product ||
        order.productName ||
        order.item_name ||
        order.item ||
        "Product"
    );
}


function getPrice(order){

    if(order.price!==undefined &&
       order.price!==null){

        return Number(order.price);
    }

    if(order.unit_price!==undefined &&
       order.unit_price!==null){

        return Number(order.unit_price);
    }

    const qty=
    Number(order.quantity||1);

    const total=
    Number(order.total||0);

    return qty>0 ? total/qty : 0;
}


function getPayment(order){

    return(
        order.payment_status ||
        order.payment_method ||
        order.payment ||
        "Pending"
    );
}


async function loadOrders(){

    const box=
    document.getElementById("orders");

    box.innerHTML=`
    <div class="message">
    Loading customer orders...
    </div>`;

    const user=
    await checkAdmin();

    if(!user)return;

    const {data,error}=
    await supabaseClient
    .from("orders")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );

    if(error){

        box.innerHTML=`
        <div class="message error">
        ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    allOrders=data||[];

    updateSummary(allOrders);
    renderOrders(allOrders);
}


function updateSummary(orders){

    let sales=0;
    let pending=0;
    let delivered=0;

    orders.forEach(order=>{

        sales+=Number(
            order.total||0
        );

        const status=
        String(
            order.status||"Pending"
        ).toLowerCase();

        if(status==="delivered"){
            delivered++;
        }

        if(
            status==="pending"||
            status==="confirmed"||
            status==="packed"||
            status==="shipped"
        ){
            pending++;
        }
    });

    document.getElementById(
        "totalOrders"
    ).innerText=orders.length;

    document.getElementById(
        "totalSales"
    ).innerText=money(sales);

    document.getElementById(
        "pendingOrders"
    ).innerText=pending;

    document.getElementById(
        "deliveredOrders"
    ).innerText=delivered;
}


function statusOption(value,current){

    return`
    <option value="${value}"
    ${current===value?"selected":""}>
    ${value}
    </option>`;
}


function renderOrders(orders){

    const box=
    document.getElementById("orders");

    if(!orders.length){

        box.innerHTML=`
        <div class="message">
        No customer orders yet.
        </div>`;

        return;
    }

    let html=`

    <div class="table-wrapper">

    <table class="order-table">

    <thead>
    <tr>
    <th>Order Date</th>
    <th>Customer</th>
    <th>Mobile</th>
    <th>Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Total</th>
    <th>Payment</th>
    <th>Address</th>
    <th>Status</th>
    </tr>
    </thead>

    <tbody>`;

    orders.forEach(order=>{

        const id=order.id;

        const date=
        order.created_at
        ?new Date(
            order.created_at
        ).toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        )
        :"–";

        const customer=
        order.customer_name||
        order.name||
        "-";

        const phone=
        order.phone||
        order.mobile||
        "-";

        const address=
        order.address||
        order.shipping_address||
        "-";

        const product=
        getProductName(order);

        const price=
        getPrice(order);

        const qty=
        Number(order.quantity||1);

        const total=
        Number(order.total||0);

        const payment=
        getPayment(order);

        const status=
        order.status||"Pending";

        html+=`

        <tr>

        <td>
        ${escapeHtml(date)}
        </td>

        <td>
        <strong>
        ${escapeHtml(customer)}
        </strong>
        </td>

        <td>
        ${escapeHtml(phone)}
        </td>

        <td class="product-name">
        ${escapeHtml(product)}
        </td>

        <td class="price">
        ${money(price)}
        </td>

        <td>${qty}</td>

        <td class="total">
        ${money(total)}
        </td>

        <td>
        <span class="payment-badge">
        ${escapeHtml(payment)}
        </span>
        </td>

        <td>
        ${escapeHtml(address)}
        </td>

        <td>

        <select
        class="status-select"
        id="status-${escapeHtml(id)}">

        ${statusOption("Pending",status)}
        ${statusOption("Confirmed",status)}
        ${statusOption("Packed",status)}
        ${statusOption("Shipped",status)}
        ${statusOption("Delivered",status)}
        ${statusOption("Cancelled",status)}

        </select>

        <button
        class="save-btn"
        id="save-${escapeHtml(id)}"
        onclick="saveOrder('${escapeHtml(id)}')">
        Save
        </button>

        </td>

        </tr>`;
    });

    html+=`
    </tbody>
    </table>
    </div>`;

    box.innerHTML=html;
}


function filterOrders(){

    const search=
    document.getElementById(
        "searchInput"
    ).value
    .toLowerCase()
    .trim();

    if(!search){

        renderOrders(allOrders);
        return;
    }

    const filtered=
    allOrders.filter(order=>{

        const text=
        (
            order.customer_name||""
        )+" "+
        (
            order.name||""
        )+" "+
        (
            order.phone||""
        )+" "+
        (
            order.mobile||""
        )+" "+
        getProductName(order)+" "+
        (
            order.address||""
        );

        return text
        .toLowerCase()
        .includes(search);
    });

    renderOrders(filtered);
}


async function saveOrder(id){

    const select=
    document.getElementById(
        "status-"+id
    );

    const button=
    document.getElementById(
        "save-"+id
    );

    if(!select)return;

    button.disabled=true;
    button.innerText="Saving...";

    const {error}=
    await supabaseClient
    .from("orders")
    .update({
        status:select.value
    })
    .eq("id",id);

    if(error){

        alert(error.message);

        button.disabled=false;
        button.innerText="Save";

        return;
    }

    const order=
    allOrders.find(
        item=>String(item.id)===String(id)
    );

    if(order){
        order.status=select.value;
    }

    updateSummary(allOrders);

    button.innerText="✓ Saved";

    setTimeout(()=>{
        button.disabled=false;
        button.innerText="Save";
    },1200);
}

function previewProductPhoto(event){

    const file=
    event.target.files[0];

    const preview=
    document.getElementById(
        "photoPreview"
    );

    if(!file){

        preview.style.display="none";
        return;
    }

    if(!file.type.startsWith("image/")){

        alert("Please select an image.");

        event.target.value="";
        preview.style.display="none";

        return;
    }

    preview.src=
    URL.createObjectURL(file);

    preview.style.display="block";
}


/* =========================
UPLOAD PHOTO
========================= */

async function uploadProductPhoto(file){

    if(!file){
        throw new Error(
            "Please select a product photo."
        );
    }

    const extension=
    file.name
    .split(".")
    .pop()
    .toLowerCase();

    const fileName=
    "product-"+Date.now()+
    "-"+Math.random()
    .toString(36)
    .substring(2)+
    "."+extension;

    const filePath=
    fileName;

    const {error:uploadError}=
    await supabaseClient
    .storage
    .from("product-images")
    .upload(
        filePath,
        file,
        {
            cacheControl:"3600",
            upsert:false
        }
    );

    if(uploadError){
        throw uploadError;
    }

    const {data}=
    supabaseClient
    .storage
    .from("product-images")
    .getPublicUrl(filePath);

    if(!data || !data.publicUrl){

        throw new Error(
            "Unable to get photo URL."
        );
    }

    return data.publicUrl;
}


/* =========================
ADD PRODUCT
========================= */

async function addProduct(){

    const name=
    document.getElementById(
        "productName"
    ).value.trim();

    const price=
    Number(
        document.getElementById(
            "productPrice"
        ).value
    );

    const stock=
    Number(
        document.getElementById(
            "productStock"
        ).value
    );

    const photoInput=
    document.getElementById(
        "productPhoto"
    );

    const button=
    document.getElementById(
        "addProductBtn"
    );

    const status=
    document.getElementById(
        "uploadStatus"
    );


    if(!name){

        alert("Product name pao.");
        return;
    }

    if(price<0 || !Number.isFinite(price)){

        alert("Valid price pao.");
        return;
    }

    if(stock<0 || !Number.isFinite(stock)){

        alert("Valid stock pao.");
        return;
    }

    if(
        !photoInput.files ||
        !photoInput.files[0]
    ){

        alert("Product photo select karo.");
        return;
    }


    const user=
    await checkAdmin();

    if(!user)return;


    try{

        button.disabled=true;
        button.innerText="Uploading...";
        status.innerText=
        "Photo upload ho rahi aa...";


        const imageUrl=
        await uploadProductPhoto(
            photoInput.files[0]
        );


        status.innerText=
        "Product save ho reha...";


        const {error}=
        await supabaseClient
        .from("products")
        .insert({

            name:name,
            price:price,
            stock:stock,
            image_url:imageUrl

        });


        if(error){

            throw error;
        }


        alert(
            "✅ Product successfully add ho gaya!"
        );


        document.getElementById(
            "productName"
        ).value="";

        document.getElementById(
            "productPrice"
        ).value="";

        document.getElementById(
            "productStock"
        ).value="";

        photoInput.value="";

        document.getElementById(
            "photoPreview"
        ).style.display="none";

        status.innerText=
        "Product add ho gaya.";

        button.disabled=false;
        button.innerText="➕ Add Product";

    }

    catch(error){

        console.error(error);

        alert(
            "Product add nahi hoya:\n\n"+
            error.message
        );

        status.innerText=
        "Error: "+error.message;

        button.disabled=false;
        button.innerText="➕ Add Product";
    }
}

/* =========================
STOCK
========================= */

async function loadStock(){

    const content=
    document.getElementById(
        "other-content"
    );

    content.innerHTML=`

    <div class="admin-box">

    <div class="form-title">

    <p>INVENTORY</p>

    <h2>Stock Management</h2>

    </div>

    <div class="stock-cards">

    <div class="stock-card">
    <span>Total Products</span>
    <strong id="stockTotal">0</strong>
    </div>

    <div class="stock-card">
    <span>Low Stock</span>
    <strong id="stockLow">0</strong>
    </div>

    <div class="stock-card">
    <span>Out of Stock</span>
    <strong id="stockOut">0</strong>
    </div>

    </div>

    <div id="stockTable">

    <div class="message">
    Loading stock...
    </div>

    </div>

    </div>
    `;


    const user=
    await checkAdmin();

    if(!user)return;


    const {data,error}=
    await supabaseClient
    .from("products")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );


    if(error){

        document.getElementById(
            "stockTable"
        ).innerHTML=`

        <div class="message error">
        ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    const products=data||[];

    let low=0;
    let out=0;


    products.forEach(product=>{

        const stock=
        Number(product.stock||0);

        if(stock<=0){
            out++;
        }

        else if(stock<=5){
            low++;
        }
    });


    document.getElementById(
        "stockTotal"
    ).innerText=products.length;

    document.getElementById(
        "stockLow"
    ).innerText=low;

    document.getElementById(
        "stockOut"
    ).innerText=out;


    if(!products.length){

        document.getElementById(
            "stockTable"
        ).innerHTML=`

        <div class="message">
        No products added yet.
        </div>`;

        return;
    }


    let html=`

    <div class="table-wrapper">

    <table class="stock-table">

    <thead>
    <tr>
    <th>Product</th>
    <th>Price</th>
    <th>Stock</th>
    <th>Status</th>
    <th>Update</th>
    </tr>
    </thead>

    <tbody>`;


    products.forEach(product=>{

        const stock=
        Number(product.stock||0);

        let status="In Stock";
        let cls="stock-ok";

        if(stock<=0){

            status="Out of Stock";
            cls="stock-out";

        }

        else if(stock<=5){

            status="Low Stock";
            cls="stock-low";

        }


        html+=`

        <tr>

        <td>
        <strong>
        ${escapeHtml(product.name)}
        </strong>
        </td>

        <td>
        ${money(product.price)}
        </td>

        <td>

        <input
        class="stock-input"
        type="number"
        min="0"
        id="stock-${escapeHtml(product.id)}"
        value="${stock}">

        </td>

        <td class="${cls}">
        ${status}
        </td>

        <td>

        <button
        class="stock-save"
        onclick="updateStock('${escapeHtml(product.id)}')">
        Save
        </button>

        </td>

        </tr>`;
    });


    html+=`
    </tbody>
    </table>
    </div>`;

    document.getElementById(
        "stockTable"
    ).innerHTML=html;
}


async function updateStock(id){

    const input=
    document.getElementById(
        "stock-"+id
    );

    const stock=
    Number(input.value);

    if(stock<0){

        alert(
            "Stock negative nahi ho sakda."
        );

        return;
    }


    const {error}=
    await supabaseClient
    .from("products")
    .update({
        stock:stock
    })
    .eq("id",id);


    if(error){

        alert(
            "Stock update failed:\n\n"+
            error.message
        );

        return;
    }


    alert(
        "✅ Stock updated."
    );

    loadStock();
}
