<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#faf8f5;
    color:#222;
}

button,input,select{
    font-family:inherit;
}

.sidebar{
    width:235px;
    min-height:100vh;
    background:#211d18;
    padding:25px 15px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
}

.sidebar-title{
    color:#c89b4b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    padding:5px 15px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 14px;
    border-radius:9px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.side-menu button:hover{
    background:#302a22;
    color:white;
}

.side-menu button.active{
    background:#ad8232;
    color:white;
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

.dashboard-main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
}

.dashboard-header{
    height:78px;
    background:white;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:900;
}

.logo{
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo small{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    color:#ad8232;
    margin-top:4px;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:white;
    border-radius:8px;
    padding:10px 13px;
    font-size:18px;
}

.admin-section{
    padding:35px 3%;
}

.admin-container{
    max-width:1550px;
    margin:auto;
}

.admin-box{
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.admin-header p{
    margin:0 0 5px;
    color:#ad8232;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2{
    margin:0;
    font-size:30px;
}

.gold-btn{
    border:0;
    background:#ad8232;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.gold-btn:hover{
    background:#866326;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.summary-card{
    background:white;
    border:1px solid #eee;
    border-radius:15px;
    padding:24px;
    box-shadow:0 7px 25px rgba(0,0,0,.05);
}

.summary-card span{
    color:#777;
    font-size:14px;
}

.summary-card strong{
    display:block;
    font-size:30px;
    margin-top:10px;
}

.green{
    color:#287a3e;
}

.gold{
    color:#ad8232;
}

.red{
    color:#b22;
}

.tools{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.search input:focus{
    border-color:#ad8232;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f7f1e7;
    padding:13px;
    text-align:left;
    font-size:12px;
}

td{
    padding:13px;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.status-select{
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.save-btn{
    margin-left:5px;
    border:0;
    background:#287a3e;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-weight:bold;
}

.error{
    color:#a33;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.product-card{
    border:1px solid #eee;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-image{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#f5f1eb;
}

.product-info{
    padding:18px;
}

.product-info h3{
    margin:0 0 8px;
}

.product-price{
    color:#287a3e;
    font-size:20px;
    font-weight:bold;
}

.product-stock{
    color:#777;
    margin:8px 0 15px;
}

.card-actions{
    display:flex;
    gap:8px;
}

.edit-btn,
.delete-btn{
    flex:1;
    border:0;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn{
    background:#f1e6d1;
    color:#795a20;
}

.delete-btn{
    background:#f8dddd;
    color:#a33;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:bold;
}

.form-group input{
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.form-group input:focus{
    border-color:#ad8232;
}

.form-actions{
    margin-top:25px;
    display:flex;
    gap:10px;
}

.cancel-btn{
    border:0;
    background:#eee;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.stock-ok{
    color:#287a3e;
    font-weight:bold;
}

.stock-low{
    color:#ad8232;
    font-weight:bold;
}

.stock-out{
    color:#b22;
    font-weight:bold;
}

.sidebar-overlay{
    display:none;
}

@media(max-width:1100px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
        margin-right:15px;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:950;
    }

}

@media(max-width:650px){

    .summary-grid,
    .product-grid,
    .form-grid{
        grid-template-columns:1fr;
    }

    .admin-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .tools{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
        COMPANY PANEL
    </div>

    <div class="side-menu">

        <button class="active"
                onclick="showSection('orders',this)">
            🛒 Orders
        </button>

        <button onclick="showSection('sales',this)">
            💰 Sales
        </button>

        <button onclick="showSection('stock',this)">
            📦 Stock
        </button>

        <button onclick="showSection('add-product',this)">
            ➕ Add Product
        </button>

        <button onclick="showSection('products',this)">
            🧴 Products
        </button>

        <button onclick="showSection('customers',this)">
            👥 Customers
        </button>

        <button onclick="showSection('reports',this)">
            📊 Reports
        </button>

        <button onclick="showSection('delivery',this)">
            🚚 Delivery
        </button>

        <button onclick="showSection('notifications',this)">
            🔔 Notifications
        </button>

        <button onclick="showSection('settings',this)">
            ⚙️ Settings
        </button>

        <button class="logout-side"
                onclick="logoutAdmin()">
            🚪 Logout
        </button>

    </div>

</aside>

<div class="sidebar-overlay"
     id="sidebarOverlay"
     onclick="closeSidebar()">
</div>

<main class="dashboard-main">

<header class="dashboard-header">

    <button class="mobile-menu-btn"
            onclick="openSidebar()">
        ☰
    </button>

    <div class="logo">
        LIARA
        <small>PROFESSIONAL™</small>
    </div>

</header>


<!-- ORDERS -->

<section class="admin-section"
         id="orders-section">

<div class="admin-container">

<div class="admin-box">

<div class="admin-header">

<div>
<p>LIARA PROFESSIONAL™</p>
<h2>Company Orders Dashboard</h2>
</div>

<button class="gold-btn"
        onclick="logoutAdmin()">
Logout
</button>

</div>

<div class="summary-grid">

<div class="summary-card">
<span>Total Orders</span>
<strong id="totalOrders">0</strong>
</div>

<div class="summary-card">
<span>Total Sales</span>
<strong class="green"
        id="totalSales">₹0</strong>
</div>

<div class="summary-card">
<span>Pending Orders</span>
<strong class="gold"
        id="pendingOrders">0</strong>
</div>

<div class="summary-card">
<span>Delivered Orders</span>
<strong class="green"
        id="deliveredOrders">0</strong>
</div>

</div>

<div class="tools">

<div class="search">
<input id="searchInput"
       placeholder="Search customer, mobile, product..."
       oninput="filterOrders()">
</div>

<button class="gold-btn"
        onclick="loadOrders()">
🔄 Refresh
</button>

</div>

<div id="orders">
<div class="message">
Loading customer orders...
</div>
</div>

</div>
</div>
</section>


<!-- OTHER -->

<section class="admin-section"
         id="other-section"
         style="display:none;">

<div class="admin-container"
     id="other-content">
</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ===============================
SUPABASE
=============================== */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

let allOrders=[];
let allProducts=[];


/* ===============================
MENU
=============================== */

function showSection(section,button){

    document
    .querySelectorAll(".side-menu button")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    document.getElementById("orders-section")
        .style.display =
        section==="orders" ? "block" : "none";

    document.getElementById("other-section")
        .style.display =
        section==="orders" ? "none" : "block";

    if(section==="orders"){
        loadOrders();
    }

    if(section==="stock"){
        loadStock();
    }

    if(section==="products"){
        loadProducts();
    }

    if(section==="add-product"){
        showAddProduct();
    }

    if(section==="sales"){
        showSales();
    }

    if(section==="customers"){
        showCustomers();
    }

    if(section==="reports"){
        showReports();
    }

    if(section==="delivery"){
        showDelivery();
    }

    if(section==="notifications"){
        showNotifications();
    }

    if(section==="settings"){
        showSettings();
    }

    closeSidebar();
}


/* ===============================
MOBILE
=============================== */

function openSidebar(){

    document
    .getElementById("sidebar")
    .classList.add("open");

    document
    .getElementById("sidebarOverlay")
    .classList.add("show");
}

function closeSidebar(){

    document
    .getElementById("sidebar")
    .classList.remove("open");

    document
    .getElementById("sidebarOverlay")
    .classList.remove("show");
}


/* ===============================
ADMIN CHECK
=============================== */

async function checkAdmin(){

    const {data,error} =
    await supabaseClient.auth.getUser();

    if(error || !data || !data.user){

        window.location.href =
        "company-login.html";

        return null;
    }

    if(
        !data.user.email ||
        data.user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href =
        "company-login.html";

        return null;
    }

    return data.user;
}


/* ===============================
MONEY
=============================== */

function money(value){

    return "₹" +
    Number(value || 0)
    .toLocaleString("en-IN");
}


/* ===============================
ESCAPE
=============================== */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ===============================
ORDERS
=============================== */

async function loadOrders(){

    const box =
    document.getElementById("orders");

    box.innerHTML =
    `<div class="message">
        Loading customer orders...
    </div>`;

    const user =
    await checkAdmin();

    if(!user)return;

    const {data,error} =
    await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        box.innerHTML =
        `<div class="message error">
            ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    allOrders=data || [];

    updateSummary(allOrders);
    renderOrders(allOrders);
}


function updateSummary(orders){

    let sales=0;
    let pending=0;
    let delivered=0;

    orders.forEach(order=>{

        sales += Number(order.total || 0);

        const status =
        String(order.status || "Pending")
        .toLowerCase();

        if(status==="delivered"){
            delivered++;
        }

        if(
            status==="pending" ||
            status==="confirmed" ||
            status==="packed" ||
            status==="shipped"
        ){
            pending++;
        }
    });

    document.getElementById("totalOrders")
    .innerText=orders.length;

    document.getElementById("totalSales")
    .innerText=money(sales);

    document.getElementById("pendingOrders")
    .innerText=pending;

    document.getElementById("deliveredOrders")
    .innerText=delivered;
}


function getProductName(order){

    return order.product_name ||
           order.product ||
           order.productName ||
           order.item_name ||
           order.item ||
           "Product";
}


function getPrice(order){

    if(order.price != null)
        return Number(order.price);

    if(order.unit_price != null)
        return Number(order.unit_price);

    const qty=Number(order.quantity || 1);
    const total=Number(order.total || 0);

    return qty>0 ? total/qty : 0;
}


function getPayment(order){

    return order.payment_status ||
           order.payment_method ||
           order.payment ||
           "Pending";
}


function renderOrders(orders){

    const box=
    document.getElementById("orders");

    if(!orders.length){

        box.innerHTML =
        `<div class="message">
            No customer orders yet.
        </div>`;

        return;
    }

    let html=`

    <div class="table-wrapper">

    <table>

    <thead>
    <tr>
        <th>Date</th>
        <th>Customer</th>
        <th>Mobile</th>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Payment</th>
        <th>Address</th>
        <th>Status</th>
    </tr>
    </thead>

    <tbody>`;

    orders.forEach(order=>{

        const id=order.id;

        const date=order.created_at
        ? new Date(order.created_at)
          .toLocaleString("en-IN")
        : "-";

        const customer=
        order.customer_name ||
        order.name || "-";

        const phone=
        order.phone ||
        order.mobile || "-";

        const address=
        order.address ||
        order.shipping_address || "-";

        const product=getProductName(order);
        const price=getPrice(order);
        const qty=Number(order.quantity || 1);
        const total=Number(order.total || 0);
        const payment=getPayment(order);
        const status=order.status || "Pending";

        html+=`

        <tr>

        <td>${escapeHtml(date)}</td>

        <td>
        <strong>${escapeHtml(customer)}</strong>
        </td>

        <td>${escapeHtml(phone)}</td>

        <td>${escapeHtml(product)}</td>

        <td>${money(price)}</td>

        <td>${qty}</td>

        <td class="green">${money(total)}</td>

        <td>${escapeHtml(payment)}</td>

        <td>${escapeHtml(address)}</td>

        <td>

        <select
        class="status-select"
        id="status-${escapeHtml(id)}">

        ${statusOption("Pending",status)}
        ${statusOption("Confirmed",status)}
        ${statusOption("Packed",status)}
        ${statusOption("Shipped",status)}
        ${statusOption("Delivered",status)}
        ${statusOption("Cancelled",status)}

        </select>

        <button
        class="save-btn"
        id="save-${escapeHtml(id)}"
        onclick="saveOrder('${escapeHtml(id)}')">

        Save

        </button>

        </td>

        </tr>`;
    });

    html+=`
    </tbody>
    </table>
    </div>`;

    box.innerHTML=html;
}


function statusOption(value,current){

    return `
    <option value="${value}"
    ${current===value?"selected":""}>
    ${value}
    </option>`;
}


function filterOrders(){

    const search=
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    if(!search){

        renderOrders(allOrders);
        return;
    }

    const filtered=
    allOrders.filter(order=>{

        const text=
        (
            order.customer_name || "" 
            +" "+(order.name || "")
            +" "+(order.phone || "")
            +" "+(order.mobile || "")
            +" "+getProductName(order)
            +" "+(order.address || "")
        ).toLowerCase();

        return text.includes(search);
    });

    renderOrders(filtered);
}


async function saveOrder(id){

    const select=
    document.getElementById("status-"+id);

    const button=
    document.getElementById("save-"+id);

    if(!select)return;

    button.disabled=true;
    button.innerText="Saving...";

    const {error}=
    await supabaseClient
    .from("orders")
    .update({
        status:select.value
    })
    .eq("id",id);

    if(error){

        alert(error.message);

        button.disabled=false;
        button.innerText="Save";

        return;
    }

    const order=
    allOrders.find(
        item=>String(item.id)===String(id)
    );

    if(order){
        order.status=select.value;
    }

    updateSummary(allOrders);

    button.innerText="✓ Saved";

    setTimeout(()=>{
        button.disabled=false;
        button.innerText="Save";
    },1200);
}


/* ===============================
STOCK
=============================== */

async function loadStock(){

    const content=
    document.getElementById("other-content");

    content.innerHTML=`
    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>INVENTORY</p>
                <h2>Stock Management</h2>
            </div>

            <button class="gold-btn"
                    onclick="loadStock()">
                🔄 Refresh
            </button>

        </div>

        <div id="stockTable">
            <div class="message">
                Loading stock...
            </div>
        </div>

    </div>`;

    const user=await checkAdmin();

    if(!user)return;

    const {data,error}=
    await supabaseClient
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        document.getElementById("stockTable")
        .innerHTML=
        `<div class="message error">
        ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    let html=`
    <div class="table-wrapper">
    <table>

    <thead>
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Minimum</th>
        <th>Status</th>
        <th>Update</th>
    </tr>
    </thead>

    <tbody>`;

    data.forEach(product=>{

        const stock=
        Number(product.stock || 0);

        const minimum=
        Number(product.low_stock || 5);

        let status="In Stock";
        let cls="stock-ok";

        if(stock<=0){
            status="Out of Stock";
            cls="stock-out";
        }
        else if(stock<=minimum){
            status="Low Stock";
            cls="stock-low";
        }

        html+=`
        <tr>

        <td>
        <strong>
        ${escapeHtml(product.name)}
        </strong>
        </td>

        <td>${money(product.price)}</td>

        <td>
        <input
        class="stock-input"
        type="number"
        min="0"
        id="stock-${product.id}"
        value="${stock}">
        </td>

        <td>${minimum}</td>

        <td class="${cls}">
        ${status}
        </td>

        <td>
        <button
        class="save-btn"
        onclick="updateStock('${product.id}')">
        Save
        </button>
        </td>

        </tr>`;
    });

    html+=`
    </tbody>
    </table>
    </div>`;

    document.getElementById("stockTable")
    .innerHTML=html;
}


async function updateStock(id){

    const input=
    document.getElementById("stock-"+id);

    const stock=Number(input.value);

    if(stock<0){
        alert("Stock cannot be negative.");
        return;
    }

    const {error}=
    await supabaseClient
    .from("products")
    .update({stock:stock})
    .eq("id",id);

    if(error){

        alert(error.message);
        return;
    }

    alert("Stock updated successfully.");

    loadStock();
}


/* ===============================
PRODUCTS
=============================== */

async function loadProducts(){

    const content=
    document.getElementById("other-content");

    content.innerHTML=`
    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>LIARA PROFESSIONAL™</p>
                <h2>Products</h2>
            </div>

            <button class="gold-btn"
                    onclick="showAddProduct()">
                ➕ Add Product
            </button>

        </div>

        <div class="tools">

            <div class="search">
                <input
                id="productSearch"
                placeholder="Search product..."
                oninput="filterProducts()">
            </div>

            <button
            class="gold-btn"
            onclick="loadProducts()">
            🔄 Refresh
            </button>

        </div>

        <div id="productGrid">
            <div class="message">
                Loading products...
            </div>
        </div>

    </div>`;

    const user=await checkAdmin();

    if(!user)return;

    const {data,error}=
    await supabaseClient
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        document.getElementById("productGrid")
        .innerHTML=
        `<div class="message error">
        ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    allProducts=data || [];

    renderProducts(allProducts);
}


function renderProducts(products){

    const grid=
    document.getElementById("productGrid");

    if(!products.length){

        grid.innerHTML=
        `<div class="message">
        No products added yet.
        </div>`;

        return;
    }

    let html=`<div class="product-grid">`;

    products.forEach(product=>{

        const image=
        product.image_url ||
        product.image ||
        "";

        html+=`

        <div class="product-card">

        ${
            image
            ?
            `<img
            class="product-image"
            src="${escapeHtml(image)}"
            onerror="this.style.display='none'">`
            :
            `<div
            class="product-image"
            style="display:flex;
            align-items:center;
            justify-content:center;
            font-size:45px;">
            🧴
            </div>`
        }

        <div class="product-info">

        <h3>
        ${escapeHtml(product.name)}
        </h3>

        <div class="product-price">
        ${money(product.price)}
        </div>

        <div class="product-stock">
        Stock:
        ${Number(product.stock || 0)}
        </div>

        <div class="card-actions">

        <button
        class="edit-btn"
        onclick="editProduct('${product.id}')">
        ✏️ Edit
        </button>

        <button
        class="delete-btn"
        onclick="deleteProduct('${product.id}')">
        🗑️ Delete
        </button>

        </div>

        </div>

        </div>`;
    });

    html+=`</div>`;

    grid.innerHTML=html;
}


function filterProducts(){

    const search=
    document.getElementById("productSearch")
    .value
    .toLowerCase()
    .trim();

    if(!search){

        renderProducts(allProducts);
        return;
    }

    renderProducts(
        allProducts.filter(product=>
            String(product.name || "")
            .toLowerCase()
            .includes(search)
        )
    );
}

function showAddProduct(){

    const content=
    document.getElementById("other-content");

    content.innerHTML=`

    <div class="admin-box">

    <div class="admin-header">

        <div>
            <p>LIARA PROFESSIONAL™</p>
            <h2>Add New Product</h2>
        </div>

    </div>

    <form id="productForm"
          onsubmit="addProduct(event)">

    <div class="form-grid">

        <div class="form-group">
            <label>Product Name</label>
            <input
            id="productName"
            required
            placeholder="Example: Herbal Face Wash">
        </div>

        <div class="form-group">
            <label>Price ₹</label>
            <input
            id="productPrice"
            type="number"
            min="0"
            required
            placeholder="299">
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input
            id="productStock"
            type="number"
            min="0"
            value="0"
            required>
        </div>

        <div class="form-group">
            <label>Minimum Stock Alert</label>
            <input
            id="productLowStock"
            type="number"
            min="0"
            value="5"
            required>
        </div>

        <div class="form-group full">
            <label>Product Image URL</label>
            <input
            id="productImage"
            placeholder="https://...">
        </div>

    </div>

    <div class="form-actions">

        <button
        class="gold-btn"
        type="submit">
        ➕ Add Product
        </button>

        <button
        class="cancel-btn"
        type="button"
        onclick="loadProducts()">
        Cancel
        </button>

    </div>

    </form>

    </div>`;
}


async function addProduct(event){

    event.preventDefault();

    const user=await checkAdmin();

    if(!user)return;

    const name=
    document.getElementById("productName").value.trim();

    const price=
    Number(document.getElementById("productPrice").value);

    const stock=
    Number(document.getElementById("productStock").value);

    const low_stock=
    Number(document.getElementById("productLowStock").value);

    const image_url=
    document.getElementById("productImage").value.trim();

    if(!name){

        alert("Product name enter karo.");
        return;
    }

    const {error}=
    await supabaseClient
    .from("products")
    .insert({

        name:name,
        price:price,
        stock:stock,
        low_stock:low_stock,
        image_url:image_url || null

    });

    if(error){

        alert(
            "Product add nahi hoya:\n\n"+
            error.message
        );

        return;
    }

    alert("✅ Product successfully add ho gaya.");

    loadProducts();
}


/* ===============================
EDIT PRODUCT
=============================== */

async function editProduct(id){

    const product=
    allProducts.find(
        p=>String(p.id)===String(id)
    );

    if(!product)return;

    const name=
    prompt(
        "Product name:",
        product.name || ""
    );

    if(name===null)return;

    const price=
    prompt(
        "Price:",
        product.price || 0
    );

    if(price===null)return;

    const stock=
    prompt(
        "Stock:",
        product.stock || 0
    );

    if(stock===null)return;

    const image=
    prompt(
        "Image URL:",
        product.image_url || ""
    );

    if(image===null)return;

    const {error}=
    await supabaseClient
    .from("products")
    .update({

        name:name.trim(),
        price:Number(price),
        stock:Number(stock),
        image_url:image.trim() || null

    })
    .eq("id",id);

    if(error){

        alert(error.message);
        return;
    }

    alert("✅ Product updated.");

    loadProducts();
}


/* ===============================
DELETE
=============================== */

async function deleteProduct(id){

    const product=
    allProducts.find(
        p=>String(p.id)===String(id)
    );

    if(!product)return;

    const yes=
    confirm(
        "Delete "+product.name+"?"
    );

    if(!yes)return;

    const {error}=
    await supabaseClient
    .from("products")
    .delete()
    .eq("id",id);

    if(error){

        alert(
            "Delete failed:\n\n"+
            error.message
        );

        return;
    }

    alert("Product deleted.");

    loadProducts();
}
