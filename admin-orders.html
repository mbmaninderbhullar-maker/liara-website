<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   ADMIN EMAIL
========================= */


/*
   APNA SUPABASE LOGIN EMAIL
   ETHHE PAO
*/


const ADMIN_EMAIL =
    "YOUR-ADMIN-EMAIL@example.com";



/* =========================
   CHECK ADMIN
========================= */


async function checkAdmin() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return null;

    }


    if (
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="error-message">

                Access denied.

            </div>

        `;

        return null;

    }


    return user;

}



/* =========================
   LOAD ORDERS
========================= */


async function loadOrders() {


    const user =
        await checkAdmin();


    if (!user) {

        return;

    }


    const ordersBox =
        document.getElementById(
            "orders"
        );


    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {


        console.log(error);


        ordersBox.innerHTML = `

            <div class="error-message">

                Unable to load orders.

                <br><br>

                ${error.message}

            </div>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {


        ordersBox.innerHTML = `

            <div class="no-orders">

                No customer orders yet.

            </div>

        `;

        return;

    }


    let html = `

        <table class="order-table">

            <thead>

                <tr>

                    <th>
                        Order ID
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Mobile
                    </th>

                    <th>
                        Address
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    data.forEach(
        function(order) {


            let orderDate =
                order.created_at
                    ? new Date(
                        order.created_at
                      ).toLocaleString(
                        "en-IN"
                      )
                    : "-";


            html += `

                <tr>

                    <td>
                        ${order.id || "-"}
                    </td>

                    <td>
                        ${orderDate}
                    </td>

                    <td>
                        ${order.customer_name || "-"}
                    </td>

                    <td>
                        ${order.phone || "-"}
                    </td>

                    <td>
                        ${order.address || "-"}
                    </td>

                    <td>
                        ${order.product || "-"}
                    </td>

                    <td>
                        ${order.quantity || 0}
                    </td>

                    <td>
                        ₹${order.total || 0}
                    </td>

                    <td class="status">

                        ${order.status ||
                         "Order Received"}

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    ordersBox.innerHTML =
        html;

}



/* =========================
   LOGOUT
========================= */


async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "login.html";

}



/* =========================
   START
========================= */


loadOrders();


</script>
