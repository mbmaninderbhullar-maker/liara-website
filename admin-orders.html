<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Orders</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
}

/* =========================
   HEADER
========================= */

header {
    padding: 18px 5%;
    background: white;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

.logo {
    text-decoration: none;
    color: #222;
    display: inline-flex;
    flex-direction: column;
}

.logo span {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo small {
    color: #ad8232;
    letter-spacing: 2px;
}

/* =========================
   SECTION
========================= */

.admin-section {
    padding: 55px 4%;
    min-height: 80vh;
}

.admin-container {
    max-width: 1500px;
    margin: auto;
}

/* =========================
   MAIN BOX
========================= */

.admin-box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

/* =========================
   HEADER
========================= */

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.admin-header p {
    margin: 0 0 6px;
    color: #ad8232;
    font-weight: bold;
    letter-spacing: 1px;
}

.admin-header h2 {
    margin: 0;
}

/* =========================
   BUTTONS
========================= */

button {
    cursor: pointer;
}

.logout-btn,
.refresh-btn,
.save-btn {

    border: none;
    color: white;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: bold;

}

.logout-btn,
.refresh-btn {
    background: #ad8232;
}

.save-btn {
    background: #287a3e;
}

.logout-btn {
    padding: 12px 22px;
}

.refresh-btn {
    margin-bottom: 25px;
}

.save-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================
   DASHBOARD CARDS
========================= */

.dashboard-cards {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

    margin-bottom: 30px;

}

.dashboard-card {

    background: #fff;

    border: 1px solid #eee;

    border-radius: 14px;

    padding: 22px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.05);

}

.dashboard-card span {

    display: block;

    color: #777;

    font-size: 14px;

    margin-bottom: 8px;

}

.dashboard-card strong {

    font-size: 28px;

    color: #222;

}

.sales-card strong {
    color: #287a3e;
}

.pending-card strong {
    color: #ad8232;
}

.delivered-card strong {
    color: #287a3e;
}

/* =========================
   TABLE
========================= */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.order-table {

    width: 100%;

    border-collapse:
        collapse;

    min-width: 1600px;

}

.order-table th,
.order-table td {

    padding: 14px;

    border-bottom:
        1px solid #eee;

    text-align: left;

    vertical-align: top;

}

.order-table th {

    background:
        #f7f1e7;

    font-weight: bold;

    white-space:
        nowrap;

}

.order-table td {

    background:
        white;

}

.order-id {

    font-weight: bold;

}

.date-time {

    white-space:
        nowrap;

    color: #555;

    font-size: 14px;

}

.product-name {

    font-weight:
        bold;

    min-width: 170px;

}

.address {

    max-width: 250px;

    line-height:
        1.5;

}

.amount {

    font-weight:
        bold;

    white-space:
        nowrap;

}

/* =========================
   INPUTS
========================= */

.status-select,
.payment-select,
.tracking-input {

    padding: 9px 10px;

    border:
        1px solid #ddd;

    border-radius: 7px;

    background:
        white;

}

.status-select {

    min-width:
        150px;

}

.payment-select {

    min-width:
        110px;

}

.tracking-input {

    width:
        160px;

}

/* =========================
   MESSAGE
========================= */

.message {

    text-align:
        center;

    padding:
        50px 20px;

    font-weight:
        bold;

}

.error {
    color: #a33;
}

.success {
    color: #287a3e;
}

.saving {
    opacity: .6;
}

/* =========================
   FOOTER
========================= */

footer {

    background:
        #222;

    color:
        white;

    text-align:
        center;

    padding:
        25px;

}

.footer-brand {

    font-size:
        20px;

    font-weight:
        bold;

}

.footer-brand small {

    display:
        block;

    color:
        #ad8232;

    font-size:
        11px;

    letter-spacing:
        2px;

}

footer p {

    margin:
        10px 0 0;

    color:
        #ccc;

    font-size:
        13px;

}

/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    .dashboard-cards {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

@media (max-width: 600px) {

    .admin-section {

        padding:
            35px 3%;

    }

    .admin-box {

        padding:
            18px;

    }

    .admin-header {

        flex-direction:
            column;

        align-items:
            flex-start;

    }

    .logout-btn {

        width:
            100%;

    }

    .dashboard-cards {

        grid-template-columns:
            1fr;

    }

}


/* =========================
   ORDER DETAIL
========================= */

.detail-btn {

    border:
        none;

    background:
        #ad8232;

    color:
        white;

    padding:
        9px 13px;

    border-radius:
        7px;

    font-weight:
        bold;

}


/* =========================
   MODAL
========================= */

.modal {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.55);

    z-index:
        9999;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

}

.modal-box {

    background:
        white;

    width:
        100%;

    max-width:
        600px;

    max-height:
        90vh;

    overflow-y:
        auto;

    border-radius:
        16px;

    padding:
        28px;

}

.modal-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        20px;

}

.close-btn {

    border:
        none;

    background:
        #eee;

    width:
        35px;

    height:
        35px;

    border-radius:
        50%;

    font-size:
        20px;

}

.detail-row {

    padding:
        12px 0;

    border-bottom:
        1px solid #eee;

}

.detail-row strong {

    display:
        block;

    margin-bottom:
        4px;

    color:
        #555;

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">

<span>LIARA</span>

<small>PROFESSIONAL™</small>

</a>

</header>


<section class="admin-section">

<div class="admin-container">

<div class="admin-box">


<!-- =========================
     HEADER
========================= -->

<div class="admin-header">

<div>

<p>LIARA PROFESSIONAL™</p>

<h2>Company Orders Dashboard</h2>

</div>


<button
class="logout-btn"
onclick="logoutAdmin()">

Logout

</button>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard-cards">


<div class="dashboard-card">

<span>Total Orders</span>

<strong id="totalOrders">
0
</strong>

</div>


<div class="dashboard-card sales-card">

<span>Total Sales</span>

<strong id="totalSales">
₹0
</strong>

</div>


<div class="dashboard-card pending-card">

<span>Pending Orders</span>

<strong id="pendingOrders">
0
</strong>

</div>


<div class="dashboard-card delivered-card">

<span>Delivered Orders</span>

<strong id="deliveredOrders">
0
</strong>

</div>


</div>


<button
class="refresh-btn"
onclick="loadOrders()">

🔄 Refresh Orders

</button>


<!-- =========================
     ORDERS
========================= -->

<div id="orders">

<div class="message">

Loading customer orders...

</div>

</div>


</div>

</div>

</section>


<footer>

<div class="footer-brand">

LIARA

<small>
PROFESSIONAL™
</small>

</div>

<p>

© 2026 Liara Group Private Limited.
All Rights Reserved.

</p>

</footer>


<!-- =========================
     ORDER DETAIL MODAL
========================= -->

<div
id="orderModal"
class="modal"
onclick="closeModal(event)">

<div
class="modal-box"
onclick="event.stopPropagation()">

<div class="modal-header">

<h3>
Order Details
</h3>

<button
class="close-btn"
onclick="closeOrderModal()">

×

</button>

</div>


<div id="orderDetails">

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const ADMIN_EMAIL =
"info@liara.co.in";


let allOrders = [];


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin() {

const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if (
error ||
!data ||
!data.user
) {

window.location.href =
"company-login.html";

return null;

}


const user =
data.user;


if (
!user.email ||
user.email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
) {

window.location.href =
"company-login.html";

return null;

}


return user;

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(value) {

if (
value === null ||
value === undefined ||
value === ""
) {

return "-";

}

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   PRODUCT NAME
========================================= */

function getProductName(order) {

return (

order.product_name ||

order.product ||

order.product_title ||

order.item_name ||

order.item ||

order.name ||

"-"

);

}


/* =========================================
   PRODUCT PRICE
========================================= */

function getProductPrice(order) {

return (

order.product_price ||

order.price ||

order.unit_price ||

0

);

}


/* =========================================
   PAYMENT STATUS
========================================= */

function getPaymentStatus(order) {

return (

order.payment_status ||

order.payment ||

"Pending"

);

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {


const box =
document.getElementById("orders");


box.innerHTML = `

<div class="message">

Loading customer orders...

</div>

`;


const user =
await checkAdmin();


if (!user) {

return;

}


try {


const {
data,
error
} =
await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if (error) {

console.error(
"Orders Error:",
error
);


box.innerHTML = `

<div class="message error">

Unable to load orders.

<br><br>

${safe(error.message)}

</div>

`;

return;

}


allOrders =
data || [];


updateDashboard(
allOrders
);


if (
allOrders.length === 0
) {

box.innerHTML = `

<div class="message">

No customer orders yet.

</div>

`;

return;

}


let html = `

<div class="table-wrapper">

<table class="order-table">

<thead>

<tr>

<th>
Order ID
</th>

<th>
Order Date
</th>

<th>
Customer
</th>

<th>
Mobile
</th>

<th>
Product
</th>

<th>
Price
</th>

<th>
Quantity
</th>

<th>
Total
</th>

<th>
Payment
</th>

<th>
Address
</th>

<th>
Status
</th>

<th>
Tracking ID
</th>

<th>
Details
</th>

<th>
Action
</th>

</tr>

</thead>

<tbody>

`;


data.forEach(
function(order) {


let orderDate =
"-";


if (
order.created_at
) {

orderDate =
new Date(
order.created_at
).toLocaleString(
"en-IN",
{
dateStyle:
"medium",
timeStyle:
"short"
}
);

}


const product =
getProductName(order);


const price =
getProductPrice(order);


const payment =
getPaymentStatus(order);


html += `

<tr>

<td class="order-id">

${safe(order.id)}

</td>


<td class="date-time">

${safe(orderDate)}

</td>


<td>

${safe(order.customer_name)}

</td>


<td>

${safe(order.phone)}

</td>


<td class="product-name">

${safe(product)}

</td>


<td class="amount">

₹${safe(price)}

</td>


<td>

${safe(order.quantity || 0)}

</td>


<td class="amount">

₹${safe(order.total || 0)}

</td>


<td>

<select
class="payment-select"
id="payment-${safe(order.id)}">

<option value="Pending"
${payment === "Pending" ? "selected" : ""}>

Pending

</option>

<option value="Paid"
${payment === "Paid" ? "selected" : ""}>

Paid

</option>

<option value="Failed"
${payment === "Failed" ? "selected" : ""}>

Failed

</option>

</select>

</td>


<td class="address">

${safe(order.address)}

</td>


<td>

<select
class="status-select"
id="status-${safe(order.id)}">

<option value="Order Received"
${order.status === "Order Received" ? "selected" : ""}>

Order Received

</option>

<option value="Confirmed"
${order.status === "Confirmed" ? "selected" : ""}>

Confirmed

</option>

<option value="Packed"
${order.status === "Packed" ? "selected" : ""}>

Packed

</option>

<option value="Shipped"
${order.status === "Shipped" ? "selected" : ""}>

Shipped

</option>

<option value="Delivered"
${order.status === "Delivered" ? "selected" : ""}>

Delivered

</option>

<option value="Cancelled"
${order.status === "Cancelled" ? "selected" : ""}>

Cancelled

</option>

</select>

</td>


<td>

<input
type="text"
class="tracking-input"
id="tracking-${safe(order.id)}"
value="${safe(order.tracking_id || "")}"
placeholder="Tracking ID">

</td>


<td>

<button
class="detail-btn"
onclick="showOrderDetails('${safe(order.id)}')">

View

</button>

</td>


<td>

<button
class="save-btn"
id="save-${safe(order.id)}"
onclick="saveOrder('${safe(order.id)}')">

Save

</button>

</td>


</tr>

`;

});


html += `

</tbody>

</table>

</div>

`;


box.innerHTML =
html;


}

catch (error) {

console.error(error);


box.innerHTML = `

<div class="message error">

Something went wrong.

<br><br>

${safe(error.message)}

</div>

`;

}

}


/* =========================================
   DASHBOARD
========================================= */

function updateDashboard(
orders
) {


let totalSales =
0;


let pending =
0;


let delivered =
0;


orders.forEach(
function(order) {


totalSales +=
Number(
order.total || 0
);


const status =
String(
order.status || ""
).toLowerCase();


if (
status !== "delivered" &&
status !== "cancelled"
) {

pending++;

}


if (
status === "delivered"
) {

delivered++;

}

});


document.getElementById(
"totalOrders"
).innerText =
orders.length;


document.getElementById(
"totalSales"
).innerText =
"₹" +
totalSales.toLocaleString(
"en-IN"
);


document.getElementById(
"pendingOrders"
).innerText =
pending;


document.getElementById(
"deliveredOrders"
).innerText =
delivered;

}


/* =========================================
   SAVE ORDER
========================================= */

async function saveOrder(
orderId
) {


const status =
document.getElementById(
"status-" + orderId
).value;


const tracking =
document.getElementById(
"tracking-" + orderId
).value.trim();


const payment =
document.getElementById(
"payment-" + orderId
).value;


const button =
document.getElementById(
"save-" + orderId
);


button.disabled =
true;


button.classList.add(
"saving"
);


button.innerText =
"Saving...";


try {


const updateData = {

status:
status,

tracking_id:
tracking || null

};


/*
   Payment column exists
   only if your orders table
   has payment_status.
*/

updateData.payment_status =
payment;


const {
error
} =
await supabaseClient

.from("orders")

.update(
updateData
)

.eq(
"id",
orderId
);


if (error) {

console.error(
"Update Error:",
error
);


alert(
"Unable to update order:\n\n" +
error.message
);


button.disabled =
false;


button.classList.remove(
"saving"
);


button.innerText =
"Save";


return;

}


button.innerText =
"✓ Saved";


button.classList.remove(
"saving"
);


setTimeout(
function() {

button.disabled =
false;

button.innerText =
"Save";

},
1500
);


}

catch (error) {

console.error(error);


alert(
"Something went wrong:\n\n" +
error.message
);


button.disabled =
false;


button.classList.remove(
"saving"
);


button.innerText =
"Save";

}

}


/* =========================================
   VIEW ORDER DETAILS
========================================= */

function showOrderDetails(
orderId
) {


const order =
allOrders.find(
function(item) {

return String(
item.id
) === String(
orderId
);

}
);


if (!order) {

return;

}


const product =
getProductName(order);


const price =
getProductPrice(order);


const payment =
getPaymentStatus(order);


let date =
"-";


if (
order.created_at
) {

date =
new Date(
order.created_at
).toLocaleString(
"en-IN",
{
dateStyle:
"full",
timeStyle:
"short"
}
);

}


document.getElementById(
"orderDetails"
).innerHTML = `

<div class="detail-row">

<strong>
Order ID
</strong>

${safe(order.id)}

</div>


<div class="detail-row">

<strong>
Order Date
</strong>

${safe(date)}

</div>


<div class="detail-row">

<strong>
Customer Name
</strong>

${safe(order.customer_name)}

</div>


<div class="detail-row">

<strong>
Mobile
</strong>

${safe(order.phone)}

</div>


<div class="detail-row">

<strong>
Product
</strong>

${safe(product)}

</div>


<div class="detail-row">

<strong>
Product Price
</strong>

₹${safe(price)}

</div>


<div class="detail-row">

<strong>
Quantity
</strong>

${safe(order.quantity)}

</div>


<div class="detail-row">

<strong>
Total Amount
</strong>

₹${safe(order.total)}

</div>


<div class="detail-row">

<strong>
Payment Status
</strong>

${safe(payment)}

</div>


<div class="detail-row">

<strong>
Delivery Address
</strong>

${safe(order.address)}

</div>


<div class="detail-row">

<strong>
Order Status
</strong>

${safe(order.status)}

</div>


<div class="detail-row">

<strong>
Tracking ID
</strong>

${safe(order.tracking_id)}

</div>

`;


document.getElementById(
"orderModal"
).style.display =
"flex";

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeOrderModal() {

document.getElementById(
"orderModal"
).style.display =
"none";

}


function closeModal(event) {

if (
event.target.id ===
"orderModal"
) {

closeOrderModal();

}

}


/* =========================================
   LOGOUT
========================================= */

async function logoutAdmin() {


await supabaseClient
.auth
.signOut();


window.location.href =
"company-login.html";

}


/* =========================================
   START
========================================= */

loadOrders();


</script>

</body>

</html>
