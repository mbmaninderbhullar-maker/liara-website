          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Customer Orders</title>

        .admin-section {

        .refresh-btn {

            font-weight: bold;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;

        .order-table th,
        .order-table td {
            padding: 14px;

            text-align: left;

        }

        .order-table th {
            background: #f7f1e7;
        }

        .status {
            color: #ad8232;
            font-weight: bold;
        }

        .message {
            text-align: center;
            padding: 40px 20px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>LIARA</span>

        <small>PROFESSIONAL™</small>

    </a>

</header>



<section class="admin-section">

    <div class="admin-container">

        <div class="admin-box">


            <div class="admin-header">

                <div>

                    <p>
                        LIARA PROFESSIONAL™
                    </p>

                    <h2>
                        Customer Orders
                    </h2>

                </div>


                <button
                    class="logout-btn"
                    onclick="logoutAdmin()">

                    Logout

                </button>

            </div>


            <button
                class="refresh-btn"
                onclick="loadOrders()">

                🔄 Refresh Orders

            </button>


            <div id="orders">

                <div class="message">
                    Checking company login...
                </div>

            </div>


        </div>

    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>PROFESSIONAL™</small>

    </div>

    <p>
        © 2026 Liara Group Private Limited.
        All Rights Reserved.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE
===================================== */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_y_K_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";


/* =====================================
   LOAD ORDERS
===================================== */


async function loadOrders() {

    const box =
        document.getElementById("orders");


    box.innerHTML = `
        <div class="message">
            Checking login...
        </div>
    `;


    /* GET CURRENT USER */

    const {
        data: userData,
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError) {

        console.log(userError);

        box.innerHTML = `
            <div class="message">
                ${userError.message}
            </div>
        `;

        return;

    }


    const user =
        userData.user;


    if (!user) {

        window.location.href =
            "company-login.html";

        return;

    }


    /* CHECK COMPANY ACCOUNT */

    if (
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        box.innerHTML = `
            <div class="message">

                Access denied.

                <br><br>

                Logged in account:
                ${user.email}

            </div>
        `;

        return;

    }


    box.innerHTML = `
        <div class="message">
            Loading customer orders...
        </div>
    `;


    /* GET ORDERS */

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order("id", {
            ascending: false
        });


    if (error) {

        console.log(error);

        box.innerHTML = `
            <div class="message">

                Unable to load orders.

                <br><br>

                ${error.message}

            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        box.innerHTML = `
            <div class="message">
                No customer orders yet.
            </div>
        `;

        return;

    }


    let html = `

        <table class="order-table">

            <thead>

                <tr>

                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

    `;


    data.forEach(function(order) {

        html += `

            <tr>

                <td>
                    ${order.id || "-"}
                </td>

                <td>
                    ${order.customer_name || "-"}
                </td>

                <td>
                    ${order.phone || "-"}
                </td>

                <td>
                    ${order.address || "-"}
                </td>

                <td>
                    ${order.quantity || 0}
                </td>

                <td>
                    ₹${order.total || 0}
                </td>

                <td class="status">
                    ${order.status || "Order Received"}
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    box.innerHTML = html;

}



/* =====================================
   LOGOUT
===================================== */


async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "company-login.html";

}


/* =====================================
   START
===================================== */


loadOrders();


</script>


</body>

</html>
