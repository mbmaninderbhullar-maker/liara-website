<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#faf8f5;
    color:#222;
}

.sidebar{
    width:235px;
    min-height:100vh;
    background:#211d18;
    padding:25px 15px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
}

.sidebar-title{
    color:#c89b4b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    padding:5px 15px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 14px;
    border-radius:9px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.side-menu button:hover{
    background:#302a22;
    color:#fff;
}

.side-menu button.active{
    background:#ad8232;
    color:#fff;
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

.dashboard-main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
}

.dashboard-header{
    height:78px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:900;
}

.logo{
    font-size:23px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo small{
    display:block;
    color:#ad8232;
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:white;
    border-radius:8px;
    padding:10px 13px;
    font-size:18px;
    cursor:pointer;
}

.admin-section{
    padding:35px 3%;
}

.admin-container{
    max-width:1550px;
    margin:auto;
}

.admin-box{
    background:#fff;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.admin-header p,
.form-title p{
    margin:0 0 5px;
    color:#ad8232;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2{
    margin:0;
    font-size:30px;
}

.btn{
    border:0;
    background:#ad8232;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#866326;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.summary-card{
    border:1px solid #eee;
    border-radius:15px;
    padding:23px;
    background:#fff;
}

.summary-card span{
    color:#777;
    font-size:14px;
}

.summary-card strong{
    display:block;
    font-size:29px;
    margin-top:10px;
}

.sales strong,
.delivered strong{
    color:#287a3e;
}

.pending strong{
    color:#ad8232;
}

.order-tools{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

.order-table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
    font-size:12px;
}

.order-table th{
    background:#f7f1e7;
    padding:13px 7px;
    text-align:left;
}

.order-table td{
    padding:12px 7px;
    border-bottom:1px solid #eee;
    vertical-align:middle;
}

.product-name{
    font-weight:bold;
}

.price{
    font-weight:bold;
}

.total{
    color:#287a3e;
    font-weight:bold;
}

.payment-badge{
    background:#f3eee5;
    color:#8c6a28;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
}

.status-select{
    width:100%;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.save-btn,
.stock-save{
    border:0;
    background:#287a3e;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-top:6px;
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-weight:bold;
}

.error{
    color:#a33;
}

/* ADD PRODUCT */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-family:inherit;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.upload-box{
    border:2px dashed #d2b477;
    border-radius:12px;
    padding:25px;
    text-align:center;
    background:#fffdf9;
}

.upload-box input{
    margin-top:15px;
}

.photo-preview{
    margin-top:18px;
    display:none;
}

.photo-preview img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

.upload-status{
    margin-top:10px;
    font-size:13px;
    color:#287a3e;
    font-weight:bold;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.clear-btn{
    border:1px solid #ddd;
    background:white;
    color:#555;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

/* PRODUCTS */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    border:1px solid #eee;
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.product-card-image{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#f5f2ed;
}

.product-card-body{
    padding:17px;
}

.product-card h3{
    margin:0 0 7px;
    font-size:17px;
}

.product-description{
    color:#777;
    font-size:13px;
    min-height:38px;
    margin-bottom:12px;
}

.product-price{
    font-size:20px;
    font-weight:bold;
    color:#287a3e;
}

.product-stock{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

.product-card-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.product-card-actions button{
    flex:1;
    border:0;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.delete-product{
    background:#f5dddd;
    color:#a33;
}

.update-product-stock{
    background:#e8f2e9;
    color:#287a3e;
}

.stock-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.stock-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stock-card{
    border:1px solid #eee;
    border-radius:15px;
    padding:22px;
}

.stock-card span{
    color:#777;
}

.stock-card strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.stock-input{
    width:90px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.stock-ok{color:#287a3e;font-weight:bold}
.stock-low{color:#ad8232;font-weight:bold}
.stock-out{color:#b22;font-weight:bold}

.sidebar-overlay{
    display:none;
}

@media(max-width:1100px){
    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
        margin-right:15px;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:950;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .summary-grid,
    .product-grid,
    .stock-cards{
        grid-template-columns:1fr;
    }

    .admin-header,
    .stock-header,
    .order-tools{
        flex-direction:column;
        align-items:stretch;
    }

    .admin-box{
        padding:18px;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
        COMPANY PANEL
    </div>

    <div class="side-menu">

        <button class="active"
            onclick="showSection('orders',this)">
            🛒 Orders
        </button>

        <button onclick="showSection('sales',this)">
            💰 Sales
        </button>

        <button onclick="showSection('stock',this)">
            📦 Stock
        </button>

        <button onclick="showSection('add-product',this)">
            ➕ Add Product
        </button>

        <button onclick="showSection('products',this)">
            🧴 Products
        </button>

        <button onclick="showSection('customers',this)">
            👥 Customers
        </button>

        <button onclick="showSection('reports',this)">
            📊 Reports
        </button>

        <button onclick="showSection('delivery',this)">
            🚚 Delivery
        </button>

        <button onclick="showSection('notifications',this)">
            🔔 Notifications
        </button>

        <button onclick="showSection('settings',this)">
            ⚙️ Settings
        </button>

        <button class="logout-side"
            onclick="logoutAdmin()">
            🚪 Logout
        </button>

    </div>
</aside>

<div class="sidebar-overlay"
     id="sidebarOverlay"
     onclick="closeSidebar()">
</div>

<main class="dashboard-main">

<header class="dashboard-header">

    <button class="mobile-menu-btn"
        onclick="openSidebar()">
        ☰
    </button>

    <div class="logo">
        LIARA
        <small>PROFESSIONAL™</small>
    </div>

</header>


<!-- ORDERS -->

<section class="admin-section"
         id="orders-section">

<div class="admin-container">

<div class="admin-box">

<div class="admin-header">

<div>
<p>LIARA PROFESSIONAL™</p>
<h2>Company Orders Dashboard</h2>
</div>

<button class="btn"
    onclick="logoutAdmin()">
    Logout
</button>

</div>

<div class="summary-grid">

<div class="summary-card">
<span>Total Orders</span>
<strong id="totalOrders">0</strong>
</div>

<div class="summary-card sales">
<span>Total Sales</span>
<strong id="totalSales">₹0</strong>
</div>

<div class="summary-card pending">
<span>Pending Orders</span>
<strong id="pendingOrders">0</strong>
</div>

<div class="summary-card delivered">
<span>Delivered Orders</span>
<strong id="deliveredOrders">0</strong>
</div>

</div>

<div class="order-tools">

<div class="search-box">
<input
    id="searchInput"
    placeholder="Search customer, mobile, product..."
    oninput="filterOrders()">
</div>

<button class="btn"
    onclick="loadOrders()">
    🔄 Refresh Orders
</button>

</div>

<div id="orders">
<div class="message">
Loading customer orders...
</div>
</div>

</div>
</div>
</section>


<!-- OTHER SECTION -->

<section class="admin-section"
         id="other-section"
         style="display:none;">

<div class="admin-container">
<div id="other-content"></div>
</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

const IMAGE_BUCKET =
"product-images";

let allOrders = [];
let allProducts = [];


/* MENU */

function showSection(section,button){

    document.querySelectorAll(
        ".side-menu button"
    ).forEach(btn=>{
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    document.getElementById(
        "orders-section"
    ).style.display =
        section === "orders"
        ? "block"
        : "none";

    document.getElementById(
        "other-section"
    ).style.display =
        section === "orders"
        ? "none"
        : "block";

    if(section==="stock"){
        loadStock();
    }
    else if(section==="add-product"){
        showAddProduct();
    }
    else if(section==="products"){
        loadProducts();
    }
    else{
        showPlaceholder(section);
    }

    closeSidebar();
}


/* PLACEHOLDER */

function showPlaceholder(section){

    const details={

        sales:[
            "💰",
            "Sales",
            "Sales management will appear here."
        ],

        customers:[
            "👥",
            "Customers",
            "Customer management will appear here."
        ],

        reports:[
            "📊",
            "Reports",
            "Business reports will appear here."
        ],

        delivery:[
            "🚚",
            "Delivery",
            "Delivery management will appear here."
        ],

        notifications:[
            "🔔",
            "Notifications",
            "Notifications will appear here."
        ],

        settings:[
            "⚙️",
            "Settings",
            "Dashboard settings will appear here."
        ]

    };

    const d=details[section];

    document.getElementById(
        "other-content"
    ).innerHTML=`

        <div class="admin-box"
             style="text-align:center;padding:80px 30px">

            <div style="font-size:50px">
                ${d ? d[0] : "📦"}
            </div>

            <h2>
                ${d ? d[1] : "Section"}
            </h2>

            <p style="color:#777">
                ${d ? d[2] : ""}
            </p>

        </div>
    `;
}


/* MOBILE */

function openSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.add("open");

    document.getElementById(
        "sidebarOverlay"
    ).classList.add("show");
}

function closeSidebar(){

    document.getElementById(
        "sidebar"
    ).classList.remove("open");

    document.getElementById(
        "sidebarOverlay"
    ).classList.remove("show");
}


/* ADMIN */

async function checkAdmin(){

    const {data,error} =
        await supabaseClient.auth.getUser();

    if(error || !data || !data.user){

        window.location.href =
            "company-login.html";

        return null;
    }

    if(
        !data.user.email ||
        data.user.email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
    ){

        window.location.href =
            "company-login.html";

        return null;
    }

    return data.user;
}


/* MONEY */

function money(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");
}


/* ESCAPE */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ORDERS */

async function loadOrders(){

    const box =
        document.getElementById("orders");

    box.innerHTML=`
        <div class="message">
            Loading customer orders...
        </div>
    `;

    const user=await checkAdmin();

    if(!user)return;

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        box.innerHTML=`
            <div class="message error">
                Unable to load orders.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    allOrders=data || [];

    updateSummary(allOrders);
    renderOrders(allOrders);
}


function updateSummary(orders){

    let sales=0;
    let pending=0;
    let delivered=0;

    orders.forEach(order=>{

        sales += Number(
            order.total || 0
        );

        const status=String(
            order.status || "Pending"
        ).toLowerCase();

        if(status==="delivered"){
            delivered++;
        }

        if([
            "pending",
            "confirmed",
            "packed",
            "shipped",
            "order received"
        ].includes(status)){
            pending++;
        }
    });

    document.getElementById(
        "totalOrders"
    ).innerText=orders.length;

    document.getElementById(
        "totalSales"
    ).innerText=money(sales);

    document.getElementById(
        "pendingOrders"
    ).innerText=pending;

    document.getElementById(
        "deliveredOrders"
    ).innerText=delivered;
}


function productName(order){

    return order.product_name ||
           order.product ||
           order.productName ||
           order.item_name ||
           order.item ||
           "Product";
}


function productPrice(order){

    if(order.price != null){
        return Number(order.price);
    }

    if(order.unit_price != null){
        return Number(order.unit_price);
    }

    const qty=Number(
        order.quantity || 1
    );

    return qty
        ? Number(order.total || 0)/qty
        : 0;
}


function payment(order){

    return order.payment_status ||
           order.payment_method ||
           order.payment ||
           "Pending";
}


function renderOrders(orders){

    const box=
        document.getElementById("orders");

    if(!orders.length){

        box.innerHTML=`
            <div class="message">
                No customer orders yet.
            </div>
        `;

        return;
    }

    let html=`

    <div class="table-wrapper">

    <table class="order-table">

    <thead>
    <tr>
        <th>Order Date</th>
        <th>Customer</th>
        <th>Mobile</th>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Payment</th>
        <th>Address</th>
        <th>Status</th>
    </tr>
    </thead>

    <tbody>
    `;

    orders.forEach(order=>{

        const id=String(order.id);

        const date=order.created_at
            ? new Date(
                order.created_at
              ).toLocaleString(
                "en-IN"
              )
            : "-";

        const customer=
            order.customer_name ||
            order.name || "-";

        const phone=
            order.phone ||
            order.mobile || "-";

        const address=
            order.address ||
            order.shipping_address || "-";

        const product=
            productName(order);

        const price=
            productPrice(order);

        const qty=
            Number(order.quantity || 1);

        const total=
            Number(order.total || 0);

        const pay=
            payment(order);

        const status=
            order.status || "Pending";

        html+=`

        <tr>

        <td>${escapeHtml(date)}</td>

        <td>
            <strong>
                ${escapeHtml(customer)}
            </strong>
        </td>

        <td>${escapeHtml(phone)}</td>

        <td class="product-name">
            ${escapeHtml(product)}
        </td>

        <td class="price">
            ${money(price)}
        </td>

        <td>${qty}</td>

        <td class="total">
            ${money(total)}
        </td>

        <td>
            <span class="payment-badge">
                ${escapeHtml(pay)}
            </span>
        </td>

        <td>${escapeHtml(address)}</td>

        <td>

            <select
                class="status-select"
                id="status-${escapeHtml(id)}">

                ${statusOption("Pending",status)}
                ${statusOption("Confirmed",status)}
                ${statusOption("Packed",status)}
                ${statusOption("Shipped",status)}
                ${statusOption("Delivered",status)}
                ${statusOption("Cancelled",status)}

            </select>

            <button
                class="save-btn"
                onclick="saveOrder('${escapeHtml(id)}')">

                Save

            </button>

        </td>

        </tr>
        `;
    });

    html+=`
    </tbody>
    </table>
    </div>
    `;

    box.innerHTML=html;
}


function statusOption(value,current){

    return `
    <option value="${value}"
        ${current===value
            ? "selected"
            : ""}>
        ${value}
    </option>
    `;
}


function filterOrders(){

    const search=
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();

    if(!search){

        renderOrders(allOrders);
        return;
    }

    const filtered=
        allOrders.filter(order=>{

            const text=
                (
                    order.customer_name || ""
                )+" "+
                (
                    order.name || ""
                )+" "+
                (
                    order.phone || ""
                )+" "+
                (
                    order.mobile || ""
                )+" "+
                productName(order)+" "+
                (
                    order.address || ""
                );

            return text
                .toLowerCase()
                .includes(search);
        });

    renderOrders(filtered);
}


async function saveOrder(id){

    const select=
        document.getElementById(
            "status-"+id
        );

    if(!select)return;

    const {error}=
        await supabaseClient
        .from("orders")
        .update({
            status:select.value
        })
        .eq("id",id);

    if(error){

        alert(
            "Unable to update order:\n\n"+
            error.message
        );

        return;
    }

    const order=
        allOrders.find(
            x=>String(x.id)===String(id)
        );

    if(order){
        order.status=select.value;
    }

    updateSummary(allOrders);

    alert("Order status updated.");
}

/* PHOTO PREVIEW */

function previewPhoto(event){

    const file=
        event.target.files[0];

    if(!file)return;

    const preview=
        document.getElementById(
            "previewImage"
        );

    const box=
        document.getElementById(
            "photoPreview"
        );

    preview.src=
        URL.createObjectURL(file);

    box.style.display="block";
}


/* SAVE PRODUCT */

async function saveProduct(){

    const name=
        document.getElementById(
            "productNameInput"
        ).value.trim();

    const price=
        Number(
            document.getElementById(
                "productPriceInput"
            ).value
        );

    const stock=
        Number(
            document.getElementById(
                "productStockInput"
            ).value || 0
        );

    const lowStock=
        Number(
            document.getElementById(
                "productLowStockInput"
            ).value || 5
        );

    const description=
        document.getElementById(
            "productDescriptionInput"
        ).value.trim();

    const file=
        document.getElementById(
            "productPhotoInput"
        ).files[0];

    const status=
        document.getElementById(
            "uploadStatus"
        );

    if(!name){

        alert("Product name pao.");
        return;
    }

    if(!price || price<0){

        alert("Product price pao.");
        return;
    }

    if(!file){

        alert("Product photo upload karo.");
        return;
    }

    if(stock<0){

        alert("Stock negative nahi ho sakda.");
        return;
    }

    const user=
        await checkAdmin();

    if(!user)return;

    status.innerText=
        "Uploading photo...";

    try{

        const extension=
            file.name
            .split(".")
            .pop()
            .toLowerCase();

        const fileName=
            Date.now()+
            "-" +
            Math.random()
            .toString(36)
            .substring(2)+
            "."+
            extension;

        const filePath=
            "products/"+fileName;

        const upload=
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );

        if(upload.error){

            status.innerText="";

            alert(
                "Photo upload failed:\n\n"+
                upload.error.message
            );

            return;
        }

        status.innerText=
            "Photo uploaded. Saving product...";

        const publicData=
            supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .getPublicUrl(filePath);

        const imageUrl=
            publicData.data.publicUrl;

        const insert=
            await supabaseClient
            .from("products")
            .insert({

                name:name,

                price:price,

                stock:stock,

                low_stock:lowStock,

                description:description,

                image_url:imageUrl

            })
            .select()
            .single();

        if(insert.error){

            status.innerText="";

            alert(
                "Product save failed:\n\n"+
                insert.error.message+
                "\n\nPhoto upload ho chukki aa."
            );

            return;
        }

        status.innerText=
            "✓ Product saved successfully.";

        alert(
            "Product successfully add ho gaya."
        );

        clearProductForm();

    }
    catch(error){

        console.error(error);

        status.innerText="";

        alert(
            "Something went wrong:\n\n"+
            error.message
        );
    }
}


/* CLEAR FORM */

function clearProductForm(){

    const ids=[

        "productPriceInput",

    ];

    ids.forEach(id=>{
        const el=document.getElementById(id);
        if(el)el.value="";
    });

    const stock=
        document.getElementById(
            "productStockInput"
        );

    if(stock)stock.value="0";

    const low=
        document.getElementById(
            "productLowStockInput"
        );

    if(low)low.value="5";

    const photo=
        document.getElementById(
            "productPhotoInput"
        );

    if(photo)photo.value="";

    const preview=
        document.getElementById(
            "photoPreview"
        );

    if(preview)preview.style.display="none";

    const status=
        document.getElementById(
            "uploadStatus"
        );

    if(status)status.innerText="";
}


/* PRODUCTS */

async function loadProducts(){

    document.getElementById(
        "other-content"
    ).innerHTML=`

        <div class="admin-box">

            <div class="admin-header">

                <div>
                    <p>PRODUCT MANAGEMENT</p>
                    <h2>🧴 Products</h2>
                </div>

                <button
                    class="btn"
                    onclick="showAddProduct()">
                    ➕ Add Product
                </button>

            </div>

            <div id="productsList">
                <div class="message">
                    Loading products...
                </div>
            </div>

        </div>
    `;

    const user=
        await checkAdmin();

    if(!user)return;

    const {data,error}=
        await supabaseClient
        .from("products")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        document.getElementById(
            "productsList"
        ).innerHTML=`

            <div class="message error">
                Unable to load products.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }

    allProducts=data || [];

    renderProducts(allProducts);
}


function renderProducts(products){

    const box=
        document.getElementById(
            "productsList"
        );

    if(!products.length){

        box.innerHTML=`

            <div class="message">

                No products added yet.

                <br><br>

                Click "Add Product" to add your first product.

            </div>
        `;

        return;
    }

    let html=
        `<div class="product-grid">`;

    products.forEach(product=>{

        const stock=
            Number(product.stock || 0);

        let stockText=
            "Stock: "+stock;

        let stockClass=
            "stock-ok";

        if(stock<=0){
            stockText="Out of Stock";
            stockClass="stock-out";
        }
        else if(
            stock<=Number(
                product.low_stock || 5
            )
        ){
            stockText=
                "Low Stock: "+stock;
            stockClass="stock-low";
        }

        const image=
            product.image_url ||
            "";

        html+=`

        <div class="product-card">

            ${
                image
                ?
                `<img
                    class="product-card-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}">`
                :
                `<div
                    class="product-card-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;">
                    🧴
                </div>`
            }

            <div class="product-card-body">

                <h3>
                    ${escapeHtml(product.name)}
                </h3>

                <div class="product-description">
                    ${escapeHtml(
                        product.description || ""
                    )}
                </div>

                <div class="product-price">
                    ${money(product.price)}
                </div>

                <div
                    class="product-stock ${stockClass}">
                    ${stockText}
                </div>

                <div class="product-card-actions">

                    <button
                        class="update-product-stock"
                        onclick="editProductStock('${escapeHtml(String(product.id))}')">
                        ✏️ Stock
                    </button>

                    <button
                        class="delete-product"
                        onclick="deleteProduct('${escapeHtml(String(product.id))}')">
                        🗑️ Delete
                    </button>

                </div>

            </div>

        </div>
        `;
    });

    html+="</div>";

    box.innerHTML=html;
}


/* EDIT STOCK */

async function editProductStock(id){

    const product=
        allProducts.find(
            p=>String(p.id)===String(id)
        );

    if(!product)return;

    const value=
        prompt(
            "New stock quantity:",
            product.stock || 0
        );

    if(value===null)return;

    const stock=
        Number(value);

    if(
        !Number.isInteger(stock) ||
        stock<0
    ){

        alert(
            "Valid stock quantity pao."
        );

        return;
    }

    const {error}=
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);

    if(error){

        alert(
            "Stock update failed:\n\n"+
            error.message
        );

        return;
    }

    alert("Stock updated successfully.");

    loadProducts();
}


/* DELETE PRODUCT */

async function deleteProduct(id){

    const product=
        allProducts.find(
            p=>String(p.id)===String(id)
        );

    if(!product)return;

    const yes=
        confirm(
            "Delete \""+
            product.name+
            "\"?"
        );

    if(!yes)return;

    const {error}=
        await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Product delete failed:\n\n"+
            error.message
        );

        return;
    }

    alert(
        "Product deleted successfully."
    );

    loadProducts();
}

async function loadStock(){

    document.getElementById(

            </div>

function renderStock(products){

    let low=0;
    let out=0;

    products.forEach(product=>{

        const stock=
            Number(product.stock || 0);

        const minimum=
            Number(product.low_stock || 5);

        if(stock<=0){
            out++;
        }
        else if(stock<=minimum){
            low++;
        }
    });

    document.getElementById(
        "stockTotal"
    ).innerText=products.length;

    document.getElementById(
        "stockLow"
    ).innerText=low;

    document.getElementById(
        "stockOut"
    ).innerText=out;

    if(!products.length){

        document.getElementById(
            "stockTable"
        ).innerHTML=`

        <div class="message">
            No products added yet.
        </div>
        `;

        return;
    }

    let html=`

    <div class="table-wrapper">

    <table class="order-table">

    <thead>
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Minimum</th>
        <th>Status</th>
        <th>Update</th>
    </tr>
    </thead>

    <tbody>
    `;

    products.forEach(product=>{

        const stock=
            Number(product.stock || 0);

        const minimum=
            Number(product.low_stock || 5);

        let status="In Stock";
        let cls="stock-ok";

        if(stock<=0){

            status="Out of Stock";
            cls="stock-out";

        }
        else if(stock<=minimum){

            status="Low Stock";
            cls="stock-low";
        }

        html+=`

        <tr>

            <td>
                <strong>
                    ${escapeHtml(product.name)}
                </strong>
            </td>

            <td>
                ${money(product.price)}
            </td>

            <td>

                <input
                    class="stock-input"
                    id="stock-${escapeHtml(String(product.id))}"
                    type="number"
                    min="0"
                    value="${stock}">

            </td>

            <td>
                ${minimum}
            </td>

            <td class="${cls}">
                ${status}
            </td>

            <td>

                <button
                    class="stock-save"
                    onclick="updateStock('${escapeHtml(String(product.id))}')">
                    Save
                </button>

            </td>

        </tr>
        `;
    });

    html+=`
    </tbody>
    </table>
    </div>
    `;

    document.getElementById(
        "stockTable"
    ).innerHTML=html;
}


async function updateStock(id){

    const input=
        document.getElementById(
            "stock-"+id
        );

    if(!input)return;

    const stock=
        Number(input.value);

    if(
        !Number.isInteger(stock) ||
        stock<0
    ){

        alert(
            "Valid stock quantity pao."
        );

        return;
    }

    const {error}=
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);

    if(error){

        alert(
            "Stock update failed:\n\n"+
            error.message
        );

        return;
    }

    alert("Stock updated successfully.");

    loadStock();
}
