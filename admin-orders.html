<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Orders</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================
   COMPANY ORDERS DASHBOARD
========================================= */

.admin-section {
    padding: 45px 4%;
    background: #faf8f5;
    min-height: 80vh;
}

.admin-container {
    max-width: 1550px;
    margin: auto;
}

.admin-box {
    background: #fff;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}


/* HEADER */

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.admin-header p {
    margin: 0 0 5px;
    color: #ad8232;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
}

.admin-header h2 {
    margin: 0;
    font-size: 32px;
}

.logout-btn {
    border: none;
    background: #ad8232;
    color: white;
    padding: 13px 23px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.logout-btn:hover {
    background: #866326;
}


/* =========================================
   SUMMARY CARDS
========================================= */

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.summary-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 7px 25px rgba(0,0,0,.05);
}

.summary-card span {
    display: block;
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
}

.summary-card strong {
    display: block;
    font-size: 30px;
    color: #222;
}

.summary-card.sales strong {
    color: #287a3e;
}

.summary-card.pending strong {
    color: #ad8232;
}

.summary-card.delivered strong {
    color: #287a3e;
}


/* =========================================
   TOOLS
========================================= */

.order-tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.search-box {
    flex: 1;
    max-width: 450px;
}

.search-box input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.search-box input:focus {
    border-color: #ad8232;
}

.refresh-btn {
    border: none;
    background: #ad8232;
    color: white;
    padding: 13px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #866326;
}


/* =========================================
   ORDERS TABLE
========================================= */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #eee;
    border-radius: 12px;
}

.order-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 12px;
}

.order-table th {
    background: #f7f1e7;
    color: #222;
    font-size: 11px;
    font-weight: bold;
    padding: 13px 7px;
    text-align: left;
    border-bottom: 1px solid #e7dfd2;
}

.order-table td {
    padding: 12px 7px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
    word-break: break-word;
    overflow-wrap: anywhere;
}

.order-table tbody tr:hover {
    background: #fffdf9;
}


/* COLUMN WIDTHS */

.order-table th:nth-child(1),
.order-table td:nth-child(1) {
    width: 10%;
}

.order-table th:nth-child(2),
.order-table td:nth-child(2) {
    width: 9%;
}

.order-table th:nth-child(3),
.order-table td:nth-child(3) {
    width: 10%;
}

.order-table th:nth-child(4),
.order-table td:nth-child(4) {
    width: 16%;
}

.order-table th:nth-child(5),
.order-table td:nth-child(5) {
    width: 7%;
}

.order-table th:nth-child(6),
.order-table td:nth-child(6) {
    width: 5%;
    text-align: center;
}

.order-table th:nth-child(7),
.order-table td:nth-child(7) {
    width: 8%;
}

.order-table th:nth-child(8),
.order-table td:nth-child(8) {
    width: 8%;
}

.order-table th:nth-child(9),
.order-table td:nth-child(9) {
    width: 14%;
}

.order-table th:nth-child(10),
.order-table td:nth-child(10) {
    width: 13%;
}


/* PRODUCT */

.product-name {
    font-weight: bold;
    color: #333;
}

.price {
    font-weight: bold;
}

.total {
    color: #287a3e;
    font-weight: bold;
}


/* PAYMENT */

.payment-badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    background: #f3eee5;
    color: #8c6a28;
}


/* STATUS */

.status-select {
    width: 100%;
    padding: 8px 5px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    font-size: 11px;
    cursor: pointer;
}

.status-select:focus {
    outline: none;
    border-color: #ad8232;
}


/* SAVE */

.save-btn {
    margin-top: 7px;
    width: 100%;
    border: none;
    background: #287a3e;
    color: white;
    padding: 7px 5px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 10px;
    font-weight: bold;
}

.save-btn:hover {
    background: #216631;
}

.save-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}


/* DATE */

.date-time {
    color: #555;
    font-size: 10px;
}


/* MESSAGE */

.message {
    text-align: center;
    padding: 50px 20px;
    color: #666;
    font-weight: bold;
}

.error {
    color: #a33;
}

.success {
    color: #287a3e;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 1100px) {

    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .admin-box {
        padding: 20px;
    }

}


@media (max-width: 700px) {

    .admin-section {
        padding: 30px 3%;
    }

    .admin-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .admin-header h2 {
        font-size: 25px;
    }

    .logout-btn {
        width: 100%;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .order-tools {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        max-width: none;
    }

    .refresh-btn {
        width: 100%;
    }

    /*
       Mobile table is allowed to scroll
       because 10 columns cannot safely
       fit on a small phone screen.
    */

    .order-table {
        min-width: 950px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <a href="index.html" class="logo">

        <span>LIARA</span>

        <small>PROFESSIONAL™</small>

    </a>

</header>



<!-- =========================================
     DASHBOARD
========================================= -->

<section class="admin-section">

<div class="admin-container">

<div class="admin-box">


<!-- HEADER -->

<div class="admin-header">

    <div>

        <p>LIARA PROFESSIONAL™</p>

        <h2>Company Orders Dashboard</h2>

    </div>

    <button
        class="logout-btn"
        onclick="logoutAdmin()">

        Logout

    </button>

</div>



<!-- =========================================
     SUMMARY
========================================= -->

<div class="summary-grid">


    <div class="summary-card">

        <span>Total Orders</span>

        <strong id="totalOrders">
            0
        </strong>

    </div>


    <div class="summary-card sales">

        <span>Total Sales</span>

        <strong id="totalSales">
            ₹0
        </strong>

    </div>


    <div class="summary-card pending">

        <span>Pending Orders</span>

        <strong id="pendingOrders">
            0
        </strong>

    </div>


    <div class="summary-card delivered">

        <span>Delivered Orders</span>

        <strong id="deliveredOrders">
            0
        </strong>

    </div>


</div>



<!-- =========================================
     SEARCH + REFRESH
========================================= -->

<div class="order-tools">


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search customer, mobile, product..."
            oninput="filterOrders()">

    </div>


    <button
        class="refresh-btn"
        onclick="loadOrders()">

        🔄 Refresh Orders

    </button>


</div>



<!-- =========================================
     ORDERS
========================================= -->

<div id="orders">

    <div class="message">

        Loading customer orders...

    </div>

</div>


</div>

</div>

</section>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>

    <p>
        © 2026 Liara Group Private Limited.
        All Rights Reserved.
    </p>

</footer>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";


let allOrders = [];


/* =========================================
   CHECK ADMIN LOGIN
========================================= */

async function checkAdmin() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "company-login.html";

        return null;

    }


    const user =
        data.user;


    if (
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        window.location.href =
            "company-login.html";

        return null;

    }


    return user;

}


/* =========================================
   NUMBER HELPER
========================================= */

function money(value) {

    const number =
        Number(value || 0);

    return "₹" +
        number.toLocaleString("en-IN");

}


/* =========================================
   PRODUCT NAME
========================================= */

function getProductName(order) {

    return (
        order.product_name ||
        order.product ||
        order.productName ||
        order.item_name ||
        order.item ||
        "Product"
    );

}


/* =========================================
   PRICE
========================================= */

function getPrice(order) {

    if (
        order.price !== undefined &&
        order.price !== null
    ) {

        return Number(order.price);

    }


    if (
        order.unit_price !== undefined &&
        order.unit_price !== null
    ) {

        return Number(order.unit_price);

    }


    if (
        order.product_price !== undefined &&
        order.product_price !== null
    ) {

        return Number(order.product_price);

    }


    const quantity =
        Number(order.quantity || 1);

    const total =
        Number(order.total || 0);


    if (quantity > 0) {

        return total / quantity;

    }


    return 0;

}


/* =========================================
   PAYMENT
========================================= */

function getPayment(order) {

    return (
        order.payment_status ||
        order.payment_method ||
        order.payment ||
        order.paymentStatus ||
        "Pending"
    );

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

    const box =
        document.getElementById("orders");


    box.innerHTML = `
        <div class="message">
            Loading customer orders...
        </div>
    `;


    const user =
        await checkAdmin();


    if (!user) {

        return;

    }


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Orders Error:",
                error
            );


            box.innerHTML = `

                <div class="message error">

                    Unable to load orders.

                    <br><br>

                    ${error.message}

                </div>

            `;

            return;

        }


        allOrders =
            data || [];


        updateSummary(
            allOrders
        );


        renderOrders(
            allOrders
        );


    }

    catch (error) {

        console.error(error);


        box.innerHTML = `

            <div class="message error">

                Something went wrong.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(
    orders
) {


    const totalOrders =
        orders.length;


    let totalSales = 0;


    let pending = 0;


    let delivered = 0;


    orders.forEach(
        function(order) {


            totalSales +=
                Number(
                    order.total || 0
                );


            const status =
                String(
                    order.status ||
                    "Pending"
                ).toLowerCase();


            if (
                status === "delivered"
            ) {

                delivered++;

            }


            if (
                status === "pending" ||
                status === "order received" ||
                status === "confirmed" ||
                status === "packed" ||
                status === "shipped"
            ) {

                pending++;

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).innerText =
        totalOrders;


    document.getElementById(
        "totalSales"
    ).innerText =
        money(totalSales);


    document.getElementById(
        "pendingOrders"
    ).innerText =
        pending;


    document.getElementById(
        "deliveredOrders"
    ).innerText =
        delivered;

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(
    orders
) {


    const box =
        document.getElementById(
            "orders"
        );


    if (
        !orders ||
        orders.length === 0
    ) {

        box.innerHTML = `

            <div class="message">

                No customer orders yet.

            </div>

        `;

        return;

    }


    let html = `

        <div class="table-wrapper">

        <table class="order-table">

        <thead>

        <tr>

            <th>Order Date</th>

            <th>Customer</th>

            <th>Mobile</th>

            <th>Product</th>

            <th>Price</th>

            <th>Qty</th>

            <th>Total</th>

            <th>Payment</th>

            <th>Address</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody>

    `;


    orders.forEach(
        function(order) {


            let orderDate =
                "-";


            if (
                order.created_at
            ) {

                orderDate =
                    new Date(
                        order.created_at
                    ).toLocaleString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric",
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    );

            }


            const customer =
                order.customer_name ||
                order.name ||
                order.customer ||
                "-";


            const phone =
                order.phone ||
                order.mobile ||
                order.customer_phone ||
                "-";


            const address =
                order.address ||
                order.shipping_address ||
                order.customer_address ||
                "-";


            const product =
                getProductName(
                    order
                );


            const price =
                getPrice(
                    order
                );


            const quantity =
                Number(
                    order.quantity || 1
                );


            const total =
                Number(
                    order.total || 0
                );


            const payment =
                getPayment(
                    order
                );


            const status =
                order.status ||
                "Pending";


            /*
              DATABASE ID IS STILL USED
              INTERNALLY.
              IT IS NOT SHOWN TO CUSTOMER.
            */

            const orderId =
                order.id;


            html += `

                <tr>

                    <td class="date-time">

                        ${orderDate}

                    </td>


                    <td>

                        <strong>
                            ${escapeHtml(customer)}
                        </strong>

                    </td>


                    <td>

                        ${escapeHtml(phone)}

                    </td>


                    <td class="product-name">

                        ${escapeHtml(product)}

                    </td>


                    <td class="price">

                        ${money(price)}

                    </td>


                    <td>

                        ${quantity}

                    </td>


                    <td class="total">

                        ${money(total)}

                    </td>


                    <td>

                        <span class="payment-badge">

                            ${escapeHtml(payment)}

                        </span>

                    </td>


                    <td>

                        ${escapeHtml(address)}

                    </td>


                    <td>

                        <select
                            class="status-select"
                            id="status-${orderId}">

                            <option value="Pending"
                                ${status === "Pending" ? "selected" : ""}>
                                Pending
                            </option>

                            <option value="Confirmed"
                                ${status === "Confirmed" ? "selected" : ""}>
                                Confirmed
                            </option>

                            <option value="Packed"
                                ${status === "Packed" ? "selected" : ""}>
                                Packed
                            </option>

                            <option value="Shipped"
                                ${status === "Shipped" ? "selected" : ""}>
                                Shipped
                            </option>

                            <option value="Delivered"
                                ${status === "Delivered" ? "selected" : ""}>
                                Delivered
                            </option>

                            <option value="Cancelled"
                                ${status === "Cancelled" ? "selected" : ""}>
                                Cancelled
                            </option>

                        </select>


                        <button
                            class="save-btn"
                            id="save-${orderId}"
                            onclick="saveOrder('${orderId}')">

                            Save

                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

        </tbody>

        </table>

        </div>

    `;


    box.innerHTML =
        html;

}


/* =========================================
   SEARCH
========================================= */

function filterOrders() {


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    if (!search) {

        renderOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            function(order) {


                const text = (

                    (order.customer_name || "") +
                    " " +
                    (order.name || "") +
                    " " +
                    (order.phone || "") +
                    " " +
                    (order.mobile || "") +
                    " " +
                    (getProductName(order)) +
                    " " +
                    (order.address || "")

                ).toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    renderOrders(
        filtered
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   SAVE STATUS
========================================= */

async function saveOrder(
    orderId
) {


    const select =
        document.getElementById(
            "status-" + orderId
        );


    const button =
        document.getElementById(
            "save-" + orderId
        );


    if (!select || !button) {

        return;

    }


    const status =
        select.value;


    button.disabled =
        true;


    button.innerText =
        "Saving...";


    try {


        const {
            error
        } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    status

            })
            .eq(
                "id",
                orderId
            );


        if (error) {

            console.error(
                "Update Error:",
                error
            );


            alert(
                "Unable to update order:\n\n" +
                error.message
            );


            button.disabled =
                false;


            button.innerText =
                "Save";


            return;

        }


        button.innerText =
            "✓ Saved";


        /*
           Update local order
        */

        const order =
            allOrders.find(
                function(item) {

                    return String(
                        item.id
                    ) === String(
                        orderId
                    );

                }
            );


        if (order) {

            order.status =
                status;

        }


        updateSummary(
            allOrders
        );


        setTimeout(
            function() {

                button.disabled =
                    false;

                button.innerText =
                    "Save";

            },
            1200
        );


    }

    catch (error) {


        console.error(
            error
        );


        alert(
            "Something went wrong."
        );


        button.disabled =
            false;


        button.innerText =
            "Save";

    }

}


/* =========================================
   LOGOUT
========================================= */

async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "company-login.html";

}


/* =========================================
   START
========================================= */

loadOrders();

</script>


</body>

</html>
