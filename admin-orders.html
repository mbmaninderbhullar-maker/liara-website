<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE
===================================== */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_y_K_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================
   COMPANY ADMIN EMAIL
===================================== */


const ADMIN_EMAIL =
    "info@liara.co.in";



/* =====================================
   CHECK ADMIN LOGIN
===================================== */


async function checkAdmin() {


    const {
        data,
        error
    } = await supabaseClient
        .auth
        .getUser();


    if (error) {

        console.log(error);

        window.location.href =
            "company-login.html";

        return false;

    }


    const user =
        data.user;


    if (!user) {

        window.location.href =
            "company-login.html";

        return false;

    }


    console.log(
        "Logged in account:",
        user.email
    );


    if (
        !user.email ||
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {


        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="error-message">

                Access denied.

                <br><br>

                Logged in account:
                ${user.email || "Unknown"}

            </div>

        `;


        return false;

    }


    return true;

}



/* =====================================
   LOAD CUSTOMER ORDERS
===================================== */


async function loadOrders() {


    const allowed =
        await checkAdmin();


    if (!allowed) {

        return;

    }


    const ordersBox =
        document.getElementById(
            "orders"
        );


    ordersBox.innerHTML = `

        <div class="loading">

            Loading orders...

        </div>

    `;



    /* GET ORDERS */


    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "id",
            {
                ascending: false
            }
        );



    /* ERROR */


    if (error) {


        console.log(
            "Orders error:",
            error
        );


        ordersBox.innerHTML = `

            <div class="error-message">

                Unable to load orders.

                <br><br>

                ${error.message}

            </div>

        `;


        return;

    }



    /* NO ORDERS */


    if (
        !data ||
        data.length === 0
    ) {


        ordersBox.innerHTML = `

            <div class="no-orders">

                No customer orders yet.

            </div>

        `;


        return;

    }



    /* TABLE */


    let html = `

        <table class="order-table">

            <thead>

                <tr>

                    <th>
                        Order ID
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Mobile
                    </th>

                    <th>
                        Address
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>

            <tbody>

    `;



    data.forEach(
        function(order) {


            html += `

                <tr>

                    <td class="order-id">

                        ${order.id || "-"}

                    </td>


                    <td>

                        ${order.customer_name || "-"}

                    </td>


                    <td>

                        ${order.phone || "-"}

                    </td>


                    <td>

                        ${order.address || "-"}

                    </td>


                    <td>

                        ${order.quantity || 0}

                    </td>


                    <td>

                        ₹${order.total || 0}

                    </td>


                    <td class="status">

                        ${order.status ||
                         "Order Received"}

                    </td>

                </tr>

            `;

        }
    );



    html += `

            </tbody>

        </table>

    `;



    ordersBox.innerHTML =
        html;

}



/* =====================================
   LOGOUT
===================================== */


async function logoutAdmin() {


    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "company-login.html";

}



/* =====================================
   START
===================================== */


loadOrders();


</script>


</body>
