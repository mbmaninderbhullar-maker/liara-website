<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#faf8f5;
    color:#222;
}

.sidebar{
    width:235px;
    min-height:100vh;
    background:#211d18;
    padding:25px 15px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:1000;
}

.sidebar-title{
    color:#c89b4b;
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
    padding:5px 15px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:13px 14px;
    border-radius:9px;
    text-align:left;
    font-size:14px;
    cursor:pointer;
}

.side-menu button:hover{
    background:#302a22;
    color:#fff;
}

.side-menu button.active{
    background:#ad8232;
    color:#fff;
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

.dashboard-main{
    margin-left:235px;
    width:calc(100% - 235px);
    min-height:100vh;
}

.dashboard-header{
    height:78px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:900;
}

.logo{
    font-size:23px;
    font-weight:bold;
    letter-spacing:3px;
}

.logo small{
    display:block;
    color:#ad8232;
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:white;
    border-radius:8px;
    padding:10px 13px;
    font-size:18px;
}

.admin-section{
    padding:35px 3%;
}

.admin-container{
    max-width:1550px;
    margin:auto;
}

.admin-box{
    background:#fff;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.admin-header p{
    margin:0 0 5px;
    color:#ad8232;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2{
    margin:0;
    font-size:30px;
}

.btn{
    border:0;
    background:#ad8232;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#866326;
}

.green-btn{
    background:#287a3e;
}

.red-btn{
    background:#a33;
}

.gray-btn{
    background:#555;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.summary-card{
    border:1px solid #eee;
    border-radius:15px;
    padding:23px;
    background:#fff;
}

.summary-card span{
    color:#777;
    font-size:14px;
}

.summary-card strong{
    display:block;
    font-size:29px;
    margin-top:10px;
}

.green{
    color:#287a3e;
}

.gold{
    color:#ad8232;
}

.red{
    color:#a33;
}

.order-tools{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.search-box{
    flex:1;
}

.search-box input,
.date-input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
}

.order-table{
    min-width:1100px;
    font-size:12px;
}

th{
    background:#f7f1e7;
    padding:13px 8px;
    text-align:left;
}

td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
}

.total{
    color:#287a3e;
    font-weight:bold;
}

.payment-badge{
    background:#f3eee5;
    color:#8c6a28;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
}

.status-select{
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.save-btn{
    border:0;
    background:#287a3e;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-top:5px;
}

.view-btn{
    border:0;
    background:#ad8232;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.message{
    text-align:center;
    padding:50px 20px;
    color:#666;
    font-weight:bold;
}

.error{
    color:#a33;
}

/* SALES */

.sales-filter{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:15px;
    margin-bottom:25px;
}

.sales-total{
    background:#f7f1e7;
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
}

.sales-total span{
    color:#777;
}

.sales-total strong{
    display:block;
    font-size:35px;
    color:#287a3e;
    margin-top:8px;
}

.date-heading{
    margin:25px 0 10px;
    padding:12px 15px;
    background:#211d18;
    color:white;
    border-radius:8px;
}

.sales-table{
    margin-bottom:20px;
}

/* VIEW MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:900px;
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:16px;
    padding:30px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    margin:0;
}

.close-btn{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.order-info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:20px;
}

.info-box{
    border:1px solid #eee;
    border-radius:10px;
    padding:15px;
}

.info-box label{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}

.info-box strong{
    font-size:15px;
}

.shipping-box{
    margin-top:20px;
}

.shipping-box label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.shipping-box textarea{
    width:100%;
    min-height:90px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

/* PRINT */

#printArea{
    display:none;
}

.print-page{
    width:210mm;
    min-height:297mm;
    padding:15mm;
    background:white;
    color:#111;
}

.print-header{
    border-bottom:3px solid #ad8232;
    padding-bottom:12px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
}

.print-brand h1{
    margin:0;
    font-size:28px;
    letter-spacing:3px;
}

.print-brand p{
    margin:5px 0 0;
    color:#ad8232;
    font-size:11px;
    letter-spacing:2px;
}

.company-details{
    text-align:right;
    font-size:11px;
    line-height:1.6;
}

.print-title{
    text-align:center;
    margin:20px 0;
}

.print-title h2{
    margin:0;
    font-size:22px;
}

.print-customer{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.print-customer-box{
    border:1px solid #ddd;
    padding:12px;
}

.print-customer-box strong{
    display:block;
    margin-bottom:6px;
}

.print-table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.print-table th,
.print-table td{
    border:1px solid #ccc;
    padding:10px;
}

.print-table th{
    background:#f5f1e9;
}

.print-total{
    margin-left:auto;
    width:300px;
    margin-top:20px;
}

.print-total div{
    display:flex;
    justify-content:space-between;
    padding:7px;
}

.print-grand{
    border-top:2px solid #222;
    font-size:18px;
    font-weight:bold;
}

.print-footer{
    margin-top:60px;
    border-top:1px solid #ddd;
    padding-top:12px;
    text-align:center;
    font-size:11px;
    color:#777;
}

@media print{

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:210mm;
    }

    @page{
        size:A4;
        margin:0;
    }
}

@media(max-width:1100px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
        margin-right:15px;
    }

    .sales-filter{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .summary-grid{
        grid-template-columns:1fr;
    }

    .order-info-grid,
    .print-customer{
        grid-template-columns:1fr;
    }

    .admin-box{
        padding:18px;
    }

}

</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

<div class="sidebar-title">
COMPANY PANEL
</div>

<div class="side-menu">

<button class="active"
onclick="showSection('orders',this)">
🛒 Orders
</button>

<button onclick="showSection('sales',this)">
💰 Sales
</button>

<button onclick="showSection('stock',this)">
📦 Stock
</button>

<button onclick="showSection('add-product',this)">
➕ Add Product
</button>

<button onclick="showSection('products',this)">
🧴 Products
</button>

<button onclick="showSection('customers',this)">
👥 Customers
</button>

<button onclick="showSection('reports',this)">
📊 Reports
</button>

<button onclick="showSection('delivery',this)">
🚚 Delivery
</button>

<button onclick="showSection('notifications',this)">
🔔 Notifications
</button>

<button onclick="showSection('settings',this)">
⚙️ Settings
</button>

<button class="logout-side"
onclick="logoutAdmin()">
🚪 Logout
</button>

</div>
</aside>

<div class="sidebar-overlay"
id="sidebarOverlay"
onclick="closeSidebar()">
</div>

<main class="dashboard-main">

<header class="dashboard-header">

<button class="mobile-menu-btn"
onclick="openSidebar()">
☰
</button>

<div class="logo">
LIARA
<small>PROFESSIONAL™</small>
</div>

</header>

<section class="admin-section">

<div class="admin-container">

<div id="mainContent"></div>

</div>

</section>

</main>


<!-- ORDER VIEW MODAL -->

<div class="modal" id="orderModal">

<div class="modal-box">

<div class="modal-header">

<h2>Order Details</h2>

<button class="close-btn"
onclick="closeOrderModal()">
×
</button>

</div>

<div id="orderDetails"></div>

</div>

</div>


<!-- PRINT AREA -->

<div id="printArea"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

let allOrders=[];

let selectedOrder=null;


/* =========================
ADMIN
========================= */

async function checkAdmin(){

const {data,error}=
await supabaseClient.auth.getUser();

if(error || !data || !data.user){

window.location.href=
"company-login.html";

return null;

}

if(
!data.user.email ||
data.user.email.toLowerCase()
!==ADMIN_EMAIL.toLowerCase()
){

window.location.href=
"company-login.html";

return null;

}

return data.user;

}


/* =========================
MENU
========================= */

function showSection(section,button){

document.querySelectorAll(
".side-menu button"
).forEach(btn=>{
btn.classList.remove("active");
});

if(button){
button.classList.add("active");
}

if(section==="orders"){
loadOrders();
}

else if(section==="sales"){
loadSales();
}

else{
showSimpleSection(section);
}

closeSidebar();

}


/* =========================
SIMPLE SECTIONS
========================= */

function showSimpleSection(section){

const names={
stock:["📦","Stock Management"],
"add-product":["➕","Add Product"],
products:["🧴","Products"],
customers:["👥","Customers"],
reports:["📊","Reports"],
delivery:["🚚","Delivery"],
notifications:["🔔","Notifications"],
settings:["⚙️","Settings"]
};

const item=names[section]||["📋","Section"];

document.getElementById(
"mainContent"
).innerHTML=`

<div class="admin-box">

<div class="admin-header">

<div>

<p>LIARA PROFESSIONAL™</p>

<h2>
${item[0]} ${item[1]}
</h2>

</div>

</div>

<div class="message">

${item[1]} section.

<br><br>

Use the existing product/stock pages for management.

</div>

</div>

`;

}


/* =========================
ORDERS
========================= */

async function loadOrders(){

document.getElementById(
"mainContent"
).innerHTML=`

<div class="admin-box">

<div class="admin-header">

<div>

<p>LIARA PROFESSIONAL™</p>

<h2>🛒 Customer Orders</h2>

</div>

<button class="btn"
onclick="loadOrders()">
🔄 Refresh
</button>

</div>

<div class="summary-grid">

<div class="summary-card">
<span>Total Orders</span>
<strong id="totalOrders">0</strong>
</div>

<div class="summary-card">
<span>Total Sales</span>
<strong class="green"
id="totalSales">
₹0
</strong>
</div>

<div class="summary-card">
<span>Pending</span>
<strong class="gold"
id="pendingOrders">
0
</strong>
</div>

<div class="summary-card">
<span>Delivered</span>
<strong class="green"
id="deliveredOrders">
0
</strong>
</div>

</div>

<div class="order-tools">

<div class="search-box">

<input
id="searchInput"
placeholder="Search customer, mobile, product..."
oninput="filterOrders()">

</div>

<button class="btn"
onclick="loadOrders()">
Refresh
</button>

</div>

<div id="ordersBox">

<div class="message">
Loading customer orders...
</div>

</div>

</div>
`;

const user=await checkAdmin();

if(!user)return;

const {data,error}=
await supabaseClient
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

document.getElementById(
"ordersBox"
).innerHTML=`

<div class="message error">
Unable to load orders.
<br><br>
${escapeHtml(error.message)}
</div>

`;

return;

}

allOrders=data||[];

updateOrderSummary();

renderOrders(allOrders);

}


/* =========================
SUMMARY
========================= */

function money(value){

return "₹"+
Number(value||0)
.toLocaleString("en-IN");

}


function updateOrderSummary(){

let sales=0;
let pending=0;
let delivered=0;

allOrders.forEach(order=>{

const status=
String(order.status||"Pending")
.toLowerCase();

if(status!=="cancelled"){

sales+=Number(order.total||0);

}

if(
[
"pending",
"confirmed",
"packed",
"shipped",
"order received"
].includes(status)
){

pending++;

}

if(status==="delivered"){

delivered++;

}

});

document.getElementById(
"totalOrders"
).innerText=
allOrders.length;

document.getElementById(
"totalSales"
).innerText=
money(sales);

document.getElementById(
"pendingOrders"
).innerText=
pending;

document.getElementById(
"deliveredOrders"
).innerText=
delivered;

}


/* =========================
PRODUCT NAME
========================= */

function productName(order){

return order.product_name||
order.product||
order.productName||
order.item_name||
order.item||
"Product";

}


function productPrice(order){

if(order.price!=null)
return Number(order.price);

if(order.unit_price!=null)
return Number(order.unit_price);

const qty=
Number(order.quantity||1);

return qty
? Number(order.total||0)/qty
:0;

}


function payment(order){

return order.payment_status||
order.payment_method||
order.payment||
"Pending";

}


/* =========================
RENDER ORDERS
========================= */

function renderOrders(orders){

const box=
document.getElementById(
"ordersBox"
);

if(!orders.length){

box.innerHTML=`

<div class="message">
No customer orders found.
</div>

`;

return;

}

let html=`

<div class="table-wrapper">

<table class="order-table">

<thead>

<tr>

<th>Date</th>
<th>Customer</th>
<th>Mobile</th>
<th>Product</th>
<th>Qty</th>
<th>Total</th>
<th>Payment</th>
<th>Status</th>
<th>View</th>

</tr>

</thead>

<tbody>

`;

orders.forEach(order=>{

const id=String(order.id);

const date=order.created_at
?new Date(order.created_at)
.toLocaleString("en-IN")
:"-";

const status=
order.status||"Pending";

html+=`

<tr>

<td>
${escapeHtml(date)}
</td>

<td>
<strong>
${escapeHtml(
order.customer_name||
order.name||
"-"
)}
</strong>
</td>

<td>
${escapeHtml(
order.phone||
order.mobile||
"-"
)}
</td>

<td>
${escapeHtml(
productName(order)
)}
</td>

<td>
${Number(order.quantity||1)}
</td>

<td class="total">
${money(order.total)}
</td>

<td>

<span class="payment-badge">
${escapeHtml(payment(order))}
</span>

</td>

<td>

<select
class="status-select"
id="status-${escapeHtml(id)}">

${statusOption("Pending",status)}
${statusOption("Confirmed",status)}
${statusOption("Packed",status)}
${statusOption("Shipped",status)}
${statusOption("Delivered",status)}
${statusOption("Cancelled",status)}

</select>

<br>

<button
class="save-btn"
onclick="saveOrder('${escapeHtml(id)}')">

Save

</button>

</td>

<td>

<button
class="view-btn"
onclick="viewOrder('${escapeHtml(id)}')">

👁 View

</button>

</td>

</tr>

`;

});

html+=`

</tbody>
</table>
</div>
`;

box.innerHTML=html;

}


function statusOption(value,current){

return `
<option value="${value}"
${String(current)===value?"selected":""}>
${value}
</option>
`;

}


/* =========================
SEARCH
========================= */

function filterOrders(){

const search=
document.getElementById(
"searchInput"
).value
.toLowerCase()
.trim();

if(!search){

renderOrders(allOrders);
return;

}

const filtered=
allOrders.filter(order=>{

const text=

(
order.customer_name||
""
)+" "+
(
order.name||
""
)+" "+
(
order.phone||
""
)+" "+
(
order.mobile||
""
)+" "+
productName(order)+" "+
(
order.address||
""
);

return text
.toLowerCase()
.includes(search);

});

renderOrders(filtered);

}


/* =========================
STATUS UPDATE
========================= */

async function saveOrder(id){

const select=
document.getElementById(
"status-"+id
);

if(!select)return;

const {error}=
await supabaseClient
.from("orders")
.update({
status:select.value
})
.eq("id",id);

if(error){

alert(
"Unable to update status:\n\n"+
error.message
);

return;

}

const order=
allOrders.find(
x=>String(x.id)===String(id)
);

if(order){

order.status=
select.value;

}

updateOrderSummary();

alert(
"Order status updated successfully."
);

}


/* =========================
VIEW ORDER
========================= */

function viewOrder(id){

const order=
allOrders.find(
x=>String(x.id)===String(id)
);

if(!order){

alert("Order not found.");
return;

}

selectedOrder=order;

const date=order.created_at
?new Date(order.created_at)
.toLocaleString("en-IN")
:"-";

const customer=
order.customer_name||
order.name||
"-";

const phone=
order.phone||
order.mobile||
"-";

const address=
order.shipping_address||
order.address||
"-";

const product=
productName(order);

const qty=
Number(order.quantity||1);

const price=
productPrice(order);

const total=
Number(order.total||0);

const status=
order.status||"Pending";

document.getElementById(
"orderDetails"
).innerHTML=`

<div class="order-info-grid">

<div class="info-box">

/* =========================
UPDATE SHIPPING
========================= */

async function updateShipping(id){

const address=
document.getElementById(
"shippingAddressInput"
).value.trim();

if(!address){

alert(
"Shipping address empty nahi ho sakda."
);

return;

}

/*
  Existing orders table vich
  shipping_address column hona chahida.
*/

const {error}=
await supabaseClient
.from("orders")
.update({
shipping_address:address
})
.eq("id",id);

if(error){

alert(
"Shipping update nahi hoyi.\n\n"+
error.message+
"\n\nJe 'shipping_address' column database vich nahi hai,
Supabase orders table vich eh column add karo."
);

return;

}

const order=
allOrders.find(
x=>String(x.id)===String(id)
);

if(order){

order.shipping_address=
address;

}

alert(
"Shipping address successfully updated."
);

}

/* =========================
SALES FILTER
========================= */

function filterSales(){

const from=
document.getElementById(
"salesFrom"
).value;

const to=
document.getElementById(
"salesTo"
).value;

let orders=
allOrders.filter(order=>{

const status=
String(order.status||"Pending")
.toLowerCase();

if(status==="cancelled")
return false;

if(!order.created_at)
return false;

const date=
new Date(order.created_at)
.toISOString()
.substring(0,10);

if(from && date<from)
return false;

if(to && date>to)
return false;

return true;

});

renderSales(orders);

}


/* =========================
RENDER SALES
========================= */

function renderSales(orders){

const box=
document.getElementById(
"salesBox"
);

let grandTotal=0;

orders.forEach(order=>{

grandTotal+=
Number(order.total||0);

});

document.getElementById(
"salesGrandTotal"
).innerText=
money(grandTotal);

if(!orders.length){

box.innerHTML=`

<div class="message">
No sales found for selected dates.
</div>

`;

return;

}


/*
 Group sales by date
*/

const grouped={};

orders.forEach(order=>{

const date=
new Date(order.created_at)
.toISOString()
.substring(0,10);

if(!grouped[date]){
grouped[date]=[];
}

grouped[date].push(order);

});


let html="";

Object.keys(grouped)
.sort()
.reverse()
.forEach(date=>{

const dayOrders=
grouped[date];

let dayTotal=0;

dayOrders.forEach(order=>{

dayTotal+=
Number(order.total||0);

});

const niceDate=
new Date(date+"T00:00:00")
.toLocaleDateString(
"en-IN",
{
day:"2-digit",
month:"long",
year:"numeric"
}
);

html+=`

<div class="date-heading">

📅 ${escapeHtml(niceDate)}

&nbsp;&nbsp; | &nbsp;&nbsp;

Orders:
${dayOrders.length}

&nbsp;&nbsp; | &nbsp;&nbsp;

Sales:
${money(dayTotal)}

</div>


<div class="table-wrapper sales-table">

<table>

<thead>

<tr>

<th>Order ID</th>
<th>Customer</th>
<th>Product</th>
<th>Qty</th>
<th>Payment</th>
<th>Status</th>
<th>Total</th>
<th>View</th>

</tr>

</thead>

<tbody>

`;

dayOrders.forEach(order=>{

html+=`

<tr>

<td>
#${escapeHtml(String(order.id))}
</td>

<td>
${escapeHtml(
order.customer_name||
order.name||
"-"
)}
</td>

<td>
${escapeHtml(
productName(order)
)}
</td>

<td>
${Number(order.quantity||1)}
</td>

<td>
${escapeHtml(payment(order))}
</td>

<td>
${escapeHtml(order.status||"Pending")}
</td>

<td class="total">
${money(order.total)}
</td>

<td>

<button
class="view-btn"
onclick="viewOrder('${escapeHtml(String(order.id))}')">

View

</button>

</td>

</tr>

`;

});

html+=`

</tbody>

</table>

</div>

`;

});

box.innerHTML=html;

}

/* =========================
ESCAPE
========================= */

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
