<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Company Dashboard</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f3ee;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:245px;
    min-height:100vh;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:2000;
    background:#201c18;
    padding:22px 14px;
    overflow-y:auto;
}

.sidebar-brand{
    padding:8px 15px 24px;
    border-bottom:1px solid rgba(255,255,255,.08);
    margin-bottom:15px;
}

.sidebar-brand h1{
    margin:0;
    color:#fff;
    font-size:22px;
    letter-spacing:4px;
}

.sidebar-brand span{
    display:block;
    margin-top:5px;
    color:#c79a48;
    font-size:9px;
    letter-spacing:3px;
    font-weight:bold;
}

.sidebar-label{
    color:#766c60;
    font-size:9px;
    letter-spacing:2px;
    font-weight:bold;
    padding:12px 15px 8px;
}

.side-menu{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.side-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#d8d4cf;
    padding:12px 14px;
    border-radius:9px;
    text-align:left;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.side-menu button:hover{
    background:#302a23;
    color:#fff;
}

.side-menu button.active{
    background:#ad8232;
    color:#fff;
    box-shadow:0 5px 15px rgba(173,130,50,.18);
}

.logout-side{
    margin-top:15px;
    border-top:1px solid rgba(255,255,255,.08)!important;
    padding-top:18px!important;
}

/* ================= MAIN ================= */

.dashboard-main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
}

.dashboard-header{
    height:76px;
    background:#fff;
    border-bottom:1px solid #eae7e1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 30px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
    letter-spacing:4px;
}

.logo small{
    display:block;
    color:#ad8232;
    font-size:9px;
    letter-spacing:3px;
    margin-top:3px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-pill{
    background:#faf7f0;
    border:1px solid #eee5d5;
    border-radius:30px;
    padding:9px 14px;
    font-size:12px;
    color:#666;
}

.mobile-menu-btn{
    display:none;
    border:0;
    background:#ad8232;
    color:#fff;
    border-radius:8px;
    padding:9px 12px;
    font-size:18px;
    cursor:pointer;
}

/* ================= SECTIONS ================= */

.admin-section{
    padding:30px 3%;
}

.admin-container{
    max-width:1600px;
    margin:auto;
}

.admin-box{
    background:#fff;
    border:1px solid #ece8e1;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 35px rgba(30,25,20,.055);
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.admin-header p,
.form-title p{
    margin:0 0 6px;
    color:#ad8232;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

.admin-header h2,
.form-title h2{
    margin:0;
    font-size:27px;
}

/* ================= BUTTONS ================= */

.btn{
    border:0;
    background:#ad8232;
    color:#fff;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    transition:.2s;
}

.btn:hover{
    background:#886527;
    transform:translateY(-1px);
}

.green-btn{background:#287a3e}
.green-btn:hover{background:#1d6330}

.red-btn{background:#a33}
.gray-btn{background:#666}
.blue-btn{background:#345f91}

.outline-btn{
    background:#fff;
    color:#555;
    border:1px solid #ddd;
}

/* ================= CARDS ================= */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.summary-card{
    border:1px solid #eee9e1;
    border-radius:14px;
    padding:20px;
    background:#fff;
    position:relative;
    overflow:hidden;
}

.summary-card:after{
    content:"";
    position:absolute;
    width:55px;
    height:55px;
    right:-15px;
    top:-15px;
    border-radius:50%;
    background:#faf4e8;
}

.summary-card span{
    color:#777;
    font-size:12px;
}

.summary-card strong{
    display:block;
    font-size:27px;
    margin-top:9px;
}

.summary-card small{
    display:block;
    color:#999;
    margin-top:6px;
}

.sales strong,
.delivered strong{
    color:#287a3e;
}

.pending strong{
    color:#ad8232;
}

.cancelled strong{
    color:#a33;
}

/* ================= FILTER ================= */

.filter-panel{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:end;
    padding:18px;
    background:#faf8f5;
    border:1px solid #ece8e1;
    border-radius:13px;
    margin-bottom:20px;
}

.filter-field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.filter-field label{
    font-size:10px;
    font-weight:bold;
    color:#777;
    letter-spacing:.5px;
}

.filter-field input,
.filter-field select,
.search-input{
    min-width:150px;
    padding:10px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
    outline:none;
    font-family:inherit;
}

.search-input{
    min-width:250px;
}

/* ================= TABLE ================= */

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #eee;
    border-radius:12px;
}

.data-table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
    font-size:12px;
}

.data-table th{
    background:#f7f2e9;
    color:#554b3e;
    padding:13px 10px;
    text-align:left;
    white-space:nowrap;
    font-size:11px;
}

.data-table td{
    padding:12px 10px;
    border-bottom:1px solid #eee;
    vertical-align:middle;
}

.data-table tr:last-child td{
    border-bottom:0;
}

.data-table tbody tr:hover{
    background:#fffdf9;
}

.product-name{font-weight:bold}
.total{color:#287a3e;font-weight:bold}

/* ================= BADGES ================= */

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
    white-space:nowrap;
}

.badge-green{background:#e8f3e9;color:#287a3e}
.badge-gold{background:#f8f0dd;color:#987329}
.badge-red{background:#f7dddd;color:#a33}
.badge-blue{background:#e7eef8;color:#345f91}
.badge-gray{background:#eee;color:#666}

.payment-badge{
    background:#f3eee5;
    color:#806226;
    padding:5px 8px;
    border-radius:20px;
    font-size:10px;
}

/* ================= ACTION ================= */

.table-btn{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.view-btn{background:#211d18;color:#fff}
.edit-btn{background:#e8f2e9;color:#287a3e}
.delete-btn{background:#f7dddd;color:#a33}
.print-btn{background:#eee;color:#444}

/* ================= MESSAGE ================= */

.message{
    text-align:center;
    padding:55px 20px;
    color:#777;
    font-weight:bold;
}

.error{color:#a33}

/* ================= STOCK ================= */

.stock-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:25px;
}

.stock-card{
    border:1px solid #eee;
    border-radius:14px;
    padding:20px;
    background:#fff;
}

.stock-card span{
    color:#777;
    font-size:12px;
}

.stock-card strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.stock-input{
    width:80px;
    padding:8px;
    border:1px solid #ddd;
    border-radius:7px;
}

.stock-ok{color:#287a3e;font-weight:bold}
.stock-low{color:#ad8232;font-weight:bold}
.stock-out{color:#b22;font-weight:bold}

/* ================= PRODUCTS ================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    border:1px solid #eee;
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.product-card-image{
    width:100%;
    height:210px;
    object-fit:cover;
    background:#f5f2ed;
}

.product-card-body{padding:16px}

.product-card h3{
    margin:0 0 7px;
    font-size:16px;
}

.product-description{
    color:#777;
    font-size:12px;
    min-height:38px;
    margin-bottom:10px;
}

.product-price{
    font-size:19px;
    font-weight:bold;
    color:#287a3e;
}

.product-stock{
    margin-top:7px;
    font-size:12px;
}

.product-card-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.product-card-actions button{
    flex:1;
    border:0;
    padding:8px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:11px;
}

/* ================= FORMS ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{margin-bottom:15px}

.form-group.full{grid-column:1/-1}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:13px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-family:inherit;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.upload-box{
    border:2px dashed #d2b477;
    border-radius:12px;
    padding:24px;
    text-align:center;
    background:#fffdf9;
}

.upload-box input{margin-top:12px}

.photo-preview{
    margin-top:15px;
    display:none;
}

.photo-preview img{
    width:170px;
    height:170px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

/* ================= ANALYTICS ================= */

.analytics-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.analytics-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:14px;
    padding:20px;
}

.analytics-card h3{
    margin:0 0 15px;
    font-size:16px;
}

.stat-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #eee;
    font-size:13px;
}

.stat-row:last-child{border-bottom:0}

/* ================= SETTINGS ================= */

.settings-layout{
    display:grid;
    grid-template-columns:235px 1fr;
    gap:20px;
}

.settings-nav{
    background:#faf8f5;
    border:1px solid #ebe6de;
    border-radius:14px;
    padding:10px;
    height:max-content;
    position:sticky;
    top:100px;
}

.settings-nav button{
    width:100%;
    border:0;
    background:transparent;
    padding:12px 13px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    color:#555;
    font-size:12px;
    margin-bottom:3px;
}

.settings-nav button:hover{
    background:#f0ebe2;
}

.settings-nav button.active{
    background:#ad8232;
    color:#fff;
}

.settings-panel{
    display:none;
}

.settings-panel.active{
    display:block;
}

.settings-card{
    background:#fff;
    border:1px solid #ece8e1;
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
}

.settings-card h3{
    margin:0 0 5px;
    font-size:18px;
}

.settings-card > p{
    margin:0 0 20px;
    color:#888;
    font-size:12px;
}

.settings-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.settings-field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.settings-field.full{
    grid-column:1/-1;
}

.settings-field label{
    font-size:11px;
    color:#666;
    font-weight:bold;
}

.settings-field input,
.settings-field select,
.settings-field textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-family:inherit;
    background:#fff;
}

.settings-field textarea{
    min-height:90px;
    resize:vertical;
}

.switch-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.switch-row:last-child{
    border-bottom:0;
}

.switch-info strong{
    display:block;
    font-size:13px;
}

.switch-info small{
    display:block;
    color:#888;
    font-size:11px;
    margin-top:4px;
}

.switch{
    position:relative;
    width:45px;
    height:24px;
    flex:0 0 auto;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#ccc;
    border-radius:30px;
    cursor:pointer;
    transition:.2s;
}

.slider:before{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:.2s;
}

.switch input:checked + .slider{
    background:#ad8232;
}

.switch input:checked + .slider:before{
    transform:translateX(21px);
}

.settings-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.settings-status{
    padding:10px 13px;
    border-radius:8px;
    background:#e8f3e9;
    color:#287a3e;
    font-size:12px;
    font-weight:bold;
    display:none;
    margin-top:12px;
}

.system-status{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px;
    background:#f7faf7;
    border:1px solid #dfece1;
    border-radius:10px;
    margin-bottom:10px;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#287a3e;
}

.status-dot.offline{
    background:#a33;
}

.status-dot.warning{
    background:#ad8232;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:900px;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:17px;
    padding:28px;
}

.modal-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-top h2{margin:0}

.close-modal{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid #eee;
    padding-bottom:18px;
    margin-bottom:18px;
}

.detail-company{
    font-size:20px;
    font-weight:bold;
    letter-spacing:2px;
}

.detail-company small{
    display:block;
    color:#ad8232;
    font-size:9px;
    margin-top:5px;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
}

.detail-item{
    padding:13px;
    background:#faf8f5;
    border-radius:8px;
}

.detail-item span{
    display:block;
    color:#777;
    font-size:10px;
    margin-bottom:4px;
}

.detail-item strong{font-size:13px}

.detail-total{
    border-top:2px solid #211d18;
    margin-top:20px;
    padding-top:15px;
    display:flex;
    justify-content:flex-end;
    gap:20px;
    font-size:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:20px;
}

/* ================= PRINT ================= */

#printArea{display:none}

@media print{

    body *{
        visibility:hidden!important;
    }

    #printArea,
    #printArea *{
        visibility:visible!important;
    }

    #printArea{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:210mm;
        min-height:297mm;
        padding:15mm;
        background:#fff;
    }

    @page{
        size:A4;
        margin:0;
    }

    .print-header{
        display:flex;
        justify-content:space-between;
        border-bottom:2px solid #222;
        padding-bottom:14px;
    }

    .print-brand{
        font-size:25px;
        font-weight:bold;
        letter-spacing:3px;
    }

    .print-brand small{
        display:block;
        color:#ad8232;
        font-size:10px;
        margin-top:4px;
    }

    .print-company{
        text-align:right;
        font-size:11px;
        line-height:1.7;
    }

    .print-title{
        text-align:center;
        margin:22px 0;
    }

    .print-title h2{
        margin:0;
        font-size:22px;
    }

    .print-meta{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .print-meta div{
        border:1px solid #ddd;
        padding:9px;
    }

    .print-meta span{
        display:block;
        font-size:9px;
        color:#777;
        margin-bottom:3px;
    }

    .print-table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    .print-table th,
    .print-table td{
        border:1px solid #ccc;
        padding:9px;
        font-size:11px;
        text-align:left;
    }

    .print-table th{
        background:#f3f0eb;
    }

    .print-total{
        text-align:right;
        margin-top:18px;
        font-size:18px;
        font-weight:bold;
    }

    .print-footer{
        margin-top:55px;
        border-top:1px solid #ddd;
        padding-top:12px;
        font-size:9px;
        text-align:center;
        color:#666;
    }
}

/* ================= MOBILE ================= */

.sidebar-overlay{display:none}

@media(max-width:1100px){

    .summary-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .settings-layout{
        grid-template-columns:1fr;
    }

    .settings-nav{
        position:static;
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:4px;
    }
}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .dashboard-main{
        margin-left:0;
        width:100%;
    }

    .mobile-menu-btn{
        display:block;
    }

    .sidebar-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.45);
        z-index:1900;
    }

    .analytics-grid{
        grid-template-columns:1fr;
    }

    .form-grid,
    .settings-form{
        grid-template-columns:1fr;
    }

    .form-group.full,
    .settings-field.full{
        grid-column:auto;
    }
}

@media(max-width:600px){

    .summary-grid,
    .product-grid,
    .stock-cards{
        grid-template-columns:1fr;
    }

    .admin-box{
        padding:18px;
    }

    .admin-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .dashboard-header{
        padding:12px 17px;
    }

    .admin-section{
        padding:20px 12px;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .search-input{
        min-width:100%;
    }

    .settings-nav{
        grid-template-columns:1fr;
    }

    .admin-pill{
        display:none;
    }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-brand">
        <h1>LIARA</h1>
        <span>PROFESSIONAL™</span>
    </div>

    <div class="sidebar-label">BUSINESS MANAGEMENT</div>

function deepMerge(target,source){

    if(!source) return target;

    Object.keys(source).forEach(key=>{

        if(
            source[key] &&
            typeof source[key] === "object" &&
            !Array.isArray(source[key]) &&
            target[key]
        ){

            deepMerge(
                target[key],
                source[key]
            );

        }else{

            target[key] = source[key];

        }

    });

    return target;

}

/* =========================================================

========================================================= */

function money(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");

}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function shortOrderId(id){

    const raw =
        String(id || "")
        .replace(/-/g,"")
        .toUpperCase();

    return "LIARA-" +
        raw.substring(0,8);

}

function productName(order){

    return order.product_name ||
           order.product ||
           order.productName ||
           order.item_name ||
           order.item ||
           "Product";

}

function productPrice(order){

    if(order.price != null){
        return Number(order.price);
    }

    if(order.unit_price != null){
        return Number(order.unit_price);
    }

    const qty =
        Number(order.quantity || 1);

    return qty
        ? Number(order.total || 0) / qty
        : 0;

}

function payment(order){

    return order.payment_status ||
           order.payment_method ||
           order.payment ||
           "Pending";

}

    `;

        await checkAdmin();

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        box.innerHTML = `
            <div class="message error">
                Unable to load orders.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    allOrders = data || [];

    updateOrderSummary(allOrders);
    renderOrders(allOrders);

}

function updateOrderSummary(orders){

    let sales = 0;
    let active = 0;
    let delivered = 0;

    orders.forEach(order=>{

        sales += Number(order.total || 0);

        const status =
            String(
                order.status || "Pending"
            ).toLowerCase();

        if(status === "delivered"){
            delivered++;
        }

        if([
            "pending",
            "confirmed",
            "packed",
            "shipped",
            "order received"
        ].includes(status)){

            active++;

        }

    });

    document.getElementById("totalOrders").innerText =
        orders.length;

    document.getElementById("totalSales").innerText =
        money(sales);

    document.getElementById("pendingOrders").innerText =
        active;

    document.getElementById("deliveredOrders").innerText =
        delivered;

}

function applyOrderFilters(){

    const status =
        document.getElementById(
            "orderStatusFilter"
        ).value
        .toLowerCase();

    const from =
        document.getElementById("orderFrom").value;

    const to =
        document.getElementById("orderTo").value;

    let filtered = [...allOrders];

    filtered = filtered.filter(order=>{

        const text =
            [
                order.customer_name,
                order.name,
                order.phone,
                order.mobile,
                productName(order),
                shortOrderId(order.id)
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

        if(search && !text.includes(search)){
            return false;
        }

        const orderStatus =
            String(
                order.status || "pending"
            ).toLowerCase();

        if(status && orderStatus !== status){
            return false;
        }

        if(from && order.created_at){

            if(
                new Date(order.created_at)
                <
                new Date(from+"T00:00:00")
            ){
                return false;
            }

        }

        if(to && order.created_at){

            if(
                new Date(order.created_at)
                >
                new Date(to+"T23:59:59")
            ){
                return false;
            }

        }

        return true;

    });

    renderOrders(filtered);

    if(lower === "delivered"){
        cls = "badge-green";
    }
    else if(lower === "cancelled"){
        cls = "badge-red";

    else if(

        lower === "packed"

    }

    return `

        </span>

function filterSalesByDate(){

    const from =
        document.getElementById("salesFrom").value;

    const to =
        document.getElementById("salesTo").value;

    let filtered = [...allOrders];

    if(from){

        filtered =
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) >=
                new Date(
                    from+"T00:00:00"
                );

            });

    }

    if(to){

        filtered =
            filtered.filter(order=>{

                if(!order.created_at)
                    return false;

                return new Date(
                    order.created_at
                ) <=
                new Date(
                    to+"T23:59:59"
                );

            });

    }

    renderSales(filtered);

}

function clearSalesFilter(){

    document.getElementById("salesFrom").value = "";
    document.getElementById("salesTo").value = "";

    renderSales(allOrders);

}

function renderSales(orders){

    let total = 0;
    let delivered = 0;
    let cancelled = 0;

    orders.forEach(order=>{

        const status =
            String(
                order.status || "Pending"
            ).toLowerCase();

        if(status !== "cancelled"){
            total += Number(order.total || 0);
        }

        if(status === "delivered") delivered++;
        if(status === "cancelled") cancelled++;

    });

    document.getElementById("salesTotal").innerText =
        money(total);

    document.getElementById("salesOrders").innerText =
        orders.length;

    document.getElementById("salesDelivered").innerText =
        delivered;

    document.getElementById("salesCancelled").innerText =
        cancelled;

    const box =
        document.getElementById("salesTable");

    if(!orders.length){

        box.innerHTML = `
            <div class="message">
                No sales found.
            </div>
        `;

        return;

    }

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>DATE</th>
        <th>ORDER ID</th>
        <th>CUSTOMER</th>
        <th>PRODUCT</th>
        <th>QTY</th>
        <th>AMOUNT</th>
        <th>PAYMENT</th>
        <th>STATUS</th>
        <th>ACTION</th>
    </tr>
    </thead>
    <tbody>
    `;

    orders.forEach(order=>{

        const date =
            order.created_at
            ? new Date(
                order.created_at
              ).toLocaleDateString("en-IN")
            : "-";

        html += `
        <tr>

            <td>${escapeHtml(date)}</td>

            <td>
                <strong>
                    ${escapeHtml(
                        shortOrderId(order.id)
                    )}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    order.customer_name ||
                    order.name ||
                    "-"
                )}
            </td>

            <td class="product-name">
                ${escapeHtml(productName(order))}
            </td>

            <td>
                ${Number(order.quantity || 1)}
            </td>

            <td class="total">
                ${money(order.total)}
            </td>

            <td>
                <span class="payment-badge">
                    ${escapeHtml(payment(order))}
                </span>
            </td>

            <td>${statusBadge(order.status)}</td>

            <td>
                <button
                    class="table-btn view-btn"
                    onclick="viewOrder(
                        '${escapeHtml(String(order.id))}'
                    )">
                    View
                </button>
            </td>

        </tr>
        `;

    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    box.innerHTML = html;

}

async function loadStock(){

    document.getElementById(
        "other-content"
    ).innerHTML = `

            <div>
                <p>INVENTORY MANAGEMENT</p>
                <h2>📦 Stock Management</h2>
            </div>

            <button class="btn" onclick="loadStock()">
                🔄 Refresh
            </button>

        </div>

        <div class="stock-cards">

            <div class="stock-card">
                <span>Total Products</span>
                <strong id="stockTotal">0</strong>
            </div>

            <div class="stock-card">
                <span>Low Stock</span>
                <strong id="stockLow">0</strong>
            </div>

            <div class="stock-card">
                <span>Out of Stock</span>
                <strong id="stockOut">0</strong>
            </div>

        </div>

        <div id="stockTable">
            <div class="message">Loading stock...</div>
        </div>

    </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        document.getElementById(
            "stockTable"
        ).innerHTML = `
            <div class="message error">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    allProducts = data || [];

    renderStock(allProducts);

}

function renderStock(products){

    let low = 0;
    let out = 0;

    products.forEach(product=>{

        const stock =
            Number(product.stock || 0);

        const minimum =
            Number(product.low_stock || 5);

        if(stock <= 0) out++;
        else if(stock <= minimum) low++;

    });

    document.getElementById("stockTotal").innerText =
        products.length;

    document.getElementById("stockLow").innerText =
        low;

    document.getElementById("stockOut").innerText =
        out;

    if(!products.length){

        document.getElementById(
            "stockTable"
        ).innerHTML = `
            <div class="message">
                No products added yet.
            </div>
        `;

        return;

    }

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>PRODUCT</th>
        <th>PRICE</th>
        <th>CURRENT STOCK</th>
        <th>MINIMUM</th>
        <th>STATUS</th>
        <th>UPDATE</th>
    </tr>
    </thead>
    <tbody>
    `;

    products.forEach(product=>{

        const stock =
            Number(product.stock || 0);

        const minimum =
            Number(product.low_stock || 5);

        let status = "In Stock";
        let cls = "stock-ok";

        if(stock <= 0){

            status = "Out of Stock";
            cls = "stock-out";

        }
        else if(stock <= minimum){

            status = "Low Stock";
            cls = "stock-low";

        }

        html += `
        <tr>

            <td>
                <strong>
                    ${escapeHtml(product.name)}
                </strong>
            </td>

            <td>${money(product.price)}</td>

            <td>

                <input
                    class="stock-input"
                    id="stock-${escapeHtml(String(product.id))}"
                    type="number"
                    min="0"
                    value="${stock}">

            </td>

            <td>${minimum}</td>

            <td class="${cls}">
                ${status}
            </td>

            <td>

                <button
                    class="table-btn edit-btn"
                    onclick="updateStock(
                        '${escapeHtml(String(product.id))}'
                    )">
                    Save
                </button>

            </td>

        </tr>
        `;

    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    document.getElementById(
        "stockTable"
    ).innerHTML = html;

}

async function updateStock(id){

    const input =
        document.getElementById("stock-"+id);

    if(!input) return;

    const stock =
        Number(input.value);

    if(
        !Number.isInteger(stock) ||
        stock < 0
    ){

        alert("Valid stock quantity pao.");
        return;

    }

    const {error} =
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);

    if(error){

        alert(
            "Stock update failed:\n\n" +
            error.message
        );

        return;

    }

    alert("Stock updated successfully.");

    loadStock();

}

function renderProducts(products){

    const box =
        document.getElementById("productsList");

    if(!products.length){

        box.innerHTML = `
            <div class="message">
                No products added yet.
            </div>
        `;

        return;

    }

    let html = `<div class="product-grid">`;

    products.forEach(product=>{

        const stock =
            Number(product.stock || 0);

        let stockText =
            "Stock: " + stock;

        let stockClass =
            "stock-ok";

        if(stock <= 0){

            stockText = "Out of Stock";
            stockClass = "stock-out";

        }
        else if(
            stock <= Number(product.low_stock || 5)
        ){

            stockText = "Low Stock: " + stock;
            stockClass = "stock-low";

        }

        const image =
            product.image_url || "";

        html += `

        <div class="product-card">

            ${
                image
                ?
                `<img
                    class="product-card-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}">`
                :
                `<div
                    class="product-card-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;">
                    🧴
                </div>`
            }

            <div class="product-card-body">

                <h3>
                    ${escapeHtml(product.name)}
                </h3>

                <div class="product-description">
                    ${escapeHtml(product.description || "")}
                </div>

                <div class="product-price">
                    ${money(product.price)}
                </div>

                <div class="product-stock ${stockClass}">
                    ${stockText}
                </div>

                <div class="product-card-actions">

                    <button
                        class="edit-btn"
                        onclick="editProduct(
                            '${escapeHtml(String(product.id))}'
                        )">
                        ✏️ Edit
                    </button>

                    <button
                        class="edit-btn"
                        onclick="editProductStock(
                            '${escapeHtml(String(product.id))}'
                        )">
                        📦 Stock
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteProduct(
                            '${escapeHtml(String(product.id))}'
                        )">
                        🗑 Delete
                    </button>

                </div>

            </div>

        </div>
        `;

    });

    html += "</div>";

    box.innerHTML = html;

}

async function editProductStock(id){

        allProducts.find(
            p =>
            String(p.id)
            === String(id)

    if(!product) return;

    const value =
        prompt(
            "New stock quantity:",
            product.stock || 0
        );

    if(value === null) return;

    const stock =
        Number(value);

    if(
        !Number.isInteger(stock) ||
        stock < 0
    ){

        alert("Valid stock quantity pao.");
        return;

    }

    const {error} =
        await supabaseClient
        .from("products")
        .update({
            stock:stock
        })
        .eq("id",id);

    if(error){

        alert(
            "Stock update failed:\n\n" +
            error.message
        );

        return;

    }

    loadProducts();

}

function previewEditPhoto(event){

    const file = event.target.files[0];
    if(!file) return;

    const preview = document.getElementById("editPhotoPreview");
    if(!preview) return;

    preview.innerHTML = `
        <img
            src="${URL.createObjectURL(file)}"
            alt="New Product Photo"
            style="width:170px;height:170px;object-fit:cover;border-radius:12px;border:1px solid #ddd;">
    `;
}

async function saveEditedProduct(id){

    const name = document.getElementById("editProductNameInput").value.trim();
    const price = Number(document.getElementById("editProductPriceInput").value);
    const stock = Number(document.getElementById("editProductStockInput").value || 0);
    const lowStock = Number(document.getElementById("editProductLowStockInput").value || 5);
    const description = document.getElementById("editProductDescriptionInput").value.trim();
    const file = document.getElementById("editProductPhotoInput").files[0];
    const status = document.getElementById("editUploadStatus");

    if(!name){
        alert("Product name pao.");
        return;
    }

    if(!Number.isFinite(price) || price < 0){
        alert("Valid price pao.");
        return;
    }

    if(!Number.isInteger(stock) || stock < 0){
        alert("Valid stock quantity pao.");
        return;
    }

    if(!Number.isInteger(lowStock) || lowStock < 0){
        alert("Valid low stock value pao.");
        return;
    }

    const user = await checkAdmin();
    if(!user) return;

    const oldProduct = allProducts.find(
        p => String(p.id) === String(id)
    );

    if(!oldProduct){
        alert("Product not found.");
        return;
    }

    try{

        let imageUrl = oldProduct.image_url || null;

        if(file){

            status.innerText = "Uploading new photo...";

            const extension =
                file.name.split(".").pop().toLowerCase();

            const fileName =
                Date.now() +
                "-" +
                Math.random().toString(36).substring(2) +
                "." + extension;

            const filePath = "products/" + fileName;

            const upload =
                await supabaseClient
                .storage
                .from(IMAGE_BUCKET)
                .upload(filePath, file, {
                    cacheControl:"3600",
                    upsert:false
                });

            if(upload.error){
                alert("Photo upload failed:\n\n" + upload.error.message);
                return;
            }

            imageUrl =
                supabaseClient
                .storage
                .from(IMAGE_BUCKET)
                .getPublicUrl(filePath)
                .data.publicUrl;
        }

        status.innerText = "Saving changes...";

        const updateData = {
            name:name,
            price:price,
            stock:stock,
            low_stock:lowStock,
            description:description,
            image_url:imageUrl
        };

        const {error} =
            await supabaseClient
            .from("products")
            .update(updateData)
            .eq("id",id);

        if(error){
            alert("Product update failed:\n\n" + error.message);
            return;
        }

        alert("Product updated successfully.");
        loadProducts();

    }catch(error){
        alert("Something went wrong:\n\n" + error.message);
    }
}

async function deleteProduct(id){

    const product =
        allProducts.find(
            p =>
            String(p.id)
            === String(id)
        );

    if(!product) return;

    const yes =
        confirm(
            'Delete "' +
            product.name +
            '"?'
        );

    if(!yes) return;

    const {error} =
        await supabaseClient
        .from("products")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Product delete failed:\n\n" +
            error.message
        );

        return;

    }

    alert("Product deleted successfully.");

    loadProducts();

}

                "productPriceInput"
            ).value
        );

                "productStockInput"
            ).value || 0
        );

        Number(
            document.getElementById(
                "productLowStockInput"
            ).value || 5
        );

        document.getElementById(
            "productDescriptionInput"
        ).value.trim();

    const file =
        document.getElementById(
            "productPhotoInput"
        ).files[0];

        document.getElementById(
            "uploadStatus"
        );

        await checkAdmin();

    status.innerText =

            file.name
            .split(".")

            .toLowerCase();

            Math.random()
            .toString(36)
            .substring(2) +

            extension;

            "products/" +
            fileName;

        const upload =
            await supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );

        if(upload.error){

            alert(
                "Photo upload failed:\n\n" +
                upload.error.message
            );

            return;

        status.innerText =
            "Saving product...";

        const publicData =
            supabaseClient
            .storage
            .from(IMAGE_BUCKET)
            .getPublicUrl(filePath);

            publicData.data.publicUrl;

            await supabaseClient

            .insert({

                name:name,
                price:price,
                stock:stock,
                low_stock:lowStock,

                image_url:imageUrl

            alert(

        );

function clearProductForm(){

    [
        "productNameInput",
        "productPriceInput",
        "productDescriptionInput"
    ].forEach(id=>{

        const el =
            document.getElementById(id);

        if(el) el.value = "";

    });

    const stock =
        document.getElementById(
            "productStockInput"
        );

    if(stock) stock.value = "0";

    const low =
        document.getElementById(
            "productLowStockInput"
        );

    if(low) low.value = "5";

    const photo =
        document.getElementById(
            "productPhotoInput"
        );

    if(photo) photo.value = "";

    const preview =
        document.getElementById(
            "photoPreview"
        );

    if(preview)
        preview.style.display = "none";

    const status =
        document.getElementById(
            "uploadStatus"
        );

    if(status)
        status.innerText = "";

}

/* =========================================================
   CUSTOMERS
========================================================= */

async function loadCustomers(){

    document.getElementById(
        "other-content"
    ).innerHTML = `

    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>CUSTOMER MANAGEMENT</p>
                <h2>👥 Customers</h2>
            </div>

            <button class="btn" onclick="loadCustomers()">
                🔄 Refresh
            </button>

        </div>

        <div id="customersTable">
            <div class="message">Loading customers...</div>
        </div>

    </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        document.getElementById(
            "customersTable"
        ).innerHTML = `
            <div class="message error">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    const customers = {};

    (data || []).forEach(order=>{

        const name =
            order.customer_name ||
            order.name ||
            "Unknown Customer";

        const phone =
            order.phone ||
            order.mobile ||
            "-";

        const key =
            phone !== "-"
            ? phone
            : name;

        if(!customers[key]){

            customers[key] = {
                name:name,
                phone:phone,
                orders:0,
                total:0,
                last:order.created_at
            };

        }

        customers[key].orders++;

        customers[key].total +=
            Number(order.total || 0);

    });

    const list =
        Object.values(customers);

    if(!list.length){

        document.getElementById(
            "customersTable"
        ).innerHTML = `
            <div class="message">
                No customers yet.
            </div>
        `;

        return;

    }

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>CUSTOMER</th>
        <th>MOBILE</th>
        <th>ORDERS</th>
        <th>TOTAL SPENDING</th>
        <th>LAST ORDER</th>
    </tr>
    </thead>
    <tbody>
    `;

    list.forEach(customer=>{

        html += `
        <tr>

            <td>
                <strong>
                    ${escapeHtml(customer.name)}
                </strong>
            </td>

            <td>${escapeHtml(customer.phone)}</td>

            <td>${customer.orders}</td>

            <td class="total">
                ${money(customer.total)}
            </td>

            <td>
                ${
                    customer.last
                    ? new Date(
                        customer.last
                      ).toLocaleDateString("en-IN")
                    : "-"
                }
            </td>

        </tr>
        `;

    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    document.getElementById(
        "customersTable"
    ).innerHTML = html;

}

/* =========================================================

========================================================= */

async function loadDelivery(){

    document.getElementById(
        "other-content"
    ).innerHTML = `

    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>DELIVERY MANAGEMENT</p>
                <h2>🚚 Delivery Tracking</h2>
            </div>

            <button class="btn" onclick="loadDelivery()">
                🔄 Refresh
            </button>

        </div>

        <div id="deliveryTable">
            <div class="message">
                Loading delivery orders...
            </div>
        </div>

    </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        document.getElementById(
            "deliveryTable"
        ).innerHTML = `
            <div class="message error">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    const deliveryOrders =
        (data || []).filter(order=>{

            const status =
                String(
                    order.status || "Pending"
                ).toLowerCase();

            return status !== "delivered" &&
                   status !== "cancelled";

        });

    if(!deliveryOrders.length){

        document.getElementById(
            "deliveryTable"
        ).innerHTML = `
            <div class="message">
                No active delivery orders.
            </div>
        `;

        return;

    }

    let html = `
    <div class="table-wrapper">
    <table class="data-table">
    <thead>
    <tr>
        <th>ORDER ID</th>
        <th>CUSTOMER</th>
        <th>MOBILE</th>
        <th>PRODUCT</th>
        <th>ADDRESS</th>
        <th>STATUS</th>
        <th>ACTION</th>
    </tr>
    </thead>
    <tbody>
    `;

    deliveryOrders.forEach(order=>{

        const address =
            order.address ||
            order.shipping_address ||
            order.delivery_address ||
            "-";

        html += `
        <tr>

            <td>
                <strong>
                    ${escapeHtml(
                        shortOrderId(order.id)
                    )}
                </strong>
            </td>

            <td>
                ${escapeHtml(
                    order.customer_name ||
                    order.name ||
                    "-"
                )}
            </td>

            <td>
                ${escapeHtml(
                    order.phone ||
                    order.mobile ||
                    "-"
                )}
            </td>

            <td class="product-name">
                ${escapeHtml(productName(order))}
            </td>

            <td>${escapeHtml(address)}</td>

            <td>${statusBadge(order.status)}</td>

            <td>
                <button
                    class="table-btn view-btn"
                    onclick="viewOrder(
                        '${escapeHtml(String(order.id))}'
                    )">
                    View
                </button>
            </td>

        </tr>
        `;

    });

    html += `
    </tbody>
    </table>
    </div>
    `;

    document.getElementById(
        "deliveryTable"
    ).innerHTML = html;

}

/* =========================================================
   REPORTS
========================================================= */

async function loadReports(){

    document.getElementById(
        "other-content"
    ).innerHTML = `

    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>BUSINESS ANALYTICS</p>
                <h2>📊 Reports</h2>
            </div>

            <button class="btn" onclick="loadReports()">
                🔄 Refresh
            </button>

        </div>

        <div id="reportsContent">
            <div class="message">Loading reports...</div>
        </div>

    </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("orders")
        .select("*");

    if(error){

        document.getElementById(
            "reportsContent"
        ).innerHTML = `
            <div class="message error">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    const orders =
        data || [];

    let totalSales = 0;
    let delivered = 0;
    let pending = 0;
    let cancelled = 0;

    const productSales = {};

    orders.forEach(order=>{

        const status =
            String(
                order.status || "Pending"
            ).toLowerCase();

        if(status !== "cancelled"){
            totalSales += Number(order.total || 0);
        }

        if(status === "delivered"){
            delivered++;
        }
        else if(status === "cancelled"){
            cancelled++;
        }
        else{
            pending++;
        }

        const product =
            productName(order);

        if(!productSales[product]){

            productSales[product] = {
                qty:0,
                amount:0
            };

        }

        productSales[product].qty +=
            Number(order.quantity || 1);

        productSales[product].amount +=
            Number(order.total || 0);

    });

    const topProducts =
        Object.entries(productSales)
        .sort(
            (a,b)=>
            b[1].amount-a[1].amount
        )
        .slice(0,10);

    let productRows = "";

    topProducts.forEach(item=>{

        productRows += `

        <div class="stat-row">

            <strong>
                ${escapeHtml(item[0])}
            </strong>

            <span>
                ${item[1].qty} units ·
                ${money(item[1].amount)}
            </span>

        </div>
        `;

    });

    document.getElementById(
        "reportsContent"
    ).innerHTML = `

    <div class="summary-grid">

        <div class="summary-card sales">
            <span>Total Sales</span>
            <strong>${money(totalSales)}</strong>
        </div>

        <div class="summary-card">
            <span>Total Orders</span>
            <strong>${orders.length}</strong>
        </div>

        <div class="summary-card delivered">
            <span>Delivered</span>
            <strong>${delivered}</strong>
        </div>

        <div class="summary-card cancelled">
            <span>Cancelled</span>
            <strong>${cancelled}</strong>
        </div>

    </div>

    <div class="analytics-grid">

        <div class="analytics-card">

            <h3>📦 Order Status</h3>

            <div class="stat-row">
                <span>Delivered</span>
                <strong>${delivered}</strong>
            </div>

            <div class="stat-row">
                <span>Active / Pending</span>
                <strong>${pending}</strong>
            </div>

            <div class="stat-row">
                <span>Cancelled</span>
                <strong>${cancelled}</strong>
            </div>

        </div>

        <div class="analytics-card">

            <h3>🏆 Top Products</h3>

            ${
                productRows ||
                `<div class="message">
                    No product sales yet.
                </div>`
            }

        </div>

    </div>
    `;

}

/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications(){

    document.getElementById(
        "other-content"
    ).innerHTML = `

    <div class="admin-box">

        <div class="admin-header">

            <div>
                <p>BUSINESS ALERTS</p>
                <h2>🔔 Notifications</h2>
            </div>

            <button class="btn" onclick="loadNotifications()">
                🔄 Refresh
            </button>

        </div>

        <div id="notificationContent">
            <div class="message">Loading alerts...</div>
        </div>

    </div>
    `;

    const user =
        await checkAdmin();

    if(!user) return;

    const {data,error} =
        await supabaseClient
        .from("products")
        .select("*");

    if(error){

        document.getElementById(
            "notificationContent"
        ).innerHTML = `
            <div class="message error">
                ${escapeHtml(error.message)}
            </div>
        `;

        return;

    }

    const low =
        (data || []).filter(product=>{

            return Number(product.stock || 0)
                <=
                Number(product.low_stock || 5);

        });

    if(!low.length){

        document.getElementById(
            "notificationContent"
        ).innerHTML = `

        <div
            class="analytics-card"
            style="text-align:center">

            <div style="font-size:45px">✅</div>

            <h3>Everything looks good</h3>

            <p style="color:#777">
                No low-stock products right now.
            </p>

        </div>
        `;

        return;

    }

    let html = `

    <div class="analytics-card">

        <h3>⚠️ Low Stock Alerts</h3>
    `;

    low.forEach(product=>{

        const stock =
            Number(product.stock || 0);

        html += `

        <div class="stat-row">

            <span>
                ${escapeHtml(product.name)}
            </span>

            <strong
                class="${
                    stock <= 0
                    ? "stock-out"
                    : "stock-low"
                }">

                ${
                    stock <= 0
                    ? "OUT OF STOCK"
                    : "Only " + stock + " left"
                }

            </strong>

        </div>
        `;

    });

    html += "</div>";

    document.getElementById(
        "notificationContent"
    ).innerHTML = html;

}

/* =========================================================
   SETTINGS UI HELPERS
========================================================= */

function toggle(id,checked){

    return `
    <label class="switch">

        <input
            type="checkbox"
            id="${id}"
            ${checked ? "checked" : ""}>

        <span class="slider"></span>

    </label>
    `;

}

function notificationToggle(
    id,
    checked,
    title,
    description
){

    return `
    <div class="switch-row">

        <div class="switch-info">

            <strong>${escapeHtml(title)}</strong>

            <small>
                ${escapeHtml(description)}
            </small>

        </div>

        ${toggle(id,checked)}

    </div>
    `;

}

function optionList(options,current){

    return options.map(option=>`

        <option
            value="${escapeHtml(option)}"
            ${
                String(current).toLowerCase()
                === String(option).toLowerCase()
                ? "selected"
                : ""
            }>

            ${escapeHtml(option)}

        </option>

    `).join("");

}

function openSettingsTab(tab,button){

    document.querySelectorAll(
        ".settings-panel"
    ).forEach(panel=>{
        panel.classList.remove("active");
    });

    document.querySelectorAll(
        ".settings-nav button"
    ).forEach(btn=>{
        btn.classList.remove("active");
    });

    const panel =
        document.getElementById(
            "settings-"+tab
        );

    if(panel){
        panel.classList.add("active");
    }

    if(button){
        button.classList.add("active");
    }

}

/* =========================================================
   PASSWORD CHANGE
========================================================= */

async function changeAdminPassword(){

    const password =
        document.getElementById(
            "newAdminPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmAdminPassword"
        ).value;

    if(password.length < 6){

        alert(
            "Password minimum 6 characters da hona chahida."
        );

        return;

    }

    if(password !== confirmPassword){

        alert(
            "Passwords match nahi karde."
        );

        return;

    }

    const user =
        await checkAdmin();

    if(!user) return;

    const {error} =
        await supabaseClient
        .auth
        .updateUser({
            password:password
        });

    if(error){

        alert(
            "Password change failed:\n\n" +
            error.message
        );

        return;

    }

    document.getElementById(
        "newAdminPassword"
    ).value = "";

    document.getElementById(
        "confirmAdminPassword"
    ).value = "";

    alert(
        "Password successfully change ho gaya."
    );

}

/* =========================================================
   SYSTEM STATUS
========================================================= */

async function checkSystemStatus(){

    const status =
        document.getElementById(
            "supabaseStatus"
        );

    const dot =
        document.getElementById(
            "supabaseDot"
        );

    if(!status) return;

    status.innerText =
        "Checking connection...";

    if(dot){
        dot.classList.remove(
            "offline",
            "warning"
        );
    }

    try{

        const {data,error} =
            await supabaseClient
            .auth
            .getUser();

        if(error){

            status.innerText =
                "Connection available, but admin session check returned an error.";

            if(dot)
                dot.classList.add("warning");

            return;

        }

        if(data && data.user){

            status.innerText =
                "Connected • Admin session active.";

        }
        else{

            status.innerText =
                "Supabase connected • No active session.";

        }

    }
    catch(error){

        status.innerText =
            "Unable to connect.";

        if(dot)
            dot.classList.add("offline");

    }

}
