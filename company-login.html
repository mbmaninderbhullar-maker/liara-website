<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Company Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .company-login-section {
            min-height: 75vh;
            padding: 80px 5%;
            background: #faf8f5;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .company-login-box {
            width: 100%;
            max-width: 450px;

            background: white;
            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.08);
        }

        .company-login-box > p:first-child {
            color: #ad8232;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .company-login-box h2 {
            margin: 0 0 8px;
        }

        .company-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;

            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ad8232;
        }

        .company-login-btn {
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
        }

        .company-login-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .company-message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            min-height: 22px;
        }

        .company-message.success {
            color: #287a3e;
        }

        .company-message.error {
            color: #a33;
        }

    </style>

</head>


<body>


<header>

    <a href="index.html" class="logo">

        <span>
            LIARA
        </span>

        <small>
            PROFESSIONAL™
        </small>

    </a>

</header>



<section class="company-login-section">


    <div class="company-login-box">


        <p>
            LIARA PROFESSIONAL™
        </p>


        <h2>
            Company Login
        </h2>


        <p class="company-subtitle">
            Secure Company / Admin Access
        </p>


        <form id="companyLoginForm">


            <div class="form-group">

                <label for="email">
                    Company Email
                </label>

                <input
                    type="email"
                    id="email"
                    value="info@liara.co.in"
                    autocomplete="username"
                    readonly
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter company password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="btn company-login-btn"
                id="loginButton">

                Company Login

            </button>


            <div
                id="message"
                class="company-message">
            </div>


        </form>


    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_EMAIL =
    "info@liara.co.in";



/* =====================================
   COMPANY LOGIN
===================================== */


document.getElementById(
    "companyLoginForm"
).addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const button =
            document.getElementById(
                "loginButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        message.innerText = "";

        message.className =
            "company-message";


        button.disabled = true;

        button.innerText =
            "Logging in...";


        try {


            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


            if (error) {


                console.error(
                    "Supabase Login Error:",
                    error
                );


                message.innerText =
                    error.message;


                message.className =
                    "company-message error";


                button.disabled =
                    false;


                button.innerText =
                    "Company Login";


                return;

            }


            if (data.user) {


                if (
                    data.user.email.toLowerCase() !==
                    ADMIN_EMAIL.toLowerCase()
                ) {


                    await supabaseClient
                        .auth
                        .signOut();


                    message.innerText =
                        "Company access only.";


                    message.className =
                        "company-message error";


                    button.disabled =
                        false;


                    button.innerText =
                        "Company Login";


                    return;

                }


                message.innerText =
                    "Company login successful ✓";


                message.className =
                    "company-message success";


                button.innerText =
                    "Opening Orders...";


                setTimeout(
                    function() {

                        window.location.href =
                            "admin-orders.html";

                    },
                    500
                );

            }

        }

        catch (error) {


            console.error(
                "Login Error:",
                error
            );


            message.innerText =
                "Something went wrong. Please try again.";


            message.className =
                "company-message error";


            button.disabled =
                false;


            button.innerText =
                "Company Login";

        }

    }
);


</script>


</body>

</html>
