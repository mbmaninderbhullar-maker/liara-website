<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    Liara Professional™ | Company Login
</title>

<link rel="stylesheet" href="style.css">

<style>

    .company-login-section {
        min-height: 75vh;
        padding: 80px 5%;
        background: #faf8f5;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .company-login-box {
        width: 100%;
        max-width: 450px;

        background: white;

        padding: 40px;

        border-radius: 18px;

        box-shadow:
            0 10px 35px
            rgba(0,0,0,.08);
    }

    .company-login-box > p:first-child {
        color: #ad8232;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .company-login-box h2 {
        margin: 0 0 8px;
    }

    .company-subtitle {
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 13px 15px;

        border: 1px solid #ddd;
        border-radius: 8px;

        box-sizing: border-box;

        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #ad8232;
    }

    .company-login-btn {
        width: 100%;
        border: none;
        cursor: pointer;
        font-size: 16px;
        margin-top: 5px;
    }

    .company-login-btn:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .company-message {
        text-align: center;
        margin-top: 18px;
        font-weight: bold;
        min-height: 22px;
    }

    .back-home {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #ad8232;
        text-decoration: none;
        font-size: 14px;
    }

    .back-home:hover {
        text-decoration: underline;
    }

</style>


</head>

<body>

<!-- HEADER -->

<header>

```
<a href="/" class="logo">

    <span>
        LIARA
    </span>

    <small>
        PROFESSIONAL™
    </small>

</a>


</header>

<!-- COMPANY LOGIN -->

<section class="company-login-section">


<div class="company-login-box">


    <p>
        LIARA PROFESSIONAL™
    </p>


    <h2>
        Company Login
    </h2>


    <p class="company-subtitle">
        Secure Company / Admin Access
    </p>



    <form id="companyLoginForm">


        <div class="form-group">

            <label for="email">
                Company Email
            </label>

            <input
                type="email"
                id="email"
                value="info@liara.co.in"
                autocomplete="username"
                required>

        </div>



        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter company password"
                autocomplete="current-password"
                required>

        </div>



        <button
            type="submit"
            class="btn company-login-btn"
            id="loginButton">

            Company Login

        </button>



        <div
            id="message"
            class="company-message">
        </div>


    </form>



    <a
        href="/"
        class="back-home">

        ← Back to Website

    </a>


</div>
```

</section>

<!-- FOOTER -->

<footer>


<div class="footer-brand">

    LIARA

    <small>
        PROFESSIONAL™
    </small>

</div>


<p>

    © 2026 Liara Group Private Limited.
    All Rights Reserved.

</p>
```

</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================
   COMPANY ADMIN EMAIL
===================================== */

const ADMIN_EMAIL =
    "info@liara.co.in";



/* =====================================
   LOGIN FORM
===================================== */

document
    .getElementById("companyLoginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const button =
                document
                    .getElementById("loginButton");


            const message =
                document
                    .getElementById("message");


            message.innerText = "";


            button.disabled = true;

            button.innerText =
                "Logging in...";


            /* =============================
               CHECK EMAIL
            ============================= */

            if (
                email.toLowerCase() !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                message.innerText =
                    "This account is not authorized.";

                button.disabled = false;

                button.innerText =
                    "Company Login";

                return;

            }


            /* =============================
               SUPABASE LOGIN
            ============================= */

            const {
                data,
                error
            } = await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            /* =============================
               LOGIN ERROR
            ============================= */

            if (error) {

                console.log(
                    "Supabase Login Error:",
                    error
                );


                message.innerText =
                    error.message;


                button.disabled =
                    false;


                button.innerText =
                    "Company Login";


                return;

            }


            /* =============================
               SUCCESS
            ============================= */

            if (data && data.user) {


                message.innerText =
                    "Company login successful ✓";


                button.innerText =
                    "Opening Orders...";


                setTimeout(
                    function() {

                        window.location.href =
                            "admin-orders.html";

                    },
                    700
                );


            }

        }
    );


</script>

</body>

</html>
