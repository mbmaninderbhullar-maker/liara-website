<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liara Professional™ | Login</title>
<link rel="stylesheet" href="style.css">
<style>
.company-login-section{min-height:75vh;padding:80px 5%;background:#faf8f5;display:flex;align-items:center;justify-content:center}
.company-login-box{width:100%;max-width:450px;background:white;padding:40px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
.company-login-box>p:first-child{color:#ad8232;font-weight:bold;letter-spacing:2px;margin-bottom:8px}
.company-login-box h2{margin:0 0 8px}
.company-subtitle{color:#777;margin-bottom:30px}
.login-switch{display:flex;gap:8px;background:#f4f1ec;padding:6px;border-radius:12px;margin:0 0 28px}
.login-switch button{flex:1;border:0;background:transparent;padding:12px 10px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}
.login-switch button.active{background:#ad8232;color:#fff}
.login-mode-note{font-size:13px;color:#777;margin:-16px 0 22px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;font-weight:600}
.form-group input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px;outline:none}
.form-group input:focus{border-color:#ad8232}
.company-login-btn{width:100%;border:none;cursor:pointer;font-size:16px;margin-top:5px}
.company-login-btn:disabled{opacity:.6;cursor:not-allowed}
.company-message{text-align:center;margin-top:18px;font-weight:bold;min-height:22px}
.back-home{display:block;text-align:center;margin-top:20px;color:#ad8232;text-decoration:none;font-size:14px}
.back-home:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
<a href="/" class="logo">
<span>LIARA</span>
<small>PROFESSIONAL™</small>
</a>
</header>

<section class="company-login-section">
<div class="company-login-box">

<p>LIARA PROFESSIONAL™</p>

<h2 id="loginTitle">Admin Login</h2>

<p class="company-subtitle" id="loginSubtitle">
Secure Company / Admin Access
</p>

<div class="login-switch">
<button type="button" id="adminTab" class="active" onclick="setLoginMode('admin')">
Admin Login
</button>

<button type="button" id="staffTab" onclick="setLoginMode('staff')">
Staff Login
</button>
</div>

<p class="login-mode-note" id="loginModeNote">
Use company email and password.
</p>

<form id="companyLoginForm">

<div class="form-group">
<label id="loginIdLabel" for="email">Company Email</label>

<input
type="email"
id="email"
value="info@liara.co.in"
autocomplete="username"
required

>

</div>

<div class="form-group">

<label for="password">Password</label>

<input
type="password"
id="password"
placeholder="Enter company password"
autocomplete="current-password"
required

>

</div>

<button
type="submit"
class="btn company-login-btn"
id="loginButton"

>

Admin Login </button>

<div id="message" class="company-message"></div>

</form>

<a href="/" class="back-home">
← Back to Website
</a>

</div>
</section>

<footer>
<div class="footer-brand">
LIARA <small>PROFESSIONAL™</small>
</div>

<p>
© 2026 Liara Group Private Limited. All Rights Reserved.
</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@Supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_EMAIL =
"info@liara.co.in";

let loginMode="admin";


/* =========================
   LOGIN MODE
========================= */

function setLoginMode(mode){

loginMode=mode;

const admin=mode==="admin";

document
.getElementById("adminTab")
.classList
.toggle("active",admin);

document
.getElementById("staffTab")
.classList
.toggle("active",!admin);

document.getElementById("loginTitle").innerText =
admin ? "Admin Login" : "Staff Login";

document.getElementById("loginSubtitle").innerText =
admin
? "Secure Company / Admin Access"
: "Secure Staff Access";

document.getElementById("loginModeNote").innerText =
admin
? "Use company email and password."
: "Use your Staff Login ID (LIARA-XXXXXX) and staff password.";

document.getElementById("loginIdLabel").innerText =
admin
? "Company Email"
: "Staff Login ID";

const input=document.getElementById("email");

input.type =
admin ? "email" : "text";

input.value =
admin ? ADMIN_EMAIL : "";

input.placeholder =
admin ? "" : "LIARA-XXXXXX";

input.autocomplete="username";

document.getElementById("password").value="";

document.getElementById("password").placeholder =
admin
? "Enter company password"
: "Enter staff password";

document.getElementById("loginButton").innerText =
admin ? "Admin Login" : "Staff Login";

document.getElementById("message").innerText="";

}


/* =========================
   FIND STAFF PROFILE
========================= */

async function findStaffByLoginId(loginId){

/*
  Normalize entered Staff Login ID.

  Accepted formats:

  LIARA-ABC123
  liara-abc123
  LIARA ABC123
  LIARA_ABC123
  LIARAABC123
*/

let entered =
String(loginId || "")
.trim()
.toUpperCase();

let cleanLoginId =
entered
.replace(/\s+/g,"")
.replace(/_/g,"-");


/*
  Convert:

  LIARAABC123

  into:

  LIARA-ABC123
*/

if(
/^LIARA[A-Z0-9]{6}$/.test(cleanLoginId)
){

cleanLoginId =
"LIARA-" +
cleanLoginId.substring(5);

}


/*
  Final validation.
*/

if(
!/^LIARA-[A-Z0-9]{6}$/.test(cleanLoginId)
){

throw new Error(
"Enter a valid Staff Login ID, e.g. LIARA-ABC123."
);

}


/*
  Get staff profiles.

  We fetch the available staff profiles and
  normalize login_id/staff_code locally so
  different formatting does not cause a
  false "not found" result.
*/

let {
data:profiles,
error:profilesError
} =
await supabaseClient
.from("staff_profiles")
.select(`
id,
user_id,
name,
email,
role,
permissions,
active,
login_id,
staff_code
`);


if(profilesError){

console.error(
"Staff profile lookup error:",
profilesError
);

throw profilesError;

}


/*
  Normalize database Staff Login ID.
*/

const normalizeStaffId = value => {

if(!value){

return "";

}

let valueNormalized =
String(value)
.trim()
.toUpperCase()
.replace(/\s+/g,"")
.replace(/_/g,"-");


/*
  Convert LIARAABC123
  to LIARA-ABC123.
*/

if(
/^LIARA[A-Z0-9]{6}$/.test(valueNormalized)
){

valueNormalized =
"LIARA-" +
valueNormalized.substring(5);

}

return valueNormalized;

};


/*
  Find matching profile using either:

  login_id

  OR

  staff_code
*/

let profile =
(profiles || []).find(item => {

const databaseLoginId =
normalizeStaffId(item.login_id);

const databaseStaffCode =
normalizeStaffId(item.staff_code);

return (
databaseLoginId === cleanLoginId ||
databaseStaffCode === cleanLoginId
);

});


/*
  No profile found.
*/

if(!profile){

console.error(
"Staff Login ID not found:",
cleanLoginId,
profiles
);

throw new Error(
"Staff Login ID not found. Please check the ID created in Staff Management."
);

}


/*
  Account inactive.
*/

if(profile.active===false){

throw new Error(
"This staff account is inactive."
);

}


/*
  Email is required because Supabase
  password authentication uses email/phone,
  not custom Login ID.
*/

if(
!profile.email ||
!String(profile.email).trim()
){

throw new Error(
"Staff account email is missing. Please contact Admin."
);

}


return profile;

}


/* =========================
   LOGIN FORM
========================= */

document
.getElementById("companyLoginForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();

const loginValue =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");

message.innerText="";

button.disabled=true;

button.innerText="Logging in...";


try{

let email=loginValue;

let staffProfile=null;


/* =========================
   ADMIN LOGIN
========================= */

if(loginMode==="admin"){

if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

throw new Error(
"This account is not authorized."
);

}

}


/* =========================
   STAFF LOGIN
========================= */

else{

staffProfile =
await findStaffByLoginId(loginValue);

email =
String(staffProfile.email).trim();

}


/* =========================
   SUPABASE AUTH LOGIN
========================= */

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}


if(
!data ||
!data.user
){

throw new Error(
"Login failed."
);

}


/* =========================
   ADMIN VERIFY
========================= */

if(loginMode==="admin"){

if(
!data.user.email ||
data.user.email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

await supabaseClient.auth.signOut();

throw new Error(
"This account is not authorized as Admin."
);

}

message.innerText =
"Admin login successful ✓";

button.innerText =
"Opening Orders...";

setTimeout(
()=>{
window.location.href="admin-orders.html";
},
700
);

return;

}


/* =========================
   STAFF VERIFY
========================= */

if(
!staffProfile ||
!staffProfile.user_id
){

await supabaseClient.auth.signOut();

throw new Error(
"Staff profile not found."
);

}


/*
  Extra security check:
  The Auth user must belong to the
  same staff profile selected by Login ID.
*/

if(
String(staffProfile.user_id) !==
String(data.user.id)
){

await supabaseClient.auth.signOut();

throw new Error(
"This Staff Login ID is not linked to the authenticated account."
);

}


/*
  Re-check active status.
*/

if(
staffProfile.active===false
){

await supabaseClient.auth.signOut();

throw new Error(
"This staff account is inactive."
);

}


/*
  Save complete staff profile locally
  for existing staff/admin pages.
*/

sessionStorage.setItem(
"liaraStaffProfile",
JSON.stringify(staffProfile)
);


/*
  Also save basic staff identity.
  Existing pages can use either key.
*/

sessionStorage.setItem(
"liaraStaffLoginId",
staffProfile.login_id ||
staffProfile.staff_code ||
""
);

sessionStorage.setItem(
"liaraStaffRole",
staffProfile.role ||
"Staff"
);


/* =========================
   SUCCESS
========================= */

message.innerText =
"Staff login successful ✓";

button.innerText =
"Opening Staff Panel...";

setTimeout(
()=>{
window.location.href="admin-orders.html";
},
700
);

}

catch(error){

console.error(
"Login Error:",
error
);


/*
  Convert common Supabase auth errors
  into cleaner messages.
*/

let errorMessage =
error?.message ||
"Login failed.";


if(
errorMessage.toLowerCase()
.includes("invalid login credentials")
){

errorMessage =
"Invalid password.";

}

else if(
errorMessage.toLowerCase()
.includes("email not confirmed")
){

errorMessage =
"Staff account email is not confirmed.";

}


message.innerText=errorMessage;

button.disabled=false;

button.innerText =
loginMode==="admin"
? "Admin Login"
: "Staff Login";

}

});

</script>

</body>
</html>
