<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | Customer Login</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .login-section {
            min-height: 75vh;
            padding: 80px 20px;
            background: #f7f1e7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #ad8232;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #866326;
        }

        .forgot-password {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 18px;
        }

        .forgot-password a {
            color: #ad8232;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .back-login {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .back-login a {
            color: #ad8232;
            font-weight: bold;
            cursor: pointer;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .switch a {
            color: #ad8232;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

    </style>

</head>


<body>


<header>

    <a href="index.html"
       class="logo">

        <span>LIARA</span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>



<section class="login-section">


    <div class="login-box">


        <!-- =========================
             LOGIN / SIGNUP TITLE
        ========================== -->

        <h2 id="formTitle">
            Customer Login
        </h2>


        <p class="subtitle"
           id="formSubtitle">

            Login to your Liara Professional account

        </p>



        <!-- =========================
             SIGNUP FIELDS
        ========================== -->

        <div id="signupFields"
             style="display:none;">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                autocomplete="name">


            <input
                type="tel"
                id="phone"
                placeholder="Mobile Number"
                autocomplete="tel">

        </div>



        <!-- =========================
             EMAIL
        ========================== -->

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email">



        <!-- =========================
             PASSWORD
        ========================== -->

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">



        <!-- =========================
             FORGOT PASSWORD
        ========================== -->

        <div class="forgot-password"
             id="forgotBox">

            <a onclick="showForgotPassword()">
                Forgot Password?
            </a>

        </div>



        <!-- =========================
             MAIN BUTTON
        ========================== -->

        <button
            type="button"
            class="login-button"
            id="mainButton"
            onclick="loginUser()">

            Login

        </button>



        <!-- =========================
             LOGIN / SIGNUP SWITCH
        ========================== -->

        <div class="switch"
             id="switchBox">

            <span id="switchText">
                Don't have an account?
            </span>

            <a
                id="switchLink"
                onclick="toggleForm()">

                Create Account

            </a>

        </div>



        <!-- =========================
             BACK TO LOGIN
        ========================== -->

        <div class="back-login"
             id="backLogin"
             style="display:none;">

            <a onclick="showLogin()">
                ← Back to Login
            </a>

        </div>



        <!-- =========================
             MESSAGE
        ========================== -->

        <div id="message"></div>


    </div>

</section>



<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */


const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let signupMode = false;



/* =========================
   TOGGLE LOGIN / SIGNUP
========================= */


function toggleForm() {

    signupMode = !signupMode;


    const fields =
        document.getElementById("signupFields");

    const title =
        document.getElementById("formTitle");

    const subtitle =
        document.getElementById("formSubtitle");

    const button =
        document.getElementById("mainButton");

    const switchText =
        document.getElementById("switchText");

    const switchLink =
        document.getElementById("switchLink");

    const forgotBox =
        document.getElementById("forgotBox");

    const backLogin =
        document.getElementById("backLogin");


    backLogin.style.display = "none";


    if (signupMode) {

        fields.style.display = "block";

        title.innerText =
            "Create Customer Account";

        subtitle.innerText =
            "Create your Liara Professional account";

        button.innerText =
            "Create Account";

        button.onclick =
            signupUser;

        switchText.innerText =
            "Already have an account?";

        switchLink.innerText =
            "Login";

        forgotBox.style.display =
            "none";


        document.getElementById("password")
            .setAttribute(
                "autocomplete",
                "new-password"
            );


    } else {

        fields.style.display = "none";

        title.innerText =
            "Customer Login";

        subtitle.innerText =
            "Login to your Liara Professional account";

        button.innerText =
            "Login";

        button.onclick =
            loginUser;

        switchText.innerText =
            "Don't have an account?";

        switchLink.innerText =
            "Create Account";

        forgotBox.style.display =
            "block";


        document.getElementById("password")
            .setAttribute(
                "autocomplete",
                "current-password"
            );

    }

}



/* =========================
   FORGOT PASSWORD SCREEN
========================= */


function showForgotPassword() {

    document.getElementById("formTitle")
        .innerText =
        "Forgot Password";


    document.getElementById("formSubtitle")
        .innerText =
        "Enter your email and we will send you a password reset link.";


    document.getElementById("signupFields")
        .style.display =
        "none";


    document.getElementById("password")
        .style.display =
        "none";


    document.getElementById("forgotBox")
        .style.display =
        "none";


    document.getElementById("switchBox")
        .style.display =
        "none";


    document.getElementById("backLogin")
        .style.display =
        "block";


    const button =
        document.getElementById("mainButton");


    button.innerText =
        "Send Reset Link";


    button.onclick =
        sendResetEmail;


    document.getElementById("email")
        .value = "";


    document.getElementById("email")
        .placeholder =
        "Enter your registered email";


    document.getElementById("message")
        .innerText = "";

}



/* =========================
   SEND PASSWORD RESET EMAIL
========================= */


async function sendResetEmail() {

    const email =
        document.getElementById("email")
        .value
        .trim();


    if (!email) {

        showMessage(
            "Please enter your email address."
        );

        return;

    }


    showMessage(
        "Sending password reset link..."
    );


    const { error } =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    window.location.pathname +
                    "?reset=true"
            }
        );


    if (error) {

        showMessage(
            error.message
        );

        return;

    }


    showMessage(
        "Password reset link has been sent to your email. Please check your inbox."
    );

}



/* =========================
   BACK TO LOGIN
========================= */


function showLogin() {

    signupMode = false;


    document.getElementById("formTitle")
        .innerText =
        "Customer Login";


    document.getElementById("formSubtitle")
        .innerText =
        "Login to your Liara Professional account";


    document.getElementById("signupFields")
        .style.display =
        "none";


    document.getElementById("password")
        .style.display =
        "block";


    document.getElementById("forgotBox")
        .style.display =
        "block";


    document.getElementById("switchBox")
        .style.display =
        "block";


    document.getElementById("backLogin")
        .style.display =
        "none";


    document.getElementById("mainButton")
        .innerText =
        "Login";


    document.getElementById("mainButton")
        .onclick =
        loginUser;


    document.getElementById("email")
        .placeholder =
        "Email Address";


    document.getElementById("password")
        .placeholder =
        "Password";


    document.getElementById("password")
        .value = "";


    document.getElementById("message")
        .innerText = "";

}



/* =========================
   CREATE ACCOUNT
========================= */


async function signupUser() {


    const name =
        document.getElementById("fullName")
        .value
        .trim();


    const phone =
        document.getElementById("phone")
        .value
        .trim();


    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    if (!name || !email || !password) {

        showMessage(
            "Please fill Name, Email and Password."
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    showMessage(
        "Creating your account..."
    );


    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name,

                    phone: phone

                }

            }

        });


    if (error) {

        showMessage(
            error.message
        );

        return;

    }


    document.getElementById("fullName").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";


    showMessage(
        "Account created successfully! Login now."
    );

}



/* =========================
   LOGIN
========================= */


async function loginUser() {


    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    if (!email || !password) {

        showMessage(
            "Please enter Email and Password."
        );

        return;

    }


    showMessage(
        "Logging in..."
    );


    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        showMessage(
            error.message
        );

        return;

    }


    showMessage(
        "Login successful!"
    );


    setTimeout(function() {

        window.location.href =
            "index.html";

    }, 1000);

}



/* =========================
   MESSAGE
========================= */


function showMessage(text) {

    document.getElementById("message")
        .innerText =
        text;

}



/* =========================
   PASSWORD RESET CHECK
========================= */


async function checkPasswordReset() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const reset =
        params.get("reset");


    if (reset !== "true") {

        return;

    }


    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth
        .getSession();


    if (!session) {

        showMessage(
            "Password reset session expired. Please request a new reset link."
        );

        return;

    }


    document.getElementById("formTitle")
        .innerText =
        "Create New Password";


    document.getElementById("formSubtitle")
        .innerText =
        "Enter your new password below.";


    document.getElementById("signupFields")
        .style.display =
        "none";


    document.getElementById("email")
        .style.display =
        "none";


    document.getElementById("forgotBox")
        .style.display =
        "none";


    document.getElementById("switchBox")
        .style.display =
        "none";


    document.getElementById("backLogin")
        .style.display =
        "none";


    const password =
        document.getElementById("password");


    password.style.display =
        "block";


    password.placeholder =
        "New Password";


    password.value = "";


    const button =
        document.getElementById("mainButton");


    button.innerText =
        "Update Password";


    button.onclick =
        updatePassword;

}



/* =========================
   UPDATE PASSWORD
========================= */


async function updatePassword() {

    const password =
        document.getElementById("password")
        .value;


    if (!password) {

        showMessage(
            "Please enter a new password."
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    showMessage(
        "Updating password..."
    );


    const { error } =
        await supabaseClient.auth
        .updateUser({

            password:
                password

        });


    if (error) {

        showMessage(
            error.message
        );

        return;

    }


    showMessage(
        "Password updated successfully! You can now login."
    );


    setTimeout(function() {

        window.history.replaceState(
            {},
            document.title,
            "login.html"
        );


        showLogin();

    }, 1500);

}



/* =========================
   RUN RESET CHECK
========================= */


checkPasswordReset();


</script>


</body>

</html>
