<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | My Account</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .account-section {
            min-height: 75vh;
            padding: 80px 8%;
            background: #f7f1e7;
        }

        .account-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .account-header h2 {
            margin-bottom: 5px;
        }

        .account-email {
            color: #777;
            font-size: 14px;
        }

        .logout-btn {
            padding: 12px 20px;
            background: #ad8232;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #866326;
        }

        .orders-title {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 20px;
        }

        .order-card {
            border: 1px solid #eee;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .order-card p {
            margin: 5px 0;
            color: #666;
        }

        .status {
            color: #ad8232;
            font-weight: bold;
        }

        .no-orders {
            color: #777;
            padding: 20px 0;
        }

        @media (max-width: 600px) {

            .account-section {
                padding: 50px 5%;
            }

            .account-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        <span>LIARA</span>
        <small>PROFESSIONAL™</small>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a href="cart.html">Cart 🛒</a>
        <a href="account.html">My Account</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>


<section class="account-section">

    <div class="account-box">

        <div class="account-header">

            <div>

                <h2>
                    My Account
                </h2>

                <div
                    class="account-email"
                    id="userEmail">
                    Loading...
                </div>

            </div>

            <button
                class="logout-btn"
                onclick="logoutUser()">

                Logout

            </button>

        </div>


        <h3 class="orders-title">
            My Orders
        </h3>


        <div id="orders">
            Loading orders...
        </div>

    </div>

</section>


<footer>

    <div class="footer-brand">
        LIARA
        <small>PROFESSIONAL™</small>
    </div>

    <p>
        © 2026 Liara Group Private Limited.
        All Rights Reserved.
    </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadAccount() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    document.getElementById(
        "userEmail"
    ).innerText = user.email;


    loadOrders(user.id);

}


async function loadOrders(userId) {

    const ordersBox =
        document.getElementById("orders");


    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
            ascending: false
        });


    if (error) {

        ordersBox.innerHTML =
            "<p>Unable to load orders.</p>";

        return;

    }


    if (!data || data.length === 0) {

        ordersBox.innerHTML = `
            <div class="no-orders">
                You haven't placed any orders yet.
            </div>
        `;

        return;

    }


    let html = "";


    data.forEach(function(order) {

        html += `

            <div class="order-card">

                <p>
                    <strong>Order:</strong>
                    ${order.product}
                </p>

                <p>
                    <strong>Quantity:</strong>
                    ${order.quantity}
                </p>

                <p>
                    <strong>Total:</strong>
                    ₹${order.total}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status">
                        ${order.status}
                    </span>
                </p>

            </div>

        `;

    });


    ordersBox.innerHTML = html;

}


async function logoutUser() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}


loadAccount();

</script>

</body>

</html>
