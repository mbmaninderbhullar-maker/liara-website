<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Liara Professional™ | My Account</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .account-section {
            min-height: 75vh;
            padding: 80px 8%;
            background: #f7f1e7;
        }

        .account-box {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .account-header h2 {
            margin: 0 0 6px;
        }

        .account-email {
            color: #777;
            font-size: 14px;
        }

        .logout-btn {
            padding: 12px 22px;
            background: #ad8232;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #866326;
        }

        .orders-title {
            border-top: 1px solid #eee;
            padding-top: 25px;
            margin-top: 20px;
        }

        .order-card {
            border: 1px solid #eee;
            padding: 22px;
            margin-top: 18px;
            border-radius: 12px;
            background: #fff;
        }

        .order-card p {
            margin: 8px 0;
            color: #555;
            line-height: 1.5;
        }

        .order-id {
            font-weight: bold;
            color: #ad8232;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .status {
            color: #ad8232;
            font-weight: bold;
        }

        .no-orders {
            color: #777;
            padding: 20px 0;
        }

        .error-message {
            color: #b33;
            padding: 20px 0;
        }

        @media (max-width: 600px) {

            .account-section {
                padding: 50px 5%;
            }

            .account-box {
                padding: 25px 18px;
            }

            .account-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a href="index.html"
       class="logo">

        <span>
            LIARA
        </span>

        <small>
            PROFESSIONAL™
        </small>

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="account.html">
            My Account
        </a>

        <a href="index.html#contact">
            Contact
        </a>

    </nav>

</header>



<!-- =====================================================
     ACCOUNT
===================================================== -->

<section class="account-section">

    <div class="account-box">


        <!-- ACCOUNT HEADER -->

        <div class="account-header">

            <div>

                <h2>
                    My Account
                </h2>

                <div
                    class="account-email"
                    id="userEmail">

                    Loading...

                </div>

            </div>


            <button
                class="logout-btn"
                onclick="logoutUser()">

                Logout

            </button>

        </div>



        <!-- ORDERS -->

        <h3 class="orders-title">

            My Orders

        </h3>


        <div id="orders">

            Loading orders...

        </div>


    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-brand">

        LIARA

        <small>
            PROFESSIONAL™
        </small>

    </div>


    <p>

        © 2026 Liara Group Private Limited.
        All Rights Reserved.

    </p>

</footer>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_EDcfAx97hUu3VUgS1K1XXA_yK_Jn5Gu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   SHORT ORDER ID
===================================================== */

/*
   Database di original UUID nu change nahi karde.

   Example:

   2305ada4-fad5-4df6-9acd-30f8601...

   Website te:

   LIARA-2305AD
*/

function getShortOrderId(id) {

    if (!id) {

        return "N/A";

    }


    const cleanId =
        String(id)
            .replace(/-/g, "")
            .toUpperCase();


    return "LIARA-" +
        cleanId.substring(0, 6);

}



/* =====================================================
   BUILD ADDRESS
===================================================== */

function buildAddress(order) {

    const parts = [

        order.house_no,

        order.street,

        order.city,

        order.state,

        order.pincode

    ];


    return parts
        .filter(function(value) {

            return value &&
                   String(value).trim() !== "";

        })
        .join(", ") || "-";

}



/* =====================================================
   LOAD ACCOUNT
===================================================== */

async function loadAccount() {


    const {
        data: {
            user
        },
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if (error || !user) {

        window.location.href =
            "login.html";

        return;

    }


    document.getElementById(
        "userEmail"
    ).innerText =
        user.email || "";


    await loadOrders(
        user.id
    );

}



/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(userId) {


    const ordersBox =
        document.getElementById(
            "orders"
        );


    ordersBox.innerHTML = `

        <div class="no-orders">

            Loading orders...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("orders")
        .select("*")
        .eq(
            "user_id",
            userId
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );



    /* =================================================
       ERROR
    ================================================== */

    if (error) {

        console.error(
            "ORDER LOAD ERROR:",
            error
        );


        ordersBox.innerHTML = `

            <div class="error-message">

                Unable to load orders.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }



    /* =================================================
       NO ORDERS
    ================================================== */

    if (
        !data ||
        data.length === 0
    ) {

        ordersBox.innerHTML = `

            <div class="no-orders">

                You haven't placed
                any orders yet.

            </div>

        `;

        return;

    }



    /* =================================================
       CREATE ORDER CARDS
    ================================================== */

    let html = "";


    data.forEach(
        function(order) {


            /* =========================
               DATE
            ========================== */

            let orderDate = "-";


            if (order.created_at) {

                orderDate =
                    new Date(
                        order.created_at
                    ).toLocaleString(
                        "en-IN"
                    );

            }



            /* =========================
               SHORT ORDER ID
            ========================== */

            const shortOrderId =
                getShortOrderId(
                    order.id
                );



            /* =========================
               STATUS
            ========================== */

            const orderStatus =
                order.status ||
                "Order Received";



            /* =========================
               HTML
            ========================== */

            html += `

                <div class="order-card">


                    <!-- ORDER ID -->

                    <div class="order-id">

                        Order ID:
                        ${escapeHtml(
                            shortOrderId
                        )}

                    </div>



                    <!-- PRODUCT -->

                    <p>

                        <strong>
                            Product:
                        </strong>

                        ${escapeHtml(
                            order.product ||
                            "Order"
                        )}

                    </p>



                    <!-- CUSTOMER -->

                    <p>

                        <strong>
                            Customer Name:
                        </strong>

                        ${escapeHtml(
                            order.customer_name ||
                            "-"
                        )}

                    </p>



                    <!-- PHONE -->

                    <p>

                        <strong>
                            Phone:
                        </strong>

                        ${escapeHtml(
                            order.phone ||
                            "-"
                        )}

                    </p>



                    <!-- ADDRESS -->

                    <p>

                        <strong>
                            Address:
                        </strong>

                        ${escapeHtml(
                            buildAddress(order)
                        )}

                    </p>



                    <!-- QUANTITY -->

                    <p>

                        <strong>
                            Quantity:
                        </strong>

                        ${escapeHtml(
                            order.quantity ||
                            0
                        )}

                    </p>



                    <!-- TOTAL -->

                    <p>

                        <strong>
                            Total:
                        </strong>

                        ₹${Number(
                            order.total || 0
                        ).toLocaleString(
                            "en-IN"
                        )}

                    </p>



                    <!-- PAYMENT -->

                    <p>

                        <strong>
                            Payment:
                        </strong>

                        ${escapeHtml(
                            order.payment_method ||
                            "-"
                        )}

                    </p>



                    <!-- STATUS -->

                    <p>

                        <strong>
                            Status:
                        </strong>

                        <span class="status">

                            ${escapeHtml(
                                orderStatus
                            )}

                        </span>

                    </p>



                    <!-- DATE -->

                    <p>

                        <strong>
                            Order Date:
                        </strong>

                        ${escapeHtml(
                            orderDate
                        )}

                    </p>


                </div>

            `;

        }
    );


    ordersBox.innerHTML =
        html;

}



/* =====================================================
   LOGOUT
===================================================== */

async function logoutUser() {


    const {
        error
    } =
    await supabaseClient
        .auth
        .signOut();


    if (error) {

        console.error(
            "LOGOUT ERROR:",
            error
        );

    }


    window.location.href =
        "login.html";

}



/* =====================================================
   START
===================================================== */

loadAccount();

</script>


</body>

</html>
