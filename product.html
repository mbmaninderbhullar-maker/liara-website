<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Product</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   PRODUCT PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #222;
}


/* =====================================================
   MAIN
===================================================== */

.product-page {
    width: 92%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 45px 0 70px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-link {
    display: inline-block;
    margin-bottom: 30px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
}

.back-link:hover {
    text-decoration: underline;
}


/* =====================================================
   PRODUCT DETAIL
===================================================== */

.product-detail {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-photo {
    width: 100%;
    height: 450px;
    background: #f5f1eb;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.product-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 10px;
}

.product-label {
    color: #ad8232;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2.5px;
    margin-bottom: 12px;
}

.product-info h1 {
    font-size: 36px;
    line-height: 1.2;
    margin: 0 0 15px;
    color: #222;
}

.product-price {
    font-size: 30px;
    font-weight: bold;
    color: #ad8232;
    margin: 5px 0 22px;
}

.product-description {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}


/* =====================================================
   KEY INGREDIENTS
===================================================== */

.ingredients-section {
    margin: 5px 0 28px;
    padding: 25px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.ingredients-title {
    margin: 0 0 18px;
    font-size: 22px;
    color: #222;
    font-weight: 700;
}

.ingredients-title span {
    color: #ad8232;
}

.ingredients-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.ingredient-item {
    background: #fff;
    border-radius: 12px;
    padding: 15px 16px;
    border: 1px solid #eee;
}

.ingredient-name {
    font-size: 16px;
    font-weight: 700;
    color: #ad8232;
    margin-bottom: 5px;
}

.ingredient-benefit {
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.no-ingredients {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}


/* =====================================================
   STOCK
===================================================== */

.stock-text {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 15px;
}

.in-stock {
    color: #287a3e;
}

.out-stock {
    color: #b22;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.quantity-box button {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    font-size: 21px;
    cursor: pointer;
    transition: .2s;
}

.quantity-box button:hover {
    background: #f5f1eb;
    border-color: #ad8232;
}

.quantity-box input {
    width: 65px;
    height: 42px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-buttons button {
    border: none;
    cursor: pointer;
    padding: 15px 27px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.action-buttons button:hover {
    transform: translateY(-2px);
    opacity: .93;
}

.add-cart {
    background: #ad8232;
    color: white;
}

.buy-now {
    background: #287a3e;
    color: white;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.message {
    text-align: center;
    padding: 100px 20px;
    color: #777;
}

.error {
    color: #a33;
}

.message a {
    color: #ad8232;
    font-weight: bold;
    text-decoration: none;
}



/* =====================================================
   PURCHASE / DETAILS LAYOUT
===================================================== */

.purchase-area {
    grid-column: 1;
    grid-row: 2;
    align-self: start;
}

.product-info {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
}

.product-detail .ingredients-section,
.product-detail .product-detail-section {
    grid-column: 1 / -1;
}

.purchase-area .stock-text {
    margin: 0 0 14px;
}

.purchase-area .quantity-box {
    margin: 0 0 14px;
}

.purchase-area .action-buttons {
    width: 100%;
}

.purchase-area .action-buttons button {
    flex: 1;
}


/* =====================================================
   MOBILE PURCHASE ORDER
===================================================== */

@media(max-width: 900px) {

    .product-info {
        grid-column: auto;
        grid-row: auto;
    }

    .purchase-area {
        grid-column: auto;
        grid-row: auto;
        order: 3;
    }

    .product-detail .ingredients-section,
    .product-detail .product-detail-section {
        grid-column: auto;
    }

    .purchase-area .buy-now {
        order: 1;
    }

    .purchase-area .add-cart {
        order: 2;
    }

    .purchase-area .action-buttons {
        flex-direction: column;
    }

    .purchase-area .action-buttons button {
        width: 100%;
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

    .product-detail {
        grid-template-columns: 1fr;
        padding: 25px;
        gap: 35px;
    }

    .product-photo {
        height: 450px;
    }

    .product-info h1 {
        font-size: 34px;
    }

}


@media(max-width: 600px) {

    .product-page {
        padding: 35px 15px 60px;
    }

    .product-detail {
        padding: 18px;
        border-radius: 18px;
    }

    .product-photo {
        height: 360px;
        border-radius: 15px;
    }

    .product-info h1 {
        font-size: 29px;
    }

    .product-price {
        font-size: 26px;
    }

    .ingredients-section {
        padding: 18px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }

}


/* =====================================================
   PRODUCT PAGE - LAPTOP SIZE FIX
   Only affects product.html
===================================================== */

@media (min-width: 901px) {

    .product-page {
        width: min(88vw, 810px) !important;
        max-width: 810px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding: 35px 0 60px !important;
    }

    .product-detail {
        width: 100% !important;
        max-width: 810px !important;
        padding: 22px !important;
        gap: 22px !important;
        border-radius: 18px !important;
    }

    .product-photo {
        height: 325px !important;
        max-height: 325px !important;
    }

    .product-info h1 {
        font-size: 29px !important;
        line-height: 1.18 !important;
    }

    .product-price {
        font-size: 23px !important;
    }
}

@media (min-width: 1400px) {

    .product-page {
        width: min(86vw, 840px) !important;
        max-width: 840px !important;
    }

    .product-detail {
        max-width: 840px !important;
    }

    .product-photo {
        height: 340px !important;
        max-height: 340px !important;
    }
}

@media (max-width: 900px) {

    .product-page {
        width: 92% !important;
        max-width: none !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .product-detail {
        width: 100% !important;
    }
}


/* =====================================================
   PRODUCT DETAIL SECTIONS
===================================================== */

.product-detail-section {
    margin: 5px 0 24px;
    padding: 22px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.product-detail-title {
    margin: 0 0 14px;
    font-size: 21px;
    color: #222;
    font-weight: 700;
}

.product-detail-title span {
    margin-right: 6px;
}

.product-detail-content {
    color: #666;
    font-size: 14px;
    line-height: 1.75;
}

.detail-line {
    margin-bottom: 7px;
}

.detail-line:last-child {
    margin-bottom: 0;
}

@media(max-width:600px) {
    .product-detail-section {
        padding: 18px;
    }

    .product-detail-title {
        font-size: 19px;
    }
}

/* =====================================================
   PRODUCT SIZE / UNIT OPTIONS
===================================================== */
.size-selection {
    margin: 0 0 14px;
}
.size-selection-label {
    display:block;
    margin:0 0 8px;
    font-size:14px;
    font-weight:700;

}
.size-options {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.size-option {
    min-width:72px;
    padding:10px 13px;
    border:1px solid #ddd5c9;
    border-radius:10px;
    background:#fff;
    color:#555;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}
.size-option:hover,
.size-option.active {
    border-color:#b88427;
    background:#b88427;
    color:#fff;
}
.size-option:disabled {
    opacity:.45;
    cursor:not-allowed;
    background:#f5f3ef;
}
.selected-size-text {
    margin:8px 0 0;
    font-size:13px;
    color:#777;
}
@media(max-width:600px){
    .size-options{gap:7px;}
    .size-option{flex:1 1 70px;}
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PRODUCT ID
===================================================== */

const productId =
localStorage.getItem(
    "selectedProductId"
);


/* =====================================================
   INGREDIENT PARSER
===================================================== */

function parseIngredients(value) {

    if(!value) {

        return [];

    }


    /*
       Try JSON first.
    */

    try {

        const parsed =
            JSON.parse(value);

        if(Array.isArray(parsed)) {

            return parsed;

        }

    }

    catch(error) {

        /*
           Normal text format will
           continue below.
        */

    }


    /*
       Normal text format:

       Niacinamide — Brightening
       Aloe Vera — Hydration
       Vitamin E — Moisturising
    */

    const lines =
        String(value)
        .split(/\r?\n/)
        .map(function(line) {

            return line.trim();

        })
        .filter(Boolean);


    return lines.map(function(line) {

        let parts;


        if(line.includes("—")) {

            parts =
                line.split("—");

        }

        else if(line.includes("|")) {

            parts =
                line.split("|");

        }

        else if(line.includes(":")) {

            parts =
                line.split(":");

        }

        else {

            return {

                name: line,
                benefit: ""

            };

        }


        return {

            name:
                parts.shift().trim(),

            benefit:
                parts.join("—").trim()

        };

    });

}


/* =====================================================
   RENDER INGREDIENTS
===================================================== */

function renderIngredients(value) {

    const ingredients =
        parseIngredients(value);


    if(!ingredients.length) {

        return `

            <div class="ingredients-section">

                <h2 class="ingredients-title">

                </h2>

                </div>

        `;

    }


    let html = "";


    ingredients.forEach(function(item) {

        const benefit =

            </div>

        </div>

    `;

}



/* =====================================================
   RENDER PRODUCT DETAILS
===================================================== */

function renderTextSection(title, icon, value) {
    const text = String(value || "").trim();
    if (!text) return "";

    `;
}

/* =====================================================
   PRODUCT SIZE / UNIT HELPERS
===================================================== */
function parseSizeOptions(product) {
    const candidates = [
        product.size_options,
        product.sizes,
        product.product_sizes,
        product.variants
    ];

    for (const value of candidates) {
        if (Array.isArray(value) && value.length) return normalizeSizeOptions(value);
        if (typeof value === "string" && value.trim()) {
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed) && parsed.length) return normalizeSizeOptions(parsed);
            } catch(e) {}
            const parts = value.split(/[,\n|]+/).map(v => v.trim()).filter(Boolean);
            if (parts.length) return normalizeSizeOptions(parts);
        }
    }

    const singleSize = product.size || product.volume || product.weight || product.quantity_size || "";
    const singleUnit = product.unit || product.size_unit || product.volume_unit || product.weight_unit || "";
    if (singleSize) return normalizeSizeOptions([{ size: singleSize, unit: singleUnit }]);

    return [];
}

function normalizeSizeOptions(list) {
    return list.map((item, index) => {
        if (typeof item === "number") return { value: String(item), label: String(item) };
        if (typeof item === "string") {
            const raw = item.trim();
            const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)\s*(g|gram|grams|kg|ml|millilitre|milliliter|l|ltr|litre|liter|litres|liters)$/i);
            if (match) {
                const n = match[1];
                const u = normalizeUnit(match[2]);
                return { value: n + u, label: n + " " + u };
            }
            return { value: raw, label: raw };
        }
        const size = item?.size ?? item?.value ?? item?.quantity ?? item?.weight ?? item?.volume ?? "";
        const unit = normalizeUnit(item?.unit ?? item?.size_unit ?? item?.volume_unit ?? item?.weight_unit ?? "");
        const label = String(size).trim() + (unit ? " " + unit : "");
        return { value: label || ("Option " + (index + 1)), label: label || ("Option " + (index + 1)) };
    }).filter(x => x.label);
}

function normalizeUnit(unit) {
    const u = String(unit || "").trim().toLowerCase();
    if (["g","gram","grams"].includes(u)) return "g";
    if (["kg","kilogram","kilograms"].includes(u)) return "kg";
    if (["ml","millilitre","milliliter","millilitres","milliliters"].includes(u)) return "ml";
    if (["l","ltr","litre","liter","litres","liters"].includes(u)) return "L";
    return String(unit || "").trim();
}

function parsePriceNumber(value) {
    const n = Number(String(value ?? "").replace(/[₹,\s]/g, ""));
    return Number.isFinite(n) ? n : 0;
}

function parseUnitPriceOptions(product) {
    const candidates = [
        product.unit_prices,
        product.size_prices,
        product.price_options,
        product.size_options,
        product.sizes,
        product.product_sizes,
        product.variants
    ];

    for (const value of candidates) {
        if (Array.isArray(value) && value.length) {
            const result = normalizeUnitPriceOptions(value);
            if (result.length) return result;
        }

        if (typeof value === "string" && value.trim()) {
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed) && parsed.length) {
                    const result = normalizeUnitPriceOptions(parsed);
                    if (result.length) return result;
                }
            } catch(e) {}

            const parts = value.split(/\r?\n|[|]+/).map(v => v.trim()).filter(Boolean);
            const result = normalizeUnitPriceOptions(parts);
            if (result.length) return result;
        }
    }
    return [];
}

function normalizeUnitPriceOptions(list) {
    return list.map(item => {
        if (typeof item === "string") {
            const raw = item.trim();
            const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)\s*(g|gram|grams|kg|ml|millilitre|milliliter|l|ltr|litre|liter|litres|liters)\s*(?:[:=\-–—]\s*)₹?\s*([0-9]+(?:\.[0-9]+)?)$/i);
            if (!match) return null;
            const size = match[1];
            const unit = normalizeUnit(match[2]);
            const price = parsePriceNumber(match[3]);
            return { value: size + " " + unit, label: size + " " + unit, price };
        }

        if (!item || typeof item !== "object") return null;
        const size = item.size ?? item.value ?? item.quantity ?? item.weight ?? item.volume ?? "";
        const unit = normalizeUnit(item.unit ?? item.size_unit ?? item.volume_unit ?? item.weight_unit ?? "");
        const price = parsePriceNumber(item.price ?? item.rate ?? item.amount ?? item.sale_price);
        if (size === "" || price <= 0) return null;
        const label = String(size).trim() + (unit ? " " + unit : "");
        return { value: label, label, price };
    }).filter(Boolean);
}

function getSelectedVariant() {
    const value = document.getElementById("productSize")?.value || "";
    const options = window.liaraUnitPriceOptions || [];
    return options.find(o => String(o.value) === String(value)) || null;
}

function updateDisplayedPrice() {

}

function getSelectedSize() {

    return el ? el.value : "";
}

function selectProductSize(value, button) {
    document.querySelectorAll(".size-option").forEach(btn => btn.classList.remove("active"));
    if (button) button.classList.add("active");
    const input = document.getElementById("productSize");
    if (input) input.value = value;
    const text = document.getElementById("selectedSizeText");
    if (text) text.textContent = value ? "Selected size: " + value : "";
    updateDisplayedPrice();
}

function renderSizeOptions(product) {
    let options = parseUnitPriceOptions(product);

    /*
      Supported database formats:
      unit_prices / size_prices / price_options:
      [
        {"size":"50","unit":"ml","price":99},
        {"size":"100","unit":"ml","price":149},
        {"size":"250","unit":"ml","price":199},
        {"size":"500","unit":"ml","price":349},
        {"size":"1","unit":"L","price":599}
      ]
    */

    // Backward compatibility: if only size options exist, show them.
    if (!options.length) {
        const oldOptions = parseSizeOptions(product);
        if (oldOptions.length) {
            options = oldOptions.map((o, i) => ({
                value: o.value,
                label: o.label,
                price: i === 0 ? parsePriceNumber(product.price) : 0
            }));
        }
    }

    /*
      Final fallback keeps the section visible even when no size data
      has been entered yet. The base product price is attached to the
      existing product size when available; other prices are marked
      "Set price" so customers cannot accidentally purchase them.
    */
    if (!options.length) {
        const basePrice = parsePriceNumber(product.price);
        const baseSize = product.size || product.volume || product.weight || "";
        const baseUnit = normalizeUnit(
            product.unit || product.size_unit || product.volume_unit || product.weight_unit || ""
        );

        if (baseSize) {
            options = [{
                value: String(baseSize).trim() + (baseUnit ? " " + baseUnit : ""),
                label: String(baseSize).trim() + (baseUnit ? " " + baseUnit : ""),
                price: basePrice
            }];
        } else {
            options = [
                {value:"50 ml",  label:"50 ml",  price:0},
                {value:"100 ml", label:"100 ml", price:0},
                {value:"250 ml", label:"250 ml", price:basePrice},
                {value:"500 ml", label:"500 ml", price:0},
                {value:"1 L",    label:"1 L",    price:0}
            ];
        }
    }

    window.liaraUnitPriceOptions = options;

    const firstPriced = options.find(o => Number(o.price) > 0) || options[0];
    const buttons = options.map((option, index) => {
        const hasPrice = Number(option.price) > 0;
        return `
            <button type="button"
                    class="size-option ${option.value === firstPriced.value ? "active" : ""} ${hasPrice ? "" : "price-not-set"}"
                    ${hasPrice ? `onclick="selectProductSize(${JSON.stringify(option.value)}, this)"` : "disabled"}
                    title="${hasPrice ? "Select " + escapeHtml(option.label) : "Price not configured for this size"}">
                <span>${escapeHtml(option.label)}</span>
                <small>${hasPrice ? "₹" + Number(option.price).toLocaleString("en-IN") : "Set price"}</small>
            </button>
        `;
    }).join("");

    return `
        <div class="liara-size-price-box">
            <label class="size-selection-label">CHOOSE SIZE</label>
            <div class="size-options">${buttons}</div>
            <input type="hidden" id="productSize" value="${escapeHtml(firstPriced.value)}">
            <div class="selected-size-text" id="selectedSizeText">
                Selected size: ${escapeHtml(firstPriced.label)}
            </div>
            <div class="liara-size-price-note">ⓘ Price changes with selected size</div>
        </div>
    `;
}

/* =====================================================
   LOAD PRODUCT
===================================================== */

function getProductRating(product) {
    const rating = Number(
        product.rating ??
        product.average_rating ??
        product.review_rating ??
        0
    );
    return Number.isFinite(rating) && rating > 0 ? Math.min(5, rating) : 0;
}

function getProductReviewCount(product) {
    const count = Number(
        product.review_count ??
        product.reviews_count ??
        product.total_reviews ??
        0
    );
    return Number.isFinite(count) && count >= 0 ? count : 0;
}

function renderReviewSummary(product) {
    const rating = getProductRating(product);
    const count = getProductReviewCount(product);

    const stars = document.getElementById("liaraStars");
    const countEl = document.getElementById("liaraReviewCount");

    if (!stars || !countEl) return;

    if (rating > 0) {
        const full = Math.floor(rating);
        const half = rating - full >= 0.5;
        let starText = "★".repeat(full);
        if (half && full < 5) starText += "★";
        starText += "☆".repeat(Math.max(0, 5 - starText.length));
        stars.textContent = starText;
        countEl.textContent = count
            ? `${rating.toFixed(1)} (${count.toLocaleString("en-IN")} ${count === 1 ? "review" : "reviews"})`
            : `${rating.toFixed(1)}`;
    } else {
        stars.textContent = "☆☆☆☆☆";
        countEl.textContent = "No reviews yet";
    }
}

function renderSideSizePriceOptions(product) {
    const target = document.getElementById("liaraSizeButtons");
    const options = window.liaraUnitPriceOptions || [];
    if (!target || !options.length) return;

    target.innerHTML = options.map((option, index) => `

            ${escapeHtml(option.label)}
            <small>₹${option.price.toLocaleString("en-IN")}</small>
        </button>
    `).join("");
}

<!-- PURCHASE AREA

/* =====================================================
   QUANTITY +
===================================================== */

function increaseQuantity(maxStock) {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity < maxStock) {

        quantity++;

        input.value =
            quantity;

    }

}


/* =====================================================
   QUANTITY -
===================================================== */

function decreaseQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity > 1) {

        quantity--;

        input.value =
            quantity;

    }

}

        .eq("id", productId)
        .single();


    if(error) {

        console.error(
            "Product error:",
            error
        );

}

        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "liaraCart"
                ) || "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    const selectedSize = getSelectedSize();

    const existing =
        cart.find(function(item) {

            return String(item.id) === String(product.id) &&
                   String(item.size || "") === String(selectedSize || "");

        });


    if(existing) {

        const newQuantity =
            Number(
                existing.quantity || 0
            ) +
            quantity;


        if(newQuantity > stock) {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }


        existing.quantity =
            newQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                product.product_name ||
                "Liara Product",

            price:
                Number(
                    getSelectedVariant()?.price ?? product.price ?? 0
                ),

            image:
                product.image_url ||
                product.photo_url ||
                product.image ||
                product.photo ||
                "facewash.jpg",

            quantity:
                quantity,

            size:
                getSelectedSize()

        });

    }


    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    alert(
        "Product added to cart successfully."
    );


    window.location.href =
        "cart.html";

}
