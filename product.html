<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Product</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   PRODUCT PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #222;
}


/* =====================================================
   MAIN
===================================================== */

.product-page {
    width: 92%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 45px 0 70px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-link {
    display: inline-block;
    margin-bottom: 30px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
}

.back-link:hover {
    text-decoration: underline;
}


/* =====================================================
   PRODUCT DETAIL
===================================================== */

.product-detail {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-photo {
    width: 100%;
    height: 450px;
    background: #f5f1eb;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.product-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 10px;
}

.product-label {
    color: #ad8232;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2.5px;
    margin-bottom: 12px;
}

.product-info h1 {
    font-size: 36px;
    line-height: 1.2;
    margin: 0 0 15px;
    color: #222;
}

.product-price {
    font-size: 30px;
    font-weight: bold;
    color: #ad8232;
    margin: 5px 0 22px;
}

.product-description {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}


/* =====================================================
   KEY INGREDIENTS
===================================================== */

.ingredients-section {
    margin: 5px 0 28px;
    padding: 25px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.ingredients-title {
    margin: 0 0 18px;
    font-size: 22px;
    color: #222;
    font-weight: 700;
}

.ingredients-title span {
    color: #ad8232;
}

.ingredients-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.ingredient-item {
    background: #fff;
    border-radius: 12px;
    padding: 15px 16px;
    border: 1px solid #eee;
}

.ingredient-name {
    font-size: 16px;
    font-weight: 700;
    color: #ad8232;
    margin-bottom: 5px;
}

.ingredient-benefit {
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.no-ingredients {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}


/* =====================================================
   STOCK
===================================================== */

.stock-text {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 15px;
}

.in-stock {
    color: #287a3e;
}

.out-stock {
    color: #b22;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.quantity-box button {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    font-size: 21px;
    cursor: pointer;
    transition: .2s;
}

.quantity-box button:hover {
    background: #f5f1eb;
    border-color: #ad8232;
}

.quantity-box input {
    width: 65px;
    height: 42px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-buttons button {
    border: none;
    cursor: pointer;
    padding: 15px 27px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.action-buttons button:hover {
    transform: translateY(-2px);
    opacity: .93;
}

.add-cart {
    background: #ad8232;
    color: white;
}

.buy-now {
    background: #287a3e;
    color: white;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.message {
    text-align: center;
    padding: 100px 20px;
    color: #777;
}

.error {
    color: #a33;
}

.message a {
    color: #ad8232;
    font-weight: bold;
    text-decoration: none;
}



/* =====================================================
   PURCHASE / DETAILS LAYOUT
===================================================== */

.purchase-area {
    grid-column: 1;
    grid-row: 2;
    align-self: start;
}

.product-info {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
}

.product-detail .ingredients-section,
.product-detail .product-detail-section {
    grid-column: 1 / -1;
}

.purchase-area .stock-text {
    margin: 0 0 14px;
}

.purchase-area .quantity-box {
    margin: 0 0 14px;
}

.purchase-area .action-buttons {
    width: 100%;
}

.purchase-area .action-buttons button {
    flex: 1;
}


/* =====================================================
   MOBILE PURCHASE ORDER
===================================================== */

@media(max-width: 900px) {

    .product-info {
        grid-column: auto;
        grid-row: auto;
    }

    .purchase-area {
        grid-column: auto;
        grid-row: auto;
        order: 3;
    }

    .product-detail .ingredients-section,
    .product-detail .product-detail-section {
        grid-column: auto;
    }

    .purchase-area .buy-now {
        order: 1;
    }

    .purchase-area .add-cart {
        order: 2;
    }

    .purchase-area .action-buttons {
        flex-direction: column;
    }

    .purchase-area .action-buttons button {
        width: 100%;
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

    .product-detail {
        grid-template-columns: 1fr;
        padding: 25px;
        gap: 35px;
    }

    .product-photo {
        height: 450px;
    }

    .product-info h1 {
        font-size: 34px;
    }

}


@media(max-width: 600px) {

    .product-page {
        padding: 35px 15px 60px;
    }

    .product-detail {
        padding: 18px;
        border-radius: 18px;
    }

    .product-photo {
        height: 360px;
        border-radius: 15px;
    }

    .product-info h1 {
        font-size: 29px;
    }

    .product-price {
        font-size: 26px;
    }

    .ingredients-section {
        padding: 18px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }

}


/* =====================================================
   PRODUCT PAGE - LAPTOP SIZE FIX
   Only affects product.html
===================================================== */

@media (min-width: 901px) {

    .product-page {
        width: min(88vw, 810px) !important;
        max-width: 810px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding: 35px 0 60px !important;
    }

    .product-detail {
        width: 100% !important;
        max-width: 810px !important;

    }

    .product-photo {

    }

    }

    }
}

@media (min-width: 1400px) {

    .product-page {

    }

    .product-detail {

    }

    .product-photo {
        height: 340px !important;

    }
}

@media (max-width: 900px) {

    .product-page {
        width: 92% !important;
        max-width: none !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .product-detail {
        width: 100% !important;
    }
}


/* =====================================================
   PRODUCT DETAIL SECTIONS
===================================================== */

.product-detail-section {
    margin: 5px 0 24px;
    padding: 22px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.product-detail-title {
    margin: 0 0 14px;
    font-size: 21px;
    color: #222;
    font-weight: 700;
}

.product-detail-title span {
    margin-right: 6px;
}

.product-detail-content {
    color: #666;
    font-size: 14px;
    line-height: 1.75;
}

.detail-line {
    margin-bottom: 7px;
}

.detail-line:last-child {
    margin-bottom: 0;
}

@media(max-width:600px) {
    .product-detail-section {
        padding: 18px;
    }

    .product-detail-title {
        font-size: 19px;
    }
}

===================================================== */

/* =====================================================
   PRODUCT SIZE / UNIT OPTIONS
===================================================== */
.size-selection {
    margin: 0 0 14px;
}
.size-selection-label {
    display:block;
    margin:0 0 8px;
    font-size:14px;

}
.size-options {

    flex-wrap:wrap;
    gap:8px;
}
.size-option {
    min-width:72px;
    padding:10px 13px;
    border:1px solid #ddd5c9;
    border-radius:10px;
    background:#fff;
    color:#555;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}
.size-option:hover,
.size-option.active {
    border-color:#b88427;
    background:#b88427;
    color:#fff;
}
.size-option:disabled {
    opacity:.45;
    cursor:not-allowed;
    background:#f5f3ef;
}
.selected-size-text {
    margin:8px 0 0;
    font-size:13px;
    color:#777;
}
@media(max-width:600px){
    .size-options{gap:7px;}
    .size-option{flex:1 1 70px;}
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PRODUCT ID
===================================================== */

const productId =
localStorage.getItem(
    "selectedProductId"
);


/* =====================================================
   INGREDIENT PARSER
===================================================== */

function parseIngredients(value) {

    if(!value) {

        return [];

    }


    /*
       Try JSON first.
    */

    try {

        const parsed =
            JSON.parse(value);

        if(Array.isArray(parsed)) {

            return parsed;

        }

    }

    catch(error) {

        /*
           Normal text format will
           continue below.
        */

    }


    /*
       Normal text format:

       Niacinamide — Brightening
       Aloe Vera — Hydration
       Vitamin E — Moisturising
    */

    const lines =
        String(value)
        .split(/\r?\n/)
        .map(function(line) {

            return line.trim();

        })
        .filter(Boolean);


    return lines.map(function(line) {

        let parts;


        if(line.includes("—")) {

            parts =
                line.split("—");

        }

        else if(line.includes("|")) {

            parts =
                line.split("|");

        }

        else if(line.includes(":")) {

            parts =
                line.split(":");

        }

        else {

            return {

                name: line,
                benefit: ""

            };

        }


        return {

            name:
                parts.shift().trim(),

            benefit:
                parts.join("—").trim()

        };

    });

}


/* =====================================================
   RENDER INGREDIENTS
===================================================== */

function renderIngredients(value) {

    const ingredients =
        parseIngredients(value);


    if(!ingredients.length) {

        return `

            <div class="ingredients-section">

                <h2 class="ingredients-title">

                    <span>🌿</span>
                    Key Ingredients

                </h2>

                <div class="no-ingredients">

                    Key ingredients information
                    will be updated soon.

                </div>

        `;

    }


    let html = "";


    ingredients.forEach(function(item) {

        const name =
            item.name ||
            item.ingredient ||

        const benefit =
            item.benefit ||
            item.description ||
            item.benefits ||

                    `

                    :

                <span>🌿</span>
                Key Ingredients

            </h2>


            <div class="ingredients-list">

                ${html}

            </div>

        </div>

    `;

}



/* =====================================================
   RENDER PRODUCT DETAILS
===================================================== */

function renderTextSection(title, icon, value) {

/* =====================================================
   PRODUCT SIZE / UNIT HELPERS
===================================================== */
function parseSizeOptions(product) {
    const candidates = [
        product.size_options,
        product.sizes,
        product.product_sizes,
        product.variants
    ];

    for (const value of candidates) {
        if (Array.isArray(value) && value.length) return normalizeSizeOptions(value);
        if (typeof value === "string" && value.trim()) {
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed) && parsed.length) return normalizeSizeOptions(parsed);
            } catch(e) {}
            const parts = value.split(/[,\n|]+/).map(v => v.trim()).filter(Boolean);
            if (parts.length) return normalizeSizeOptions(parts);
        }
    }

    const singleSize = product.size || product.volume || product.weight || product.quantity_size || "";
    const singleUnit = product.unit || product.size_unit || product.volume_unit || product.weight_unit || "";
    if (singleSize) return normalizeSizeOptions([{ size: singleSize, unit: singleUnit }]);

    return [];
}

function normalizeSizeOptions(list) {
    return list.map((item, index) => {
        if (typeof item === "number") return { value: String(item), label: String(item) };
        if (typeof item === "string") {
            const raw = item.trim();
            const match = raw.match(/^([0-9]+(?:\.[0-9]+)?)\s*(g|gram|grams|kg|ml|millilitre|milliliter|l|ltr|litre|liter|litres|liters)$/i);
            if (match) {
                const n = match[1];
                const u = normalizeUnit(match[2]);
                return { value: n + u, label: n + " " + u };
            }
            return { value: raw, label: raw };
        }
        const size = item?.size ?? item?.value ?? item?.quantity ?? item?.weight ?? item?.volume ?? "";
        const unit = normalizeUnit(item?.unit ?? item?.size_unit ?? item?.volume_unit ?? item?.weight_unit ?? "");
        const label = String(size).trim() + (unit ? " " + unit : "");
        return { value: label || ("Option " + (index + 1)), label: label || ("Option " + (index + 1)) };
    }).filter(x => x.label);
}

function normalizeUnit(unit) {
    const u = String(unit || "").trim().toLowerCase();
    if (["g","gram","grams"].includes(u)) return "g";
    if (["kg","kilogram","kilograms"].includes(u)) return "kg";
    if (["ml","millilitre","milliliter","millilitres","milliliters"].includes(u)) return "ml";
    if (["l","ltr","litre","liter","litres","liters"].includes(u)) return "L";
    return String(unit || "").trim();
}

function getSelectedSize() {
    const el = document.getElementById("productSize");
    return el ? el.value : "";
}

function selectProductSize(value, button) {
    document.querySelectorAll(".size-option").forEach(btn => btn.classList.remove("active"));
    if (button) button.classList.add("active");
    const input = document.getElementById("productSize");
    if (input) input.value = value;
    const text = document.getElementById("selectedSizeText");
    if (text) text.textContent = value ? "Selected size: " + value : "";
}

function parseVariantPrices(product) {
    const sources = [product.unit_prices, product.size_prices, product.price_options, product.variants];

    for (const source of sources) {
        let data = source;
        if (typeof data === "string" && data.trim()) {
            try { data = JSON.parse(data); }
            catch(e) { data = data.split(/\r?\n|[|]+/).map(x => x.trim()).filter(Boolean); }
        }
        if (!Array.isArray(data) || !data.length) continue;

        const result = data.map(item => {
            if (typeof item === "string") {
                const m = item.match(/^(.+?)\s*(?:[:=]|-)\s*₹?\s*([0-9]+(?:\.[0-9]+)?)$/);
                return m ? {value:m[1].trim(), label:m[1].trim(), price:Number(m[2])} : null;
            }
            if (!item || typeof item !== "object") return null;
            const size = item.size ?? item.quantity ?? item.weight ?? item.volume ?? item.value ?? "";
            const unit = normalizeUnit(item.unit ?? item.size_unit ?? item.weight_unit ?? item.volume_unit ?? "");
            const rate = Number(String(item.price ?? item.rate ?? item.amount ?? item.sale_price ?? "").replace(/[₹,\s]/g,""));
            if (!size || !Number.isFinite(rate) || rate <= 0) return null;
            const label = `${size}${unit ? " " + unit : ""}`.trim();
            return {value:label, label, price:rate};
        }).filter(Boolean);

        if (result.length) return result;
    }
    return [];
}

function getSelectedVariant() {
    const value = document.getElementById("productSize")?.value || "";
    return (window.liaraVariants || []).find(v => String(v.value) === String(value)) || null;
}

function selectProductSize(value, button) {
    document.querySelectorAll(".size-option").forEach(btn => btn.classList.remove("active"));
    if (button) button.classList.add("active");

    const input = document.getElementById("productSize");
    if (input) input.value = value;

    const variant = getSelectedVariant();
    const priceEl = document.getElementById("productPrice");
    if (variant && priceEl) priceEl.textContent = "₹" + Number(variant.price).toLocaleString("en-IN");

    const text = document.getElementById("selectedSizeText");
    if (text && variant) text.textContent = "Selected size: " + variant.label;
}

function renderSizeOptions(product) {
    let options = parseVariantPrices(product);

    if (!options.length) {
        const old = parseSizeOptions(product);
        if (old.length) {
            options = old.map((o, i) => ({
                value:o.value,
                label:o.label,
                price:i === 0 ? Number(product.price || 0) : 0
            }));
        }
    }

    if (!options.length) return "";
    window.liaraVariants = options;

    const first = options.find(v => v.price > 0) || options[0];

    return `
        <div class="liara-size-price-box">
            <div class="size-selection-label">CHOOSE SIZE</div>
            <div class="size-options">
                ${options.map(v => `
                    <button type="button"
                            class="size-option ${v.value === first.value ? "active" : ""}"
                            ${v.price > 0 ? `onclick="selectProductSize(${JSON.stringify(v.value)}, this)"` : "disabled"}>
                        <span>${escapeHtml(v.label)}</span>
                        <small>${v.price > 0 ? "₹" + Number(v.price).toLocaleString("en-IN") : "Price not set"}</small>
                    </button>
                `).join("")}
            </div>
            <input type="hidden" id="productSize" value="${escapeHtml(first.value)}">
            <div class="selected-size-text" id="selectedSizeText">Selected size: ${escapeHtml(first.label)}</div>
        </div>
    `;
}

/* =====================================================
   LOAD PRODUCT
===================================================== */

function renderProductReviewSummary(product) {
    const rating = Number(product.rating ?? product.average_rating ?? 0);
    const count = Number(product.review_count ?? product.reviews_count ?? 0);

    }

/* =====================================================
   QUANTITY +
===================================================== */

function increaseQuantity(maxStock) {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity < maxStock) {

        quantity++;

        input.value =
            quantity;

    }

}


/* =====================================================
   QUANTITY -
===================================================== */

function decreaseQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity > 1) {

        quantity--;

        input.value =
            quantity;

    }

}


/* =====================================================
   GET CURRENT PRODUCT
===================================================== */

async function getCurrentProduct() {

    if(!productId) {

        return null;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if(error) {

        console.error(
            "Product error:",
            error
        );

        return null;

    }


    return data;

}


/* =====================================================
   ADD TO CART
===================================================== */

async function addToCart() {

    const product =
        await getCurrentProduct();


    if(!product) {

        alert(
            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "liaraCart"
                ) || "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    const selectedSize = getSelectedSize();

    const existing =
        cart.find(function(item) {

            return String(item.id) === String(product.id) &&
                   String(item.size || "") === String(selectedSize || "");

        });


    if(existing) {

        const newQuantity =
            Number(
                existing.quantity || 0
            ) +
            quantity;


        if(newQuantity > stock) {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }


        existing.quantity =
            newQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                product.product_name ||
                "Liara Product",

            price:
                Number(
                    getSelectedVariant()?.price ?? product.price ?? 0
                ),

            image:
                product.image_url ||
                product.photo_url ||
                product.image ||
                product.photo ||
                "facewash.jpg",

            quantity:
                quantity,

            size:
                getSelectedSize()

        });

    }


    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    alert(
        "Product added to cart successfully."
    );


    window.location.href =
        "cart.html";

}

<script id="liara-unit-visible-js">
let liaraSelectedUnit = localStorage.getItem("liaraSelectedUnit") || "g";

function selectLiaraUnit(unit, button){
    liaraSelectedUnit = unit;
    localStorage.setItem("liaraSelectedUnit", unit);

    document.querySelectorAll(".liara-unit-btn").forEach(function(btn){
        btn.classList.toggle("active", btn.dataset.unit === unit);
    });

    const sizeInput = document.getElementById("productSize");
    if(sizeInput){
        const raw = String(sizeInput.value || "").trim();
        const numberOnly = raw.match(/^[0-9]+(?:\.[0-9]+)?/);
        if(numberOnly){
            sizeInput.value = numberOnly[0] + " " + unit;
        }
    }

    const selectedText = document.getElementById("selectedSizeText");
