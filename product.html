<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Product</title>

<link rel="stylesheet" href="style.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #222;
}

.product-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 25px;
}

.back-link {
    display: inline-block;
    margin-bottom: 30px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
}

.product-detail {
    background: white;
    border-radius: 20px;
    padding: 35px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    box-shadow: 0 10px 35px rgba(0,0,0,.07);
}

.product-photo {
    width: 100%;
    height: 520px;
    background: #f5f1eb;
    border-radius: 16px;
    overflow: hidden;
}

.product-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.product-label {
    color: #ad8232;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.product-info h1 {
    font-size: 40px;
    margin: 0 0 15px;
}

.product-price {
    font-size: 28px;
    font-weight: bold;
    color: #ad8232;
    margin: 10px 0 20px;
}

.product-description {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}

.stock-text {
    font-weight: bold;
    margin-bottom: 20px;
}

.in-stock {
    color: #287a3e;
}

.out-stock {
    color: #b22;
}

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.quantity-box button {
    width: 40px;
    height: 40px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 7px;
    font-size: 20px;
    cursor: pointer;
}

.quantity-box button:hover {
    background: #f5f1eb;
}

.quantity-box input {
    width: 60px;
    height: 40px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 16px;
}

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-buttons button {
    border: none;
    cursor: pointer;
    padding: 14px 25px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.action-buttons button:hover {
    transform: translateY(-1px);
    opacity: .92;
}

.add-cart {
    background: #ad8232;
    color: white;
}

.buy-now {
    background: #287a3e;
    color: white;
}

.message {
    text-align: center;
    padding: 80px 20px;
    color: #777;
}

.error {
    color: #a33;
}

@media(max-width:800px) {

    .product-detail {
        grid-template-columns: 1fr;
        padding: 20px;
    }

    .product-photo {
        height: 400px;
    }

    .product-info h1 {
        font-size: 30px;
    }

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">

    <span>
        LIARA
    </span>

    <small>
        PROFESSIONAL™
    </small>

</a>

<nav>

    <a href="index.html">
        Home
    </a>

    <a href="index.html#products">
        Products
    </a>

    <a href="account.html">
        My Account
    </a>

    <a href="cart.html">
        Cart 🛒
    </a>

</nav>

</header>



<main class="product-page">

<a
    href="index.html#products"
    class="back-link">

    ← Back to Products

</a>


<div id="productContainer">

    <div class="message">

        Loading product...

    </div>

</div>

</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PRODUCT ID
===================================================== */

const productId =
localStorage.getItem(
    "selectedProductId"
);


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct() {

    const container =
        document.getElementById(
            "productContainer"
        );


    if(!productId) {

        container.innerHTML = `

            <div class="message error">

                Product not selected.

                <br><br>

                <a href="index.html#products">
                    Go Back to Products
                </a>

            </div>

        `;

        return;

    }


    const {
        data: product,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if(error || !product) {

        console.error(error);

        container.innerHTML = `

            <div class="message error">

                Product could not be found.

                <br><br>

                <a href="index.html#products">
                    Go Back to Products
                </a>

            </div>

        `;

        return;

    }


    const name =
        product.name ||
        product.product_name ||
        "Liara Product";


    const description =
        product.description ||
        "Premium beauty and personal care product.";


    const price =
        Number(product.price || 0);


    const stock =
        Number(product.stock || 0);


    const image =
        product.image_url ||
        product.photo_url ||
        product.image ||
        product.photo ||
        "facewash.jpg";


    document.title =
        name + " | Liara Professional™";


    container.innerHTML = `

        <div class="product-detail">


            <div class="product-photo">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="this.src='facewash.jpg'"
                >

            </div>


            <div class="product-info">

                <div class="product-label">

                    LIARA PROFESSIONAL™

                </div>


                <h1>

                    ${escapeHtml(name)}

                </h1>


                <div class="product-price">

                    ₹${price.toLocaleString("en-IN")}

                </div>


                <div class="product-description">

                    ${escapeHtml(description)}

                </div>


                ${
                    stock > 0

                    ?

                    `

                    <div class="stock-text in-stock">

                        ✓ In Stock
                        (${stock} available)

                    </div>


                    <div class="quantity-box">

                        <button
                            type="button"
                            onclick="decreaseQuantity()">

                            −

                        </button>


                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                            max="${stock}"
                            readonly
                        >


                        <button
                            type="button"
                            onclick="increaseQuantity(${stock})">

                            +

                        </button>

                    </div>


                    <div class="action-buttons">

                        <button
                            type="button"
                            class="add-cart"
                            onclick="addToCart()">

                            🛒 Add to Cart

                        </button>


                        <button
                            type="button"
                            class="buy-now"
                            onclick="buyNow()">

                            ⚡ Buy Now

                        </button>

                    </div>

                    `

                    :

                    `

                    <div class="stock-text out-stock">

                        ✕ Out of Stock

                    </div>

                    `

                }

            </div>

        </div>

    `;

}


/* =====================================================
   QUANTITY
===================================================== */

function increaseQuantity(maxStock) {

    const input =
        document.getElementById(
            "quantity"
        );

    if(!input) return;


    let quantity =
        Number(input.value);


    if(quantity < maxStock) {

        quantity++;

        input.value =
            quantity;

    }

}


function decreaseQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );

    if(!input) return;


    let quantity =
        Number(input.value);


    if(quantity > 1) {

        quantity--;

        input.value =
            quantity;

    }

}


/* =====================================================
   GET CURRENT PRODUCT
===================================================== */

async function getCurrentProduct() {

    if(!productId) {

        return null;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if(error) {

        console.error(
            "Product error:",
            error
        );

        return null;

    }


    return data;

}


/* =====================================================
   ADD TO CART
===================================================== */

async function addToCart() {

    const product =
        await getCurrentProduct();


    if(!product) {

        alert(
            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(product.stock || 0);


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    let cart = [];

    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "liaraCart"
                ) || "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    const existing =
        cart.find(function(item) {

            return String(item.id) ===
                   String(product.id);

        });


    if(existing) {

        const newQuantity =
            Number(existing.quantity || 0) +
            quantity;


        if(newQuantity > stock) {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }


        existing.quantity =
            newQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                product.product_name ||
                "Liara Product",

            price:
                Number(
                    product.price || 0
                ),

            image:
                product.image_url ||
                product.photo_url ||
                product.image ||
                product.photo ||
                "facewash.jpg",

            quantity:
                quantity

        });

    }


    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    alert(
        "Product added to cart successfully."
    );


    window.location.href =
        "cart.html";

}


/* =====================================================
   BUY NOW
   DIRECT CHECKOUT
===================================================== */

async function buyNow() {

    const product =
        await getCurrentProduct();


    if(!product) {

        alert(
            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(product.stock || 0);


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    /*
       IMPORTANT:

       Buy Now DOES NOT add product
       to liaraCart.

       It creates a separate
       liaraBuyNow order.
    */

    const buyNowItem = {

        id:
            product.id,

        name:
            product.name ||
            product.product_name ||
            "Liara Product",

        price:
            Number(
                product.price || 0
            ),

        image:
            product.image_url ||
            product.photo_url ||
            product.image ||
            product.photo ||
            "facewash.jpg",

        quantity:
            quantity

    };


    localStorage.setItem(
        "liaraBuyNow",
        JSON.stringify(
            buyNowItem
        )
    );


    /*
       This flag tells checkout
       that customer selected
       BUY NOW.
    */

    localStorage.setItem(
        "liaraCheckoutMode",
        "buyNow"
    );


    /*
       DIRECT CHECKOUT PAGE

       IMPORTANT:
       checkout.html should be
       your customer order page.
    */

    window.location.href =
        "checkout.html";

}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>

</html>
