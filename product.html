<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Product</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   PRODUCT PAGE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #faf8f5;
    color: #222;
}


/* =====================================================
   MAIN
===================================================== */

.product-page {
    width: 92%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 45px 0 70px;
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-link {
    display: inline-block;
    margin-bottom: 30px;
    color: #ad8232;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
}

.back-link:hover {
    text-decoration: underline;
}


/* =====================================================
   PRODUCT DETAIL
===================================================== */

.product-detail {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,.07);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-photo {
    width: 100%;
    height: 450px;
    background: #f5f1eb;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.product-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 10px;
}

.product-label {
    color: #ad8232;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2.5px;
    margin-bottom: 12px;
}

.product-info h1 {
    font-size: 36px;
    line-height: 1.2;
    margin: 0 0 15px;
    color: #222;
}

.product-price {
    font-size: 30px;
    font-weight: bold;
    color: #ad8232;
    margin: 5px 0 22px;
}

.product-description {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}


/* =====================================================
   KEY INGREDIENTS
===================================================== */

.ingredients-section {
    margin: 5px 0 28px;
    padding: 25px;
    background: #faf8f5;
    border: 1px solid #eee5d7;
    border-radius: 16px;
}

.ingredients-title {
    margin: 0 0 18px;
    font-size: 22px;
    color: #222;
    font-weight: 700;
}

.ingredients-title span {
    color: #ad8232;
}

.ingredients-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.ingredient-item {
    background: #fff;
    border-radius: 12px;
    padding: 15px 16px;
    border: 1px solid #eee;
}

.ingredient-name {
    font-size: 16px;
    font-weight: 700;
    color: #ad8232;
    margin-bottom: 5px;
}

.ingredient-benefit {
    font-size: 14px;
    line-height: 1.6;
    color: #666;
}

.no-ingredients {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}


/* =====================================================
   STOCK
===================================================== */

.stock-text {
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 15px;
}

.in-stock {
    color: #287a3e;
}

.out-stock {
    color: #b22;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.quantity-box button {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    font-size: 21px;
    cursor: pointer;
    transition: .2s;
}

.quantity-box button:hover {
    background: #f5f1eb;
    border-color: #ad8232;
}

.quantity-box input {
    width: 65px;
    height: 42px;
    text-align: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.action-buttons button {
    border: none;
    cursor: pointer;
    padding: 15px 27px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.action-buttons button:hover {
    transform: translateY(-2px);
    opacity: .93;
}

.add-cart {
    background: #ad8232;
    color: white;
}

.buy-now {
    background: #287a3e;
    color: white;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

.message {
    text-align: center;
    padding: 100px 20px;
    color: #777;
}

.error {
    color: #a33;
}

.message a {
    color: #ad8232;
    font-weight: bold;
    text-decoration: none;
}



/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

    .product-detail {
        grid-template-columns: 1fr;
        padding: 25px;
        gap: 35px;
    }

    .product-photo {
        height: 450px;
    }

    .product-info h1 {
        font-size: 34px;
    }

}


@media(max-width: 600px) {

    .product-page {
        padding: 35px 15px 60px;
    }

    .product-detail {
        padding: 18px;
        border-radius: 18px;
    }

    .product-photo {
        height: 360px;
        border-radius: 15px;
    }

    .product-info h1 {
        font-size: 29px;
    }

    .product-price {
        font-size: 26px;
    }

    .ingredients-section {
        padding: 18px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }

}


/* =====================================================
   PRODUCT PAGE - LAPTOP SIZE FIX
   Only affects product.html
===================================================== */

@media (min-width: 901px) {

    .product-page {
        width: min(92vw, 1080px) !important;
        max-width: 1080px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding: 35px 0 60px !important;
    }

    .product-detail {
        width: 100% !important;
        max-width: 1080px !important;
        padding: 26px !important;
        gap: 28px !important;
        border-radius: 18px !important;
    }

    .product-photo {
        height: 430px !important;
        max-height: 430px !important;
    }

    .product-info h1 {
        font-size: 34px !important;
        line-height: 1.18 !important;
    }

    .product-price {
        font-size: 27px !important;
    }
}

@media (min-width: 1400px) {

    .product-page {
        width: min(90vw, 1120px) !important;
        max-width: 1120px !important;
    }

    .product-detail {
        max-width: 1120px !important;
    }

    .product-photo {
        height: 450px !important;
        max-height: 450px !important;
    }
}

@media (max-width: 900px) {

    .product-page {
        width: 92% !important;
        max-width: none !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .product-detail {
        width: 100% !important;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<a href="index.html" class="logo">

    <span>
        LIARA
    </span>

    <small>
        PROFESSIONAL™
    </small>

</a>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="index.html#products">
        Products
    </a>

    <a href="account.html">
        My Account
    </a>

    <a href="cart.html">
        Cart 🛒
    </a>

</nav>

</header>



<!-- =====================================================
     MAIN PRODUCT PAGE
===================================================== -->

<main class="product-page">


<a
    href="index.html#products"
    class="back-link">

    ← Back to Products

</a>


<div id="productContainer">

    <div class="message">

        Loading product...

    </div>

</div>


</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   PRODUCT ID
===================================================== */

const productId =
localStorage.getItem(
    "selectedProductId"
);


/* =====================================================
   INGREDIENT PARSER
===================================================== */

function parseIngredients(value) {

    if(!value) {

        return [];

    }


    /*
       Try JSON first.
    */

    try {

        const parsed =
            JSON.parse(value);

        if(Array.isArray(parsed)) {

            return parsed;

        }

    }

    catch(error) {

        /*
           Normal text format will
           continue below.
        */

    }


    /*
       Normal text format:

       Niacinamide — Brightening
       Aloe Vera — Hydration
       Vitamin E — Moisturising
    */

    const lines =
        String(value)
        .split(/\r?\n/)
        .map(function(line) {

            return line.trim();

        })
        .filter(Boolean);


    return lines.map(function(line) {

        let parts;


        if(line.includes("—")) {

            parts =
                line.split("—");

        }

        else if(line.includes("|")) {

            parts =
                line.split("|");

        }

        else if(line.includes(":")) {

            parts =
                line.split(":");

        }

        else {

            return {

                name: line,
                benefit: ""

            };

        }


        return {

            name:
                parts.shift().trim(),

            benefit:
                parts.join("—").trim()

        };

    });

}


/* =====================================================
   RENDER INGREDIENTS
===================================================== */

function renderIngredients(value) {

    const ingredients =
        parseIngredients(value);


    if(!ingredients.length) {

        return `

            <div class="ingredients-section">

                <h2 class="ingredients-title">

                    <span>🌿</span>
                    Key Ingredients

                </h2>

                <div class="no-ingredients">

                    Key ingredients information
                    will be updated soon.

                </div>

            </div>

        `;

    }


    let html = "";


    ingredients.forEach(function(item) {

        const name =
            item.name ||
            item.ingredient ||
            "Key Ingredient";


        const benefit =
            item.benefit ||
            item.description ||
            item.benefits ||
            "";


        html += `

            <div class="ingredient-item">

                <div class="ingredient-name">

                    🌿
                    ${escapeHtml(name)}

                </div>


                ${
                    benefit

                    ?

                    `

                    <div class="ingredient-benefit">

                        ${escapeHtml(benefit)}

                    </div>

                    `

                    :

                    ""

                }

            </div>

        `;

    });


    return `

        <div class="ingredients-section">

            <h2 class="ingredients-title">

                <span>🌿</span>
                Key Ingredients

            </h2>


            <div class="ingredients-list">

                ${html}

            </div>

        </div>

    `;

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct() {

    const container =
        document.getElementById(
            "productContainer"
        );


    if(!productId) {

        container.innerHTML = `

            <div class="message error">

                Product not selected.

                <br><br>

                <a href="index.html#products">

                    Go Back to Products

                </a>

            </div>

        `;

        return;

    }


    const {
        data: product,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if(error || !product) {

        console.error(
            "Product loading error:",
            error
        );


        container.innerHTML = `

            <div class="message error">

                Product could not be found.

                <br><br>

                <a href="index.html#products">

                    Go Back to Products

                </a>

            </div>

        `;

        return;

    }


    /* =================================================
       PRODUCT DATA
    ================================================= */

    const name =
        product.name ||
        product.product_name ||
        "Liara Product";


    const description =
        product.description ||
        "Premium beauty and personal care product.";


    const price =
        Number(
            product.price || 0
        );


    const stock =
        Number(
            product.stock || 0
        );


    const image =
        product.image_url ||
        product.photo_url ||
        product.image ||
        product.photo ||
        "facewash.jpg";


    /*
       KEY INGREDIENTS
    */

    const keyIngredients =
        product.key_ingredients ||
        "";


    document.title =
        name +
        " | Liara Professional™";


    /* =================================================
       DISPLAY PRODUCT
    ================================================= */

    container.innerHTML = `

        <div class="product-detail">


            <!-- PRODUCT IMAGE -->

            <div class="product-photo">

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="this.src='facewash.jpg'"
                >

            </div>



            <!-- PRODUCT INFORMATION -->

            <div class="product-info">


                <div class="product-label">

                    LIARA PROFESSIONAL™

                </div>



                <h1>

                    ${escapeHtml(name)}

                </h1>



                <div class="product-price">

                    ₹${price.toLocaleString("en-IN")}

                </div>



                <div class="product-description">

                    ${escapeHtml(description)}

                </div>



                <!-- KEY INGREDIENTS -->

                ${renderIngredients(keyIngredients)}



                ${
                    stock > 0

                    ?

                    `

                    <div class="stock-text in-stock">

                        ✓ In Stock
                        (${stock} available)

                    </div>



                    <!-- QUANTITY -->

                    <div class="quantity-box">

                        <button
                            type="button"
                            onclick="decreaseQuantity()">

                            −

                        </button>


                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                            max="${stock}"
                            readonly
                        >


                        <button
                            type="button"
                            onclick="increaseQuantity(${stock})">

                            +

                        </button>

                    </div>



                    <!-- ACTION BUTTONS -->

                    <div class="action-buttons">

                        <button
                            type="button"
                            class="add-cart"
                            onclick="addToCart()">

                            🛒 Add to Cart

                        </button>


                        <button
                            type="button"
                            class="buy-now"
                            onclick="buyNow()">

                            ⚡ Buy Now

                        </button>

                    </div>

                    `

                    :

                    `

                    <div class="stock-text out-stock">

                        ✕ Out of Stock

                    </div>

                    `

                }

            </div>

        </div>

    `;

}


/* =====================================================
   QUANTITY +
===================================================== */

function increaseQuantity(maxStock) {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity < maxStock) {

        quantity++;

        input.value =
            quantity;

    }

}


/* =====================================================
   QUANTITY -
===================================================== */

function decreaseQuantity() {

    const input =
        document.getElementById(
            "quantity"
        );


    if(!input) {

        return;

    }


    let quantity =
        Number(
            input.value
        );


    if(quantity > 1) {

        quantity--;

        input.value =
            quantity;

    }

}


/* =====================================================
   GET CURRENT PRODUCT
===================================================== */

async function getCurrentProduct() {

    if(!productId) {

        return null;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", productId)
        .single();


    if(error) {

        console.error(
            "Product error:",
            error
        );

        return null;

    }


    return data;

}


/* =====================================================
   ADD TO CART
===================================================== */

async function addToCart() {

    const product =
        await getCurrentProduct();


    if(!product) {

        alert(
            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    let cart = [];


    try {

        cart =
            JSON.parse(
                localStorage.getItem(
                    "liaraCart"
                ) || "[]"
            );

    }

    catch(error) {

        cart = [];

    }


    const existing =
        cart.find(function(item) {

            return String(item.id) ===
                   String(product.id);

        });


    if(existing) {

        const newQuantity =
            Number(
                existing.quantity || 0
            ) +
            quantity;


        if(newQuantity > stock) {

            alert(
                "You cannot add more than available stock."
            );

            return;

        }


        existing.quantity =
            newQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name ||
                product.product_name ||
                "Liara Product",

            price:
                Number(
                    product.price || 0
                ),

            image:
                product.image_url ||
                product.photo_url ||
                product.image ||
                product.photo ||
                "facewash.jpg",

            quantity:
                quantity

        });

    }


    localStorage.setItem(
        "liaraCart",
        JSON.stringify(cart)
    );


    alert(
        "Product added to cart successfully."
    );


    window.location.href =
        "cart.html";

}


/* =====================================================
   BUY NOW
===================================================== */

async function buyNow() {

    const product =
        await getCurrentProduct();


    if(!product) {

        alert(
            "Product could not be loaded."
        );

        return;

    }


    const quantityInput =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Number(
            quantityInput?.value || 1
        );


    if(quantity < 1) {

        alert(
            "Please select a valid quantity."
        );

        return;

    }


    const stock =
        Number(
            product.stock || 0
        );


    if(stock < quantity) {

        alert(
            "Not enough stock available."
        );

        return;

    }


    const buyNowItem = {

        id:
            product.id,

        name:
            product.name ||
            product.product_name ||
            "Liara Product",

        price:
            Number(
                product.price || 0
            ),

        image:
            product.image_url ||
            product.photo_url ||
            product.image ||
            product.photo ||
            "facewash.jpg",

        quantity:
            quantity

    };


    localStorage.setItem(
        "liaraBuyNow",
        JSON.stringify(
            buyNowItem
        )
    );


    localStorage.setItem(
        "liaraCheckoutMode",
        "buyNow"
    );


    window.location.href =
        "checkout.html";

}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>

</html>
```
