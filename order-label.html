const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   FIND ORDER
===================================================== */

async function findOrder(){

  const entered =
    document
    .getElementById("orderInput")
    .value
    .trim();


  const message =
    document.getElementById("message");


  const labelArea =
    document.getElementById("labelArea");


  labelArea.style.display = "none";


  message.className = "message";


  if(!entered){

    message.textContent =
      "Please enter an order number.";

    message.classList.add("error");

    return;

  }


  message.textContent =
    "Finding order...";


  try{

    const { data, error } =
      await supabaseClient
      .from("orders")
      .select(`
        order_number,
        customer_name,
        phone,
        address,
        house_no,
        street,
        city,
        state,
        pincode,
        payment_method,
        shipping_address
      `)
      .eq(
        "order_number",
        entered
      )
      .maybeSingle();


    if(error){

      console.error(error);

      throw error;

    }


    if(!data){

      message.textContent =
        "Order not found.";

      message.classList.add("error");

      return;

    }


    showLabel(data);


  }catch(error){

    console.error(
      "ORDER ERROR:",
      error
    );


    message.textContent =
      "Order fetch failed: " +
      error.message;

    message.classList.add("error");

  }

}


/* =====================================================
   SHOW LABEL
===================================================== */

function showLabel(order){

  const customerName =
    order.customer_name ||
    "Customer";


  const mobile =
    order.phone ||
    "—";


  /*
     Address priority:

     shipping_address
     ↓
     individual address fields
     ↓
     address
  */

  let address = "";


  if(
    order.shipping_address &&
    order.shipping_address.trim()
  ){

    address =
      order.shipping_address.trim();

  }else{

    const parts = [

      order.house_no,

      order.street,

      order.city,

      order.state,

      order.pincode

    ];


    address =
      parts
      .filter(
        value =>
        value &&
        String(value).trim()
      )
      .join(", ");


    if(
      !address &&
      order.address
    ){

      address =
        order.address;

    }

  }


  const orderNumber =
    order.order_number ||
    document
    .getElementById("orderInput")
    .value
    .trim();


  /* CUSTOMER */

  document
  .getElementById("customerName")
  .textContent =
    customerName;


  /* ADDRESS */

  document
  .getElementById("customerAddress")
  .textContent =
    address ||
    "Address not available";


  /* MOBILE */

  document
  .getElementById("customerMobile")
  .textContent =
    "Mobile: " +
    mobile;


  /* ORDER NUMBER */

  document
  .getElementById("displayOrder")
  .textContent =
    "ORDER: " +
    orderNumber;


  /* =================================================
     PAYMENT
  ================================================= */

  const payment =
    String(
      order.payment_method || "COD"
    ).toUpperCase();


  document
  .querySelector(".cod")
  .textContent =
    "PAYMENT: " +
    (
      payment.includes("COD")
      ? "COD"
      : payment
    );


  /* =================================================
     BARCODE
  ================================================= */

  JsBarcode(
    "#barcode",
    orderNumber,
    {

      format: "CODE128",

      width: 2,

      height: 40,

      displayValue: true,

      fontSize: 10,

      margin: 0

    }
  );


  /* =================================================
     SHOW
  ================================================= */

  document
  .getElementById("message")
  .textContent =
    "Order found — label ready.";

  document
  .getElementById("message")
  .classList.add("success");


  document
  .getElementById("labelArea")
  .style.display =
    "block";

}


/* =====================================================
   PRINT
===================================================== */

function printLabel(){

  window.print();

}


/* =====================================================
   ENTER KEY
===================================================== */

document
.getElementById("orderInput")
.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      findOrder();

    }

  }
);

</script>
