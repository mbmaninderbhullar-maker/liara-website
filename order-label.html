<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Liara Professional™ | Order Label</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f2ee;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    max-width:900px;
    margin:auto;
    padding:25px 18px 50px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:30px;
    letter-spacing:4px;
}

.header p{
    margin:5px 0 0;
    font-size:9px;
    color:#777;
    letter-spacing:2px;
}

/* SEARCH */

.search-box{
    background:#fff;
    border:1px solid #ddd8d0;
    border-radius:13px;
    padding:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.search-row{
    display:flex;
    gap:8px;
}

.search-input{
    flex:1;
    height:44px;
    border:1px solid #ccc;
    border-radius:8px;
    padding:0 12px;
    font-size:14px;
    outline:none;
}

.search-input:focus{
    border-color:#222;
}

.search-btn{
    height:44px;
    border:0;
    border-radius:8px;
    padding:0 17px;
    background:#171717;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

/* STATUS */

.status{
    min-height:18px;
    margin-top:8px;
    font-size:11px;
}

.status.error{
    color:#b42318;
}

.status.success{
    color:#16733c;
}

/* ORDERS */

.orders-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 2px 9px;
}

.orders-head strong{
    font-size:13px;
}

.order-count{
    color:#777;
    font-size:11px;
}

.orders{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:9px;
    max-height:430px;
    overflow:auto;
}

.order-card{
    background:#fff;
    border:1px solid #ddd8d0;
    border-radius:9px;
    padding:12px;
    cursor:pointer;
    transition:.15s;
}

.order-card:hover{
    border-color:#222;
}

.order-card.active{
    border:2px solid #171717;
    padding:11px;
}

.order-number{
    font-size:13px;
    font-weight:800;
}

.order-name{
    margin-top:4px;
    font-size:12px;
    font-weight:600;
}

.order-phone{
    margin-top:3px;
    font-size:10px;
    color:#777;
}

.order-payment{
    display:inline-block;
    margin-top:7px;
    padding:3px 6px;
    border:1px solid #222;
    border-radius:4px;
    font-size:8px;
    font-weight:800;
}

/* LABEL PREVIEW */

.preview{
    display:none;
    margin-top:22px;
    background:#fff;
    border:1px solid #ddd8d0;
    border-radius:13px;
    padding:15px;
}

.preview-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.preview-head strong{
    font-size:13px;
}

.print-btn{
    height:38px;
    border:0;
    border-radius:7px;
    padding:0 15px;
    background:#171717;
    color:#fff;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

/* =====================================================
   90MM LABEL
===================================================== */

.label{
    width:90mm;
    min-height:55mm;
    margin:0 auto;
    padding:6mm;
    background:#fff;
    border:1.5px solid #111;
    overflow:hidden;
}

/* LABEL TOP */

.label-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    padding-bottom:7px;
    border-bottom:1.5px solid #111;
}

.logo{
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    font-weight:700;
    letter-spacing:2px;
}

.logo small{
    display:block;
    margin-top:2px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:7px;
    letter-spacing:1.2px;
}

.payment{
    border:1.5px solid #111;
    border-radius:4px;
    padding:4px 6px;
    font-size:8px;
    font-weight:800;
    white-space:nowrap;
}

/* CUSTOMER */

.ship{
    margin-top:8px;
    margin-bottom:3px;
    font-size:7px;
    font-weight:800;
    letter-spacing:1.2px;
}

.customer-name{
    font-size:15px;
    font-weight:800;
    margin-bottom:4px;
    word-break:break-word;
}

.customer-address{
    font-size:10px;
    line-height:1.4;
    word-break:break-word;
}

.customer-phone{
    margin-top:5px;
    font-size:9px;
    font-weight:700;
}

/* =====================================================
   BARCODE AREA
===================================================== */

.label-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-top:8px;
    padding-top:7px;
    border-top:1px solid #999;
}

.label-order{
    font-size:9px;
    font-weight:800;
    white-space:nowrap;
    max-width:27mm;
    overflow:hidden;
    text-overflow:ellipsis;
}

/*
   BIG SCANNER-FRIENDLY BARCODE
*/

.barcode{
    width:180px;
    height:55px;
    max-width:54mm;
    display:block;
    flex-shrink:0;
}

/* LOADING */

.loading,
.empty{
    background:#fff;
    border:1px solid #ddd8d0;
    border-radius:9px;
    padding:20px;
    text-align:center;
    color:#777;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .page{
        padding:12px 9px 35px;
    }

    .search-row{
        flex-direction:column;
    }

    .search-btn{
        width:100%;
    }

    .orders{
        grid-template-columns:1fr;
        max-height:350px;
    }

    .preview{
        padding:10px;
    }

    .preview-head{
        gap:8px;
    }

}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{
        size:90mm 55mm;
        margin:0;
    }

    html,
    body{
        width:90mm;
        height:55mm;
        margin:0;
        padding:0;
        background:#fff;
    }

    .page{
        max-width:none;
        margin:0;
        padding:0;
    }

    .header,
    .search-box,
    .orders-head,
    .orders,
    .preview-head,
    .status{
        display:none !important;
    }

    .preview{
        display:block !important;
        border:0;
        padding:0;
        margin:0;
        background:#fff;
    }

    .label{
        width:90mm;
        height:55mm;
        min-height:55mm;
        max-height:55mm;
        margin:0;
        padding:6mm;
        border:1.5px solid #111;
        page-break-inside:avoid;
        overflow:hidden;
    }

}

</style>

</head>

<body>

<div class="page">

<!-- HEADER -->

<div class="header">

    <h1>LIARA</h1>

    <p>
        PROFESSIONAL™ · ORDER LABEL
    </p>

</div>

<!-- SEARCH -->

<div class="search-box">

    <div class="search-row">

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search order number / customer / mobile"
            autocomplete="off"
        >

        <button
            class="search-btn"
            onclick="searchOrders()"
        >
            Search
        </button>

    </div>

    <div
        id="status"
        class="status"
    ></div>

    <div class="orders-head">

        <strong>
            Orders
        </strong>

        <span
            id="orderCount"
            class="order-count"
        >
            0 orders
        </span>

    </div>

    <div
        id="orders"
        class="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>

<!-- LABEL PREVIEW -->

<div
    id="preview"
    class="preview"
>

    <div class="preview-head">

        <strong>
            Label Preview
        </strong>

        <button
            class="print-btn"
            onclick="printLabel()"
        >
            🖨 Print Label
        </button>

    </div>

    <div class="label">

        <!-- TOP -->

        <div class="label-top">

            <div class="logo">

                LIARA

                <small>
                    PROFESSIONAL™
                </small>

            </div>

            <div
                id="payment"
                class="payment"
            >
                PAYMENT: COD
            </div>

        </div>

        <!-- CUSTOMER -->

        <div class="ship">
            SHIP TO
        </div>

        <div
            id="customerName"
            class="customer-name"
        >
            —
        </div>

        <div
            id="customerAddress"
            class="customer-address"
        >
            —
        </div>

        <div
            id="customerPhone"
            class="customer-phone"
        >
            Mobile: —
        </div>

        <!-- BARCODE -->

        <div class="label-bottom">

            <div
                id="labelOrder"
                class="label-order"
            >
                ORDER: —
            </div>

            <svg
                id="barcode"
                class="barcode"
            ></svg>

        </div>

    </div>

</div>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://oinafbuicwhleudztzyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wXorRS0wOTHSsKcx_rXd8w_pfe62CIu";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const ADMIN_EMAIL =
    "info@liara.co.in";

/* VARIABLES */

let allOrders = [];

let selectedOrder = null;

/* ADMIN CHECK */

async function checkAdmin(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();

        if(
            error ||
            !data ||
            !data.user
        ){

            window.location.href =
                "company-login.html";

            return false;

        }

        if(
            !data.user.email ||
            data.user.email.toLowerCase()
            !==
            ADMIN_EMAIL.toLowerCase()
        ){

            window.location.href =
                "company-login.html";

            return false;

        }

        return true;

    }

    catch(error){

        console.error(error);

        window.location.href =
            "company-login.html";

        return false;

    }

}

/* LOAD ORDERS */

async function loadOrders(){

    const ordersBox =
        document.getElementById("orders");

    const status =
        document.getElementById("status");

    ordersBox.innerHTML =
        `
        <div class="loading">
            Loading customer orders...
        </div>
        `;

    status.textContent = "";

    const allowed =
        await checkAdmin();

    if(!allowed){
        return;
    }

    try{

        const {
            data,
            error
        } =
        await supabaseClient

            .from("orders")

            .select("*")

            .order(
                "created_at",
                {
                    ascending:false
                }
            );

        if(error){
            throw error;
        }

        allOrders =
            data || [];

        renderOrders(
            allOrders
        );

    }

    catch(error){

        console.error(
            "ORDER LOAD ERROR:",
            error
        );

        ordersBox.innerHTML =
            `
            <div class="empty">
                Unable to load orders.
            </div>
            `;

        status.textContent =
            error.message ||
            "Unable to load orders.";

        status.className =
            "status error";

    }

}

/* RENDER ORDERS */

function renderOrders(orders){

    const box =
        document.getElementById("orders");

    const count =
        document.getElementById("orderCount");

    count.textContent =
        orders.length +
        (
            orders.length === 1
            ? " order"
            : " orders"
        );

    if(!orders.length){

        box.innerHTML =
            `
            <div class="empty">
                No orders found.
            </div>
            `;

        return;

    }

    box.innerHTML = "";

    orders.forEach(
        function(order){

            const card =
                document.createElement("div");

            card.className =
                "order-card";

            if(
                selectedOrder &&
                String(selectedOrder.id)
                ===
                String(order.id)
            ){

                card.classList.add(
                    "active"
                );

            }

            card.innerHTML = `

                <div class="order-number">
                    ${escapeHTML(
                        order.order_number || "-"
                    )}
                </div>

                <div class="order-name">
                    ${escapeHTML(
                        order.customer_name || "Customer"
                    )}
                </div>

                <div class="order-phone">
                    ${escapeHTML(
                        order.phone || "-"
                    )}
                </div>

                <div class="order-payment">
                    PAYMENT:
                    ${escapeHTML(
                        paymentText(order)
                    )}
                </div>

            `;

            card.addEventListener(
                "click",
                function(){

                    selectOrder(
                        order
                    );

                }
            );

            box.appendChild(card);

        }
    );

}

/* SEARCH */

function searchOrders(){

    const value =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    if(!value){

        renderOrders(
            allOrders
        );

        return;

    }

    const filtered =
        allOrders.filter(
            function(order){

                const number =
                    String(
                        order.order_number || ""
                    )
                    .toLowerCase();

                const name =
                    String(
                        order.customer_name || ""
                    )
                    .toLowerCase();

                const phone =
                    String(
                        order.phone || ""
                    )
                    .toLowerCase();

                return (
                    number.includes(value) ||
                    name.includes(value) ||
                    phone.includes(value)
                );

            }
        );

    renderOrders(
        filtered
    );

}

/* LIVE SEARCH */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        searchOrders
    );

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                searchOrders();

            }

        }
    );

/* SELECT ORDER */

function selectOrder(order){

    selectedOrder =
        order;

    renderOrders(
        getFilteredOrders()
    );

    /* NAME */

    document
        .getElementById("customerName")
        .textContent =
            order.customer_name ||
            "Customer";

    /* PHONE */

    document
        .getElementById("customerPhone")
        .textContent =
            "Mobile: " +
            (
                order.phone ||
                "—"
            );

    /* ADDRESS */

    document
        .getElementById("customerAddress")
        .textContent =
            buildAddress(order) ||
            "Address not available";

    /* ORDER NUMBER */

    const orderNumber =
        order.order_number ||
        "-";

    document
        .getElementById("labelOrder")
        .textContent =
            "ORDER: " +
            orderNumber;

    /* PAYMENT */

    document
        .getElementById("payment")
        .textContent =
            "PAYMENT: " +
            paymentText(order);

    /* BARCODE */

    const barcode =
        document.getElementById("barcode");

    barcode.innerHTML = "";

    if(orderNumber !== "-"){

        JsBarcode(
            barcode,
            orderNumber,
            {

                format:"CODE128",

                /*
                   Wider bars for easier scanning
                */
                width:2.2,

                /*
                   Bigger barcode height
                */
                height:55,

                displayValue:true,

                fontSize:11,

                fontOptions:"bold",

                textMargin:2,

                margin:0,

                flat:false

            }
        );

    }

    /* SHOW PREVIEW */

    document
        .getElementById("preview")
        .style.display =
            "block";

    const status =
        document.getElementById("status");

    status.textContent =
        "Order selected — label ready.";

    status.className =
        "status success";

    document
        .getElementById("preview")
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

}

/* FILTER */

function getFilteredOrders(){

    const value =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();

    if(!value){
        return allOrders;
    }

    return allOrders.filter(
        function(order){

            return (

                String(
                    order.order_number || ""
                )
                .toLowerCase()
                .includes(value)

                ||

                String(
                    order.customer_name || ""
                )
                .toLowerCase()
                .includes(value)

                ||

                String(
                    order.phone || ""
                )
                .toLowerCase()
                .includes(value)

            );

        }
    );

}

/* PAYMENT */

function paymentText(order){

    const payment =
        order.payment_method ||
        order.payment_status ||
        order.payment ||
        "COD";

    const value =
        String(payment)
            .trim()
            .toUpperCase();

    if(
        value.includes("COD") ||
        value === "CASH ON DELIVERY"
    ){

        return "COD";

    }

    return value || "COD";

}

/* ADDRESS */

function buildAddress(order){

    if(
        order.address &&
        String(
            order.address
        ).trim()
    ){

        return String(
            order.address
        ).trim();

    }

    if(
        order.shipping_address &&
        String(
            order.shipping_address
        ).trim()
    ){

        return String(
            order.shipping_address
        ).trim();

    }

    return [

        order.house_no,

        order.street,

        order.city,

        order.state,

        order.pincode

    ]

    .filter(
        function(value){

            return (
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
            );

        }
    )

    .map(
        function(value){

            return String(
                value
            ).trim();

        }
    )

    .join(", ");

}

/* ESCAPE */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

/* PRINT */

function printLabel(){

    if(!selectedOrder){

        alert(
            "Please select an order first."
        );

        return;

    }

    window.print();

}

/* START */

loadOrders();

</script>

</body>
</html>
```
