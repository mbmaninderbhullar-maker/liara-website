<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Liara Professional™ | Order Labels</title>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     BARCODE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    background:#f5f3ef;

    color:#171717;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:30px 20px 50px;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    text-align:center;

    margin-bottom:25px;
}


.header h1{

    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:32px;

    letter-spacing:4px;
}


.header p{

    margin:6px 0 0;

    color:#777;

    font-size:10px;

    letter-spacing:2px;
}


/* =====================================================
   CONTROL BOX
===================================================== */

.controls{

    background:#fff;

    border:1px solid #ddd8d0;

    border-radius:15px;

    padding:18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.06);
}


.search-row{

    display:flex;

    gap:10px;
}


.search-row input{

    flex:1;

    height:46px;

    border:1px solid #ccc;

    border-radius:8px;

    padding:0 13px;

    font-size:15px;

    outline:none;
}


.search-row input:focus{

    border-color:#222;
}


.btn{

    height:46px;

    border:0;

    border-radius:8px;

    padding:0 18px;

    background:#171717;

    color:#fff;

    font-weight:700;

    cursor:pointer;
}


.btn:hover{

    opacity:.9;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    min-height:20px;

    margin-top:10px;

    font-size:12px;
}


.status.error{

    color:#b42318;
}


.status.success{

    color:#16733c;
}


/* =====================================================
   ORDERS
===================================================== */

.orders-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:20px 0 10px;
}


.orders-title strong{

    font-size:14px;
}


.order-count{

    color:#777;

    font-size:12px;
}


.orders{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));

    gap:10px;

    max-height:430px;

    overflow:auto;

    padding-right:3px;
}


.order-card{

    background:#fff;

    border:1px solid #ddd8d0;

    border-radius:10px;

    padding:13px;

    cursor:pointer;

    transition:.15s;
}


.order-card:hover{

    border-color:#222;

    transform:translateY(-1px);
}


.order-card.active{

    border:2px solid #171717;

    padding:12px;
}


.order-number{

    font-size:14px;

    font-weight:800;
}


.order-customer{

    margin-top:4px;

    font-size:13px;

    font-weight:600;
}


.order-phone{

    margin-top:3px;

    color:#777;

    font-size:11px;
}


.order-payment{

    display:inline-block;

    margin-top:8px;

    padding:4px 7px;

    border:1px solid #222;

    border-radius:4px;

    font-size:9px;

    font-weight:800;
}


/* =====================================================
   LABEL AREA
===================================================== */

.label-section{

    display:none;

    margin-top:25px;

    background:#fff;

    border:1px solid #ddd8d0;

    border-radius:15px;

    padding:20px;
}


.label-heading{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}


.label-heading strong{

    font-size:14px;
}


.print-btn{

    height:40px;

    padding:0 17px;

    border:0;

    border-radius:8px;

    background:#171717;

    color:#fff;

    font-weight:700;

    cursor:pointer;
}


/* =====================================================
   LABEL
===================================================== */

.label{

    width:90mm;

    min-height:55mm;

    background:#fff;

    border:1.5px solid #111;

    padding:6mm;

    margin:0 auto;
}


/* =====================================================
   LABEL TOP
===================================================== */

.label-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:8px;

    padding-bottom:7px;

    border-bottom:1.5px solid #111;
}


.logo{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:18px;

    font-weight:700;

    letter-spacing:2px;
}


.logo small{

    display:block;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:7px;

    letter-spacing:1.3px;

    margin-top:2px;
}


.payment{

    border:1.5px solid #111;

    border-radius:4px;

    padding:4px 6px;

    font-size:8px;

    font-weight:800;

    white-space:nowrap;
}


/* =====================================================
   ADDRESS
===================================================== */

.ship{

    margin-top:8px;

    margin-bottom:3px;

    font-size:7px;

    font-weight:800;

    letter-spacing:1.2px;
}


.customer-name{

    font-size:15px;

    font-weight:800;

    margin-bottom:4px;

    word-break:break-word;
}


.customer-address{

    font-size:10px;

    line-height:1.4;

    word-break:break-word;
}


.customer-phone{

    margin-top:5px;

    font-size:9px;

    font-weight:700;
}


/* =====================================================
   BOTTOM
===================================================== */

.label-bottom{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:8px;

    margin-top:8px;

    padding-top:7px;

    border-top:1px solid #999;
}


.label-order{

    font-size:9px;

    font-weight:800;

    white-space:nowrap;
}


.barcode{

    width:125px;

    height:38px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:25px;

    color:#777;

    font-size:13px;
}


.empty{

    text-align:center;

    padding:25px;

    color:#777;

    font-size:13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .page{

        padding:15px 10px 40px;
    }


    .search-row{

        flex-direction:column;
    }


    .search-row .btn{

        width:100%;
    }


    .orders{

        grid-template-columns:1fr;

        max-height:350px;
    }


    .label-section{

        padding:12px;
    }


    .label-heading{

        align-items:flex-start;

        gap:10px;
    }


    .print-btn{

        font-size:11px;

        padding:0 12px;
    }

}


/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{

        size:A4;

        margin:10mm;
    }


    body{

        background:#fff;
    }


    .page{

        width:auto;

        max-width:none;

        margin:0;

        padding:0;
    }


    .header,

    .controls,

    .orders-title,

    .orders,

    .label-heading{

        display:none !important;
    }


    .label-section{

        display:block !important;

        border:0;

        padding:0;

        margin:0;

        background:#fff;
    }


    .label{

        width:90mm;

        max-width:90mm;

        min-height:55mm;

        margin:0;

        padding:6mm;

        border:1.5px solid #111;

        page-break-inside:avoid;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>LIARA</h1>

    <p>
        PROFESSIONAL™ · ORDER LABELS
    </p>

</div>



<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">


    <div class="search-row">

        <input
            id="searchInput"
            type="text"
            placeholder="Search Order Number / Customer Name / Mobile"
            autocomplete="off"
        >


        <button
            class="btn"
            onclick="loadOrders()"
        >
            Search
        </button>

    </div>


    <div
        id="status"
        class="status"
    ></div>



    <div class="orders-title">

        <strong>
            Orders
        </strong>

        <span
            id="orderCount"
            class="order-count"
        >
            0 orders
        </span>

    </div>


    <div
        id="orders"
        class="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>



<!-- =====================================================
     LABEL
===================================================== -->

<div
    id="labelSection"
    class="label-section"
>


    <div class="label-heading">

        <strong>
            Print Preview
        </strong>


        <button
            class="print-btn"
            onclick="printLabel()"
        >
            🖨 Print Label
        </button>

    </div>



    <div class="label">


        <!-- TOP -->

        <div class="label-top">


            <div class="logo">

                LIARA

                <small>
                    PROFESSIONAL™
                </small>

            </div>


            <div
                id="payment"
                class="payment"
            >
                PAYMENT: COD
            </div>


        </div>



        <!-- SHIP TO -->

        <div class="ship">
            SHIP TO
        </div>


        <div
            id="customerName"
            class="customer-name"
        >
            —
        </div>


        <div
            id="customerAddress"
            class="customer-address"
        >
            —
        </div>


        <div
            id="customerPhone"
            class="customer-phone"
        >
            Mobile: —
        </div>



        <!-- ORDER + BARCODE -->

        <div class="label-bottom">


            <div
                id="labelOrder"
                class="label-order"
            >
                ORDER: —
            </div>


            <svg
                id="barcode"
                class="barcode"
            ></svg>


        </div>


    </div>


</div>


</div>



<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */


/*
   YOUR SUPABASE PROJECT URL
*/

const SUPABASE_URL =
"https://oinafbuicwhleudztzyz.supabase.co";


/*
   PASTE YOUR EXISTING PUBLISHABLE / ANON KEY HERE.

   DO NOT USE SERVICE_ROLE KEY.
*/

const SUPABASE_ANON_KEY =
"PASTE_YOUR_EXISTING_ANON_OR_PUBLISHABLE_KEY_HERE";


/*
   CREATE CLIENT
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================================
   VARIABLES
===================================================== */

let allOrders = [];

let selectedOrderId = null;



/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const ordersBox =
        document.getElementById(
            "orders"
        );


    const status =
        document.getElementById(
            "status"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    status.className =
        "status";


    ordersBox.innerHTML =
        `
        <div class="loading">
            Loading orders...
        </div>
        `;


    /*
       Check key
    */

    if(
        SUPABASE_ANON_KEY.includes(
            "PASTE_"
        )
    ){

        status.textContent =
            "Supabase publishable/anon key is required.";

        status.classList.add(
            "error"
        );

        ordersBox.innerHTML =
            `
            <div class="empty">
                Add your existing Supabase
                publishable/anon key in the code.
            </div>
            `;

        return;

    }


    try{


        /*
           Fetch orders
        */

        const {
            data,
            error
        } = await supabaseClient

            .from("orders")

            .select(`
                id,
                order_number,
                customer_name,
                phone,
                address,
                house_no,
                street,
                city,
                state,
                pincode,
                payment_method,
                shipping_address,
                created_at
            `)

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allOrders =
            data || [];


        /*
           Search
        */

        let filtered =
            allOrders;


        if(search){

            filtered =
                allOrders.filter(
                    order => {

                        const number =
                            String(
                                order.order_number || ""
                            )
                            .toLowerCase();


                        const name =
                            String(
                                order.customer_name || ""
                            )
                            .toLowerCase();


                        const phone =
                            String(
                                order.phone || ""
                            )
                            .toLowerCase();


                        return (

                            number.includes(search) ||

                            name.includes(search) ||

                            phone.includes(search)

                        );

                    }
                );

        }


        renderOrders(
            filtered
        );


    }
    catch(error){

        console.error(
            "Supabase Error:",
            error
        );


        status.textContent =
            "Could not load orders: " +
            error.message;


        status.classList.add(
            "error"
        );


        ordersBox.innerHTML =
            `
            <div class="empty">
                Orders could not be loaded.
            </div>
            `;

    }

}



/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

    const box =
        document.getElementById(
            "orders"
        );


    const count =
        document.getElementById(
            "orderCount"
        );


    count.textContent =
        orders.length +
        (
            orders.length === 1
            ? " order"
            : " orders"
        );


    if(!orders.length){

        box.innerHTML =
            `
            <div class="empty">
                No orders found.
            </div>
            `;

        return;

    }


    box.innerHTML =
        "";


    orders.forEach(
        order => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            card.dataset.id =
                order.id;


            const payment =
                String(
                    order.payment_method ||
                    "COD"
                )
                .toUpperCase();


            card.innerHTML =

                `
                <div class="order-number">
                    ${escapeHTML(
                        order.order_number || "—"
                    )}
                </div>

                <div class="order-customer">
                    ${escapeHTML(
                        order.customer_name || "Customer"
                    )}
                </div>

                <div class="order-phone">
                    ${escapeHTML(
                        order.phone || "—"
                    )}
                </div>

                <div class="order-payment">
                    PAYMENT:
                    ${
                        payment.includes("COD")
                        ? "COD"
                        : escapeHTML(payment)
                    }
                </div>
                `;


            card.addEventListener(
                "click",
                function(){

                    selectOrder(
                        order
                    );

                }
            );


            box.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   SELECT ORDER
===================================================== */

function selectOrder(order){

    selectedOrderId =
        order.id;


    /*
       Remove previous active
    */

    document
        .querySelectorAll(
            ".order-card"
        )
        .forEach(
            card => {

                card.classList.remove(
                    "active"
                );

            }
        );


    /*
       Active current
    */

    const active =
        document.querySelector(
            `.order-card[data-id="${CSS.escape(String(order.id))}"]`
        );


    if(active){

        active.classList.add(
            "active"
        );

    }


    /*
       Customer
    */

    document
        .getElementById(
            "customerName"
        )
        .textContent =
            order.customer_name ||
            "Customer";


    /*
       Mobile
    */

    document
        .getElementById(
            "customerPhone"
        )
        .textContent =
            "Mobile: " +
            (
                order.phone ||
                "—"
            );


    /*
       Address
    */

    const address =
        makeAddress(
            order
        );


    document
        .getElementById(
            "customerAddress"
        )
        .textContent =
            address ||
            "Address not available";


    /*
       Order number
    */

    const orderNumber =
        order.order_number ||
        "—";


    document
        .getElementById(
            "labelOrder"
        )
        .textContent =
            "ORDER: " +
            orderNumber;


    /*
       Payment
    */

    const payment =
        String(
            order.payment_method ||
            "COD"
        )
        .toUpperCase();


    document
        .getElementById(
            "payment"
        )
        .textContent =
            "PAYMENT: " +
            (
                payment.includes("COD")
                ? "COD"
                : payment
            );


    /*
       Barcode
    */

    const barcode =
        document.getElementById(
            "barcode"
        );


    barcode.innerHTML =
        "";


    if(orderNumber !== "—"){

        JsBarcode(
            barcode,
            orderNumber,
            {

                format:"CODE128",

                width:2,

                height:38,

                displayValue:true,

                fontSize:10,

                margin:0

            }
        );

    }


    /*
       Show label
    */

    document
        .getElementById(
            "labelSection"
        )
        .style.display =
            "block";


    /*
       Success message
    */

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Order selected. Label ready.";

    status.className =
        "status success";


    /*
       Scroll
    */

    document
        .getElementById(
            "labelSection"
        )
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

}



/* =====================================================
   ADDRESS BUILDER
===================================================== */

function makeAddress(order){

    /*
       First use shipping_address
    */

    if(
        order.shipping_address &&
        String(
            order.shipping_address
        ).trim()
    ){

        return String(
            order.shipping_address
        ).trim();

    }


    /*
       Build address from fields
    */

    const parts = [

        order.house_no,

        order.street,

        order.city,

        order.state,

        order.pincode

    ];


    const built =
        parts

        .filter(
            value =>
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ""
        )

        .map(
            value =>
                String(value).trim()
        )

        .join(", ");


    if(built){

        return built;

    }


    /*
       Last fallback
    */

    if(order.address){

        return String(
            order.address
        ).trim();

    }


    return "";

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   PRINT
===================================================== */

function printLabel(){

    if(!selectedOrderId){

        alert(
            "Please select an order first."
        );

        return;

    }


    window.print();

}



/* =====================================================
   SEARCH WHILE TYPING
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function(){

            const search =
                this.value
                .trim()
                .toLowerCase();


            const filtered =
                allOrders.filter(
                    order => {

                        const number =
                            String(
                                order.order_number || ""
                            )
                            .toLowerCase();


                        const name =
                            String(
                                order.customer_name || ""
                            )
                            .toLowerCase();


                        const phone =
                            String(
                                order.phone || ""
                            )
                            .toLowerCase();


                        return (

                            number.includes(search) ||

                            name.includes(search) ||

                            phone.includes(search)

                        );

                    }
                );


            renderOrders(
                filtered
            );

        }
    );



/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                loadOrders();

            }

        }
    );



/* =====================================================
   INITIAL LOAD
===================================================== */

loadOrders();

</script>


</body>
</html>
